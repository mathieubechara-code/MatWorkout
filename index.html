  // computeSwimSessionMetrics — the single source of truth — so nothing on screen goes stale
  // (Part 1F). A manual distance correction, if one was set earlier, is superseded the moment
  // a length is edited, since the length-level system is now the authoritative source.
  const applyLengthEdit = async (sessionId, lengthIndex, updater) => {
    const next = (sessions || []).map((s) => {
      if (s.id !== sessionId) return s;
      const lengths = s.lengths.map((l) => (l.index === lengthIndex ? updater(l) : l));
      const metrics = computeSwimSessionMetrics(lengths, s.poolLength);
      return {
        ...s,
        lengths,
        distance: metrics.distance,
        swimTimeSec: metrics.swimTimeSec,
        restTimeSec: metrics.restTimeSec,
        pace100Overall: metrics.pace100Overall,
        strokeStats: metrics.strokeStats,
        reps: metrics.reps,
        totalActiveLengths: metrics.totalActiveLengths,
        validActiveLengths: metrics.validActiveLengths,
        excludedCount: metrics.excludedCount,
        qualityNote: metrics.qualityNote,
        distanceCorrection: null,
      };
    });
    await persist(next);
  };

  // Part 1C/1D: correct a length's stroke, or reclassify IDLE<->ACTIVE. Never overwrites the
  // original `stroke`/`lengthType` fields — writes into the userStroke/userLengthType override
  // layer instead, so the original imported value stays visible and the edit is reversible.
  const updateLengthStroke = (sessionId, lengthIndex, newStroke) =>
    applyLengthEdit(sessionId, lengthIndex, (l) => ({ ...l, userStroke: newStroke === l.stroke ? null : newStroke }));

  const markLengthActive = (sessionId, lengthIndex, stroke) =>
    applyLengthEdit(sessionId, lengthIndex, (l) => ({ ...l, userLengthType: "active", userStroke: stroke }));

  const markLengthIdle = (sessionId, lengthIndex) =>
    applyLengthEdit(sessionId, lengthIndex, (l) => ({ ...l, userLengthType: l.lengthType === "idle" ? null : "idle", userStroke: null }));

  // Part 1A/1B: exclude/include a length from analysis entirely (accidental lap press,
  // duplicate/parasite length, GPS artifact...). Reversible any time — see "Include" below.
  const toggleExcludeLength = (sessionId, lengthIndex) =>
    applyLengthEdit(sessionId, lengthIndex, (l) => ({ ...l, userExcluded: !l.userExcluded }));

  // Reverts every override on a single length back to the original imported values.
  const resetLengthOverrides = (sessionId, lengthIndex) =>
    applyLengthEdit(sessionId, lengthIndex, (l) => ({ ...l, userExcluded: false, userLengthType: null, userStroke: null }));

  const [idleToActiveFor, setIdleToActiveFor] = useState(null); // { sessionId, lengthIndex } — length currently prompting for a swim-type pick

  // Session-detail CSS flagging: lets a person retroactively mark two of a session's own
  // reconstructed reps (Reps/sets) as the short/long split for a CSS calculation, instead of
  // only being able to set this at upload time. { [sessionId]: { short: repIdx, long: repIdx } }
  const [cssRepPick, setCssRepPick] = useState({});

  const pickCssRep = (sessionId, slot, repIdx) => {
    setCssRepPick((prev) => {
      const cur = prev[sessionId] || {};
      return { ...prev, [sessionId]: { ...cur, [slot]: cur[slot] === repIdx ? null : repIdx } };
    });
  };

  // Computes CSS from whichever two reps were picked, using their actual distances/times
  // (not a hardcoded 200/400) — so it works whether the reps were exactly 200m/400m or just
  // close to it. Stored under the same cssTest.{t200,t400} shape the rest of the app expects.
  const applyCssRepPick = async (sessionId) => {
    const pick = cssRepPick[sessionId];
    const session = (sessions || []).find((s) => s.id === sessionId);
    if (!pick || !session || pick.short == null || pick.long == null || pick.short === pick.long) return;
    const repA = session.reps[pick.short], repB = session.reps[pick.long];
    if (!repA || !repB) return;
    const [shortRep, longRep] = repA.distance <= repB.distance ? [repA, repB] : [repB, repA];
    if (longRep.distance === shortRep.distance || longRep.timeSec <= shortRep.timeSec) return;
    const cssSpeed = (longRep.distance - shortRep.distance) / (longRep.timeSec - shortRep.timeSec);
    const pace100 = cssSpeed > 0 ? 100 / cssSpeed : null;
    const next = (sessions || []).map((s) => (s.id === sessionId ? { ...s, isCssTest: true, cssTest: { t200: shortRep.timeSec, t400: longRep.timeSec, cssSpeed, pace100 } } : s));
    await persist(next);
    setCssRepPick((prev) => { const cp = { ...prev }; delete cp[sessionId]; return cp; });
  };

  const clearCssPick = (sessionId) => setCssRepPick((prev) => ({ ...prev, [sessionId]: {} }));

  const unmarkCssTest = async (sessionId) => {
    const next = (sessions || []).map((s) => (s.id === sessionId ? { ...s, isCssTest: false, cssTest: null } : s));
    await persist(next);
  };

  const todayStr = toISODate(new Date());

  const streak = useMemo(() => {
    if (!sessions || sessions.length === 0) return null;
    const weekKeySet = new Set(sessions.map((s) => toISODate(mondayOf(s.date))));
    const currentMonday = mondayOf(todayStr);
    let wStreak = 0, firstIter = true;
    let cursor = new Date(currentMonday);
    for (let i = 0; i < 104; i++) {
      const key = toISODate(cursor);
      if (weekKeySet.has(key)) wStreak++;
      else if (!firstIter) break;
      firstIter = false;
      cursor.setDate(cursor.getDate() - 7);
    }
    const dayKeySet = new Set(sessions.map((s) => s.date));
    let dStreak = 0; let dCursor = new Date(todayStr + "T00:00:00");
    // Day streak starts counting from today/yesterday backward; if nothing logged today it
    // still counts an active streak through yesterday.
    if (!dayKeySet.has(toISODate(dCursor))) dCursor.setDate(dCursor.getDate() - 1);
    for (let i = 0; i < 365; i++) {
      const key = toISODate(dCursor);
      if (dayKeySet.has(key)) { dStreak++; dCursor.setDate(dCursor.getDate() - 1); } else break;
    }
    const sorted = [...sessions].sort((a, b) => (a.date < b.date ? -1 : 1));
    const daysSinceLast = dayDiff(sorted[sorted.length - 1].date, todayStr);
    return { weekStreak: wStreak, dayStreak: dStreak, daysSinceLast, totalSessions: sessions.length };
  }, [sessions, todayStr]);

  // Category is derived straight from the existing isCssTest boolean — no separate settable
  // field. Whatever already marks a session as a CSS test (the Reps/sets picker below, or
  // upload-time in History & Log) is the single source of truth for this label everywhere.
  const categoryLabelOf = (s) => (s.isCssTest ? "CSS Test" : "Workout");
  const categoryValueOf = (s) => (s.isCssTest ? "csstest" : "workout");

  // chronSessions feeds Trends + Compare (and Insights) — filtered by the Workout/CSS Test
  // picker so a CSS effort test (or, flipped, casual swims) can be excluded from those views.
  // Session Detail always shows every session regardless of this filter, since that's where
  // CSS tests actually get marked/unmarked.
  const chronSessions = useMemo(() => {
    const chron = sessions ? [...sessions].sort((a, b) => (a.date < b.date ? -1 : 1)) : [];
    return categoryFilter === "all" ? chron : chron.filter((s) => categoryValueOf(s) === categoryFilter);
  }, [sessions, categoryFilter]);
  const sortedSessions = useMemo(() => (sessions ? [...sessions].sort((a, b) => (a.date < b.date ? 1 : -1)) : []), [sessions]);

  const allStrokesSeen = useMemo(() => {
    const set = new Set();
    (chronSessions || []).forEach((s) => Object.keys(s.strokeStats || {}).forEach((k) => set.add(k)));
    return Array.from(set);
  }, [chronSessions]);

  // The stroke with the most sessions of data — used as the default single line shown on the
  // collapsed sparkline cards for the per-stroke metrics (SWOLF, cadence, distance/stroke).
  const primaryStroke = useMemo(() => {
    const counts = {};
    (chronSessions || []).forEach((s) => Object.keys(s.strokeStats || {}).forEach((k) => { counts[k] = (counts[k] || 0) + 1; }));
    let best = null, bestCount = -1;
    Object.keys(counts).forEach((k) => { if (counts[k] > bestCount) { best = k; bestCount = counts[k]; } });
    return best;
  }, [chronSessions]);

  // Trend series, oldest -> newest, one point per session.
  const trendData = useMemo(() => {
    return chronSessions.map((s) => {
      const energy100 = s.calories != null && s.distance ? (s.calories / s.distance) * 100 : null;
      const point = { date: s.date, label: fmtDate(s.date), pace100: s.pace100Overall, avgHR: s.avgHR, peakHR: s.peakHR, energy100 };
      allStrokesSeen.forEach((stroke) => {
        const st = s.strokeStats && s.strokeStats[stroke];
        point[`pace100_${stroke}`] = st ? st.pace100 : null;
        point[`swolf_${stroke}`] = st ? st.avgSwolf : null;
        point[`cadence_${stroke}`] = st ? st.avgCadence : null;
        point[`dps_${stroke}`] = st ? st.avgDistPerStroke : null;
      });
      return point;
    });
  }, [chronSessions, allStrokesSeen]);

  // Weekly-aggregated equivalent of trendData, for the Day/Week trend toggle. Sessions are
  // bucketed by the Monday of their week (same mondayOf/toISODate helpers used elsewhere);
  // weeks with zero sessions simply don't appear (no null-padded gaps).
  const weeklyTrendData = useMemo(() => {
    if (chronSessions.length === 0) return [];
    const buckets = {};
    chronSessions.forEach((s) => {
      const weekKey = toISODate(mondayOf(s.date));
      if (!buckets[weekKey]) buckets[weekKey] = [];
      buckets[weekKey].push(s);
    });
    const avg = (arr) => (arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : null);
    return Object.keys(buckets).sort().map((weekKey) => {
      const weekSessions = buckets[weekKey];
      const pace100Vals = weekSessions.map((s) => s.pace100Overall).filter((v) => v != null);
      const hrVals = weekSessions.map((s) => s.avgHR).filter((v) => v != null);
      const peakHrVals = weekSessions.map((s) => s.peakHR).filter((v) => v != null);
      const energy100Vals = weekSessions.map((s) => (s.calories != null && s.distance ? (s.calories / s.distance) * 100 : null)).filter((v) => v != null);
      const point = {
        date: weekKey, label: `Wk ${fmtDate(weekKey)}`, pace100: avg(pace100Vals), avgHR: avg(hrVals),
        // Peak HR aggregates as the week's actual highest reading, not an average of peaks —
        // "peak" stays meaningful as the hardest single effort that week.
        peakHR: peakHrVals.length ? Math.max(...peakHrVals) : null,
        energy100: avg(energy100Vals),
        sessionCount: weekSessions.length,
      };
      allStrokesSeen.forEach((stroke) => {
        const pace100StrokeVals = weekSessions.map((s) => (s.strokeStats && s.strokeStats[stroke] ? s.strokeStats[stroke].pace100 : null)).filter((v) => v != null);
        const swolfVals = weekSessions.map((s) => (s.strokeStats && s.strokeStats[stroke] ? s.strokeStats[stroke].avgSwolf : null)).filter((v) => v != null);
        const cadenceVals = weekSessions.map((s) => (s.strokeStats && s.strokeStats[stroke] ? s.strokeStats[stroke].avgCadence : null)).filter((v) => v != null);
        const dpsVals = weekSessions.map((s) => (s.strokeStats && s.strokeStats[stroke] ? s.strokeStats[stroke].avgDistPerStroke : null)).filter((v) => v != null);
        point[`pace100_${stroke}`] = pace100StrokeVals.length ? avg(pace100StrokeVals) : null;
        point[`swolf_${stroke}`] = swolfVals.length ? avg(swolfVals) : null;
        point[`cadence_${stroke}`] = cadenceVals.length ? avg(cadenceVals) : null;
        point[`dps_${stroke}`] = dpsVals.length ? avg(dpsVals) : null;
      });
      return point;
    });
  }, [chronSessions, allStrokesSeen]);

  // The series actually feeding the sparkline cards + expanded charts, switched by the
  // Day/Week toggle. Collapsed cards and their expanded charts always read from this same
  // source, so they never disagree.
  const trendDataView = swimTimeView === "week" ? weeklyTrendData : trendData;

  const cssTrendData = useMemo(() => {
    const chron = sessions ? [...sessions].filter((s) => s.isCssTest && s.cssTest).sort((a, b) => (a.date < b.date ? -1 : 1)) : [];
    return chron.map((s) => ({ date: s.date, label: fmtDate(s.date), cssPace100: s.cssTest.pace100, cssSpeed: s.cssTest.cssSpeed }));
  }, [sessions]);

  // ---- Distance by swim type: latest session vs 6-week total, plus stroke mix ----------
  // For each stroke seen, shows the distance swum in that stroke during the most recent
  // session that included it, the raw *total* distance in that stroke over the last 6
  // calendar weeks (Mon-Sun, including the current in-progress week — no division, so a
  // single 900m session shows as 900m, not amortized down to 150m/week), and that stroke's
  // % share of total swim distance across all strokes over the same 6-week window.
  const strokeDistanceStats = useMemo(() => {
    if (!sessions || sessions.length === 0 || allStrokesSeen.length === 0) return [];
    const currentMonday = mondayOf(todayStr);
    const weekKeys = [];
    for (let w = 5; w >= 0; w--) {
      const d = new Date(currentMonday); d.setDate(d.getDate() - w * 7);
      weekKeys.push(toISODate(d));
    }
    const weekKeySet = new Set(weekKeys);
    const rows = allStrokesSeen.map((stroke) => {
      // Latest: most recent session (sortedSessions is newest-first) that included this stroke.
      let latest = null;
      for (let i = 0; i < sortedSessions.length; i++) {
        const s = sortedSessions[i];
        const st = s.strokeStats && s.strokeStats[stroke];
        if (st && st.count > 0 && s.poolLength != null) {
          latest = { date: s.date, distance: Math.round(st.count * s.poolLength * 100) / 100 };
          break;
        }
      }
      let sixWeekTotal = 0;
      sessions.forEach((s) => {
        const wk = toISODate(mondayOf(s.date));
        if (!weekKeySet.has(wk)) return;
        const st = s.strokeStats && s.strokeStats[stroke];
        if (st && st.count > 0 && s.poolLength != null) sixWeekTotal += st.count * s.poolLength;
      });
      return { stroke, latest, sixWeekTotal: Math.round(sixWeekTotal) };
    });
    const grandTotal = rows.reduce((a, r) => a + r.sixWeekTotal, 0);
    return rows
      .map((r) => ({ ...r, pct: grandTotal > 0 ? (r.sixWeekTotal / grandTotal) * 100 : null }))
      .sort((a, b) => b.sixWeekTotal - a.sixWeekTotal);
  }, [sessions, sortedSessions, allStrokesSeen, todayStr]);

  // ---- Swim PR card -------------------------------------------------------------------
  // Best pace also records that session's dominant stroke (the one with the most lengths),
  // shown as a small tag next to the PR so "1:32/100m" isn't ambiguous about which stroke it
  // was swum in — whole-session pace can otherwise mix strokes together silently.
  const bestPacePR = useMemo(() => {
    if (!sessions) return null;
    let best = null;
    sessions.forEach((s) => {
      if (s.pace100Overall == null) return;
      if (!best || s.pace100Overall < best.value) {
        const stats = s.strokeStats || {};
        let domStroke = null, domCount = -1;
        Object.keys(stats).forEach((k) => { if (stats[k].count > domCount) { domStroke = k; domCount = stats[k].count; } });
        best = { value: s.pace100Overall, date: s.date, stroke: domStroke };
      }
    });
    return best;
  }, [sessions]);

  // Only compared within the same pool length as the most recent session, since SWOLF isn't
  // meaningfully comparable across different pool lengths.
  const bestSwolfPR = useMemo(() => {
    if (!sessions || sessions.length === 0) return null;
    const refPoolLength = sortedSessions[0] ? sortedSessions[0].poolLength : null;
    let best = null;
    sessions.forEach((s) => {
      if (s.poolLength !== refPoolLength) return;
      const vals = Object.values(s.strokeStats || {}).map((st) => st.avgSwolf).filter((v) => v != null);
      if (!vals.length) return;
      const sessionMin = Math.min(...vals);
      if (!best || sessionMin < best.value) best = { value: sessionMin, date: s.date };
    });
    return best;
  }, [sessions, sortedSessions]);

  const longestSessionPR = useMemo(() => {
    if (!sessions) return null;
    let best = null;
    sessions.forEach((s) => {
      if (s.distance == null) return;
      if (!best || s.distance > best.value) best = { value: s.distance, date: s.date };
    });
    return best;
  }, [sessions]);

  const bestCssPR = useMemo(() => {
    if (!sessions) return null;
    let best = null;
    sessions.forEach((s) => {
      if (!s.isCssTest || !s.cssTest || s.cssTest.pace100 == null) return;
      if (!best || s.cssTest.pace100 < best.value) best = { value: s.cssTest.pace100, date: s.date };
    });
    return best;
  }, [sessions]);

  if (sessions === null) {
    return <div style={{ color: "#6b7078", fontSize: 13, padding: "24px 0" }}>Loading swim data…</div>;
  }

  const cardStyle = { background: "linear-gradient(180deg, #1a1c22 0%, #141519 100%)", border: "1px solid #2b2e36", borderRadius: 22, boxShadow: "0 12px 28px -14px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.04)", padding: isMobile ? 14 : 18, marginBottom: 18 };
  const labelStyle = { fontSize: 11, color: "#8a8f98", textTransform: "uppercase", letterSpacing: "0.06em", marginBottom: 6 };

  // ---- Compact "bevel" sparkline trend cards ------------------------------------------
  // Each card: small hidden-axis sparkline, headline (most recent value), and a colored
  // Improving/Steady/Slower verdict comparing the last 3 sessions' average against the
  // 3 before that. Tapping expands into the full chart (with stroke filter pills, for the
  // per-stroke metrics).
  const seriesFor = (key) => trendDataView.map((d) => (d[key] == null ? null : d[key]));

  // Degrades gracefully: with lots of history it compares the last 3 sessions against the
  // 3 before that; with as few as 2 sessions total it falls back to latest-vs-previous, so a
  // one-word status is available as soon as there's anything to compare.
  const computeVerdict = (series, direction) => {
    const vals = series.filter((v) => v != null);
    if (vals.length < 2) return null;
    const windowSize = Math.max(1, Math.min(3, Math.floor(vals.length / 2)));
    const recent = vals.slice(-windowSize);
    const prior = vals.slice(-windowSize * 2, -windowSize);
    if (prior.length === 0) return null;
    const avg = (a) => a.reduce((x, y) => x + y, 0) / a.length;
    const recentAvg = avg(recent), priorAvg = avg(prior);
    if (priorAvg === 0) return null;
    const pctChange = (recentAvg - priorAvg) / priorAvg;
    if (Math.abs(pctChange) < 0.015) return { label: "Steady", color: "#9a9fa6" };
    const better = direction === "lower-better" ? pctChange < 0 : pctChange > 0;
    return better ? { label: "Improving", color: "#6FCF97" } : { label: "Slower", color: "#E63946" };
  };

  const sparkPoints = (series) => series.map((v, i) => ({ i, v })).filter((p) => p.v != null);

  // The stroke driving the per-stroke cards: whichever the always-visible filter pills
  // have selected, falling back to the most-common stroke when "All strokes" is chosen.
  const activeStroke = strokeFilter === "all" ? primaryStroke : strokeFilter;
  // Pace: "All strokes" shows genuine whole-session pace; a specific stroke shows that
  // stroke's own pace (time-in-that-stroke ÷ that stroke's own distance) — a real, distinct
  // series from the whole-session figure, not a repeat of it.
  const paceDataKey = strokeFilter === "all" ? "pace100" : `pace100_${strokeFilter}`;
  const paceSeries = seriesFor(paceDataKey);
  const hrSeries = seriesFor("avgHR");
  const swolfSeries = activeStroke ? seriesFor(`swolf_${activeStroke}`) : [];
  const cadenceSeries = activeStroke ? seriesFor(`cadence_${activeStroke}`) : [];
  const dpsSeries = activeStroke ? seriesFor(`dps_${activeStroke}`) : [];

  const latestOf = (series) => { const vals = series.filter((v) => v != null); return vals.length ? vals[vals.length - 1] : null; };
  // Mean of the most recent 6 non-null points (fewer if there isn't 6 yet). This is the
  // "6-week avg" alternative to the single latest-session figure — smooths session-to-session
  // noise but lags behind a real, recent change, unlike the latest value.
  const avg6Of = (series) => {
    const vals = series.filter((v) => v != null).slice(-6);
    return vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null;
  };
  const headlineOf = (series) => (metricValueMode === "avg6" ? avg6Of(series) : latestOf(series));

  // Card accent color: Pace is the only one of these four that has a genuine "All strokes"
  // value (pace100 is a real whole-session figure — total time ÷ total distance across every
  // stroke swum, not any one stroke's number). SWOLF, stroke rate, and distance/stroke are all
  // technique-dependent — a butterfly stroke rate and a backstroke stroke rate aren't on the
  // same scale, so there's no meaningful way to blend them into one number, same reasoning for
  // all three, SWOLF included. When "All strokes" is selected, none of the four should be
  // painted with one arbitrary stroke's color (which used to make it look like that color WAS
  // "all"); use the neutral "all" white instead. The headline number itself still falls back to
  // the most-common stroke for SWOLF/cadence/dps (see activeStroke above) since a single card
  // can only show one number — the title suffix below makes that fallback explicit — while the
  // expanded chart for each already draws every stroke as its own line.
  const strokeCardColor = strokeFilter === "all" ? "#F5F3EE" : (SWIM_STROKE_COLORS[strokeFilter] || "#F5F3EE");
  const strokeTitleSuffix = (stroke) => {
    if (!stroke) return "";
    return strokeFilter === "all" ? ` (${SWIM_STROKE_LABELS[stroke]} · most common)` : ` (${SWIM_STROKE_LABELS[stroke]})`;
  };

  // ---- Web chart ("radar") metric registry --------------------------------------------------
  // A small explicit table rather than hardcoded per-axis JSX, so the radar's available axes
  // stay driven by data instead of by bespoke markup. Each entry knows how to read its own raw
  // value off a session object (per-stroke metrics use activeStroke, same fallback as the
  // Trends cards above) and its "better" direction, for the z-score sign-flip below. direction
  // "neutral" (HR) isn't flipped — there's no universal better direction for effort.
  const RADAR_METRIC_REGISTRY = [
    { key: "pace", label: "Pace", color: "#56CCF2", direction: METRIC_AXIS_DIRECTION.pace, fmt: (v) => fmtPace100(v),
      getValue: (s) => (strokeFilter === "all" ? s.pace100Overall : (s.strokeStats && s.strokeStats[strokeFilter] ? s.strokeStats[strokeFilter].pace100 : null)) },
    { key: "swolf", label: "SWOLF", color: "#9CCC65", direction: METRIC_AXIS_DIRECTION.swolf, fmt: (v) => fmtNum(v, 0),
      getValue: (s) => (activeStroke && s.strokeStats && s.strokeStats[activeStroke] ? s.strokeStats[activeStroke].avgSwolf : null) },
    { key: "cadence", label: "Stroke rate", color: "#F2C94C", direction: METRIC_AXIS_DIRECTION.cadence, fmt: (v) => `${fmtNum(v, 1)} spm`,
      getValue: (s) => (activeStroke && s.strokeStats && s.strokeStats[activeStroke] ? s.strokeStats[activeStroke].avgCadence : null) },
    { key: "dps", label: "Distance/stroke", color: "#2EC4B6", direction: METRIC_AXIS_DIRECTION.dps, fmt: (v) => `${fmtNum(v, 2)}m`,
      getValue: (s) => (activeStroke && s.strokeStats && s.strokeStats[activeStroke] ? s.strokeStats[activeStroke].avgDistPerStroke : null) },
    { key: "avgHR", label: "Avg HR", color: "#E63946", direction: "neutral", fmt: (v) => `${Math.round(v)} bpm`,
      getValue: (s) => s.avgHR },
    { key: "peakHR", label: "Peak HR", color: "#BB86FC", direction: "neutral", fmt: (v) => `${Math.round(v)} bpm`,
      getValue: (s) => s.peakHR },
    { key: "energy100", label: "Energy /100m", color: "#F2994A", direction: "lower", fmt: (v) => `${Math.round(v)} kcal`,
      getValue: (s) => (s.calories != null && s.distance ? (s.calories / s.distance) * 100 : null) },
  ];

  const latestChronSession = chronSessions.length ? chronSessions[chronSessions.length - 1] : null;
  const radarCurrentSession = chronSessions.find((s) => s.id === radarCurrentId) || latestChronSession;

  // radarData: one row per selected metric, each with a z-scored current + baseline value
  // (mean/std computed over chronSessions — the same category+stroke-filtered pool Trends and
  // Compare read — reusing computeMeanStd/zScoreOf rather than a new normalization approach).
  // Sign is flipped for lower-better metrics so "farther out" always reads as "better" on every
  // axis, same convention as the reversed Y axes elsewhere in this tab.
  const radarData = RADAR_METRIC_REGISTRY.filter((m) => radarMetricKeys.has(m.key)).map((m) => {
    const poolVals = chronSessions.map(m.getValue);
    const stats = computeMeanStd(poolVals);
    const currentRaw = radarCurrentSession ? m.getValue(radarCurrentSession) : null;

    let baselineRaw = null;
    if (radarBaselineId === "avg6") {
      const vals = chronSessions
        .filter((s) => !radarCurrentSession || s.id !== radarCurrentSession.id)
        .map(m.getValue)
        .filter((v) => v != null)
        .slice(-6);
      baselineRaw = vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null;
    } else {
      const baselineSession = chronSessions.find((s) => s.id === radarBaselineId);
      baselineRaw = baselineSession ? m.getValue(baselineSession) : null;
    }

    let currentZ = zScoreOf(currentRaw, stats);
    let baselineZ = zScoreOf(baselineRaw, stats);
    if (m.direction === "lower") {
      if (currentZ != null) currentZ = -currentZ;
      if (baselineZ != null) baselineZ = -baselineZ;
    }
    return {
      metric: m.label,
      current: currentZ != null ? Math.max(-2.4, Math.min(2.4, currentZ)) : 0,
      baseline: baselineZ != null ? Math.max(-2.4, Math.min(2.4, baselineZ)) : 0,
      currentRaw, baselineRaw, fmt: m.fmt,
    };
  });

  const metricCards = [
    {
      key: "pace",
      title: "Pace" + (strokeFilter !== "all" ? ` (${SWIM_STROKE_LABELS[strokeFilter]})` : ""),
      series: paceSeries,
      verdict: computeVerdict(paceSeries, "lower-better"),
      value: fmtPace100(headlineOf(paceSeries)),
      perStroke: true,
      lowerBetter: true,
      color: strokeCardColor,
    },
    {
      key: "swolf",
      title: "SWOLF" + strokeTitleSuffix(activeStroke),
      series: swolfSeries,
      verdict: computeVerdict(swolfSeries, "lower-better"),
      value: headlineOf(swolfSeries) != null ? Math.round(headlineOf(swolfSeries)) : "—",
      perStroke: true,
      lowerBetter: true,
      color: strokeCardColor,
    },
    {
      key: "cadence",
      title: "Stroke rate" + strokeTitleSuffix(activeStroke),
      series: cadenceSeries,
      verdict: computeVerdict(cadenceSeries, "higher-better"),
      value: headlineOf(cadenceSeries) != null ? `${Math.round(headlineOf(cadenceSeries))} spm` : "—",
      perStroke: true,
      color: strokeCardColor,
    },
    {
      key: "dps",
      title: "Distance/stroke" + strokeTitleSuffix(activeStroke),
      series: dpsSeries,
      verdict: computeVerdict(dpsSeries, "higher-better"),
      value: headlineOf(dpsSeries) != null ? `${headlineOf(dpsSeries).toFixed(2)}m` : "—",
      perStroke: true,
      color: strokeCardColor,
    },
    {
      key: "heart",
      title: "Heart",
      series: hrSeries,
      // No verdict: whole-session average HR alone has no universal "better" direction —
      // it moves with effort, not fitness, so a rising/falling line is context, not a grade.
      verdict: null,
      value: headlineOf(hrSeries) != null ? `${Math.round(headlineOf(hrSeries))} bpm` : "—",
      perStroke: false,
      color: "#E63946",
    },
  ];

  const allMetricsExpanded = metricCards.length > 0 && metricCards.every((c) => expandedMetrics.has(c.key));
  const toggleMetric = (key) => {
    setExpandedMetrics((prev) => {
      const next = new Set(prev);
      if (next.has(key)) next.delete(key); else next.add(key);
      return next;
    });
  };
  const toggleExpandAllMetrics = () => {
    setExpandedMetrics(allMetricsExpanded ? new Set() : new Set(metricCards.map((c) => c.key)));
  };

  // Shared by the Trends and Compare tabs — both read the same strokeFilter/categoryFilter
  // state, so a pick here filters both tabs even though each only renders this bar while
  // it's the active tab (previously this one bar visually spanned both cards at once, back
  // when Trends+Compare were stacked instead of tabbed).
  const renderFilterBar = () => (
    <div style={{ position: "sticky", top: isMobile ? 52 : 56, zIndex: 30, display: "flex", flexDirection: "column", gap: 8, background: FLOATING_BAR_BG, border: `1px solid ${FLOATING_BAR_BORDER}`, borderRadius: 14, padding: "6px 8px", marginBottom: 10, boxShadow: "0 6px 16px -8px rgba(0,0,0,0.65)" }}>
      {allStrokesSeen.length > 0 && (
        <div style={{ display: "flex", alignItems: "center", gap: 4, flexWrap: "wrap" }}>
          {["all", ...allStrokesSeen].map((s) => {
            // Part 2: every swim-type slicer button uses that stroke's own color from
            // the centralized SWIM_STROKE_COLORS map, with a strong, unambiguous
            // selected state (solid fill) vs. a tinted, low-contrast unselected state —
            // reused verbatim (same colors) everywhere else in the Swim tab.
            const color = s === "all" ? "#F5F3EE" : (SWIM_STROKE_COLORS[s] || "#8a8f98");
            const selected = strokeFilter === s;
            return (
              <button key={s} onClick={() => setStrokeFilter(s)} className="pill" style={{
                cursor: "pointer", background: selected ? color : `${color}1a`,
                border: `1.5px solid ${selected ? color : color + "55"}`, color: selected ? "#0c0d10" : color,
                borderRadius: 12, padding: "5px 10px", fontSize: 11.5, fontWeight: 700,
              }}>{s === "all" ? "All strokes" : SWIM_STROKE_LABELS[s]}</button>
            );
          })}
        </div>
      )}
      {/* Workout/CSS Test filter — excludes whichever category isn't picked from Trends +
          Compare + the radar tab (chronSessions itself is filtered by this, so every
          chart/card downstream inherits it automatically). Session Detail always shows
          everything regardless, so nothing is ever hidden for good — this only narrows what
          these tabs analyze. Category comes straight from isCssTest (item 3), not a separate
          field. */}
      {(sessions || []).length > 0 && (
        <div style={{ display: "flex", alignItems: "center", gap: 4, flexWrap: "wrap", paddingTop: allStrokesSeen.length > 0 ? 6 : 0, borderTop: allStrokesSeen.length > 0 ? "1px solid #2b241a" : "none" }}>
          <span style={{ fontSize: 10, color: "#6b7078", marginRight: 2 }}>Category</span>
          {[["all", "All", "#F5F3EE", null], ["workout", "Workout", "#56CCF2", Dumbbell], ["csstest", "CSS Test", "#2EC4B6", Target]].map(([v, l, c, Ic]) => {
            const selected = categoryFilter === v;
            return (
              <button key={v} onClick={() => setCategoryFilter(v)} className="pill" style={{
                display: "flex", alignItems: "center", gap: 4, cursor: "pointer",
                background: selected ? c : `${c}1a`, border: `1.5px solid ${selected ? c : c + "55"}`,
                color: selected ? "#0c0d10" : c, borderRadius: 12, padding: "5px 10px", fontSize: 11.5, fontWeight: 700,
              }}>{Ic && <Ic size={11} />}{l}</button>
            );
          })}
        </div>
      )}
    </div>
  );

  const expandedChartFor = (key) => {
    const overlay = chartOverlaySel[key] || "none";
    const hasHR = trendDataView.some((d) => d.avgHR != null);
    const showHR = overlay === "hr" && hasHR;
    const options = SWIM_CHART_OVERLAY_OPTIONS[key] || [{ value: "none", label: "None" }];

    const overlaySelector = options.length > 1 && (
      <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 8, flexWrap: "wrap" }}>
        <span style={{ fontSize: 10.5, color: "#6b7078" }}>Overlay:</span>
        {options.map((opt) => (
          <button key={opt.value} onClick={() => setChartOverlaySel((prev) => ({ ...prev, [key]: opt.value }))} className="pill" style={{
            cursor: "pointer", background: overlay === opt.value ? "#23262d" : "transparent",
            border: "1px solid " + (overlay === opt.value ? "#3a3f45" : "#23262d"),
            color: overlay === opt.value ? "#F5F3EE" : "#8a8f98",
            borderRadius: 7, padding: "3px 8px", fontSize: 10.5, fontWeight: 600,
          }}>{opt.label}</button>
        ))}
        {overlay === "hr" && !hasHR && <span style={{ fontSize: 10, color: "#5a5f66" }}>No HR data in this range</span>}
      </div>
    );

    const strokeCaption = key !== "pace" && overlay === "hr" && strokeFilter !== "all" && (
      <div style={{ fontSize: 10, color: "#5a5f66", marginTop: 6 }}>HR is whole-session, not stroke-specific.</div>
    );

    if (key === "pace") {
      return (
        <div>
          <ResponsiveContainer width="100%" height={200}>
            <LineChart data={trendDataView} margin={{ top: 4, right: 8, left: 0, bottom: 0 }}>
              <CartesianGrid strokeDasharray="3 3" stroke="#23262d" />
              <XAxis dataKey="label" tick={{ fill: "#6b7078", fontSize: 10.5 }} />
              <YAxis tick={{ fill: "#6b7078", fontSize: 10.5 }} tickFormatter={(v) => fmtMinSec(v)} reversed={METRIC_AXIS_DIRECTION.pace === "lower"} domain={["dataMin - 5", "dataMax + 5"]} />
              <Tooltip contentStyle={{ background: "#0c0d10", border: "1px solid #2a2e33", borderRadius: 12, fontSize: 12 }} formatter={(v) => fmtPace100(v)} />
              <Line type="monotone" dataKey={paceDataKey} name="Pace /100m" stroke={strokeCardColor} strokeWidth={2} dot={{ r: 3 }} connectNulls />
            </LineChart>
          </ResponsiveContainer>
        </div>
      );
    }

    if (key === "heart") {
      // Whole-session metric — one line, no per-stroke overlay (HR isn't tracked per-stroke),
      // no reason to offer the stroke-rate overlay picker either.
      // reversed reads the METRIC_AXIS_DIRECTION registry — same single source of truth the
      // collapsed sparkline reads (see its YAxis above), so the two can never drift out of
      // sync again the way the SWOLF-only patch previously did (item 6).
      const reversed = METRIC_AXIS_DIRECTION.heart === "lower";
      return (
        <div>
          <ResponsiveContainer width="100%" height={200}>
            <LineChart data={trendDataView} margin={{ top: 4, right: 8, left: 0, bottom: 0 }}>
              <CartesianGrid strokeDasharray="3 3" stroke="#23262d" />
              <XAxis dataKey="label" tick={{ fill: "#6b7078", fontSize: 10.5 }} />
              <YAxis tick={{ fill: "#6b7078", fontSize: 10.5 }} tickFormatter={(v) => `${Math.round(v)}`} reversed={reversed} domain={["dataMin - 2", "dataMax + 2"]} />
              <Tooltip contentStyle={{ background: "#0c0d10", border: "1px solid #2a2e33", borderRadius: 12, fontSize: 12 }} formatter={(v) => (v != null ? `${Math.round(v)} bpm` : "—")} />
              <Line type="monotone" dataKey="avgHR" name="Avg HR" stroke="#E63946" strokeWidth={2} dot={{ r: 3 }} connectNulls />
            </LineChart>
          </ResponsiveContainer>
        </div>
      );
    }

    const dataKeyPrefix = key === "swolf" ? "swolf_" : key === "cadence" ? "cadence_" : "dps_";
    const baseFormatter = key === "dps" ? (v) => (v != null ? fmtNum(v, 2) + "m" : "—") : (v) => fmtNum(v, key === "swolf" ? 0 : 1);
    const strokesToShow = strokeFilter === "all" ? allStrokesSeen : [strokeFilter];
    // "Better" direction per metric, read from the shared METRIC_AXIS_DIRECTION registry (item
    // 6) rather than decided locally — lower SWOLF is better (flip, like pace), higher
    // distance-per-stroke is better (no flip), and cadence has no universal "better" direction
    // so it's left unflipped and called out as such.
    const metricDirection = METRIC_AXIS_DIRECTION[key] === "lower" ? "lower-better" : "neutral-or-higher-better";
    const metricLabel = key === "swolf" ? "SWOLF" : key === "cadence" ? "cadence" : "distance per stroke";

    if (!showHR) {
      // No HR overlay requested: raw values on a single axis, exactly as before — no
      // cross-metric scaling problem to solve when only one unit is on the chart.
      const tooltipFormatter = (v, name) => [baseFormatter(v), name];
      return (
        <div>
          {overlaySelector}
          <ResponsiveContainer width="100%" height={220}>
            <LineChart data={trendDataView} margin={{ top: 4, right: 8, left: 0, bottom: 0 }}>
              <CartesianGrid strokeDasharray="3 3" stroke="#23262d" />
              <XAxis dataKey="label" tick={{ fill: "#6b7078", fontSize: 10.5 }} />
              {/* reversed reads METRIC_AXIS_DIRECTION — the same registry the collapsed
                  sparkline's YAxis reads above — instead of a per-branch key check, so this
                  can't quietly drift out of sync with the sparkline again (item 6). */}
              <YAxis tick={{ fill: "#6b7078", fontSize: 10.5 }} tickFormatter={(v) => fmtNum(v, 2)} reversed={METRIC_AXIS_DIRECTION[key] === "lower"} domain={["dataMin - 2", "dataMax + 2"]} />
              <Tooltip contentStyle={{ background: "#0c0d10", border: "1px solid #2a2e33", borderRadius: 12, fontSize: 12 }} formatter={tooltipFormatter} />
              <Legend wrapperStyle={{ fontSize: 11 }} />
              {strokesToShow.map((stroke) => (
                <Line key={stroke} type="monotone" dataKey={`${dataKeyPrefix}${stroke}`} name={SWIM_STROKE_LABELS[stroke]} stroke={SWIM_STROKE_COLORS[stroke]} strokeWidth={2} dot={{ r: 3 }} connectNulls />
              ))}
            </LineChart>
          </ResponsiveContainer>
          {strokeCaption}
        </div>
      );
    }

    // HR overlay requested: normalize each stroke's line AND HR to z-scores on one shared
    // axis, same technique as the Pace chart — otherwise two independently-scaled axes just
    // stretch both series to fill the chart regardless of real magnitude.
    const hrStats = computeMeanStd(trendDataView.map((d) => d.avgHR));
    const strokeStatsMap = {};
    strokesToShow.forEach((stroke) => {
      strokeStatsMap[stroke] = computeMeanStd(trendDataView.map((d) => d[`${dataKeyPrefix}${stroke}`]));
    });
    const pairedCount = trendDataView.filter(
      (d) => d.avgHR != null && strokesToShow.some((stroke) => d[`${dataKeyPrefix}${stroke}`] != null)
    ).length;

    if (pairedCount < 2) {
      if (pairedCount === 0) {
        return (
          <div>
            {overlaySelector}
            <div style={{ padding: "26px 10px", textAlign: "center", color: "#5a5f66", fontSize: 12.5, lineHeight: 1.5 }}>
              No sessions yet with both {metricLabel} and HR recorded — log an HR-tracked swim to see this comparison.
            </div>
          </div>
        );
      }
      // Exactly 1 paired session: a chart isn't meaningful here — with a single value, each
      // axis centers it at 50% height independent of the other, so the dots always land on
      // the same pixel row regardless of the real numbers. That's a coincidence of a lone-point
      // domain, not a real relationship. Just show the values directly instead.
      const only = trendDataView.find(
        (d) => d.avgHR != null && strokesToShow.some((stroke) => d[`${dataKeyPrefix}${stroke}`] != null)
      ) || trendDataView[0];
      return (
        <div>
          {overlaySelector}
          <div style={{ display: "flex", gap: 28, flexWrap: "wrap", padding: "18px 4px 8px" }}>
            {strokesToShow.map((stroke) => {
              const raw = only[`${dataKeyPrefix}${stroke}`];
              if (raw == null) return null;
              return (
                <div key={stroke}>
                  <div style={{ fontSize: 10, color: "#8a8f98", textTransform: "uppercase", letterSpacing: "0.06em" }}>{SWIM_STROKE_LABELS[stroke]}</div>
                  <div style={{ fontSize: 21, fontWeight: 700, color: SWIM_STROKE_COLORS[stroke] }}>{baseFormatter(raw)}</div>
                </div>
              );
            })}
            <div>
              <div style={{ fontSize: 10, color: "#8a8f98", textTransform: "uppercase", letterSpacing: "0.06em" }}>Avg HR</div>
              <div style={{ fontSize: 21, fontWeight: 700, color: "#E63946" }}>{only.avgHR != null ? `${Math.round(only.avgHR)} bpm` : "—"}</div>
            </div>
          </div>
          <div style={{ fontSize: 10, color: "#5a5f66", marginTop: 4 }}>
            Log one more HR-tracked swim to see {metricLabel} and HR actually plotted against each other.
          </div>
          {strokeCaption}
        </div>
      );
    }

    const normalizedData = trendDataView.map((d) => {
      const point = { ...d, hrZ: zScoreOf(d.avgHR, hrStats) };
      strokesToShow.forEach((stroke) => {
        const stats = strokeStatsMap[stroke];
        let z = stats ? zScoreOf(d[`${dataKeyPrefix}${stroke}`], stats) : null;
        if (z != null && metricDirection === "lower-better") z = -z;
        point[`z_${stroke}`] = z;
      });
      return point;
    });
    const labelToStroke = Object.fromEntries(strokesToShow.map((s) => [SWIM_STROKE_LABELS[s], s]));
    const zTooltipFormatter = (v, name, props) => {
      if (name === "Avg HR") return [props.payload.avgHR != null ? `${Math.round(props.payload.avgHR)} bpm` : "—", name];
      const stroke = labelToStroke[name];
      const raw = stroke ? props.payload[`${dataKeyPrefix}${stroke}`] : v;
      return [baseFormatter(raw), name];
    };
    const directionNote =
      metricDirection === "lower-better"
        ? `${metricLabel} is flipped so "up" = better (lower ${metricLabel}), matching "up" = higher HR.`
        : key === "cadence"
        ? `Cadence has no universal "better" direction, so it's shown as-is — a line moving with HR just means cadence and effort moved together, not that higher or lower cadence is good.`
        : `Higher ${metricLabel} is already "better" here, matching "up" = higher HR.`;

    return (
      <div>
        {overlaySelector}
        <ResponsiveContainer width="100%" height={220}>
          <LineChart data={normalizedData} margin={{ top: 4, right: 8, left: 0, bottom: 0 }}>
            <CartesianGrid strokeDasharray="3 3" stroke="#23262d" />
            <XAxis dataKey="label" tick={{ fill: "#6b7078", fontSize: 10.5 }} />
            <YAxis
              tick={{ fill: "#6b7078", fontSize: 10.5 }}
              tickFormatter={(v) => `${v > 0 ? "+" : ""}${v.toFixed(1)}σ`}
              domain={[(dataMin) => Math.min(dataMin - 0.3, -1), (dataMax) => Math.max(dataMax + 0.3, 1)]}
            />
            <ReferenceLine y={0} stroke="#3a3f45" strokeDasharray="2 2" />
            <Tooltip contentStyle={{ background: "#0c0d10", border: "1px solid #2a2e33", borderRadius: 12, fontSize: 12 }} formatter={zTooltipFormatter} />
            <Legend wrapperStyle={{ fontSize: 11 }} />
            {strokesToShow.map((stroke) => (
              <Line key={stroke} type="monotone" dataKey={`z_${stroke}`} name={SWIM_STROKE_LABELS[stroke]} stroke={SWIM_STROKE_COLORS[stroke]} strokeWidth={2} dot={{ r: 3 }} connectNulls />
            ))}
            <Line type="monotone" dataKey="hrZ" name="Avg HR" stroke="#E63946" strokeWidth={2} strokeDasharray="4 3" dot={{ r: 3 }} connectNulls />
          </LineChart>
        </ResponsiveContainer>
        {strokeCaption}
      </div>
    );
  };

  return (
    <div>
      {sessions.length === 0 ? (
        <div style={{ textAlign: "center", padding: "40px 20px", color: "#6b7078", fontSize: 13 }}>
          No swim sessions yet — head to History &amp; Log, switch to "Swim", and upload a .FIT file to get started.
        </div>
      ) : (
        <>
          {/* Swim section tabs — Dashboard / Trend / Compare / Radar. Segmented control styled
              like the floating filter bars elsewhere in this tab (solid warm-dark background,
              pill buttons), sticky so it stays reachable while scrolling a long tab's content.
              top is tuned near 0 now that the OUTER nav (Today/Workout/Swim/History & Log) is
              no longer sticky itself — this inner switcher is now the only thing floating above
              this content, so it no longer needs to reserve space for the outer nav above it
              (item 5). Dashboard holds everything that isn't Trend or Compare (PRs, streak,
              distance breakdown, insights) — Radar keeps its own tab as before. */}
          <div style={{ position: "sticky", top: isMobile ? 0 : 2, zIndex: 31, display: "flex", gap: 6, background: FLOATING_BAR_BG, border: `1px solid ${FLOATING_BAR_BORDER}`, borderRadius: 16, padding: 6, marginBottom: 14, boxShadow: "0 8px 20px -10px rgba(0,0,0,0.6)" }}>
            {[["dashboard", "Dashboard", LayoutGrid], ["trends", "Trend", TrendingUp], ["compare", "Compare", GitCompare], ["radar", "Radar", RadarIcon]].map(([v, l, Ic]) => {
              const selected = swimSection === v;
              return (
                <button key={v} onClick={() => setSwimSection(v)} style={{
                  flex: 1, display: "flex", alignItems: "center", justifyContent: "center", gap: 6, cursor: "pointer",
                  background: selected ? "#F2994A" : "transparent", border: "none", borderRadius: 11,
                  color: selected ? "#0c0d10" : "#8a8f98", fontWeight: 700, fontSize: 13, padding: "9px 10px",
                  transition: "background 0.15s, color 0.15s",
                }}>
                  <Ic size={14} />
                  {l}
                </button>
              );
            })}
          </div>

          {swimSection === "dashboard" && (
            <>
          {/* PR card — top, matching the Workout tab's emphasis on PRs first */}
          <div style={{ background: "linear-gradient(180deg, #191b20 0%, #131418 100%)", border: "1px solid #23262d", borderRadius: 20, boxShadow: "0 10px 24px -14px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.03)", padding: 16, marginBottom: 12 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 10 }}>
              <Award size={14} color="#56CCF2" />
              <span style={{ fontSize: 11, color: "#8a8f98", fontWeight: 600, textTransform: "uppercase", letterSpacing: "0.04em" }}>Swim PRs</span>
            </div>
            <div style={{ display: "grid", gridTemplateColumns: isMobile ? "1fr" : "repeat(2, 1fr)", gap: 10 }}>
              {[
                { label: "Best pace", pr: bestPacePR, fmt: (v) => fmtPace100(v) },
                { label: "Best SWOLF (same pool length)", pr: bestSwolfPR, fmt: (v) => Math.round(v) },
                { label: "Longest session", pr: longestSessionPR, fmt: (v) => `${v}m` },
                { label: "Best CSS pace", pr: bestCssPR, fmt: (v) => fmtPace100(v) },
              ].map(({ label, pr, fmt }) => {
                const age = pr ? agingLabel(dayDiff(pr.date, todayStr)) : null;
                return (
                  <div key={label}>
                    <div style={{ display: "flex", justifyContent: "space-between", gap: 8, fontSize: 12 }}>
                      <span style={{ color: "#9a9fa6" }}>{label}</span>
                      <span className="mono" style={{ color: "#c9cdd3", fontWeight: 700, whiteSpace: "nowrap" }}>{pr ? fmt(pr.value) : "—"}</span>
                    </div>
                    <div style={{ display: "flex", justifyContent: "space-between", fontSize: 10 }} className="mono">
                      <span style={{ color: "#5a5f66" }}>
                        {pr ? fmtDate(pr.date) : label === "Best CSS pace" ? "no CSS test logged yet" : ""}
                        {pr && pr.stroke && <span style={{ color: SWIM_STROKE_COLORS[pr.stroke] || "#5a5f66" }}> · {SWIM_STROKE_LABELS[pr.stroke]}</span>}
                      </span>
                      {age && <span style={{ color: age.color }}>{age.text}</span>}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>

          {/* Streak — small, secondary to PR */}
          <div style={{ background: "linear-gradient(180deg, #191b20 0%, #131418 100%)", border: "1px solid #23262d", borderRadius: 20, boxShadow: "0 10px 24px -14px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.03)", padding: "10px 16px", marginBottom: 18 }}>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 10 }}>
              <div>
                <div className="disp" style={{ fontSize: 18, fontWeight: 700, color: "#56CCF2" }}>{streak.weekStreak}</div>
                <div style={{ fontSize: 10, color: "#9a9fa6" }}>Week streak</div>
              </div>
              <div>
                <div className="disp" style={{ fontSize: 18, fontWeight: 700, color: "#F5F3EE" }}>{streak.totalSessions}</div>
                <div style={{ fontSize: 10, color: "#9a9fa6" }}>Sessions logged</div>
              </div>
              <div>
                <div className="disp" style={{ fontSize: 18, fontWeight: 700, color: streak.daysSinceLast > 7 ? "#E63946" : "#F5F3EE" }}>{streak.daysSinceLast}d</div>
                <div style={{ fontSize: 10, color: "#9a9fa6" }}>Since last swim</div>
              </div>
            </div>
          </div>

          {/* Distance by swim type — latest session vs 6-week total distance, plus each
              stroke's % share of total distance over that same 6-week window. See
              strokeDistanceStats above for exactly how these are computed. */}
          {strokeDistanceStats.length > 0 && (
            <div style={cardStyle}>
              <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 2 }}>
                <TrendingUp size={13} color="#56CCF2" />
                <div style={{ ...labelStyle, marginBottom: 0 }}>Distance by swim type</div>
              </div>
              <div style={{ fontSize: 10.5, color: "#5a5f66", marginBottom: 12 }}>
                % share of your total distance across all strokes, last 6 weeks
              </div>
              <div style={{ display: "grid", gap: 14 }}>
                {strokeDistanceStats.map(({ stroke, latest, sixWeekTotal, pct }) => (
                  <div key={stroke}>
                    <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10, marginBottom: 5 }}>
                      <div style={{ display: "flex", alignItems: "center", gap: 8, minWidth: 0 }}>
                        <span style={{ width: 8, height: 8, borderRadius: 4, background: SWIM_STROKE_COLORS[stroke], flexShrink: 0 }} />
                        <span style={{ fontSize: 12.5, color: "#c9cdd3" }}>{SWIM_STROKE_LABELS[stroke]}</span>
                        <span className="mono" style={{ fontSize: 10.5, color: "#6b7078" }} title="Share of total distance across all strokes, last 6 weeks">{pct != null ? `${pct.toFixed(0)}%` : "—"}</span>
                      </div>
                      <div style={{ display: "flex", gap: 16, flexShrink: 0 }}>
                        <div style={{ textAlign: "right" }}>
                          <div className="mono" style={{ fontSize: 13, fontWeight: 700, color: "#F5F3EE" }}>{latest ? `${latest.distance}m` : "—"}</div>
                          <div style={{ fontSize: 9, color: "#5a5f66" }}>latest</div>
                        </div>
                        <div style={{ textAlign: "right" }}>
                          <div className="mono" style={{ fontSize: 13, fontWeight: 700, color: "#9a9fa6" }}>{sixWeekTotal}m</div>
                          <div style={{ fontSize: 9, color: "#5a5f66" }}>6-wk total</div>
                        </div>
                      </div>
                    </div>
                    <div style={{ height: 5, borderRadius: 3, background: "#20232a", overflow: "hidden" }}>
                      <div style={{ height: "100%", width: `${pct != null ? Math.max(pct, pct > 0 ? 2 : 0) : 0}%`, background: SWIM_STROKE_COLORS[stroke], borderRadius: 3 }} />
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* Insights — rule-based, deterministic interpretation of your swim data. No AI, no
              network calls: every line below is generated locally from data already computed
              above (trendData / chronSessions). See buildSwimInsights and its generator
              functions near the top of the file. */}
          <div style={cardStyle}>
            <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 12 }}>
              <Sparkles size={13} color="#F2C94C" />
              <div style={{ ...labelStyle, marginBottom: 0 }}>Insights</div>
            </div>
            {(() => {
              const strokeLabel = activeStroke ? SWIM_STROKE_LABELS[activeStroke] : "Swim";
              const swimInsights = buildSwimInsights({
                chronSessions, trendData, activeStroke, strokeLabel, todayStr,
                strokeFilterActive: strokeFilter !== "all",
              });
              if (swimInsights.length === 0) {
                return <div style={{ fontSize: 12.5, color: "#6b7078" }}>Log a swim to start seeing insights here.</div>;
              }
              return (
                <div style={{ display: "grid", gap: 10 }}>

          {swimSection === "trends" && (

          {renderFilterBar()}

          {/* Trends — compact sparkline cards, tap to expand */}
          <div style={cardStyle}>
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 8, marginBottom: 12 }}>

              <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
                <div style={{ display: "flex", gap: 4 }}>

                    <button key={v} onClick={() => setSwimTimeView(v)} className="pill" style={{

                      borderRadius: 12, padding: "5px 10px", fontSize: 11.5, fontWeight: 600,

                  ))}
                </div>
                <button
                  onClick={() => setMetricValueMode((m) => (m === "avg6" ? "latest" : "avg6"))}
                  title="Toggle each card's big number between the latest session and a 6-week average"
                  className="pill"
                  style={{
                    cursor: "pointer",
                    background: metricValueMode === "avg6" ? "#56CCF2" : "transparent",
                    border: "1px solid " + (metricValueMode === "avg6" ? "#56CCF2" : "#23262d"),
                    color: metricValueMode === "avg6" ? "#0c0d10" : "#8a8f98",
                    borderRadius: 12, padding: "5px 10px", fontSize: 11.5, fontWeight: 700,
                  }}
                >6-wk avg</button>
                {metricCards.length > 0 && (
                  <button onClick={toggleExpandAllMetrics} className="pill" style={{
                    display: "flex", alignItems: "center", gap: 5, cursor: "pointer",
                    background: allMetricsExpanded ? "#23262d" : "transparent",
                    border: "1px solid " + (allMetricsExpanded ? "#3a3f45" : "#23262d"),
                    color: allMetricsExpanded ? "#F5F3EE" : "#8a8f98",
                    borderRadius: 12, padding: "5px 10px", fontSize: 11.5, fontWeight: 600,
                  }}>
                    <ChevronDown size={12} style={{ transform: allMetricsExpanded ? "rotate(180deg)" : "none", transition: "transform 0.15s" }} />
                    {allMetricsExpanded ? "Collapse all" : "Expand all"}
                  </button>
                )}
              </div>
            </div>
            <div style={{ display: "grid", gridTemplateColumns: isMobile ? "1fr" : "repeat(2, 1fr)", gap: 10 }}>
              {metricCards.map((card) => {
                const isOpen = expandedMetrics.has(card.key);
                const pts = sparkPoints(card.series);
                return (
                  <div key={card.key} style={{ background: "#0c0d10", border: `1.5px solid ${card.color}${isOpen ? "cc" : "70"}`, borderRadius: 16, padding: 12, cursor: "pointer", transition: "border-color 0.15s" }} onClick={() => toggleMetric(card.key)}>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 4, gap: 8 }}>
                      <div style={{ minWidth: 0 }}>
                        <div style={{ fontSize: 11.5, fontWeight: 600, color: "#c9cdd3" }}>{card.title}</div>
                        <div className="disp" style={{ fontSize: 19, fontWeight: 700, color: "#F5F3EE", marginTop: 2 }}>{card.value}</div>
                        {card.sub && <div className="mono" style={{ fontSize: 10, color: "#E63946" }}>{card.sub}</div>}
                      </div>
                      <div style={{ display: "flex", flexDirection: "column", alignItems: "flex-end", gap: 6, flexShrink: 0 }}>
                        {card.verdict && (
                          <span className="mono" style={{ fontSize: 10.5, fontWeight: 700, color: card.verdict.color, border: `1px solid ${card.verdict.color}55`, borderRadius: 6, padding: "2px 6px", whiteSpace: "nowrap" }}>{card.verdict.label}</span>
                        )}
                        <button
                          onClick={(e) => { e.stopPropagation(); toggleMetric(card.key); }}
                          title={isOpen ? "Collapse chart" : "Expand chart"}
                          style={{ cursor: "pointer", background: isOpen ? `${card.color}22` : "transparent", border: `1px solid ${isOpen ? card.color + "55" : "#2b2e36"}`, borderRadius: 6, width: 22, height: 22, display: "flex", alignItems: "center", justifyContent: "center", padding: 0 }}
                        >
                          <ChevronDown size={12} style={{ color: isOpen ? card.color : "#8a8f98", transform: isOpen ? "rotate(180deg)" : "none", transition: "transform 0.15s" }} />
                        </button>
                      </div>
                    </div>
                    {!isOpen && (pts.length >= 2 ? (
                      <ResponsiveContainer width="100%" height={64}>
                        <LineChart data={pts} margin={{ top: 2, right: 2, left: 2, bottom: 2 }}>

                    {isOpen && (

            {/* CSS trend — kept full-size since it's rare/high-signal */}
            <div style={{ marginTop: 18 }}>
              <div style={{ fontSize: 12.5, fontWeight: 600, color: "#c9cdd3", marginBottom: 8 }}>Critical Swim Speed (CSS) over time</div>
              {cssTrendData.length === 0 ? (
                <div style={{ fontSize: 12, color: "#6b7078", background: "#0c0d10", border: "1px dashed #22262b", borderRadius: 16, padding: "12px 14px" }}>
                  No CSS test logged yet. CSS isn't estimated from casual sessions — mark a session as a CSS test at upload time (in History &amp; Log) to start this chart.
                </div>
              ) : (
                <ResponsiveContainer width="100%" height={200}>
                  <LineChart data={cssTrendData} margin={{ top: 4, right: 8, left: 0, bottom: 0 }}>
                    <CartesianGrid strokeDasharray="3 3" stroke="#23262d" />
                    <XAxis dataKey="label" tick={{ fill: "#6b7078", fontSize: 10.5 }} />
                    <YAxis tick={{ fill: "#6b7078", fontSize: 10.5 }} tickFormatter={(v) => fmtMinSec(v)} reversed domain={["dataMin - 5", "dataMax + 5"]} />
                    <Tooltip contentStyle={{ background: "#0c0d10", border: "1px solid #2a2e33", borderRadius: 12, fontSize: 12 }} formatter={(v) => fmtPace100(v)} />
                    <Line type="monotone" dataKey="cssPace100" name="CSS pace /100m" stroke="#2EC4B6" strokeWidth={2} dot={{ r: 4 }} connectNulls />
                  </LineChart>
                </ResponsiveContainer>
              )}
            </div>
          </div>
            </>
          )}

          {swimSection === "compare" && (
            <>
          {renderFilterBar()}
          {/* Compare — optional metric overlays (Pace+StrokeRate, Pace+StrokeDistance, Pace+HR,
              SWOLF+HR). Additive to the Trends chart above, not a replacement. Reuses the same
              z-score normalization approach as the Pace/HR overlay in Trends (see
              expandedChartFor) so two differently-scaled metrics can be read on one axis without
              one visually dominating the other. Respects the current stroke filter and Day/Week
              toggle. HR-based modes are always whole-session (HR isn't recorded per-stroke). */}
          <div style={cardStyle}>
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 8, marginBottom: 8 }}>
              <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                <div style={{ ...labelStyle, marginBottom: 0 }}>Compare</div>
                <button
                  onClick={() => setShowCompareInfo((v) => !v)}
                  title="What is this?"
                  style={{ cursor: "pointer", background: showCompareInfo ? "#23262d" : "transparent", border: "1px solid " + (showCompareInfo ? "#3a3f45" : "#2b2e36"), borderRadius: "50%", width: 20, height: 20, display: "flex", alignItems: "center", justifyContent: "center", padding: 0, flexShrink: 0 }}
                >
                  <Info size={12} style={{ color: showCompareInfo ? "#F5F3EE" : "#8a8f98" }} />
                </button>
              </div>
              <div style={{ display: "flex", gap: 4, flexWrap: "wrap" }}>
                {[["cadence", "Pace + Stroke Rate", "#56CCF2"], ["dps", "Pace + Stroke Distance", "#9CCC65"], ["hr", "Pace + HR", "#E63946"], ["swolfhr", "SWOLF + HR", "#BB86FC"]].map(([v, l, c]) => (
                  <button key={v} onClick={() => setCompareMode(v)} className="pill" style={{
                    cursor: "pointer", background: compareMode === v ? c : `${c}1a`,
                    border: `1.5px solid ${compareMode === v ? c : c + "55"}`,
                    color: compareMode === v ? "#0c0d10" : c,
                    borderRadius: 12, padding: "5px 10px", fontSize: 11.5, fontWeight: 700,
                  }}>{l}</button>
                ))}
              </div>
            </div>
            {showCompareInfo && (
              <div style={{ fontSize: 11, color: "#9a9fa6", background: "#0c0d10", border: "1px solid #22262b", borderRadius: 12, padding: "8px 10px", marginBottom: 10, lineHeight: 1.5 }}>
                {COMPARE_MODE_DESCRIPTIONS[compareMode]} Tap a dot below to focus on that session. Lines are normalized (σ) so two differently-scaled metrics can share one axis — real values are always in the tooltip, and the "better" direction is flipped so up always means improving.
              </div>
            )}
            {/* Swim-type filter lives only once now, as the shared floating filter above both
                Trends and Compare — both cards read the same strokeFilter state, so picking a
                stroke up there filters this chart too without a second, easy-to-miss control
                down here. */}
            {(() => {
              if (!activeStroke) return <div style={{ fontSize: 12, color: "#6b7078" }}>No stroke data yet.</div>;
              const modeCfg = {
                cadence:  { primary: "pace",  secLabel: "Stroke rate",     secFmt: (v) => `${fmtNum(v, 1)} spm`, secKey: `cadence_${activeStroke}`, secColor: "#F2C94C", wholeSession: false },
                dps:      { primary: "pace",  secLabel: "Distance/stroke", secFmt: (v) => `${fmtNum(v, 2)}m`,    secKey: `dps_${activeStroke}`,     secColor: "#F2C94C", wholeSession: false },
                hr:       { primary: "pace",  secLabel: "Avg HR",          secFmt: (v) => `${Math.round(v)} bpm`, secKey: "avgHR",                  secColor: "#E63946", wholeSession: true },
                swolfhr:  { primary: "swolf", secLabel: "Avg HR",          secFmt: (v) => `${Math.round(v)} bpm`, secKey: "avgHR",                  secColor: "#E63946", wholeSession: true },
              };
              const cfg = modeCfg[compareMode];
              const primaryKey = cfg.primary === "pace" ? paceDataKey : `swolf_${activeStroke}`;
              const primaryLabel = cfg.primary === "pace" ? "Pace" : "SWOLF";
              const primaryFmt = cfg.primary === "pace" ? fmtPace100 : (v) => Math.round(v);
              const otherKey = cfg.secKey, otherLabel = cfg.secLabel, otherFmt = cfg.secFmt, otherColor = cfg.secColor;
              const strokeLabel = SWIM_STROKE_LABELS[activeStroke];

              if (cfg.wholeSession && !trendDataView.some((d) => d.avgHR != null)) {
                return <div style={{ padding: "20px 10px", textAlign: "center", color: "#5a5f66", fontSize: 12.5 }}>No heart rate data recorded yet.</div>;
              }

              const primaryStats = computeMeanStd(trendDataView.map((d) => d[primaryKey]));
              const otherStats = computeMeanStd(trendDataView.map((d) => d[otherKey]));
              const pairedCount = trendDataView.filter((d) => d[primaryKey] != null && d[otherKey] != null).length;
              const normalizedData = trendDataView.map((d) => ({
                ...d,
                // Pace and SWOLF are both "lower is better", so both get sign-flipped the same
                // way the existing Pace/HR chart flips pace — "up" always means better here.
                primaryZ: primaryStats ? (() => { const z = zScoreOf(d[primaryKey], primaryStats); return z == null ? null : -z; })() : null,
                otherZ: otherStats ? zScoreOf(d[otherKey], otherStats) : null,
              }));
              const zTooltipFormatter = (v, name, props) => {
                if (name === primaryLabel) return [props.payload[primaryKey] != null ? primaryFmt(props.payload[primaryKey]) : "—", name];
                if (name === otherLabel) return [props.payload[otherKey] != null ? otherFmt(props.payload[otherKey]) : "—", name];
                return [v, name];
              };

              return (
                <div>
                  <div style={{ fontSize: 10.5, color: "#6b7078", marginBottom: 10, display: "flex", alignItems: "center", gap: 5, flexWrap: "wrap" }}>
                    <span>{strokeLabel}</span>
                    {strokeFilter === "all" && (
                      <span style={{ color: "#F2994A", display: "flex", alignItems: "center", gap: 4 }}>
                        <AlertTriangle size={11} style={{ flexShrink: 0 }} />
                        your primary stroke shown; this session set contains multiple swim types, use the filter above to narrow
                      </span>
                    )}
                    {cfg.wholeSession && strokeFilter !== "all" && <span style={{ color: "#5a5f66" }}>· HR is whole-session, not stroke-specific</span>}
                  </div>
                  {pairedCount < 2 ? (
                    pairedCount === 0 ? (
                      <div style={{ padding: "26px 10px", textAlign: "center", color: "#5a5f66", fontSize: 12.5, lineHeight: 1.5 }}>
                        No sessions yet with both {primaryLabel.toLowerCase()} and {otherLabel.toLowerCase()} recorded for {strokeLabel.toLowerCase()}.
                      </div>
                    ) : (
                      <>
                        {(() => {
                          const only = trendDataView.find((d) => d[primaryKey] != null && d[otherKey] != null) || trendDataView[0];
                          return (
                            <div style={{ display: "flex", gap: 28, padding: "18px 4px 8px" }}>
                              <div>
                                <div style={{ fontSize: 10, color: "#8a8f98", textTransform: "uppercase", letterSpacing: "0.06em" }}>{primaryLabel}</div>
                                <div style={{ fontSize: 21, fontWeight: 700, color: "#56CCF2" }}>{only[primaryKey] != null ? primaryFmt(only[primaryKey]) : "—"}</div>
                              </div>
                              <div>
                                <div style={{ fontSize: 10, color: "#8a8f98", textTransform: "uppercase", letterSpacing: "0.06em" }}>{otherLabel}</div>
                                <div style={{ fontSize: 21, fontWeight: 700, color: otherColor }}>{only[otherKey] != null ? otherFmt(only[otherKey]) : "—"}</div>
                              </div>
                            </div>
                          );
                        })()}
                        <div style={{ fontSize: 10, color: "#5a5f66", marginTop: 4 }}>Log one more comparable swim to see these actually plotted against each other.</div>
                      </>
                    )
                  ) : (() => {
                    const primaryPoints = trendDataView.map((d) => ({ date: d.date, v: d[primaryKey] })).filter((p) => p.v != null);
                    const secPoints = trendDataView.map((d) => ({ date: d.date, v: d[otherKey] })).filter((p) => p.v != null);

                    const selectedRow = selectedComparePoint ? trendDataView.find((d) => d.date === selectedComparePoint) : null;
                    const selectedPrimary = selectedRow ? selectedRow[primaryKey] : null;
                    const selectedSecondary = selectedRow ? selectedRow[otherKey] : null;
                    // Baseline for a selected session = its other recent comparable sessions (same stroke,
                    // same metrics), capped to the last 6 for recency — not the whole lifetime history.
                    const baselinePrimaryVals = primaryPoints.filter((p) => p.date !== selectedComparePoint).slice(-6).map((p) => p.v);
                    const baselineSecondaryVals = secPoints.filter((p) => p.date !== selectedComparePoint).slice(-6).map((p) => p.v);

                    const trendInterp = !selectedComparePoint ? generateCompareTrendInterpretation(compareMode, primaryPoints, secPoints, INSIGHT_THRESHOLDS.mediumTermWeeks) : null;
                    const sessionInterp = selectedRow ? generateCompareSessionInterpretation(compareMode, strokeLabel, selectedPrimary, selectedSecondary, baselinePrimaryVals, baselineSecondaryVals, primaryFmt, otherFmt) : null;
                    const interp = selectedComparePoint ? sessionInterp : trendInterp;
                    const cat = interp ? INSIGHT_CATEGORIES[interp.category] : null;

                    // Custom dot renderer: purely visual now (see item 4/6) — selection itself is
                    // driven by the chart-level onClick above, not this dot's own click, since that's
                    // what reliably registers on mobile taps. Selected dot enlarges and lightens,
                    // every other dot dims so the selection reads clearly against the full trend line.
                    const makeDot = (color) => (dotProps) => {
                      const { cx, cy, payload, index } = dotProps;
                      if (cx == null || cy == null) return null;
                      const isSelected = selectedComparePoint === payload.date;
                      const isDimmed = selectedComparePoint && !isSelected;
                      return (
                        <circle
                          key={`dot-${color}-${index}`}
                          cx={cx} cy={cy}
                          r={isSelected ? 6 : 3}
                          fill={isSelected ? "#F5F3EE" : color}
                          stroke={color}
                          strokeWidth={isSelected ? 2 : 1}
                          opacity={isDimmed ? 0.3 : 1}
                        />
                      );
                    };

                    return (
                      <>
                        {selectedRow && (
                          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 8, marginBottom: 8 }}>
                            <div style={{ fontSize: 12, fontWeight: 700, color: "#F5F3EE" }}>Selected: {selectedRow.label}</div>
                            <button onClick={() => setSelectedComparePoint(null)} className="pill" style={{ cursor: "pointer", background: "transparent", border: "1px solid #3a3f45", color: "#8a8f98", borderRadius: 12, padding: "3px 9px", fontSize: 11 }}>
                              ← View overall trend
                            </button>
                          </div>
                        )}
                        {interp ? (
                          <div style={{ display: "flex", gap: 8, alignItems: "flex-start", background: cat.bg, border: `1px solid ${cat.color}33`, borderRadius: 14, padding: "10px 12px", marginBottom: 12 }}>
                            <cat.Icon size={14} style={{ color: cat.color, flexShrink: 0, marginTop: 1 }} />
                            <div>
                              <div style={{ fontSize: 12.5, fontWeight: 700, color: cat.color }}>{interp.headline}</div>
                              <div style={{ fontSize: 11.5, color: "#c9cdd3", marginTop: 1 }}>{interp.detail}</div>
                            </div>
                          </div>
                        ) : (
                          <div style={{ fontSize: 11.5, color: "#6b7078", marginBottom: 12 }}>
                            {selectedComparePoint ? "Not enough other comparable sessions yet to compare this one against." : "Not enough comparable sessions yet to interpret this trend — keep logging and this will fill in."}
                          </div>
                        )}
                        {selectedRow && selectedPrimary != null && selectedSecondary != null && (
                          <div style={{ display: "flex", gap: 24, flexWrap: "wrap", marginBottom: 12 }}>
                            <div>
                              <div style={{ fontSize: 10, color: "#8a8f98", textTransform: "uppercase", letterSpacing: "0.06em" }}>Selected session</div>
                              <div style={{ fontSize: 13, color: "#F5F3EE" }}>{primaryLabel} {primaryFmt(selectedPrimary)} &nbsp; {otherLabel} {otherFmt(selectedSecondary)}</div>
                            </div>
                            {baselinePrimaryVals.length >= 2 && baselineSecondaryVals.length >= 2 && (
                              <div>
                                <div style={{ fontSize: 10, color: "#8a8f98", textTransform: "uppercase", letterSpacing: "0.06em" }}>Recent baseline</div>
                                <div style={{ fontSize: 13, color: "#9a9fa6" }}>{primaryLabel} {primaryFmt(medianOf(baselinePrimaryVals))} &nbsp; {otherLabel} {otherFmt(medianOf(baselineSecondaryVals))}</div>
                              </div>
                            )}
                          </div>
                        )}
                        <ResponsiveContainer width="100%" height={220}>
                          <LineChart
                            data={normalizedData}
                            margin={{ top: 4, right: 8, left: 0, bottom: 0 }}
                            onClick={(e) => {
                              // Chart-level click/tap handler, not per-dot: this uses Recharts' own
                              // touch-tracking (the same mechanism that already drives the Tooltip),
                              // which reliably hit-tests on mobile taps — a raw onClick on a 3px SVG
                              // dot circle does not, since the tracking layer intercepts the touch
                              // first. activePayload carries the full row (including its date) for
                              // whichever x-position was tapped.
                              if (!e || !e.activePayload || !e.activePayload.length) return;
                              const clickedDate = e.activePayload[0].payload.date;
                              if (clickedDate == null) return;
                              setSelectedComparePoint((prev) => (prev === clickedDate ? null : clickedDate));
                            }}
                          >
                            <CartesianGrid strokeDasharray="3 3" stroke="#23262d" />
                            <XAxis dataKey="label" tick={{ fill: "#6b7078", fontSize: 10.5 }} />
                            <YAxis tick={{ fill: "#6b7078", fontSize: 10.5 }} tickFormatter={(v) => `${v > 0 ? "+" : ""}${v.toFixed(1)}σ`} domain={[(dataMin) => Math.min(dataMin - 0.3, -1), (dataMax) => Math.max(dataMax + 0.3, 1)]} />
                            {/* Bright teal, distinct from every line color this chart can show (blue
                                primary, gold or red secondary) so "Avg" reads clearly against all of them —
                                previously a low-contrast gray that nearly disappeared on the dark background. */}
                            <ReferenceLine y={0} stroke="#2EC4B6" strokeWidth={1.5} strokeDasharray="4 3" label={{ value: "Avg", position: "insideTopRight", fill: "#2EC4B6", fontSize: 11, fontWeight: 700 }} />
                            <Tooltip contentStyle={{ background: "#0c0d10", border: "1px solid #2a2e33", borderRadius: 12, fontSize: 12 }} formatter={zTooltipFormatter} />
                            <Legend wrapperStyle={{ fontSize: 11 }} />
                            <Line type="monotone" dataKey="primaryZ" name={primaryLabel} stroke="#56CCF2" strokeWidth={2} dot={makeDot("#56CCF2")} activeDot={{ r: 5, style: { cursor: "pointer" } }} connectNulls />
                            <Line type="monotone" dataKey="otherZ" name={otherLabel} stroke={otherColor} strokeWidth={2} dot={makeDot(otherColor)} activeDot={{ r: 5, style: { cursor: "pointer" } }} connectNulls />
                          </LineChart>
                        </ResponsiveContainer>
                      </>
                    );
                  })()}
                </div>
              );
            })()}
          </div>
            </>
          )}

          {swimSection === "radar" && (
            <>
          {renderFilterBar()}
          {/* Web chart — Current vs Baseline swim, normalized across whichever metrics are
              picked, drawn as two overlapping radar polygons (item 4). Respects the same
              stroke + Workout/CSS Test filters as Trends/Compare via chronSessions. */}
          <div style={cardStyle}>
            <div style={{ ...labelStyle, marginBottom: 2 }}>Web chart</div>
            <div style={{ fontSize: 11, color: "#6b7078", marginBottom: 14 }}>Current session vs a baseline, normalized onto one shared scale so differently-scaled metrics can share one chart. Pick which axes to show and which two sessions to compare.</div>

            <div style={{ display: "flex", gap: 12, flexWrap: "wrap", marginBottom: 14 }}>
              <div>
                <div style={{ fontSize: 10, color: "#8a8f98", textTransform: "uppercase", letterSpacing: "0.06em", marginBottom: 4 }}>Current</div>
                <select
                  value={radarCurrentSession ? radarCurrentSession.id : ""}
                  onChange={(e) => setRadarCurrentId(e.target.value)}
                  className="mono"
                  style={{ background: "#0c0d10", border: "1px solid #2a2e33", borderRadius: 8, padding: "6px 9px", color: "#c9cdd3", fontSize: 11.5, cursor: "pointer" }}
                >
                  {[...chronSessions].reverse().map((s) => (
                    <option key={s.id} value={s.id}>{fmtDate(s.date)}{s.id === latestChronSession?.id ? " (latest)" : ""}</option>
