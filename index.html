  const sessionVolume = (s) => Object.keys(s.ex).reduce((sum, name) => {
    if (!s.ex[name]) return sum;
    const v = exerciseVolume(s, name);
    return v == null ? sum : sum + v;
  }, 0);

  const volumeKpi = useMemo(() => {
    if (!sessions || !latest || !first) return null;
    const latestVol = sessionVolume(latest);
    const firstVol = sessionVolume(first);
    const cumulative = sessions.reduce((sum, s) => sum + sessionVolume(s), 0);
    return { latestVol, delta: latestVol - firstVol, cumulative };
  }, [sessions, latest, first]);

  const groupVolumeLatest = useMemo(() => {
    if (!latest) return [];
    const totals = {}; GROUPS.forEach((g) => (totals[g] = 0));
    Object.keys(latest.ex).forEach((name) => {
      const v = exerciseVolume(latest, name);
      if (v == null) return;
      const group = muscleGroupMap[name] || "Custom";
      if (totals[group] === undefined) totals[group] = 0;
      totals[group] += v;
    });
    const grand = Object.values(totals).reduce((a, b) => a + b, 0) || 1;
    return GROUPS.map((g) => ({ group: g, kg: Math.round(totals[g] || 0), pct: Math.round(((totals[g] || 0) / grand) * 100) }));
  }, [latest, muscleGroupMap]);

  // PRs are tracked by TOTAL session volume (all sets for that exercise, summed) rather than a
  // single best set — one big set can flatter a session that was otherwise unremarkable, while
  // total volume reflects the actual work done. Each PR also carries the rep/set breakdown it
  // was built from, plus how many days ago it was set ("PR aging"), so a PR you haven't come
  // close to in months reads differently from one you nearly matched last week.
  // Uses the same "currently actually logged" list as the charts (`chartExercises`) — not
  // every exercise name that has ever existed — so a PR disappears once you delete the
  // session(s) that produced it, instead of hanging around forever.
  const prMap = useMemo(() => {
    if (!sessions) return {};
    const map = {};
    chartExercises.forEach((name) => {
      let best = null; // { oneRM, reps, weight, date }
      let priorBest = -1;
      sessions.forEach((s) => {
        if (!s.ex[name]) return;
        const sessionBest = bestSet1RM(s, name);
        if (sessionBest == null) return; // no bodyweight logged for this session — 1RM unknown, skip
        if (!latest || s.id !== latest.id) { if (sessionBest.oneRM > priorBest) priorBest = sessionBest.oneRM; }
        if (!best || sessionBest.oneRM > best.oneRM) best = { ...sessionBest, date: s.date };
      });
      const latestBest = latest && latest.ex[name] ? bestSet1RM(latest, name) : null;
      const latestVal = latestBest ? latestBest.oneRM : -1;
      map[name] = {
        best1RM: best ? best.oneRM : -1,
        bestDate: best ? best.date : null,
        bestReps: best ? best.reps : null,
        bestWeight: best ? best.weight : null,
        daysAgo: best ? dayDiff(best.date, todayStr) : null,
        isNewPR: latest && !!best && latestVal > priorBest && latestVal === best.oneRM,
      };
    });
    return map;
  }, [sessions, latest, todayStr, chartExercises]);

  // Fresh (<=13d), aging (14-45d), or stale (46d+) — a quick-glance color for how long ago a
  // PR was actually set, so a shiny "all-time best" number doesn't hide that it's 4 months old.
  const prAgeLabel = agingLabel;

  const consistency = useMemo(() => {
    if (!sessions || sessions.length === 0) return null;
    const weekKeySet = new Set(sessions.map((s) => toISODate(mondayOf(s.date))));
    const currentMonday = mondayOf(todayStr);
    let streak = 0, firstIter = true;
    let cursor = new Date(currentMonday);
    for (let i = 0; i < 104; i++) {
      const key = toISODate(cursor);
      if (weekKeySet.has(key)) streak++;
      else if (!firstIter) break;
      firstIter = false;
      cursor.setDate(cursor.getDate() - 7);
    }
    const firstMonday = mondayOf(sessions[0].date);
    const weeksSpan = Math.max(1, Math.round((currentMonday - firstMonday) / (7 * 86400000)) + 1);
    const avgPerWeek = (sessions.length / weeksSpan).toFixed(1);
    const thisWeekKey = toISODate(currentMonday);
    const thisWeekCount = sessions.filter((s) => toISODate(mondayOf(s.date)) === thisWeekKey).length;
    const daysSinceLast = dayDiff(sessions[sessions.length - 1].date, todayStr);
    return { streak, avgPerWeek, thisWeekCount, daysSinceLast };
  }, [sessions]);

  const twelveWeekTarget = useMemo(() => {
    if (!sessions || sessions.length === 0 || !first) return null;
    const goalWeeks = (targetSettings && targetSettings.weeks) || 12;
    const startDate = (targetSettings && targetSettings.startDate) || first.date;
    const startMonday = mondayOf(startDate);
    const currentMonday = mondayOf(todayStr);
    const weekKeySet = new Set(sessions.map((s) => toISODate(mondayOf(s.date))));
    let cursor = new Date(startMonday);
    let missedWeeks = 0, trainedWeeks = 0;
    while (cursor < currentMonday) {
      const key = toISODate(cursor);
      if (weekKeySet.has(key)) trainedWeeks++; else missedWeeks++;
      cursor.setDate(cursor.getDate() + 7);
    }
    if (weekKeySet.has(toISODate(currentMonday)) && currentMonday >= startMonday) trainedWeeks++;
    const targetDate = new Date(startMonday);
    targetDate.setDate(targetDate.getDate() + (goalWeeks + missedWeeks) * 7);
    const targetISO = toISODate(targetDate);
    const daysRemaining = Math.max(0, dayDiff(todayStr, targetISO));
    const trainedCapped = Math.min(goalWeeks, trainedWeeks);
    return { targetDate: targetISO, daysRemaining, trainedWeeks: trainedCapped, goalWeeks, missedWeeks, reached: trainedWeeks >= goalWeeks };
  }, [sessions, first, todayStr, targetSettings]);

  const HEATMAP_WEEKS = 24;

  const heatmapWeeks = useMemo(() => {
    if (!sessions) return [];
    const sessionByDate = {};
    sessions.forEach((s) => { sessionByDate[s.date] = s; });
    const currentMonday = mondayOf(todayStr);
    const weeks = [];
    for (let w = HEATMAP_WEEKS - 1; w >= 0; w--) {
      const weekStart = new Date(currentMonday); weekStart.setDate(weekStart.getDate() - w * 7);
      const days = [];
      for (let d = 0; d < 7; d++) {
        const day = new Date(weekStart); day.setDate(day.getDate() + d);
        const iso = toISODate(day);
        days.push({ date: iso, trained: !!sessionByDate[iso], isFuture: iso > todayStr });
      }
      weeks.push(days);
    }
    return weeks;
  }, [sessions]);

  // Measures the heatmap grid's actual available width (via heatmapGridRef) and derives a
  // square size that makes all 24 week-columns plus the day-label column fit exactly —
  // replacing the old fixed 12/14px squares + horizontal scroll, which required swiping on
  // phones. Recomputes on mount and whenever the container resizes (ResizeObserver), so it
  // stays correct across orientation changes and window resizes too.
  useEffect(() => {
    const el = heatmapGridRef.current;
    if (!el) return;
    const GAP = 3;
    const LABEL_COL_WIDTH = 18;
    const compute = () => {
      const width = el.clientWidth;
      if (!width) return;
      const usable = width - LABEL_COL_WIDTH - GAP * HEATMAP_WEEKS;
      const size = Math.max(6, Math.min(16, Math.floor(usable / HEATMAP_WEEKS)));
      setHeatmapCellSize(size);
    };
    compute();
    const ro = new ResizeObserver(compute);
    ro.observe(el);
    return () => ro.disconnect();
  }, []);


  // ---- Dashboard tab (overview): combines workout + swim, doesn't duplicate either tab's
  // full detail — just consistency, weight, a combined "days trained" map, both targets at a
  // glance, and a couple of mini streak cards that link into the sport-specific tabs.
  const [swimTargetSettingsView, setSwimTargetSettingsView] = useState(null);
  const [dashHeatmapCellSize, setDashHeatmapCellSize] = useState(14);
  const [dashHeatmapWeekCount, setDashHeatmapWeekCount] = useState(24);
  const dashHeatmapGridRef = useRef(null);

  useEffect(() => {
    if (tab !== "dashboard") return;
    (async () => {
      try {
        const res = await window.storage.get("swim-target-settings-v1", false);
        setSwimTargetSettingsView(res && res.value ? JSON.parse(res.value) : {});
      } catch (e) {
        setSwimTargetSettingsView({});
      }
    })();
  }, [tab]);

  // Earliest logged date across both workout and swim history — the heatmap is clamped to
  // never render weeks before this, even if the selected dropdown window (8/12/24/52) is
  // longer than actual history. Prevents a wall of empty black cells when history is short.
  const combinedEarliestDate = useMemo(() => {
    const dates = [...(sessions || []).map((s) => s.date), ...(swimSessions || []).map((s) => s.date)];
    if (dates.length === 0) return null;
    return dates.reduce((min, d) => (d < min ? d : min), dates[0]);
  }, [sessions, swimSessions]);

  // How many weeks actually get rendered: the smaller of the selected dropdown value and
  // the number of weeks since the earliest logged session (min 1 so a single-week-old log
  // still renders something).
  const combinedRenderedWeekCount = useMemo(() => {
    if (!combinedEarliestDate) return 0;
    const earliestMonday = mondayOf(combinedEarliestDate);
    const currentMonday = mondayOf(todayStr);
    const weeksAvailable = Math.floor((currentMonday - earliestMonday) / (7 * 86400000)) + 1;
    return Math.max(1, Math.min(dashHeatmapWeekCount, weeksAvailable));
  }, [combinedEarliestDate, todayStr, dashHeatmapWeekCount]);

  useEffect(() => {
    const el = dashHeatmapGridRef.current;
    if (!el || combinedRenderedWeekCount === 0) return;
    const GAP = 3, LABEL_COL_WIDTH = 18;
    const compute = () => {
      const width = el.clientWidth;
      if (!width) return;
      const usable = width - LABEL_COL_WIDTH - GAP * combinedRenderedWeekCount;
      setDashHeatmapCellSize(Math.max(6, Math.min(16, Math.floor(usable / combinedRenderedWeekCount))));
    };
    compute();
    const ro = new ResizeObserver(compute);
    ro.observe(el);
    return () => ro.disconnect();
  }, [tab, combinedRenderedWeekCount]);

  const combinedHeatmapWeeks = useMemo(() => {
    if (!combinedEarliestDate) return [];
    const workoutDates = new Set((sessions || []).map((s) => s.date));
    const swimDates = new Set((swimSessions || []).map((s) => s.date));
    const currentMonday = mondayOf(todayStr);
    const weeks = [];
    for (let w = combinedRenderedWeekCount - 1; w >= 0; w--) {
      const weekStart = new Date(currentMonday); weekStart.setDate(weekStart.getDate() - w * 7);
      const days = [];
      for (let d = 0; d < 7; d++) {
        const day = new Date(weekStart); day.setDate(day.getDate() + d);
        const iso = toISODate(day);
        days.push({ date: iso, workout: workoutDates.has(iso), swim: swimDates.has(iso), isFuture: iso > todayStr, isToday: iso === todayStr });
      }
      weeks.push(days);
    }
    return weeks;
  }, [sessions, swimSessions, todayStr, combinedRenderedWeekCount, combinedEarliestDate]);

  const combinedConsistency = useMemo(() => {
    const dateSet = new Set([...(sessions || []).map((s) => s.date), ...(swimSessions || []).map((s) => s.date)]);
    if (dateSet.size === 0) return null;
    let dayStreak = 0; let cursor = new Date(todayStr + "T00:00:00");
    if (!dateSet.has(toISODate(cursor))) cursor.setDate(cursor.getDate() - 1);
    for (let i = 0; i < 365; i++) {
      const key = toISODate(cursor);
      if (dateSet.has(key)) { dayStreak++; cursor.setDate(cursor.getDate() - 1); } else break;
    }
    const last7 = Array.from({ length: 7 }, (_, i) => { const d = new Date(todayStr + "T00:00:00"); d.setDate(d.getDate() - i); return toISODate(d); });
    const trainedLast7 = last7.filter((d) => dateSet.has(d)).length;
    return { dayStreak, trainedLast7 };
  }, [sessions, swimSessions, todayStr]);

  const swimConsistencyMini = useMemo(() => {
    if (!swimSessions || swimSessions.length === 0) return null;
    const weekKeySet = new Set(swimSessions.map((s) => toISODate(mondayOf(s.date))));
    const currentMonday = mondayOf(todayStr);
    let streak = 0, firstIter = true; const cursor = new Date(currentMonday);
    for (let i = 0; i < 104; i++) {
      const key = toISODate(cursor);
      if (weekKeySet.has(key)) streak++;
      else if (!firstIter) break;
      firstIter = false;
      cursor.setDate(cursor.getDate() - 7);
    }
    const sorted = [...swimSessions].sort((a, b) => (a.date < b.date ? -1 : 1));
    const daysSinceLast = dayDiff(sorted[sorted.length - 1].date, todayStr);
    return { streak, daysSinceLast };
  }, [swimSessions, todayStr]);

  const swimTargetForDash = useMemo(() => {
    if (!swimSessions || swimSessions.length === 0) return null;
    const sortedSwim = [...swimSessions].sort((a, b) => (a.date < b.date ? -1 : 1));
    const goalWeeks = (swimTargetSettingsView && swimTargetSettingsView.weeks) || 12;
    const startDate = (swimTargetSettingsView && swimTargetSettingsView.startDate) || sortedSwim[0].date;
    const startMonday = mondayOf(startDate);
    const currentMonday = mondayOf(todayStr);
    const weekKeySet = new Set(swimSessions.map((s) => toISODate(mondayOf(s.date))));
    let cursor = new Date(startMonday);
    let missedWeeks = 0, trainedWeeks = 0;
    while (cursor < currentMonday) {
      const key = toISODate(cursor);
      if (weekKeySet.has(key)) trainedWeeks++; else missedWeeks++;
      cursor.setDate(cursor.getDate() + 7);
    }
    if (weekKeySet.has(toISODate(currentMonday)) && currentMonday >= startMonday) trainedWeeks++;
    const targetDate = new Date(startMonday);
    targetDate.setDate(targetDate.getDate() + (goalWeeks + missedWeeks) * 7);
    const targetISO = toISODate(targetDate);
    const daysRemaining = Math.max(0, dayDiff(todayStr, targetISO));
    return { targetDate: targetISO, daysRemaining, trainedWeeks: Math.min(goalWeeks, trainedWeeks), goalWeeks, reached: trainedWeeks >= goalWeeks };
  }, [swimSessions, todayStr, swimTargetSettingsView]);

  // A plain-language, rule-based read of "how's it going" — not an AI summary, just the
  // consistency numbers put into a sentence so the Dashboard has something to say at a glance.
  const statusBlurb = useMemo(() => {
    const bits = [];
    if (combinedConsistency) {
      bits.push(`Trained ${combinedConsistency.trainedLast7}/7 days this past week${combinedConsistency.dayStreak >= 2 ? `, on a ${combinedConsistency.dayStreak}-day streak` : ""}.`);
    }
    if (consistency) {
      bits.push(consistency.daysSinceLast <= 3
        ? `Workouts on pace — last session ${consistency.daysSinceLast === 0 ? "today" : consistency.daysSinceLast + "d ago"}.`
        : `Workouts have slipped — last session was ${consistency.daysSinceLast}d ago.`);
    }
    if (swimConsistencyMini) {
      bits.push(swimConsistencyMini.daysSinceLast <= 4
        ? `Swimming steady — last swim ${swimConsistencyMini.daysSinceLast === 0 ? "today" : swimConsistencyMini.daysSinceLast + "d ago"}.`
        : `Swimming's gone quiet — last swim was ${swimConsistencyMini.daysSinceLast}d ago.`);
    }
    if (!(sessions || []).length && !(swimSessions || []).length) return "Log a workout or upload a swim to see your status here.";
    return bits.join(" ");
  }, [combinedConsistency, consistency, swimConsistencyMini, sessions, swimSessions]);

  const latestBw = latest ? bwMap[latest.id] : null;
  const firstBw = first ? bwMap[first.id] : null;
  const bwDelta = latestBw != null && firstBw != null ? latestBw - firstBw : null;

  // ---- Dashboard: weight card (expand + target weight) --------------------------------
  const WEIGHT_TARGET_KEY = "weight-target-settings-v1";
  const [weightTargetSettings, setWeightTargetSettings] = useState(null);
  const [editingWeightTarget, setEditingWeightTarget] = useState(false);
  const [weightTargetDraft, setWeightTargetDraft] = useState("");
  const [weightExpanded, setWeightExpanded] = useState(false);
  const [weightTimeView, setWeightTimeView] = useState("day"); // independent of the Workout tab's own day/week toggle

  useEffect(() => {
    if (tab !== "dashboard") return;
    (async () => {
      try {
        const res = await window.storage.get(WEIGHT_TARGET_KEY, false);
        setWeightTargetSettings(res && res.value ? JSON.parse(res.value) : {});
      } catch (e) {
        setWeightTargetSettings({});
      }
    })();
  }, [tab]);

  const saveWeightTarget = async () => {
    const num = parseFloat(weightTargetDraft);
    const next = { targetWeight: Number.isFinite(num) ? num : null };
    setWeightTargetSettings(next);
    setEditingWeightTarget(false);
    try { await window.storage.set(WEIGHT_TARGET_KEY, JSON.stringify(next), false); } catch (_) {}
  };

  const targetWeight = weightTargetSettings && weightTargetSettings.targetWeight != null ? weightTargetSettings.targetWeight : null;
  const weightToGo = targetWeight != null && latestBw != null ? targetWeight - latestBw : null;
  // Progress from the first logged weight toward the target — undefined/hidden if there's no
  // real starting baseline or the target equals the start (nothing to measure progress against).
  const weightProgressPct = (() => {
    if (targetWeight == null || latestBw == null || firstBw == null || targetWeight === firstBw) return null;
    const pct = ((latestBw - firstBw) / (targetWeight - firstBw)) * 100;
    return Math.max(0, Math.min(100, pct));
  })();

  const dashBodyweightDaily = useMemo(() => (sessions || []).filter((s) => s.bodyweight != null).map((s) => ({ date: fmtDate(s.date), kg: s.bodyweight })), [sessions]);
  const dashBodyweightWeekly = useMemo(() => {
    const byWeek = {};
    (sessions || []).forEach((s) => { if (s.bodyweight != null) byWeek[toISODate(mondayOf(s.date))] = s.bodyweight; });
    return Object.keys(byWeek).sort().map((wk) => ({ date: fmtDate(wk), kg: byWeek[wk] }));
  }, [sessions]);
  const dashBodyweightSeries = weightTimeView === "week" ? dashBodyweightWeekly : dashBodyweightDaily;

  // ---- Dashboard: swim target editing (Swim tab no longer shows/edits this) -----------
  const [editingSwimTargetDash, setEditingSwimTargetDash] = useState(false);
  const [swimTargetDraftDash, setSwimTargetDraftDash] = useState({ startDate: "", weeks: "12" });

  const saveSwimTargetDash = async () => {
    const weeksNum = parseInt(swimTargetDraftDash.weeks, 10);
    const next = { startDate: swimTargetDraftDash.startDate || null, weeks: Number.isFinite(weeksNum) && weeksNum > 0 ? weeksNum : 12 };
    setSwimTargetSettingsView(next);
    setEditingSwimTargetDash(false);
    try { await window.storage.set("swim-target-settings-v1", JSON.stringify(next), false); } catch (_) {}
  };

  if (!sessions) {
    return <div style={{ background: "#0c0d10", minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", color: "#8a8f98", fontFamily: "monospace" }}>loading log…</div>;
  }
  const setColor = (i) => ["#F2C94C", "#E63946", "#56CCF2", "#6FCF97"][i % 4];
  const yLabel = metric === "reps" ? "reps" : metric === "1rm" ? "1RM" : "kg";

  const changeFilter = (f) => { setFilter(f); setChartFocus(null); };

  const toggleCompare = (id) => {
    setSelectedCompare((sc) => {
      if (sc.includes(id)) return sc.filter((x) => x !== id);
      if (sc.length >= 2) return [sc[1], id];
      return [...sc, id];
    });
  };

  const compareSessions = selectedCompare.length === 2 ? selectedCompare.map((id) => sessions.find((s) => s.id === id)).sort((a, b) => a.date.localeCompare(b.date)) : null;

  return (
    <div style={{ background: "#0c0d10", minHeight: "100vh", color: "#E8E6E1", fontFamily: "'Inter', 'Helvetica Neue', sans-serif" }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');
        .disp { font-family: 'Manrope', sans-serif; letter-spacing: -0.02em; font-weight: 800; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .pill { transition: all 0.18s ease; }
        .pill:hover { transform: translateY(-1px); }
        ::-webkit-scrollbar { height: 6px; width: 6px; }
        ::-webkit-scrollbar-thumb { background: #2b2e36; border-radius: 6px; }
        input[type="text"], input[type="date"], input[type="number"], textarea { color-scheme: dark; }
        textarea { font-family: 'Inter', sans-serif; resize: vertical; }
        .file-btn { position: relative; overflow: hidden; }
        .file-btn input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
        @media (max-width: 560px) {
          button, .file-btn, input[type="checkbox"] { min-height: 40px; }
          .pill { padding: 8px 12px !important; font-size: 12.5px !important; }
        }
      `}</style>

      {/* Header */}
      <div style={{ borderBottom: "1px solid #22262b", padding: isMobile ? "14px 12px 0" : "20px 16px 0" }}>
        <div style={{ maxWidth: 1060, margin: "0 auto" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 6 }}>
            <Dumbbell size={20} color="#F2C94C" strokeWidth={2.2} />
            <span className="mono" style={{ fontSize: 11, letterSpacing: "0.15em", color: "#8a8f98", textTransform: "uppercase" }}>Calisthenics · Training Log</span>
          </div>
          {editingName ? (
            <div style={{ display: "flex", alignItems: "center", gap: 8, margin: "0 0 4px", flexWrap: "wrap" }}>
              <input
                type="text"
                autoFocus
                value={nameDraft}
                onChange={(e) => setNameDraft(e.target.value)}
                onKeyDown={(e) => { if (e.key === "Enter") saveOwnerName(); if (e.key === "Escape") setEditingName(false); }}
                placeholder="Your name"
                className="disp"
                style={{ fontSize: "clamp(20px, 5vw, 28px)", fontWeight: 700, color: "#F5F3EE", background: "#15171b", border: "1px solid #2a2e33", borderRadius: 12, padding: "4px 10px", minWidth: 160 }}
              />
              <button onClick={saveOwnerName} style={{ background: "linear-gradient(135deg, #FFDD7A, #F2C94C)", color: "#101214", border: "none", borderRadius: 12, padding: "6px 12px", fontWeight: 700, fontSize: 12.5, cursor: "pointer" }}>Save</button>
              <button onClick={() => setEditingName(false)} style={{ background: "transparent", color: "#9a9fa6", border: "1px solid #2a2e33", borderRadius: 12, padding: "6px 12px", fontWeight: 600, fontSize: 12.5, cursor: "pointer" }}>Cancel</button>
            </div>
          ) : (
            <h1
              className="disp"
              onClick={() => { setNameDraft(ownerName); setEditingName(true); }}
              title="Click to edit"
              style={{ fontSize: "clamp(24px, 6vw, 32px)", fontWeight: 700, margin: "0 0 4px", color: "#F5F3EE", cursor: "pointer", display: "inline-flex", alignItems: "center", gap: 8 }}

              )}
              {viewMode === "swim" && (swimSessions || []).length > 0 && (
                <button onClick={() => setConfirmDeleteAllScope("swim")} style={{ display: "flex", alignItems: "center", gap: 6, cursor: "pointer", background: "#15171b", border: "1px solid #E6394655", color: "#E63946", borderRadius: 16, padding: "10px 14px", fontWeight: 600, fontSize: 13 }}><Trash2 size={14} /> Delete all swim activity</button>
              )}

                <button onClick={() => setConfirmDeleteAllScope("all")} style={{ display: "flex", alignItems: "center", gap: 6, cursor: "pointer", background: "#15171b", border: "1px solid #E6394655", color: "#E63946", borderRadius: 16, padding: "10px 14px", fontWeight: 600, fontSize: 13 }}><Trash2 size={14} /> Delete all activity</button>
              )}
            </div>

            {importMsg && (<div style={{ fontSize: 12, color: "#F2C94C", marginBottom: 12 }}>{importMsg}</div>)}
            {viewMode === "workout" && selectedCompare.length > 0 && selectedCompare.length < 2 && (<div style={{ fontSize: 12, color: "#6b7078", marginBottom: 12 }}>Select one more session to compare.</div>)}

                    <div style={{ fontWeight: 700, fontSize: 15, color: "#F5F3EE", marginBottom: 3 }}>Log new swim session</div>
                    <div style={{ fontSize: 12, color: "#6b7078" }}>Upload Garmin <span className="mono">.FIT</span> files (pool swims) — parsed entirely in your browser, nothing is uploaded anywhere.</div>
                  </div>
                  <label className="file-btn" style={{ display: "flex", alignItems: "center", gap: 6, cursor: "pointer", background: "#56CCF2", color: "#0c0d10", border: "none", borderRadius: 16, padding: "10px 16px", fontWeight: 700, fontSize: 13 }}>
                    <Upload size={14} /> {swimUploading ? "Parsing…" : "Upload .FIT"}

                  </label>
                </div>
                <label style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 12.5, color: "#c9cdd3", cursor: "pointer" }}>

                </label>
                {swimUploadMsg && <div style={{ fontSize: 12, color: swimUploadMsg.includes("Failed") ? "#E63946" : "#6FCF97", marginTop: 8 }}>{swimUploadMsg}</div>}

                            </div>
                            <div>
                              <div style={{ fontSize: 10, color: "#5a5f66", marginBottom: 3 }}>400m pace (min/100m) {d.auto400 && <span style={{ color: "#2EC4B6" }}>· auto-detected</span>}</div>
                              <input type="text" inputMode="decimal" placeholder="e.g. 1:26.2" value={d.t400} onChange={(e) => updatePendingCssDraft(idx, "t400", e.target.value)} className="mono" style={{ width: 130, background: "#15171b", border: "1px solid #2a2e33", borderRadius: 12, padding: "6px 8px", color: "#E8E6E1", fontSize: 12 }} />
                            </div>
                          </div>
                          <div style={{ fontSize: 10, color: "#5a5f66", marginTop: 4 }}>Enter pace as min:sec per 100m (e.g. 1:38.5) — this is the pace for the whole 200m/400m swim, not a single length.</div>

                            <div style={{ fontSize: 10.5, color: "#6b7078", marginTop: 4 }}>No matching 200m/400m reps found in this file — enter paces manually, or leave blank to save as a normal session.</div>
                          )}
                        </div>
                      ))}
                    </div>
                    <div style={{ display: "flex", gap: 8, marginTop: 14 }}>
                      <button onClick={confirmPendingCssUpload} style={{ cursor: "pointer", background: "#2EC4B6", color: "#0c0d10", border: "none", borderRadius: 12, padding: "8px 16px", fontWeight: 700, fontSize: 12.5 }}>Save session{pendingCssUpload.drafts.length > 1 ? "s" : ""}</button>

                  </div>

                </div>
                <div style={{ display: "flex", gap: 10, marginBottom: 14, flexWrap: "wrap" }}>
                  <div><div style={{ fontSize: 11, color: "#8a8f98", marginBottom: 4 }}>Date</div><input type="date" value={draft.date} onChange={(e) => setDraft({ ...draft, date: e.target.value })} style={{ background: "#0c0d10", border: "1px solid #2a2e33", borderRadius: 12, padding: "8px 10px", color: "#E8E6E1", fontSize: 13 }} /></div>

                    rows={4}
                    className="mono"
                    style={{ width: "100%", background: "#15171b", border: "1px solid #2a2e33", borderRadius: 12, padding: "8px 10px", color: "#E8E6E1", fontSize: 12, boxSizing: "border-box", resize: "vertical" }}
                  />
                  <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                    <button onClick={handleParseFill} style={{ marginTop: 8, background: "#2b2e36", color: "#F5F3EE", border: "none", borderRadius: 12, padding: "8px 14px", fontWeight: 700, fontSize: 12.5, cursor: "pointer" }}>Parse & fill</button>
                    <button onClick={() => setShowLibrary(true)} style={{ marginTop: 8, background: "transparent", color: "#8a8f98", border: "1px solid #2a2e33", borderRadius: 12, padding: "8px 14px", fontWeight: 600, fontSize: 12.5, cursor: "pointer" }}>Exercise reference</button>
                    <button onClick={() => setShowAddExercise(true)} style={{ marginTop: 8, background: "transparent", color: "#8a8f98", border: "1px solid #2a2e33", borderRadius: 12, padding: "8px 14px", fontWeight: 600, fontSize: 12.5, cursor: "pointer" }}>+ Add exercise</button>
                  </div>
                  {parseNote && <div style={{ fontSize: 11.5, color: "#F2C94C", marginTop: 8, lineHeight: 1.5 }}>{parseNote}</div>}
                  {unmatchedNames.length > 0 && (
                    <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginTop: 8 }}>
                      {unmatchedNames.map((name) => (
                        <button key={name} onClick={() => openAddExerciseFor(name)} className="mono" style={{ fontSize: 11, fontWeight: 600, color: "#F2C94C", background: "transparent", border: "1px solid #F2C94C55", borderRadius: 999, padding: "4px 10px", cursor: "pointer" }}>+ Add "{name}"</button>
                      ))}
                    </div>
                  )}
                </div>

                <div style={{ display: isMobile ? "none" : "grid", gridTemplateColumns: "160px 1fr 90px", gap: 8, marginBottom: 4, fontSize: 10, color: "#5a5f66", textTransform: "uppercase", letterSpacing: "0.04em" }}><span></span><span>Reps per set</span><span>Kg per set</span></div>
                <div style={{ display: "grid", gap: isMobile ? 14 : 10, marginBottom: 14 }}>
                  {(editingId ? Object.keys(draft.ex) : trackedExercises.filter((name) => !RETIRED.includes(name))).map((name) => (
                    isMobile ? (
                      <div key={name} style={{ display: "grid", gap: 6, borderBottom: "1px solid #1d2024", paddingBottom: 10 }}>
                        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                          <span style={{ fontSize: 13, color: colorsMap[name] || "#c9cdd3", fontWeight: 600 }}>{name}</span>
                          {!editingId && <X size={14} onClick={() => untrackExercise(name)} title="Remove from tracked exercises" style={{ cursor: "pointer", color: "#5a5f66", flexShrink: 0 }} />}
                        </div>
                        <div style={{ display: "grid", gridTemplateColumns: "1fr 90px", gap: 8 }}>
                          <input type="text" placeholder="e.g. 12,11,9,8" value={draft.ex[name]} onChange={(e) => setDraft({ ...draft, ex: { ...draft.ex, [name]: e.target.value } })} className="mono" style={{ background: "#0c0d10", border: "1px solid #2a2e33", borderRadius: 12, padding: "10px 10px", color: "#E8E6E1", fontSize: 14, boxSizing: "border-box" }} />
                          <input type="text" placeholder="e.g. 15,15,5,5" value={draft.load[name]} onChange={(e) => setDraft({ ...draft, load: { ...draft.load, [name]: e.target.value } })} className="mono" style={{ background: "#0c0d10", border: "1px solid #2a2e33", borderRadius: 12, padding: "10px 10px", color: "#E8E6E1", fontSize: 14, boxSizing: "border-box" }} />
                        </div>
                      </div>
                    ) : (
                      <div key={name} style={{ display: "grid", gridTemplateColumns: editingId ? "160px 1fr 90px" : "160px 1fr 90px 18px", gap: 10, alignItems: "center" }}>
                        <span style={{ fontSize: 13, color: colorsMap[name] || "#c9cdd3", fontWeight: 600 }}>{name}</span>
                        <input type="text" placeholder="e.g. 12,11,9,8" value={draft.ex[name]} onChange={(e) => setDraft({ ...draft, ex: { ...draft.ex, [name]: e.target.value } })} className="mono" style={{ background: "#0c0d10", border: "1px solid #2a2e33", borderRadius: 12, padding: "8px 10px", color: "#E8E6E1", fontSize: 13, boxSizing: "border-box" }} />
                        <input type="text" placeholder="e.g. 15,15,5,5" value={draft.load[name]} onChange={(e) => setDraft({ ...draft, load: { ...draft.load, [name]: e.target.value } })} className="mono" style={{ background: "#0c0d10", border: "1px solid #2a2e33", borderRadius: 12, padding: "8px 10px", color: "#E8E6E1", fontSize: 13, boxSizing: "border-box" }} />
                        {!editingId && <X size={14} onClick={() => untrackExercise(name)} title="Remove from tracked exercises" style={{ cursor: "pointer", color: "#5a5f66" }} />}
                      </div>
                    )
                  ))}
                  {trackedExercises.length === 0 && !editingId && (
                    <div style={{ fontSize: 12, color: "#6b7078", fontStyle: "italic" }}>No exercises tracked yet — paste a workout above, or use "+ Add exercise" to add one manually.</div>
                  )}
                </div>
                <div style={{ marginBottom: 4, fontSize: 11, color: "#8a8f98" }}>Notes (optional — soreness, sleep, how it felt)</div>
                <textarea value={draft.notes} onChange={(e) => setDraft({ ...draft, notes: e.target.value })} rows={2} style={{ width: "100%", background: "#0c0d10", border: "1px solid #2a2e33", borderRadius: 12, padding: "8px 10px", color: "#E8E6E1", fontSize: 13, boxSizing: "border-box" }} />
                <button onClick={saveSession} disabled={saving} style={{ marginTop: 16, background: "linear-gradient(135deg, #FFDD7A, #F2C94C)", color: "#101214", border: "none", borderRadius: 12, padding: "10px 20px", fontWeight: 700, fontSize: 13, cursor: "pointer" }}>{saving ? "Saving…" : editingId ? "Update session" : "Save session"}</button>
              </div>
            )}

            {viewMode === "workout" && (
              <div style={{ background: "#15171b", border: "1px solid #22262b", borderRadius: 22, overflow: "hidden" }}>
                <div style={{ padding: "12px 16px", borderBottom: "1px solid #22262b", fontSize: 13, fontWeight: 600, color: "#c9cdd3" }}>Workout sessions ({sessions.length}) · select up to 2 to compare</div>
                <div style={{ maxHeight: 520, overflowY: "auto" }}>
                  {[...sessions].reverse().map((s, idx) => (
                    <div key={s.id} style={{ padding: "12px 16px", borderBottom: idx === sessions.length - 1 ? "none" : "1px solid #1d2024", background: selectedCompare.includes(s.id) ? "#1d2024" : "transparent" }}>
                      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8, gap: 8 }}>
                        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                          <input type="checkbox" checked={selectedCompare.includes(s.id)} onChange={() => toggleCompare(s.id)} style={{ cursor: "pointer" }} />
                          <span className="disp" style={{ fontWeight: 700, fontSize: 15, color: "#F5F3EE" }}>{fmtDate(s.date)}</span>
                          <span style={{ fontSize: 12, color: "#6b7078" }}>{s.label}</span>
                          {s.bodyweight != null ? (
                            <span className="mono" style={{ fontSize: 11, color: "#4a4f56" }}>{s.bodyweight} kg</span>
                          ) : bwMap[s.id] != null ? (
                            <span className="mono" style={{ fontSize: 11, color: "#4a4f56", fontStyle: "italic" }}>~{bwMap[s.id]} kg (carried)</span>
                          ) : null}
                        </div>
                        <div style={{ display: "flex", gap: 12, flexShrink: 0 }}>
                          <Pencil size={14} style={{ cursor: "pointer", color: "#5a5f66" }} onClick={() => startEdit(s)} />
                          <Trash2 size={15} style={{ cursor: "pointer", color: "#5a5f66" }} onClick={() => setConfirmDelete(s)} />
                        </div>
                      </div>
                      <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
                        {Object.keys(s.ex).filter((n) => s.ex[n]).map((name) => (
                          <span key={name} className="mono" style={{ fontSize: 11, padding: "3px 8px", borderRadius: 6, background: `${colorsMap[name] || "#9a9fa6"}14`, color: colorsMap[name] || "#9a9fa6", border: `1px solid ${colorsMap[name] || "#9a9fa6"}33` }}>{name}: {s.ex[name].join("-")}{weightTag((s.load || {})[name])}</span>
                        ))}
                      </div>
                      {s.notes && <div style={{ fontSize: 11.5, color: "#6b7078", fontStyle: "italic", marginTop: 6 }}>"{s.notes}"</div>}
                    </div>
                  ))}
                  {sessions.length === 0 && <div style={{ padding: "20px 16px", fontSize: 12.5, color: "#6b7078" }}>No workout sessions logged yet.</div>}
                </div>
              </div>
            )}

            {viewMode === "swim" && (
              <div style={{ background: "#15171b", border: "1px solid #22262b", borderRadius: 22, overflow: "hidden" }}>
                <div style={{ padding: "12px 16px", borderBottom: "1px solid #22262b", fontSize: 13, fontWeight: 600, color: "#c9cdd3" }}>Swim sessions ({(swimSessions || []).length}) · full breakdown lives on the Swimming tab</div>
                <div style={{ maxHeight: 520, overflowY: "auto" }}>
                  {[...(swimSessions || [])].sort((a, b) => (a.date < b.date ? 1 : -1)).map((s, idx, arr) => (
                    <div key={s.id} style={{ padding: "12px 16px", borderBottom: idx === arr.length - 1 ? "none" : "1px solid #1d2024", display: "flex", justifyContent: "space-between", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
                      <div style={{ minWidth: 0 }}>
                        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                          <span className="disp" style={{ fontWeight: 700, fontSize: 15, color: "#F5F3EE" }}>{fmtDate(s.date)}</span>
                          {s.isCssTest && <span className="mono" style={{ fontSize: 9.5, color: "#2EC4B6", border: "1px solid #2EC4B655", borderRadius: 5, padding: "1px 5px" }}>CSS TEST</span>}
                        </div>
                        <div className="mono" style={{ fontSize: 11, color: "#6b7078" }}>{s.fileName}</div>
                      </div>
                      <div style={{ display: "flex", gap: 16, fontSize: 12, alignItems: "center" }}>
                        <div style={{ textAlign: "right" }}><div className="mono" style={{ color: "#F5F3EE", fontWeight: 700 }}>{s.distance != null ? `${s.distance}m` : "—"}</div><div style={{ color: "#6b7078", fontSize: 10 }}>distance</div></div>
                        <div style={{ textAlign: "right" }}><div className="mono" style={{ color: "#F5F3EE", fontWeight: 700 }}>{fmtPace100(s.pace100Overall)}</div><div style={{ color: "#6b7078", fontSize: 10 }}>pace</div></div>
                        <Trash2 size={15} style={{ cursor: "pointer", color: "#5a5f66" }} onClick={() => setConfirmDelete({ id: s.id, date: s.date, distance: s.distance, kind: "swim" })} />

                    </div>
                  ))}
                  {(!swimSessions || swimSessions.length === 0) && <div style={{ padding: "20px 16px", fontSize: 12.5, color: "#6b7078" }}>No swim sessions logged yet — upload a .FIT file above.</div>}
                </div>
              </div>
            )}

            {viewMode === "all" && (
              <div style={{ background: "#15171b", border: "1px solid #22262b", borderRadius: 22, overflow: "hidden" }}>
                <div style={{ padding: "12px 16px", borderBottom: "1px solid #22262b", fontSize: 13, fontWeight: 600, color: "#c9cdd3" }}>All sessions ({sessions.length + (swimSessions || []).length})</div>

                  {[
                    ...sessions.map((s) => ({ kind: "workout", data: s })),
                    ...(swimSessions || []).map((s) => ({ kind: "swim", data: s })),
                  ].sort((a, b) => (a.data.date < b.data.date ? 1 : -1)).map(({ kind, data: s }, idx, arr) => (
                    <div key={`${kind}-${s.id}`} style={{ padding: "12px 16px", borderBottom: idx === arr.length - 1 ? "none" : "1px solid #1d2024", display: "flex", justifyContent: "space-between", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
                      <div style={{ display: "flex", alignItems: "center", gap: 8, minWidth: 0 }}>
                        <span className="mono" style={{ fontSize: 9.5, fontWeight: 700, borderRadius: 5, padding: "2px 6px", color: kind === "swim" ? "#56CCF2" : "#F2C94C", border: `1px solid ${kind === "swim" ? "#56CCF255" : "#F2C94C55"}` }}>{kind === "swim" ? "SWIM" : "WORKOUT"}</span>
                        <span className="disp" style={{ fontWeight: 700, fontSize: 14, color: "#F5F3EE" }}>{fmtDate(s.date)}</span>
                        <span style={{ fontSize: 11.5, color: "#6b7078" }}>{kind === "swim" ? (s.distance != null ? `${s.distance}m · ${fmtPace100(s.pace100Overall)}` : "") : (s.label || Object.keys(s.ex).slice(0, 3).join(", "))}</span>
                      </div>
                      <Trash2 size={14} style={{ cursor: "pointer", color: "#5a5f66", flexShrink: 0 }} onClick={() => setConfirmDelete(kind === "swim" ? { id: s.id, date: s.date, distance: s.distance, kind: "swim" } : s)} />
                    </div>
                  ))}
                  {sessions.length === 0 && (swimSessions || []).length === 0 && <div style={{ padding: "20px 16px", fontSize: 12.5, color: "#6b7078" }}>Nothing logged yet.</div>}
                </div>
              </div>
            )}
          </>
        )}

        <div style={{ textAlign: "center", padding: "20px 0 4px", fontSize: 11, color: "#4a4f56" }} className="mono">Data saved automatically · visible only to you</div>
      </div>

      {confirmDelete && (
        <div style={{ position: "fixed", inset: 0, background: "rgba(8,9,11,0.72)", backdropFilter: "blur(6px)", display: "flex", alignItems: "center", justifyContent: "center", padding: 20, zIndex: 50 }}>
          <div style={{ background: "linear-gradient(180deg, #1a1c22 0%, #141519 100%)", border: "1px solid #2b2e36", borderRadius: 22, boxShadow: "0 12px 28px -14px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.04)", padding: 20, maxWidth: 360, width: "100%" }}>
            <div style={{ display: "flex", gap: 10, marginBottom: 14 }}>
              <AlertTriangle size={20} color="#E63946" style={{ flexShrink: 0 }} />
              <div><div style={{ fontWeight: 700, fontSize: 14, color: "#F5F3EE", marginBottom: 4 }}>Delete this session?</div><div style={{ fontSize: 12.5, color: "#9a9fa6" }}>{fmtDateFull(confirmDelete.date)}{confirmDelete.kind === "swim" ? ` — swim, ${confirmDelete.distance || "?"}m` : ` — "${confirmDelete.label}"`} will be permanently removed. This can't be undone.</div></div>
            </div>
            <div style={{ display: "flex", gap: 8, justifyContent: "flex-end" }}>
              <button onClick={() => setConfirmDelete(null)} style={{ padding: "8px 16px", borderRadius: 12, border: "1px solid #2a2e33", background: "transparent", color: "#c9cdd3", fontSize: 13, fontWeight: 600, cursor: "pointer" }}>Cancel</button>
              <button onClick={() => doDelete(confirmDelete.id, confirmDelete.kind)} style={{ padding: "8px 16px", borderRadius: 12, border: "none", background: "#E63946", color: "#fff", fontSize: 13, fontWeight: 700, cursor: "pointer" }}>Delete</button>
            </div>
          </div>
        </div>
      )}

      {confirmDeleteAllScope && (
        <div style={{ position: "fixed", inset: 0, background: "rgba(8,9,11,0.72)", backdropFilter: "blur(6px)", display: "flex", alignItems: "center", justifyContent: "center", padding: 20, zIndex: 50 }}>
          <div style={{ background: "linear-gradient(180deg, #1a1c22 0%, #141519 100%)", border: "1px solid #2b2e36", borderRadius: 22, boxShadow: "0 12px 28px -14px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.04)", padding: 20, maxWidth: 360, width: "100%" }}>
            <div style={{ display: "flex", gap: 10, marginBottom: 14 }}>
              <AlertTriangle size={20} color="#E63946" style={{ flexShrink: 0 }} />
              <div>
                <div style={{ fontWeight: 700, fontSize: 14, color: "#F5F3EE", marginBottom: 4 }}>
                  {confirmDeleteAllScope === "workout" ? "Delete ALL workout logs?" : confirmDeleteAllScope === "swim" ? "Delete ALL swim activity?" : "Delete ALL activity?"}
                </div>
                <div style={{ fontSize: 12.5, color: "#9a9fa6" }}>
                  {confirmDeleteAllScope === "workout" && `All ${sessions.length} workout session(s) will be permanently removed.`}
                  {confirmDeleteAllScope === "swim" && `All ${(swimSessions || []).length} swim session(s) will be permanently removed.`}
                  {confirmDeleteAllScope === "all" && `All ${sessions.length} workout and ${(swimSessions || []).length} swim session(s) will be permanently removed.`}
                  {" "}This can't be undone. Tracked exercises and target settings are kept.
                </div>
              </div>
            </div>
            <div style={{ display: "flex", gap: 8, justifyContent: "flex-end" }}>
              <button onClick={() => setConfirmDeleteAllScope(null)} style={{ padding: "8px 16px", borderRadius: 12, border: "1px solid #2a2e33", background: "transparent", color: "#c9cdd3", fontSize: 13, fontWeight: 600, cursor: "pointer" }}>Cancel</button>
              <button onClick={doDeleteAllLogs} style={{ padding: "8px 16px", borderRadius: 12, border: "none", background: "#E63946", color: "#fff", fontSize: 13, fontWeight: 700, cursor: "pointer" }}>Delete all</button>
            </div>
          </div>
        </div>
      )}

      {selectedHeatDate && (
        <div style={{ position: "fixed", inset: 0, background: "rgba(8,9,11,0.72)", backdropFilter: "blur(6px)", display: "flex", alignItems: "center", justifyContent: "center", padding: 20, zIndex: 50 }} onClick={() => setSelectedHeatDate(null)}>
          <div style={{ background: "linear-gradient(180deg, #1a1c22 0%, #141519 100%)", border: "1px solid #2b2e36", borderRadius: 22, boxShadow: "0 12px 28px -14px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.04)", padding: "20px 28px" }} onClick={(e) => e.stopPropagation()}>
            <div className="disp" style={{ fontSize: 20, fontWeight: 700, color: "#F5F3EE" }}>{fmtDateFull(selectedHeatDate)}</div>
          </div>
        </div>
      )}

      {showLibrary && (
        <div style={{ position: "fixed", inset: 0, background: "rgba(8,9,11,0.72)", backdropFilter: "blur(6px)", display: "flex", alignItems: "center", justifyContent: "center", padding: 20, zIndex: 50 }} onClick={() => setShowLibrary(false)}>
          <div style={{ background: "linear-gradient(180deg, #1a1c22 0%, #141519 100%)", border: "1px solid #2b2e36", borderRadius: 22, boxShadow: "0 12px 28px -14px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.04)", padding: 20, maxWidth: 560, width: "100%", maxHeight: "80vh", overflowY: "auto" }} onClick={(e) => e.stopPropagation()}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6 }}>
              <span style={{ fontWeight: 700, fontSize: 15, color: "#F5F3EE" }}>Exercise reference</span>
              <X size={18} style={{ cursor: "pointer", color: "#8a8f98" }} onClick={() => setShowLibrary(false)} />
            </div>
            <div style={{ fontSize: 11.5, color: "#6b7078", marginBottom: 14, lineHeight: 1.5 }}>
              Every exercise the paste-parser recognizes, with its bodyweight ratio — the fraction of bodyweight it actually lifts per rep, used to calculate volume ("load only" means the movement has no bodyweight component). Exercises marked <span style={{ color: "#F2C94C", fontWeight: 700 }}>tracked</span> have a field in the entry form — click it to untrack, or "+ track" any other one to add it. Use "Add exercise" if it isn't listed at all.
            </div>
            {GROUPS.map((g) => (
              <div key={g} style={{ marginBottom: 14 }}>
                <div className="mono" style={{ fontSize: 11, fontWeight: 700, color: GROUP_COLORS[g], textTransform: "uppercase", letterSpacing: "0.06em", marginBottom: 6 }}>{g}</div>
                <div style={{ display: "grid", gap: 2 }}>
                  {fullLibrary.filter((e) => e.group === g).map((e) => {
                    const isTracked = trackedExercises.includes(e.name);
                    return (
                      <div key={e.name} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", fontSize: 12, padding: "5px 0", borderBottom: "1px solid #1d2024" }}>
                        <span style={{ color: isTracked ? "#F5F3EE" : "#9a9fa6" }}>
                          {e.name}
                          {e.target && <span style={{ color: "#4a4f56", fontSize: 10.5 }}> · {e.target}</span>}
                        </span>
                        <span style={{ display: "flex", alignItems: "center", gap: 10, flexShrink: 0 }}>
                          <span className="mono" style={{ color: "#6b7078" }}>{e.ratio === 0 ? "load only" : `${Math.round(e.ratio * 100)}% BW`}</span>
                          {isTracked ? (
                            <button onClick={() => untrackExercise(e.name)} className="mono" style={{ fontSize: 10, fontWeight: 700, color: "#F2C94C", background: "transparent", border: "1px solid #F2C94C55", borderRadius: 999, padding: "2px 8px", cursor: "pointer" }}>✕ tracked</button>
                          ) : (
                            <button onClick={() => trackLibraryExercise(e.name)} className="mono" style={{ fontSize: 10, fontWeight: 700, color: "#9a9fa6", background: "transparent", border: "1px solid #2a2e33", borderRadius: 999, padding: "2px 8px", cursor: "pointer" }}>+ track</button>
                          )}
                        </span>
                      </div>
                    );
                  })}
                </div>
              </div>
            ))}
            <button onClick={() => { setShowLibrary(false); setShowAddExercise(true); }} style={{ marginTop: 4, width: "100%", background: "#2b2e36", color: "#F5F3EE", border: "none", borderRadius: 12, padding: "10px 14px", fontWeight: 700, fontSize: 12.5, cursor: "pointer" }}>+ Add an exercise not listed here</button>
          </div>
        </div>
      )}

      {showPrPicker && (
        <div style={{ position: "fixed", inset: 0, background: "rgba(8,9,11,0.72)", backdropFilter: "blur(6px)", display: "flex", alignItems: "center", justifyContent: "center", padding: 20, zIndex: 50 }} onClick={() => setShowPrPicker(false)}>
          <div style={{ background: "linear-gradient(180deg, #1a1c22 0%, #141519 100%)", border: "1px solid #2b2e36", borderRadius: 22, boxShadow: "0 12px 28px -14px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.04)", padding: 20, maxWidth: 420, width: "100%", maxHeight: "80vh", overflowY: "auto" }} onClick={(e) => e.stopPropagation()}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6 }}>
              <span style={{ fontWeight: 700, fontSize: 15, color: "#F5F3EE" }}>Choose PR exercises</span>
              <X size={18} style={{ cursor: "pointer", color: "#8a8f98" }} onClick={() => setShowPrPicker(false)} />
            </div>
            <div style={{ fontSize: 11.5, color: "#6b7078", marginBottom: 14, lineHeight: 1.5 }}>
              Pick which exercises show up in the PR card. Doesn't affect the charts above.
            </div>
            <div style={{ display: "flex", gap: 8, marginBottom: 12 }}>
              <button onClick={() => persistPrSelection(null)} className="mono" style={{ fontSize: 11, fontWeight: 700, color: "#9a9fa6", background: "transparent", border: "1px solid #2a2e33", borderRadius: 999, padding: "4px 10px", cursor: "pointer" }}>Select all</button>
              <button onClick={() => persistPrSelection([])} className="mono" style={{ fontSize: 11, fontWeight: 700, color: "#9a9fa6", background: "transparent", border: "1px solid #2a2e33", borderRadius: 999, padding: "4px 10px", cursor: "pointer" }}>Clear all</button>
            </div>
            <div style={{ display: "grid", gap: 2 }}>
              {chartExercises.map((name) => {
                const checked = prSelection == null || prSelection.includes(name);
                return (
                  <label key={name} style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 12.5, padding: "6px 2px", borderBottom: "1px solid #1d2024", cursor: "pointer", color: checked ? "#F5F3EE" : "#6b7078" }}>
                    <input type="checkbox" checked={checked} onChange={() => togglePrExercise(name)} style={{ accentColor: "#F2C94C", width: 14, height: 14, cursor: "pointer", flexShrink: 0 }} />
                    {name}
                  </label>
                );
              })}
            </div>
            <button onClick={() => setShowPrPicker(false)} style={{ marginTop: 14, width: "100%", background: "linear-gradient(135deg, #FFDD7A, #F2C94C)", color: "#101214", border: "none", borderRadius: 12, padding: "10px 14px", fontWeight: 700, fontSize: 12.5, cursor: "pointer" }}>Done</button>
          </div>
        </div>
      )}

      {showAddExercise && (
        <div style={{ position: "fixed", inset: 0, background: "rgba(8,9,11,0.72)", backdropFilter: "blur(6px)", display: "flex", alignItems: "center", justifyContent: "center", padding: 20, zIndex: 50 }} onClick={() => setShowAddExercise(false)}>
          <div style={{ background: "linear-gradient(180deg, #1a1c22 0%, #141519 100%)", border: "1px solid #2b2e36", borderRadius: 22, boxShadow: "0 12px 28px -14px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.04)", padding: 20, maxWidth: 400, width: "100%" }} onClick={(e) => e.stopPropagation()}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
              <span style={{ fontWeight: 700, fontSize: 15, color: "#F5F3EE" }}>Add an exercise</span>
              <X size={18} style={{ cursor: "pointer", color: "#8a8f98" }} onClick={() => setShowAddExercise(false)} />
            </div>
            <div style={{ fontSize: 11.5, color: "#6b7078", marginBottom: 14, lineHeight: 1.5 }}>
              For anything not in the built-in reference library. It's added to the entry form immediately and remembered for future paste-parsing.
            </div>
            <div style={{ display: "grid", gap: 10 }}>
              <div>
                <div style={{ fontSize: 11, color: "#8a8f98", marginBottom: 4 }}>Name</div>
                <input type="text" placeholder="e.g. Archer Pull-Ups" value={addExDraft.name} onChange={(e) => setAddExDraft({ ...addExDraft, name: e.target.value })} style={{ width: "100%", background: "#0c0d10", border: "1px solid #2a2e33", borderRadius: 12, padding: "8px 10px", color: "#E8E6E1", fontSize: 13, boxSizing: "border-box" }} />
              </div>
              <div style={{ display: "flex", gap: 10 }}>
                <div style={{ flex: 1 }}>
                  <div style={{ fontSize: 11, color: "#8a8f98", marginBottom: 4 }}>Muscle group</div>
                  <select value={addExDraft.group} onChange={(e) => setAddExDraft({ ...addExDraft, group: e.target.value })} style={{ width: "100%", background: "#0c0d10", border: "1px solid #2a2e33", borderRadius: 12, padding: "8px 10px", color: "#E8E6E1", fontSize: 13 }}>
                    {GROUPS.map((g) => <option key={g} value={g}>{g}</option>)}
                  </select>
                </div>
                <div style={{ width: 110 }}>
                  <div style={{ fontSize: 11, color: "#8a8f98", marginBottom: 4 }}>BW ratio</div>
                  <input type="number" step="0.05" min="0" max="1.5" value={addExDraft.ratio} onChange={(e) => setAddExDraft({ ...addExDraft, ratio: e.target.value })} className="mono" style={{ width: "100%", background: "#0c0d10", border: "1px solid #2a2e33", borderRadius: 12, padding: "8px 10px", color: "#E8E6E1", fontSize: 13, boxSizing: "border-box" }} />
                </div>
              </div>
              <div>
                <div style={{ fontSize: 11, color: "#8a8f98", marginBottom: 4 }}>Target muscle(s) — optional</div>
                <input type="text" placeholder="e.g. Lats, Biceps" value={addExDraft.target} onChange={(e) => setAddExDraft({ ...addExDraft, target: e.target.value })} style={{ width: "100%", background: "#0c0d10", border: "1px solid #2a2e33", borderRadius: 12, padding: "8px 10px", color: "#E8E6E1", fontSize: 13, boxSizing: "border-box" }} />
              </div>
              <div style={{ fontSize: 10.5, color: "#4a4f56" }}>Ratio = fraction of bodyweight lifted per rep. Use 0 for a pure-load exercise (barbell/machine).</div>
              <button onClick={addCustomExercise} disabled={!addExDraft.name.trim()} style={{ marginTop: 4, background: "linear-gradient(135deg, #FFDD7A, #F2C94C)", color: "#101214", border: "none", borderRadius: 12, padding: "10px 16px", fontWeight: 700, fontSize: 13, cursor: "pointer" }}>Add exercise</button>
            </div>
          </div>
        </div>
      )}

      {showCompare && compareSessions && (
        <div style={{ position: "fixed", inset: 0, background: "rgba(8,9,11,0.72)", backdropFilter: "blur(6px)", display: "flex", alignItems: "center", justifyContent: "center", padding: 20, zIndex: 50 }} onClick={() => setShowCompare(false)}>
          <div style={{ background: "linear-gradient(180deg, #1a1c22 0%, #141519 100%)", border: "1px solid #2b2e36", borderRadius: 22, boxShadow: "0 12px 28px -14px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.04)", padding: 20, maxWidth: 560, width: "100%", maxHeight: "80vh", overflowY: "auto" }} onClick={(e) => e.stopPropagation()}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
              <span style={{ fontWeight: 700, fontSize: 15, color: "#F5F3EE" }}>Session comparison</span>
              <X size={18} style={{ cursor: "pointer", color: "#8a8f98" }} onClick={() => setShowCompare(false)} />
            </div>
            <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12, color: "#6b7078", marginBottom: 12 }}>
              <span className="mono">{fmtDateFull(compareSessions[0].date)}</span><span className="mono">{fmtDateFull(compareSessions[1].date)}</span>
            </div>
            {compareSessions[0].bodyweight != null && compareSessions[1].bodyweight != null && (
              <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12.5, padding: "8px 0", borderBottom: "1px solid #22262b", marginBottom: 8 }}>
                <span style={{ color: "#9a9fa6" }}>Bodyweight</span>
                <span className="mono" style={{ color: "#F5F3EE" }}>{compareSessions[0].bodyweight}kg → {compareSessions[1].bodyweight}kg ({(compareSessions[1].bodyweight - compareSessions[0].bodyweight >= 0 ? "+" : "") + (compareSessions[1].bodyweight - compareSessions[0].bodyweight).toFixed(1)}kg)</span>
              </div>
            )}
            <div style={{ display: "grid", gap: 10 }}>
              {Array.from(new Set([...Object.keys(compareSessions[0].ex), ...Object.keys(compareSessions[1].ex)])).filter((name) => compareSessions[0].ex[name] || compareSessions[1].ex[name]).map((name) => {
                const a = compareSessions[0], b = compareSessions[1];
                const repsA = a.ex[name] ? total(a.ex[name]) : null, repsB = b.ex[name] ? total(b.ex[name]) : null;
                const volARaw = a.ex[name] ? exerciseVolume(a, name) : null;
                const volBRaw = b.ex[name] ? exerciseVolume(b, name) : null;
                const volA = volARaw != null ? Math.round(volARaw) : null;
                const volB = volBRaw != null ? Math.round(volBRaw) : null;
                return (
                  <div key={name} style={{ padding: "10px 0", borderBottom: "1px solid #1d2024" }}>
                    <div style={{ fontSize: 12.5, fontWeight: 700, color: colorsMap[name] || "#c9cdd3", marginBottom: 6 }}>{name}</div>
                    <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12, color: "#c9cdd3", marginBottom: 3 }}>
                      <span>{a.ex[name] ? a.ex[name].join("-") : "—"}</span>
                      <span className="mono">{repsA != null && repsB != null ? ((repsB - repsA >= 0 ? "+" : "") + (repsB - repsA) + " reps") : ""}</span>
                      <span>{b.ex[name] ? b.ex[name].join("-") : "—"}</span>
                    </div>
                    {volA != null && volB != null && (<div style={{ fontSize: 11, color: "#6b7078", textAlign: "right" }}>{volA}kg → {volB}kg ({(volB - volA >= 0 ? "+" : "") + (volB - volA)}kg)</div>)}
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<TrainingLog />);


</script>

<script>
(function () {
  var source = document.getElementById("app-source").textContent;
  var result = Babel.transform(source, {
    presets: [["react", { runtime: "classic" }]],
    filename: "app.jsx",
  }).code;
  try {
    (0, eval)(result);
  } catch (err) {
    document.getElementById("root").innerHTML =
      '<div style="color:#E63946;background:#101214;min-height:100vh;padding:24px;font-family:monospace;white-space:pre-wrap;">Failed to start the app:\n' +
      (err && err.stack ? err.stack : err) + '</div>';
    console.error(err);
  }
})();
</script>
</body>
