            if (st.customExercises != null) { setCustomExercises(st.customExercises); await window.storage.set(CUSTOM_LIB_KEY, JSON.stringify(st.customExercises), false); }
            if (st.prSelection != null) { setPrSelection(st.prSelection); await window.storage.set(PR_SELECTION_KEY, JSON.stringify(st.prSelection), false); }
            if (st.weightTargetSettings != null) { setWeightTargetSettings(st.weightTargetSettings); await window.storage.set(WEIGHT_TARGET_KEY, JSON.stringify(st.weightTargetSettings), false); }
            if (st.swimTargetSettings != null) { setSwimTargetSettingsView(st.swimTargetSettings); await window.storage.set("swim-target-settings-v1", JSON.stringify(st.swimTargetSettings), false); }
            settingsMsg = " Settings restored.";
          } catch (_) {}
        }

        setImportMsg((workoutMsg || swimMsg || weightMsg || settingsMsg) ? `${workoutMsg}${swimMsg}${weightMsg}${settingsMsg}` : "Nothing new to import.");
      } catch (err) {
        setImportMsg("Import failed — file doesn't look like a valid export.");
      }
      if (fileInputRef.current) fileInputRef.current.value = "";
      setTimeout(() => setImportMsg(""), 6000);
    };
    reader.readAsText(file);
  };

  const todayStr = toISODate(new Date());

  // Which exercises are "loadable" is detected from your actual data — any exercise that has
  // ever had added weight logged against it gets load-aware charts + hypertrophy coaching.
  const loadableSet = useMemo(() => {
    const s = new Set();
    (sessions || []).forEach((sess) => {
      Object.keys(sess.load || {}).forEach((name) => { if (((sess.load || {})[name] || []).some((w) => w > 0)) s.add(name); });
    });
    return s;
  }, [sessions]);

  // Carries the most recent known bodyweight forward into workouts where bodyweight was
  // left blank. Standalone weight logs participate in this fallback, but an explicitly logged
  // workout bodyweight always wins for that workout.
  const bwMap = useMemo(() => {
    const map = {};
    const standalone = [...(weightLog || [])].sort((a,b) => a.date.localeCompare(b.date));
    let wi = 0, last = null;
    (sessions || []).forEach((s) => {
      while (wi < standalone.length && standalone[wi].date <= s.date) {
        last = standalone[wi].kg;
        wi += 1;
      }
      if (s.bodyweight != null) last = s.bodyweight;
      map[s.id] = last;
    });
    return map;
  }, [sessions, weightLog]);

  // Per-set "load per rep" (bodyweight × ratio + THAT set's added weight), aligned with
  // s.ex[name] — since weight is now tracked per set rather than once per session, volume
  // math has to look at each set's own weight instead of assuming one value for all of them.
  // Returns null (session-wide) if bodyweight is unknown, same as before.
  const setLoadsFor = (s, name) => {
    const bw = bwMap[s.id];
    if (bw == null) return null;
    const ratio = bwRatioMap[name] != null ? bwRatioMap[name] : 1;
    const reps = s.ex[name] || [];
    const weights = (s.load || {})[name] || [];
    return reps.map((_, i) => bw * ratio + (weights[i] || 0));
  };

  // Total volume for one exercise within one session: sum of each set's reps × that set's
  // own load-per-rep. Null if bodyweight is unknown for the session.
  const exerciseVolume = (s, name) => {
    const loads = setLoadsFor(s, name);
    if (loads == null) return null;
    const reps = s.ex[name] || [];
    return reps.reduce((sum, r, i) => sum + r * loads[i], 0);
  };

  // Estimated one-rep max for the single best (heaviest-effort) set within a session, via the
  // Epley formula: 1RM = system weight × (1 + reps / 30), where system weight is that set's
  // own load-per-rep (bodyweight × ratio + that set's added weight). Volume rewards doing more
  // work, but two sessions with identical volume can reflect very different intensity — 1RM
  // isolates the intensity side instead. Returns null if bodyweight is unknown for the session.
  // Capped at 12 reps/set for hypertrophy-style training, where Epley stays reasonably accurate.
  const bestSet1RM = (s, name) => {
    const loads = setLoadsFor(s, name);
    if (loads == null) return null;
    const reps = s.ex[name] || [];
    const weights = (s.load || {})[name] || [];
    let best = null;
    reps.forEach((r, i) => {
      const oneRM = loads[i] * (1 + r / 30);
      if (!best || oneRM > best.oneRM) best = { oneRM, reps: r, weight: weights[i] || 0 };
    });
    return best;
  };
  const exercise1RM = (s, name) => {
    const b = bestSet1RM(s, name);
    return b ? b.oneRM : null;
  };

  const rangedSessions = useMemo(() => {
    if (!sessions) return [];
    if (range === "all") return sessions;
    const days = range === "30" ? 30 : 90;
    return sessions.filter((s) => dayDiff(s.date, todayStr) <= days);
  }, [sessions, range]);

  const chartData = useMemo(() => rangedSessions.map((s) => {
    const row = { date: fmtDate(s.date), fullDate: s.date };
    let totalVol = 0, anyVol = false;
    chartExercises.forEach((name) => {
      if (!s.ex[name]) { row[name] = null; return; }
      if (metric === "reps") { row[name] = total(s.ex[name]); return; }
      if (metric === "1rm") { const rm = exercise1RM(s, name); row[name] = rm == null ? null : Math.round(rm); return; }
      const v = exerciseVolume(s, name);
      row[name] = v == null ? null : Math.round(v);
      if (v != null) { totalVol += v; anyVol = true; }
    });
    if (metric === "volume") row.Total = anyVol ? totalVol : null;
    return row;
  }), [rangedSessions, metric, chartExercises]);

  const perSetData = useMemo(() => {
    if (filter === "All" || filter.startsWith("group:")) return [];
    return rangedSessions.filter((s) => s.ex[filter]).map((s) => {
      const row = { date: fmtDate(s.date) };
      const loads = setLoadsFor(s, filter); // per-set load-per-rep, or null if bodyweight unknown
      let totalVol = 0, anyVol = false, best1RM = null;
      s.ex[filter].forEach((r, i) => {
        if (metric === "reps") { row["Set " + (i + 1)] = r; return; }
        if (metric === "1rm") {
          const rm = loads == null ? null : loads[i] * (1 + r / 30);
          row["Set " + (i + 1)] = rm == null ? null : Math.round(rm);
          if (rm != null && (best1RM == null || rm > best1RM)) best1RM = rm;
          return;
        }
        const v = loads == null ? null : Math.round(r * loads[i]);
        row["Set " + (i + 1)] = v;
        if (v != null) { totalVol += v; anyVol = true; }
      });
      row.Total = metric === "reps" ? total(s.ex[filter]) : metric === "1rm" ? (best1RM == null ? null : Math.round(best1RM)) : (anyVol ? Math.round(totalVol) : null);
      return row;
    });
  }, [rangedSessions, filter, metric]);

  const loadStepData = useMemo(() => {
    if (!loadableSet.has(filter)) return [];
    // Weight can now vary per set within a session (e.g. drop sets) — the step chart shows
    // the top (heaviest) set of the session as the representative "working weight".
    return rangedSessions.filter((s) => s.ex[filter]).map((s) => {
      const weights = (s.load || {})[filter] || [];
      return { date: fmtDate(s.date), "Added load (kg)": weights.length ? Math.max(...weights) : 0 };
    });
  }, [rangedSessions, filter, loadableSet]);

  const bodyweightData = useMemo(() => rangedSessions.filter((s) => s.bodyweight != null).map((s) => ({ date: fmtDate(s.date), kg: s.bodyweight })), [rangedSessions]);

  const groupChartData = useMemo(() => {
    if (!filter.startsWith("group:")) return [];
    const group = filter.slice(6);
    const included = chartExercises.filter((name) => muscleGroupMap[name] === group && !hiddenStatsExercises.has(name));
    if (!included.length) return [];
    return rangedSessions
      .filter((s) => included.some((name) => s.ex[name]))
      .map((s) => {
        let val = 0, best1RM = null;
        included.forEach((name) => {
          if (!s.ex[name]) return;
          if (metric === "reps") { val += total(s.ex[name]); return; }
          if (metric === "1rm") { const rm = exercise1RM(s, name); if (rm != null && (best1RM == null || rm > best1RM)) best1RM = rm; return; }
          const v = exerciseVolume(s, name);
          if (v != null) val += v;
        });
        return { date: fmtDate(s.date), value: metric === "1rm" ? (best1RM == null ? null : Math.round(best1RM)) : Math.round(val) };
      });
  }, [rangedSessions, filter, metric, chartExercises, muscleGroupMap, hiddenStatsExercises]);

  // --- Weekly (aggregated) equivalents of the datasets above, for the Day/Week chart toggle ---
  // Sessions are bucketed into ISO weeks (Monday start, same convention as the consistency
  // streak) and summed/averaged within each week, rather than plotted one point per session.
  const weekKeyOf = (dateStr) => toISODate(mondayOf(dateStr));

  const weeklySessionGroups = useMemo(() => {
    const map = new Map();
    rangedSessions.forEach((s) => {
      const key = weekKeyOf(s.date);
      if (!map.has(key)) map.set(key, []);
      map.get(key).push(s);
    });
    return Array.from(map.entries())
      .sort((a, b) => a[0].localeCompare(b[0]))
      .map(([weekStart, weekSessions]) => ({ weekStart, sessions: weekSessions }));
  }, [rangedSessions]);

  const weeklyChartData = useMemo(() => weeklySessionGroups.map(({ weekStart, sessions: weekSessions }) => {
    const row = { date: "Wk of " + fmtDate(weekStart), fullDate: weekStart };
    let totalVol = 0, anyVol = false;
    chartExercises.forEach((name) => {
      let repsSum = 0, volSum = 0, best1RM = null, any = false;
      weekSessions.forEach((s) => {
        if (!s.ex[name]) return;
        any = true;
        repsSum += total(s.ex[name]);
        const v = exerciseVolume(s, name);
        if (v != null) volSum += v;
        const rm = exercise1RM(s, name);
        if (rm != null && (best1RM == null || rm > best1RM)) best1RM = rm;
      });
      if (!any) { row[name] = null; return; }
      row[name] = metric === "reps" ? repsSum : metric === "1rm" ? (best1RM == null ? null : Math.round(best1RM)) : Math.round(volSum);
      if (metric === "volume") { totalVol += volSum; anyVol = true; }
    });
    if (metric === "volume") row.Total = anyVol ? Math.round(totalVol) : null;
    return row;
  }), [weeklySessionGroups, chartExercises, metric]);

  const weeklyGroupChartData = useMemo(() => {
    if (!filter.startsWith("group:")) return [];
    const group = filter.slice(6);
    const included = chartExercises.filter((name) => muscleGroupMap[name] === group && !hiddenStatsExercises.has(name));
    if (!included.length) return [];
    return weeklySessionGroups
      .filter(({ sessions: weekSessions }) => weekSessions.some((s) => included.some((name) => s.ex[name])))
      .map(({ weekStart, sessions: weekSessions }) => {
        let val = 0, best1RM = null;
        weekSessions.forEach((s) => {
          included.forEach((name) => {
            if (!s.ex[name]) return;
            if (metric === "reps") { val += total(s.ex[name]); return; }
            if (metric === "1rm") { const rm = exercise1RM(s, name); if (rm != null && (best1RM == null || rm > best1RM)) best1RM = rm; return; }
            const v = exerciseVolume(s, name);
            if (v != null) val += v;
          });
        });
        return { date: "Wk of " + fmtDate(weekStart), value: metric === "1rm" ? (best1RM == null ? null : Math.round(best1RM)) : Math.round(val) };
      });
  }, [weeklySessionGroups, filter, metric, chartExercises, muscleGroupMap, hiddenStatsExercises]);

  // Per-set breakdown doesn't aggregate cleanly across a week (different session/set counts),
  // so the weekly view for a single exercise collapses to just its weekly Total line.
  const weeklySingleData = useMemo(() => {
    if (filter === "All" || filter.startsWith("group:")) return [];
    return weeklySessionGroups
      .filter(({ sessions: weekSessions }) => weekSessions.some((s) => s.ex[filter]))
      .map(({ weekStart, sessions: weekSessions }) => {
        let reps = 0, vol = 0, best1RM = null;
        weekSessions.forEach((s) => {
          if (!s.ex[filter]) return;
          reps += total(s.ex[filter]);
          const v = exerciseVolume(s, filter);
          if (v != null) vol += v;
          const rm = exercise1RM(s, filter);
          if (rm != null && (best1RM == null || rm > best1RM)) best1RM = rm;
        });
        return { date: "Wk of " + fmtDate(weekStart), Total: metric === "reps" ? reps : metric === "1rm" ? (best1RM == null ? null : Math.round(best1RM)) : Math.round(vol) };
      });
  }, [weeklySessionGroups, filter, metric]);

  const weeklyBodyweightData = useMemo(() => weeklySessionGroups.map(({ weekStart, sessions: weekSessions }) => {
    const vals = weekSessions.filter((s) => s.bodyweight != null).map((s) => s.bodyweight);
    return { date: "Wk of " + fmtDate(weekStart), kg: vals.length ? Math.round((vals.reduce((a, b) => a + b, 0) / vals.length) * 10) / 10 : null };
  }), [weeklySessionGroups]);

  // Most recent added-load entry within the week — load changes are step-like (you bump it
  // and hold there), so "latest in the week" is more representative than an average.
  const weeklyLoadStepData = useMemo(() => {
    if (!loadableSet.has(filter)) return [];
    return weeklySessionGroups
      .filter(({ sessions: weekSessions }) => weekSessions.some((s) => s.ex[filter]))
      .map(({ weekStart, sessions: weekSessions }) => {
        const withLoad = weekSessions.filter((s) => s.ex[filter]);
        const lastWeights = withLoad.length ? ((withLoad[withLoad.length - 1].load || {})[filter] || []) : [];
        const lastVal = lastWeights.length ? Math.max(...lastWeights) : 0;
        return { date: "Wk of " + fmtDate(weekStart), "Added load (kg)": lastVal };
      });
  }, [weeklySessionGroups, filter, loadableSet]);

  // The datasets actually handed to the charts below, switching on the Day/Week toggle.
  const chartDataView = timeView === "week" ? weeklyChartData : chartData;
  const groupChartDataView = timeView === "week" ? weeklyGroupChartData : groupChartData;
  const bodyweightDataView = timeView === "week" ? weeklyBodyweightData : bodyweightData;
  const loadStepDataView = timeView === "week" ? weeklyLoadStepData : loadStepData;

  const maxSets = useMemo(() => ((filter === "All" || filter.startsWith("group:") || timeView === "week") ? 0 : Math.max(0, ...rangedSessions.map((s) => (s.ex[filter] || []).length))), [rangedSessions, filter, timeView]);

  // The muscle group tied to the currently selected exercise (or group filter), used to
  // highlight the matching row in the "Volume by muscle group" panel.
  const activeGroup = filter === "All" ? null : filter.startsWith("group:") ? filter.slice(6) : muscleGroupMap[filter] || null;

  const latest = sessions && sessions.length ? sessions[sessions.length - 1] : null;
  const first = sessions && sessions.length ? sessions[0] : null;

  const deltaFor = (name) => {
    if (!latest || !first || !latest.ex[name] || !first.ex[name]) return null;
    return total(latest.ex[name]) - total(first.ex[name]);
  };

  const sessionVolume = (s) => Object.keys(s.ex).reduce((sum, name) => {
    if (!s.ex[name]) return sum;
    const v = exerciseVolume(s, name);
    return v == null ? sum : sum + v;
  }, 0);

  const volumeKpi = useMemo(() => {
    if (!sessions || !latest || !first) return null;
    const latestVol = sessionVolume(latest);
    const firstVol = sessionVolume(first);
    const cumulative = sessions.reduce((sum, s) => sum + sessionVolume(s), 0);
    return { latestVol, delta: latestVol - firstVol, cumulative };
  }, [sessions, latest, first]);

  const groupVolumeLatest = useMemo(() => {
    if (!latest) return [];
    const totals = {}; GROUPS.forEach((g) => (totals[g] = 0));
    Object.keys(latest.ex).forEach((name) => {
      const v = exerciseVolume(latest, name);
      if (v == null) return;
      const group = muscleGroupMap[name] || "Custom";
      if (totals[group] === undefined) totals[group] = 0;
      totals[group] += v;
    });
    const grand = Object.values(totals).reduce((a, b) => a + b, 0) || 1;
    return GROUPS.map((g) => ({ group: g, kg: Math.round(totals[g] || 0), pct: Math.round(((totals[g] || 0) / grand) * 100) }));
  }, [latest, muscleGroupMap]);

  // PRs are tracked by TOTAL session volume (all sets for that exercise, summed) rather than a
  // single best set — one big set can flatter a session that was otherwise unremarkable, while
  // total volume reflects the actual work done. Each PR also carries the rep/set breakdown it
  // was built from, plus how many days ago it was set ("PR aging"), so a PR you haven't come
  // close to in months reads differently from one you nearly matched last week.
  // Uses the same "currently actually logged" list as the charts (`chartExercises`) — not
  // every exercise name that has ever existed — so a PR disappears once you delete the
  // session(s) that produced it, instead of hanging around forever.
  const prMap = useMemo(() => {
    if (!sessions) return {};
    const map = {};
    chartExercises.forEach((name) => {
      let best = null; // { oneRM, reps, weight, date }
      let priorBest = -1;
      sessions.forEach((s) => {
        if (!s.ex[name]) return;
        const sessionBest = bestSet1RM(s, name);
        if (sessionBest == null) return; // no bodyweight logged for this session — 1RM unknown, skip
        if (!latest || s.id !== latest.id) { if (sessionBest.oneRM > priorBest) priorBest = sessionBest.oneRM; }
        if (!best || sessionBest.oneRM > best.oneRM) best = { ...sessionBest, date: s.date };
      });
      const latestBest = latest && latest.ex[name] ? bestSet1RM(latest, name) : null;
      const latestVal = latestBest ? latestBest.oneRM : -1;
      map[name] = {
        best1RM: best ? best.oneRM : -1,
        bestDate: best ? best.date : null,
        bestReps: best ? best.reps : null,
        bestWeight: best ? best.weight : null,
        daysAgo: best ? dayDiff(best.date, todayStr) : null,
        isNewPR: latest && !!best && latestVal > priorBest && latestVal === best.oneRM,
      };
    });
    return map;
  }, [sessions, latest, todayStr, chartExercises]);

  // Fresh (<=13d), aging (14-45d), or stale (46d+) — a quick-glance color for how long ago a
  // PR was actually set, so a shiny "all-time best" number doesn't hide that it's 4 months old.
  const prAgeLabel = agingLabel;

  const consistency = useMemo(() => {
    if (!sessions || sessions.length === 0) return null;
    const weekKeySet = new Set(sessions.map((s) => toISODate(mondayOf(s.date))));
    const currentMonday = mondayOf(todayStr);
    let streak = 0, firstIter = true;
    let cursor = new Date(currentMonday);
    for (let i = 0; i < 104; i++) {
      const key = toISODate(cursor);
      if (weekKeySet.has(key)) streak++;
      else if (!firstIter) break;
      firstIter = false;
      cursor.setDate(cursor.getDate() - 7);
    }
    const firstMonday = mondayOf(sessions[0].date);
    const weeksSpan = Math.max(1, Math.round((currentMonday - firstMonday) / (7 * 86400000)) + 1);
    const avgPerWeek = (sessions.length / weeksSpan).toFixed(1);
    const thisWeekKey = toISODate(currentMonday);
    const thisWeekCount = sessions.filter((s) => toISODate(mondayOf(s.date)) === thisWeekKey).length;
    const daysSinceLast = dayDiff(sessions[sessions.length - 1].date, todayStr);
    return { streak, avgPerWeek, thisWeekCount, daysSinceLast };
  }, [sessions]);

  const twelveWeekTarget = useMemo(() => {
    if (!sessions || sessions.length === 0 || !first) return null;
    const goalWeeks = (targetSettings && targetSettings.weeks) || 12;
    const startDate = (targetSettings && targetSettings.startDate) || first.date;
    const startMonday = mondayOf(startDate);
    const currentMonday = mondayOf(todayStr);
    const weekKeySet = new Set(sessions.map((s) => toISODate(mondayOf(s.date))));
    let cursor = new Date(startMonday);
    let missedWeeks = 0, trainedWeeks = 0;
    while (cursor < currentMonday) {
      const key = toISODate(cursor);
      if (weekKeySet.has(key)) trainedWeeks++; else missedWeeks++;
      cursor.setDate(cursor.getDate() + 7);
    }
    if (weekKeySet.has(toISODate(currentMonday)) && currentMonday >= startMonday) trainedWeeks++;
    const targetDate = new Date(startMonday);
    targetDate.setDate(targetDate.getDate() + (goalWeeks + missedWeeks) * 7);
    const targetISO = toISODate(targetDate);
    const daysRemaining = Math.max(0, dayDiff(todayStr, targetISO));
    const trainedCapped = Math.min(goalWeeks, trainedWeeks);
    return { targetDate: targetISO, daysRemaining, trainedWeeks: trainedCapped, goalWeeks, missedWeeks, reached: trainedWeeks >= goalWeeks };
  }, [sessions, first, todayStr, targetSettings]);

  const HEATMAP_WEEKS = 24;

  const heatmapWeeks = useMemo(() => {
    if (!sessions) return [];
    const sessionByDate = {};
    sessions.forEach((s) => { sessionByDate[s.date] = s; });
    const currentMonday = mondayOf(todayStr);
    const weeks = [];
    for (let w = HEATMAP_WEEKS - 1; w >= 0; w--) {
      const weekStart = new Date(currentMonday); weekStart.setDate(weekStart.getDate() - w * 7);
      const days = [];
      for (let d = 0; d < 7; d++) {
        const day = new Date(weekStart); day.setDate(day.getDate() + d);
        const iso = toISODate(day);
        days.push({ date: iso, trained: !!sessionByDate[iso], isFuture: iso > todayStr });
      }
      weeks.push(days);
    }
    return weeks;
  }, [sessions]);

  // Measures the heatmap grid's actual available width (via heatmapGridRef) and derives a
  // square size that makes all 24 week-columns plus the day-label column fit exactly —
  // replacing the old fixed 12/14px squares + horizontal scroll, which required swiping on
  // phones. Recomputes on mount and whenever the container resizes (ResizeObserver), so it
  // stays correct across orientation changes and window resizes too.
  useEffect(() => {
    const el = heatmapGridRef.current;
    if (!el) return;
    const GAP = 3;
    const LABEL_COL_WIDTH = 18;
    const compute = () => {
      const width = el.clientWidth;
      if (!width) return;
      const usable = width - LABEL_COL_WIDTH - GAP * HEATMAP_WEEKS;
      const size = Math.max(6, Math.min(16, Math.floor(usable / HEATMAP_WEEKS)));
      setHeatmapCellSize(size);
    };
    compute();
    const ro = new ResizeObserver(compute);
    ro.observe(el);
    return () => ro.disconnect();
  }, []);


  // ---- Dashboard tab (overview): combines workout + swim, doesn't duplicate either tab's
  // full detail — just consistency, weight, a combined "days trained" map, both targets at a
  // glance, and a couple of mini streak cards that link into the sport-specific tabs.
  const [swimTargetSettingsView, setSwimTargetSettingsView] = useState(null);
  const [dashHeatmapCellSize, setDashHeatmapCellSize] = useState(14);
  const [dashHeatmapWeekCount, setDashHeatmapWeekCount] = useState(24);
  const dashHeatmapGridRef = useRef(null);

  useEffect(() => {
    if (tab !== "dashboard") return;
    (async () => {
      try {
        const res = await window.storage.get("swim-target-settings-v1", false);
        setSwimTargetSettingsView(res && res.value ? JSON.parse(res.value) : {});
      } catch (e) {
        setSwimTargetSettingsView({});
      }
    })();
  }, [tab]);

  const modeWorkoutSessions = athleteMode === "swim" ? [] : (sessions || []);
  const modeSwimSessions = athleteMode === "workout" ? [] : (swimSessions || []);
  const visibleSessionDates = [...modeWorkoutSessions.map((s) => s.date), ...modeSwimSessions.map((s) => s.date)];
  const visibleSessionCount = modeWorkoutSessions.length + modeSwimSessions.length;
  const visibleFirstDate = visibleSessionDates.length ? visibleSessionDates.reduce((a, b) => a < b ? a : b) : null;
  const visibleLatestDate = visibleSessionDates.length ? visibleSessionDates.reduce((a, b) => a > b ? a : b) : null;

  // Earliest logged date across the currently visible training modes — the heatmap is clamped to
  // never render weeks before this, even if the selected dropdown window (8/12/24/52) is
  // longer than actual history. Prevents a wall of empty black cells when history is short.
  const combinedEarliestDate = useMemo(() => {
    const dates = [...modeWorkoutSessions.map((s) => s.date), ...modeSwimSessions.map((s) => s.date)];
    if (dates.length === 0) return null;
    return dates.reduce((min, d) => (d < min ? d : min), dates[0]);
  }, [modeWorkoutSessions, modeSwimSessions]);

  // How many weeks actually get rendered: the smaller of the selected dropdown value and
  // the number of weeks since the earliest logged session (min 1 so a single-week-old log
  // still renders something).
  const combinedRenderedWeekCount = useMemo(() => {
    if (!combinedEarliestDate) return 0;
    const earliestMonday = mondayOf(combinedEarliestDate);
    const currentMonday = mondayOf(todayStr);
    const weeksAvailable = Math.floor((currentMonday - earliestMonday) / (7 * 86400000)) + 1;

                {filter === "All" ? (

                    <Tooltip contentStyle={{ background: "#27272A", border: "1px solid #2C2C2E", borderRadius: 12, fontSize: 11 }} formatter={(v) => [`${fmtNum(v, 2)} ${yLabel}`, filter.slice(6)]} />
                    <Line type="monotone" dataKey="value" name={filter.slice(6)} stroke={GROUP_COLORS[filter.slice(6)]} strokeWidth={2.7} dot={{ r: 3.2 }} connectNulls />
                  </LineChart>
                ) : timeView === "week" ? (
                  <LineChart data={weeklySingleData} margin={{ top: 10, right: 16, left: -10, bottom: 0 }}><XAxis dataKey="date" stroke="#636366" fontSize={11} axisLine={{ stroke: "#8E8E93", strokeOpacity: 0.62 }} tickLine={false} /><YAxis stroke="#636366" fontSize={11} tickFormatter={(v) => fmtNum(v, 2)} />
                    <Tooltip contentStyle={{ background: "#27272A", border: "1px solid #2C2C2E", borderRadius: 12, fontSize: 12 }} formatter={(v, name) => [fmtNum(v, 2), name]} />

                  </LineChart>
                ) : (
                  <LineChart data={perSetData} margin={{ top: 10, right: 16, left: -10, bottom: 0 }}><XAxis dataKey="date" stroke="#636366" fontSize={11} axisLine={{ stroke: "#8E8E93", strokeOpacity: 0.62 }} tickLine={false} /><YAxis stroke="#636366" fontSize={11} tickFormatter={(v) => fmtNum(v, 2)} />
                    <Tooltip contentStyle={{ background: "#27272A", border: "1px solid #2C2C2E", borderRadius: 12, fontSize: 12 }} formatter={(v, name) => [fmtNum(v, 2), name]} />
                    <Legend wrapperStyle={{ fontSize: 11, paddingTop: 8, cursor: "pointer" }} onClick={(e) => setChartFocus((cur) => (cur === e.dataKey ? null : e.dataKey))} />

                <ResponsiveContainer width="100%" height={isMobile ? 120 : 150}>
                  <LineChart data={loadStepDataView} margin={{ top: 10, right: 16, left: -10, bottom: 0 }}><XAxis dataKey="date" stroke="#636366" fontSize={11} axisLine={{ stroke: "#8E8E93", strokeOpacity: 0.62 }} tickLine={false} /><YAxis stroke="#636366" fontSize={11} tickFormatter={(v) => fmtNum(v, 2)} />

                    <Line type="stepAfter" dataKey="Added load (kg)" stroke="#FF453A" strokeWidth={2.2} dot={{ r: 3 }} connectNulls />

            </div>
            </>
            )}

              <label className="file-btn" style={{ display: "flex", alignItems: "center", gap: 6, cursor: "pointer", background: "#1C1C1E", border: "1px solid #27272A", color: "#D1D1D6", borderRadius: 16, padding: "10px 14px", fontWeight: 600, fontSize: 13 }}>

              {viewMode === "swim" && (swimSessions || []).length > 0 && (

                <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 10, marginBottom: 10 }}>
                  <div>
                    <div style={{ fontWeight: 700, fontSize: 15, color: "#FFFFFF", marginBottom: 3 }}>Log new swim session</div>
                    <div style={{ fontSize: 12, color: "#636366" }}>Upload Garmin <span className="mono">.FIT</span> files (pool swims) — pool length is detected from FIT when available and must be supplied if missing. Everything is parsed locally in your browser.</div>

                  <label className="file-btn" style={{ display: "flex", alignItems: "center", gap: 6, cursor: "pointer", background: "#64D2FF", color: "#000000", border: "none", borderRadius: 16, padding: "10px 16px", fontWeight: 700, fontSize: 13 }}>
                    <Upload size={14} /> {swimUploading ? "Parsing…" : "Upload .FIT"}

                            </div>

                              <div style={{ fontSize: 10, color: "#48484A", marginBottom: 3 }}>400m pace (min/100m) {d.auto400 && <span style={{ color: "#0A84FF" }}>· auto-detected</span>}</div>

                            </div>
                          </div>
                          <div style={{ fontSize: 10, color: "#48484A", marginTop: 4 }}>Enter pace as min:sec per 100m (e.g. 1:38.5) — this is the pace for the whole 200m/400m swim, not a single length.</div>

                    <div style={{ display: "flex", gap: 8, marginTop: 14 }}>

                  <button onClick={cancelPendingPoolUpload} style={{ cursor: "pointer", background: "transparent", color: "#8E8E93", border: "1px solid #2C2C2E", borderRadius: 9, padding: "8px 10px", fontWeight: 700, fontSize: 11 }}>Cancel</button>
                </div>
              </div>

              <div style={{ background: "#1C1C1E", border: "1px solid #2C2C2E", borderRadius: 20, boxShadow: "none", padding: 18, marginBottom: 22 }}>

                </div>
                <div style={{ display: "flex", gap: 10, marginBottom: 14, flexWrap: "wrap" }}>
                  <div><div style={{ fontSize: 11, color: "#8E8E93", marginBottom: 4 }}>Date</div><input type="date" value={draft.date} onChange={(e) => setDraft({ ...draft, date: e.target.value })} style={{ background: "#000000", border: "1px solid #2C2C2E", borderRadius: 12, padding: "8px 10px", color: "#F2F2F7", fontSize: 13 }} /></div>

                <div style={{ background: "#000000", border: "1px dashed #2C2C2E", borderRadius: 16, padding: 12, marginBottom: 16 }}>

                  <textarea
                    value={pasteText}
                    onChange={(e) => setPasteText(e.target.value)}

                    rows={4}
                    className="mono"
                    style={{ width: "100%", background: "#1C1C1E", border: "1px solid #2C2C2E", borderRadius: 12, padding: "8px 10px", color: "#F2F2F7", fontSize: 12, boxSizing: "border-box", resize: "vertical" }}
                  />

                <div style={{ display: "grid", gap: isMobile ? 14 : 10, marginBottom: 14 }}>

                    isMobile ? (
                      <div key={name} style={{ display: "grid", gap: 6, borderBottom: "1px solid #27272A", paddingBottom: 10 }}>

                        </div>
                        <div style={{ display: "grid", gridTemplateColumns: "1fr 90px", gap: 8 }}>
                          <input type="text" placeholder="e.g. 12,11,9,8" value={draft.ex[name]} onChange={(e) => setDraft({ ...draft, ex: { ...draft.ex, [name]: e.target.value } })} className="mono" style={{ background: "#000000", border: "1px solid #2C2C2E", borderRadius: 12, padding: "10px 10px", color: "#F2F2F7", fontSize: 14, boxSizing: "border-box" }} />
                          <input type="text" placeholder="e.g. 15,15,5,5" value={draft.load[name]} onChange={(e) => setDraft({ ...draft, load: { ...draft.load, [name]: e.target.value } })} className="mono" style={{ background: "#000000", border: "1px solid #2C2C2E", borderRadius: 12, padding: "10px 10px", color: "#F2F2F7", fontSize: 14, boxSizing: "border-box" }} />

                      <div key={name} style={{ display: "grid", gridTemplateColumns: editingId ? "160px 1fr 90px" : "160px 1fr 90px 18px", gap: 10, alignItems: "center" }}>

                        <input type="text" placeholder="e.g. 12,11,9,8" value={draft.ex[name]} onChange={(e) => setDraft({ ...draft, ex: { ...draft.ex, [name]: e.target.value } })} className="mono" style={{ background: "#000000", border: "1px solid #2C2C2E", borderRadius: 12, padding: "8px 10px", color: "#F2F2F7", fontSize: 13, boxSizing: "border-box" }} />
                        <input type="text" placeholder="e.g. 15,15,5,5" value={draft.load[name]} onChange={(e) => setDraft({ ...draft, load: { ...draft.load, [name]: e.target.value } })} className="mono" style={{ background: "#000000", border: "1px solid #2C2C2E", borderRadius: 12, padding: "8px 10px", color: "#F2F2F7", fontSize: 13, boxSizing: "border-box" }} />

                </div>
                <div style={{ marginBottom: 4, fontSize: 11, color: "#8E8E93" }}>Notes (optional — soreness, sleep, how it felt)</div>
                <textarea value={draft.notes} onChange={(e) => setDraft({ ...draft, notes: e.target.value })} rows={2} style={{ width: "100%", background: "#000000", border: "1px solid #2C2C2E", borderRadius: 12, padding: "8px 10px", color: "#F2F2F7", fontSize: 13, boxSizing: "border-box" }} />
                <button onClick={saveSession} disabled={saving} style={{ marginTop: 16, background: "#1C1C1E", color: "#101214", border: "none", borderRadius: 12, padding: "10px 20px", fontWeight: 700, fontSize: 13, cursor: "pointer" }}>{saving ? "Saving…" : editingId ? "Update session" : "Save session"}</button>
              </div>
            )}

            {viewMode === "workout" && (
              <div style={{ background: "#1C1C1E", border: "1px solid #27272A", borderRadius: 20, overflow: "hidden" }}>

                <div style={{ maxHeight: 520, overflowY: "auto" }}>
                  {[...sessions].reverse().map((s, idx) => (

                        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>

                          <span className="disp" style={{ fontWeight: 700, fontSize: 15, color: "#FFFFFF" }}>{fmtDate(s.date)}</span>
                          <span style={{ fontSize: 12, color: "#636366" }}>{s.label}</span>
                          {s.bodyweight != null ? (
                            <span className="mono" style={{ fontSize: 11, color: "#48484A" }}>{s.bodyweight} kg</span>
                          ) : bwMap[s.id] != null ? (
                            <span className="mono" style={{ fontSize: 11, color: "#48484A", fontStyle: "italic" }}>~{bwMap[s.id]} kg (carried)</span>
                          ) : null}
                        </div>
                        <div style={{ display: "flex", gap: 12, flexShrink: 0 }}>
                          <Pencil size={14} style={{ cursor: "pointer", color: "#48484A" }} onClick={() => startEdit(s)} />
                          <Trash2 size={15} style={{ cursor: "pointer", color: "#48484A" }} onClick={() => setConfirmDelete(s)} />
                        </div>
                      </div>
                      <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
                        {Object.keys(s.ex).filter((n) => s.ex[n]).map((name) => (
                          <span key={name} className="mono" style={{ fontSize: 11, padding: "3px 8px", borderRadius: 6, background: `${colorsMap[name] || "#8E8E93"}14`, color: colorsMap[name] || "#8E8E93", border: `1px solid ${colorsMap[name] || "#8E8E93"}33` }}>{name}: {s.ex[name].join("-")}{weightTag((s.load || {})[name])}</span>
                        ))}
                      </div>
                      {s.notes && <div style={{ fontSize: 11.5, color: "#636366", fontStyle: "italic", marginTop: 6 }}>"{s.notes}"</div>}
                    </div>
                  ))}
                  {sessions.length === 0 && <div style={{ padding: "20px 16px", fontSize: 12.5, color: "#636366" }}>No workout sessions logged yet.</div>}
                </div>
              </div>
            )}

            {viewMode === "swim" && (
              <>
          {/* Session detail — the length-by-length drill-down. Always visible, outside the tab
              switcher above (item 2) — this is where CSS-test flagging happens, so it needs to
              stay reachable regardless of which of the three tabs is selected. History & Log
              has a lighter summary list of the same sessions. */}
          <div style={{ background: "#1C1C1E", border: "1px solid #27272A", borderRadius: 20, overflow: "hidden", padding: isMobile ? 12 : 16 }}>
            <div style={{ fontSize: 11, color: "#8E8E93", textTransform: "uppercase", letterSpacing: "0.06em", marginBottom: 2 }}>Swim session detail</div>
            <div style={{ fontSize: 11, color: "#636366", marginBottom: 12 }}>Full length-by-length breakdown, corrections, exclusions and CSS annotations.</div>
            <div style={{ display: "grid", gap: 8 }}>
              {sortedSwimSessions.map((s) => {
                const isOpen = expandedSwimDetailId === s.id;
                return (
                  <div key={s.id} style={{ border: "1px solid #27272A", borderRadius: 16, overflow: "hidden" }}>
                    <div onClick={() => setExpandedSwimDetailId(isOpen ? null : s.id)} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "12px 14px", cursor: "pointer", background: "#000000", flexWrap: "wrap", gap: 8 }}>
                      <div style={{ display: "flex", alignItems: "center", gap: 10, minWidth: 0 }}>
                        <ChevronDown size={14} style={{ color: "#636366", flexShrink: 0, transform: isOpen ? "rotate(180deg)" : "none", transition: "transform 0.15s" }} />
                        <div>
                          <div style={{ fontSize: 13, fontWeight: 700, color: "#FFFFFF", display: "flex", alignItems: "center", gap: 6 }}>
                            {fmtDateFull(s.date)}
                            <span className="mono" style={{ fontSize: 9.5, color: s.isCssTest ? "#0A84FF" : "#64D2FF", border: `1px solid ${s.isCssTest ? "#0A84FF" : "#64D2FF"}55`, borderRadius: 5, padding: "1px 5px" }}>{swimCategoryLabelOf(s)}</span>
                            <span className="mono" style={{ fontSize: 9.5, color: s.poolLength != null ? "#8E8E93" : "#FF453A", border: `1px solid ${s.poolLength != null ? "#8E8E9355" : "#FF453A55"}`, borderRadius: 5, padding: "1px 5px" }}>{formatPoolLength(s.poolLength)}</span>
                            {s.qualityNote && <AlertTriangle size={12} style={{ color: "#FF9F0A" }} title={s.qualityNote} />}
                          </div>
                          <div className="mono" style={{ fontSize: 11, color: "#636366" }}>{s.fileName}</div>
                        </div>
                      </div>
                      <div style={{ display: "flex", gap: 16, fontSize: 12 }}>
                        <div style={{ textAlign: "right" }}><div className="mono" style={{ color: "#FFFFFF", fontWeight: 700 }}>{s.distance != null ? `${s.distance}m` : "—"}</div><div style={{ color: "#636366", fontSize: 10 }}>distance</div></div>
                        <div style={{ textAlign: "right" }}><div className="mono" style={{ color: "#FFFFFF", fontWeight: 700 }}>{fmtMinSec(s.swimTimeSec)}</div><div style={{ color: "#636366", fontSize: 10 }}>swim time</div></div>
                        <div style={{ textAlign: "right" }}><div className="mono" style={{ color: "#FFFFFF", fontWeight: 700 }}>{s.calories != null ? s.calories : "—"}</div><div style={{ color: "#636366", fontSize: 10 }}>kcal</div></div>
                      </div>
                    </div>
                    {isOpen && (
                      <div style={{ padding: "12px 14px", borderTop: "1px solid #27272A" }}>
                        {s.qualityNote && (
                          <div style={{ fontSize: 11.5, color: "#FF9F0A", background: "#FF9F0A14", border: "1px solid #FF9F0A33", borderRadius: 12, padding: "8px 10px", marginBottom: 10 }}>{s.qualityNote}</div>
                        )}
                        <div style={{ display: "grid", gridTemplateColumns: isMobile ? "1fr 1fr" : "repeat(4, 1fr)", gap: 10, marginBottom: 8, fontSize: 12 }}>
                          <div>
                            <div style={{ color: "#636366", fontSize: 10, display: "flex", alignItems: "center", gap: 4 }}>
                              Distance
                              <Pencil size={10} style={{ cursor: "pointer", color: "#48484A" }} onClick={(e) => { e.stopPropagation(); setSwimEditingDistanceFor(s.id); setSwimDistanceDraft(String(s.distance != null ? s.distance : "")); }} />
                            </div>
                            <div className="mono" style={{ color: "#D1D1D6" }}>{s.distance != null ? `${s.distance}m` : "—"}</div>
                            {s.distanceCorrection && <div style={{ fontSize: 9.5, color: "#48484A" }}>was {s.distanceCorrection.originalDistance}m (FIT-derived)</div>}
                          </div>
                          <div>
                            <div style={{ color: "#636366", fontSize: 10, display: "flex", alignItems: "center", gap: 4 }}>Pool length <Pencil size={10} style={{ cursor: "pointer", color: "#48484A" }} onClick={(e) => { e.stopPropagation(); setSwimEditingPoolFor(s.id); setSwimPoolDraft(s.poolLength != null ? String(s.poolLength) : ""); }} /></div>
                            <div className="mono" style={{ color: s.poolLength != null ? "#D1D1D6" : "#FF453A" }}>{formatPoolLength(s.poolLength)}</div>
                            {s.poolLengthSource && <div style={{ fontSize: 9.5, color: "#48484A" }}>{s.poolLengthSource === "fit" ? "FIT detected" : s.poolLengthSource === "manual" ? "manually set" : "existing log"}</div>}
                          </div>
                          <div><div style={{ color: "#636366", fontSize: 10 }}>Avg pace</div><div className="mono" style={{ color: "#D1D1D6" }}>{fmtPace100(s.pace100Overall)}</div></div>
                          <div><div style={{ color: "#636366", fontSize: 10 }}>Avg HR</div><div className="mono" style={{ color: "#D1D1D6" }}>{s.avgHR != null ? `${s.avgHR} bpm` : "—"}</div></div>
                          <div><div style={{ color: "#636366", fontSize: 10 }}>Rest time</div><div className="mono" style={{ color: "#D1D1D6" }}>{fmtMinSec(s.restTimeSec)}</div></div>
                        </div>
                        {swimEditingPoolFor === s.id && (
                          <div style={{ display: "flex", alignItems: "center", gap: 6, flexWrap: "wrap", background: "#000000", border: "1px solid #2C2C2E", borderRadius: 10, padding: "8px 10px", marginBottom: 12 }} onClick={(e) => e.stopPropagation()}>
                            <span style={{ fontSize: 11, color: "#8E8E93" }}>Pool</span>
                            {[25, 50, 22.86].map((v) => <button key={v} onClick={() => setSwimPoolDraft(String(v))} style={{ cursor: "pointer", background: Math.abs(parseFloat(swimPoolDraft) - v) < 0.05 ? "#64D2FF" : "transparent", color: Math.abs(parseFloat(swimPoolDraft) - v) < 0.05 ? "#000000" : "#8E8E93", border: "1px solid #2C2C2E", borderRadius: 7, padding: "4px 7px", fontWeight: 700, fontSize: 10 }}>{v === 22.86 ? "25yd" : `${v}m`}</button>)}
                            <input type="number" step="0.01" min="1" value={swimPoolDraft} onChange={(e) => setSwimPoolDraft(e.target.value)} className="mono" style={{ width: 85, background: "#1C1C1E", border: "1px solid #2C2C2E", borderRadius: 6, padding: "4px 8px", color: "#F2F2F7", fontSize: 12 }} />
                            <span style={{ fontSize: 11, color: "#8E8E93" }}>m</span>
                            <button onClick={() => correctSwimPoolLength(s.id)} style={{ cursor: "pointer", background: "#64D2FF", color: "#000000", border: "none", borderRadius: 6, padding: "5px 10px", fontWeight: 700, fontSize: 11 }}>Save</button>
                            <button onClick={() => { setSwimEditingPoolFor(null); setSwimPoolDraft(""); }} style={{ cursor: "pointer", background: "transparent", color: "#8E8E93", border: "1px solid #2C2C2E", borderRadius: 6, padding: "5px 10px", fontWeight: 600, fontSize: 11 }}>Cancel</button>
                            <div style={{ fontSize: 10, color: "#48484A", width: "100%" }}>Changing pool length recalculates distance, pace, DPS, stroke-specific pace and reconstructed reps from the existing length records.</div>
                          </div>
                        )}

                        {swimEditingDistanceFor === s.id && (
                          <div style={{ display: "flex", alignItems: "center", gap: 6, flexWrap: "wrap", background: "#000000", border: "1px solid #2C2C2E", borderRadius: 10, padding: "8px 10px", marginBottom: 12 }} onClick={(e) => e.stopPropagation()}>
                            <span style={{ fontSize: 11, color: "#8E8E93" }}>Correct distance to</span>
                            <input type="number" step="0.01" value={swimDistanceDraft} onChange={(e) => setSwimDistanceDraft(e.target.value)} className="mono" style={{ width: 90, background: "#1C1C1E", border: "1px solid #2C2C2E", borderRadius: 6, padding: "4px 8px", color: "#F2F2F7", fontSize: 12 }} autoFocus />
                            <span style={{ fontSize: 11, color: "#8E8E93" }}>m</span>
                            <button onClick={() => correctSwimDistance(s.id)} style={{ cursor: "pointer", background: "#64D2FF", color: "#000000", border: "none", borderRadius: 6, padding: "5px 10px", fontWeight: 700, fontSize: 11 }}>Save</button>
                            <button onClick={() => setSwimEditingDistanceFor(null)} style={{ cursor: "pointer", background: "transparent", color: "#8E8E93", border: "1px solid #2C2C2E", borderRadius: 6, padding: "5px 10px", fontWeight: 600, fontSize: 11 }}>Cancel</button>
                            {s.distanceCorrection && <button onClick={() => { resetSwimDistanceCorrection(s.id); setSwimEditingDistanceFor(null); }} style={{ cursor: "pointer", background: "transparent", color: "#FF453A", border: "1px solid #FF453A55", borderRadius: 6, padding: "5px 10px", fontWeight: 600, fontSize: 11 }}>Reset to FIT value</button>}
                            <div style={{ fontSize: 10, color: "#48484A", width: "100%" }}>Pace, PRs, and all charts recalculate from the corrected distance — swim time stays as recorded.</div>
                          </div>
                        )}

                        {/* Activity analysis: pace over the full session, filterable by swim
                            type, with HR overlaid where it's genuinely meaningful (in-session
                            effort context) — real per-length data, not aggregated trends.
                            X-axis is cumulative elapsed time (not distance), so rest breaks
                            and other-stroke segments actually take up real width instead of
                            being invisible gaps between adjacent points. */}
                        {(() => {
                          const sessionStrokes = Object.keys(s.strokeStats || {});
                          // Effective view: original data with the person's corrections applied,
                          // excluded lengths dropped entirely — matches computeSwimSessionMetrics
                          // exactly, so this chart's timeline never disagrees with the numbers above it.
                          const effLengths = s.lengths.filter((l) => !l.userExcluded).map(effectiveLength);
                          const activeLengths = effLengths.filter((l) => l.lengthType === "active");
                          if (activeLengths.length < 2) return null;
                          const currentFilter = swimActivityStrokeFilter[s.id] || "all";

                          // Walk every (non-excluded) length in original order (active + idle)
                          // building [start,end] time windows, so rest and off-filter segments
                          // have a real position/width on the chart instead of just vanishing.
                          let cumTime = 0;
                          const segments = effLengths.map((l) => {
                            const start = cumTime;
                            cumTime += l.elapsedSec;
                            return { ...l, start, end: cumTime };
                          });

                          const restBands = segments.filter((l) => l.lengthType === "idle" && l.end > l.start);
                          const otherStrokeBands = currentFilter === "all"
                            ? []
                            : segments.filter((l) => l.lengthType === "active" && l.stroke !== currentFilter && l.end > l.start);

                          const chartData = segments
                            .filter((l) => l.lengthType === "active")
                            .map((l) => ({
                              x: l.end,
                              pace100: (currentFilter === "all" || l.stroke === currentFilter) ? l.pace100 : null,
                              avgHR: l.avgHR,
                            }));
                          const hasAnyHR = chartData.some((d) => d.avgHR != null);

                          return (
                            <div style={{ marginBottom: 12 }}>
                              <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 8, marginBottom: 6 }}>
                                <div style={{ fontSize: 11, color: "#8E8E93", textTransform: "uppercase", letterSpacing: "0.04em" }}>Pace over this session</div>
                                {sessionStrokes.length > 1 && (
                                  <div style={{ display: "flex", gap: 4, flexWrap: "wrap" }}>
                                    {["all", ...sessionStrokes].map((st) => (
                                      <button key={st} onClick={(e) => { e.stopPropagation(); setSwimActivityStrokeFilter((prev) => ({ ...prev, [s.id]: st })); }} className="pill" style={{
                                        cursor: "pointer", background: currentFilter === st ? "#27272A" : "transparent",
                                        border: "1px solid " + (currentFilter === st ? "#3A3A3C" : "#27272A"), color: currentFilter === st ? "#FFFFFF" : "#8E8E93",
                                        borderRadius: 7, padding: "3px 8px", fontSize: 10.5, fontWeight: 600,
                                      }}>{st === "all" ? "All" : SWIM_STROKE_LABELS[st]}</button>
                                    ))}
                                  </div>
                                )}
                              </div>
                              {(restBands.length > 0 || otherStrokeBands.length > 0) && (
                                <div style={{ display: "flex", gap: 12, fontSize: 10, color: "#8E8E93", marginBottom: 6 }}>
                                  {restBands.length > 0 && <span style={{ display: "flex", alignItems: "center", gap: 4 }}><span style={{ width: 9, height: 9, borderRadius: 2, background: "#3A3A3C99", display: "inline-block" }} /> rest</span>}
                                  {otherStrokeBands.length > 0 && <span style={{ display: "flex", alignItems: "center", gap: 4 }}><span style={{ width: 9, height: 9, borderRadius: 2, background: "#FF9F0A33", display: "inline-block" }} /> other stroke</span>}
                                </div>
                              )}
                              <ResponsiveContainer width="100%" height={160}>
                                <LineChart data={chartData} margin={{ top: 4, right: 8, left: 0, bottom: 0 }}>
                                  <XAxis dataKey="x" type="number" domain={[0, cumTime]} tick={{ fill: "#8E8E93", fontSize: 10 }} tickFormatter={(v) => fmtMinSec(v)} />
                                  <YAxis yAxisId="pace" tick={{ fill: "#8E8E93", fontSize: 10 }} tickFormatter={(v) => fmtMinSec(v)} reversed domain={["dataMin - 5", "dataMax + 5"]} />
                                  {hasAnyHR && <YAxis yAxisId="hr" orientation="right" tick={{ fill: "#8E8E93", fontSize: 10 }} domain={["dataMin - 5", "dataMax + 5"]} />}
                                  <Tooltip contentStyle={{ background: "#000000", border: "1px solid #2C2C2E", borderRadius: 12, fontSize: 12 }} formatter={(v, name) => (name === "Avg HR" ? [v != null ? `${Math.round(v)} bpm` : "—", name] : [fmtPace100(v), name])} labelFormatter={(v) => `${fmtMinSec(v)} elapsed`} />
                                  {restBands.map((b, i) => (<ReferenceArea key={`rest-${i}`} yAxisId="pace" x1={b.start} x2={b.end} fill="#3A3A3C" fillOpacity={0.4} strokeWidth={0} />))}
                                  {otherStrokeBands.map((b, i) => (<ReferenceArea key={`other-${i}`} yAxisId="pace" x1={b.start} x2={b.end} fill={SWIM_STROKE_COLORS[b.stroke] || "#FF9F0A"} fillOpacity={0.14} strokeWidth={0} />))}
                                  <Line yAxisId="pace" type="monotone" dataKey="pace100" name="Pace" stroke="#64D2FF" strokeWidth={2} dot={{ r: 2.5 }} connectNulls={false} />
                                  {hasAnyHR && <Line yAxisId="hr" type="monotone" dataKey="avgHR" name="Avg HR" stroke="#FF453A" strokeWidth={1.5} strokeDasharray="4 3" dot={{ r: 2 }} connectNulls />}
                                </LineChart>
                              </ResponsiveContainer>
                              {!hasAnyHR && <div style={{ fontSize: 10, color: "#48484A", marginTop: 4 }}>No HR recorded in this activity.</div>}
                            </div>
                          );
                        })()}

                        {s.reps && s.reps.length > 0 && (
                          <div style={{ marginBottom: 12 }}>

      )}

      {confirmDeleteAllScope && (
        <div style={{ position: "fixed", inset: 0, background: "rgba(8,9,11,0.72)", backdropFilter: "blur(6px)", display: "flex", alignItems: "center", justifyContent: "center", padding: 20, zIndex: 50 }}>
          <div style={{ background: "#1C1C1E", border: "1px solid #2C2C2E", borderRadius: 20, boxShadow: "none", padding: 20, maxWidth: 360, width: "100%" }}>
            <div style={{ display: "flex", gap: 10, marginBottom: 14 }}>
              <AlertTriangle size={20} color="#FF453A" style={{ flexShrink: 0 }} />
              <div>
                <div style={{ fontWeight: 700, fontSize: 14, color: "#FFFFFF", marginBottom: 4 }}>
                  {confirmDeleteAllScope === "workout" ? "Delete ALL workout logs?" : confirmDeleteAllScope === "swim" ? "Delete ALL swim activity?" : "Delete ALL activity?"}
                </div>
                <div style={{ fontSize: 12.5, color: "#8E8E93" }}>
                  {confirmDeleteAllScope === "workout" && `All ${sessions.length} workout session(s) will be permanently removed.`}
                  {confirmDeleteAllScope === "swim" && `All ${(swimSessions || []).length} swim session(s) will be permanently removed.`}
                  {confirmDeleteAllScope === "all" && `All ${sessions.length} workout and ${(swimSessions || []).length} swim session(s) will be permanently removed.`}
                  {" "}This can't be undone. Tracked exercises and target settings are kept.
                </div>
              </div>
            </div>
            <div style={{ display: "flex", gap: 8, justifyContent: "flex-end" }}>
              <button onClick={() => setConfirmDeleteAllScope(null)} style={{ padding: "8px 16px", borderRadius: 12, border: "1px solid #2C2C2E", background: "transparent", color: "#D1D1D6", fontSize: 13, fontWeight: 600, cursor: "pointer" }}>Cancel</button>
              <button onClick={doDeleteAllLogs} style={{ padding: "8px 16px", borderRadius: 12, border: "none", background: "#FF453A", color: "#fff", fontSize: 13, fontWeight: 700, cursor: "pointer" }}>Delete all</button>
            </div>
          </div>
        </div>
      )}

      {selectedHeatDate && (
        <div style={{ position: "fixed", inset: 0, background: "rgba(8,9,11,0.72)", backdropFilter: "blur(6px)", display: "flex", alignItems: "center", justifyContent: "center", padding: 20, zIndex: 50 }} onClick={() => setSelectedHeatDate(null)}>
          <div style={{ background: "#1C1C1E", border: "1px solid #2C2C2E", borderRadius: 20, boxShadow: "none", padding: "20px 28px" }} onClick={(e) => e.stopPropagation()}>
            <div className="disp" style={{ fontSize: 20, fontWeight: 700, color: "#FFFFFF" }}>{fmtDateFull(selectedHeatDate)}</div>
          </div>
        </div>
      )}

      {showLibrary && (
        <div style={{ position: "fixed", inset: 0, background: "rgba(8,9,11,0.72)", backdropFilter: "blur(6px)", display: "flex", alignItems: "center", justifyContent: "center", padding: 20, zIndex: 50 }} onClick={() => setShowLibrary(false)}>
          <div style={{ background: "#1C1C1E", border: "1px solid #2C2C2E", borderRadius: 20, boxShadow: "none", padding: 20, maxWidth: 560, width: "100%", maxHeight: "80vh", overflowY: "auto" }} onClick={(e) => e.stopPropagation()}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6 }}>
              <span style={{ fontWeight: 700, fontSize: 15, color: "#FFFFFF" }}>Exercise reference</span>
              <X size={18} style={{ cursor: "pointer", color: "#8E8E93" }} onClick={() => setShowLibrary(false)} />
            </div>
            <div style={{ fontSize: 11.5, color: "#636366", marginBottom: 14, lineHeight: 1.5 }}>
              Every exercise the paste-parser recognizes, with its bodyweight ratio — the fraction of bodyweight it actually lifts per rep, used to calculate volume ("load only" means the movement has no bodyweight component). Exercises marked <span style={{ color: "#FF9F0A", fontWeight: 700 }}>tracked</span> have a field in the entry form — click it to untrack, or "+ track" any other one to add it. Use "Add exercise" if it isn't listed at all.
            </div>
            {GROUPS.map((g) => (
              <div key={g} style={{ marginBottom: 14 }}>
                <div className="mono" style={{ fontSize: 11, fontWeight: 700, color: GROUP_COLORS[g], textTransform: "uppercase", letterSpacing: "0.06em", marginBottom: 6 }}>{g}</div>
                <div style={{ display: "grid", gap: 2 }}>
                  {fullLibrary.filter((e) => e.group === g).map((e) => {
                    const isTracked = trackedExercises.includes(e.name);
                    return (
                      <div key={e.name} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", fontSize: 12, padding: "5px 0", borderBottom: "1px solid #27272A" }}>
                        <span style={{ color: isTracked ? "#FFFFFF" : "#8E8E93" }}>
                          {e.name}
                          {e.target && <span style={{ color: "#48484A", fontSize: 10.5 }}> · {e.target}</span>}
                        </span>
                        <span style={{ display: "flex", alignItems: "center", gap: 10, flexShrink: 0 }}>
                          <span className="mono" style={{ color: "#636366" }}>{e.ratio === 0 ? "load only" : `${Math.round(e.ratio * 100)}% BW`}</span>
                          {isTracked ? (
                            <button onClick={() => untrackExercise(e.name)} className="mono" style={{ fontSize: 10, fontWeight: 700, color: "#FF9F0A", background: "transparent", border: "1px solid #FF9F0A55", borderRadius: 999, padding: "2px 8px", cursor: "pointer" }}>✕ tracked</button>
                          ) : (
                            <button onClick={() => trackLibraryExercise(e.name)} className="mono" style={{ fontSize: 10, fontWeight: 700, color: "#8E8E93", background: "transparent", border: "1px solid #2C2C2E", borderRadius: 999, padding: "2px 8px", cursor: "pointer" }}>+ track</button>
                          )}
                        </span>
                      </div>
                    );
                  })}
                </div>
              </div>
            ))}
            <button onClick={() => { setShowLibrary(false); setShowAddExercise(true); }} style={{ marginTop: 4, width: "100%", background: "#2C2C2E", color: "#FFFFFF", border: "none", borderRadius: 12, padding: "10px 14px", fontWeight: 700, fontSize: 12.5, cursor: "pointer" }}>+ Add an exercise not listed here</button>
          </div>
        </div>
      )}

      {showPrPicker && (
        <div style={{ position: "fixed", inset: 0, background: "rgba(8,9,11,0.72)", backdropFilter: "blur(6px)", display: "flex", alignItems: "center", justifyContent: "center", padding: 20, zIndex: 50 }} onClick={() => setShowPrPicker(false)}>
          <div style={{ background: "#1C1C1E", border: "1px solid #2C2C2E", borderRadius: 20, boxShadow: "none", padding: 20, maxWidth: 420, width: "100%", maxHeight: "80vh", overflowY: "auto" }} onClick={(e) => e.stopPropagation()}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6 }}>
              <span style={{ fontWeight: 700, fontSize: 15, color: "#FFFFFF" }}>Choose PR exercises</span>
              <X size={18} style={{ cursor: "pointer", color: "#8E8E93" }} onClick={() => setShowPrPicker(false)} />
            </div>
            <div style={{ fontSize: 11.5, color: "#636366", marginBottom: 14, lineHeight: 1.5 }}>
              Pick which exercises show up in the PR card. Doesn't affect the charts above.
            </div>
            <div style={{ display: "flex", gap: 8, marginBottom: 12 }}>
              <button onClick={() => persistPrSelection(null)} className="mono" style={{ fontSize: 11, fontWeight: 700, color: "#8E8E93", background: "transparent", border: "1px solid #2C2C2E", borderRadius: 999, padding: "4px 10px", cursor: "pointer" }}>Select all</button>
              <button onClick={() => persistPrSelection([])} className="mono" style={{ fontSize: 11, fontWeight: 700, color: "#8E8E93", background: "transparent", border: "1px solid #2C2C2E", borderRadius: 999, padding: "4px 10px", cursor: "pointer" }}>Clear all</button>
            </div>
            <div style={{ display: "grid", gap: 2 }}>
              {chartExercises.map((name) => {
                const checked = prSelection == null || prSelection.includes(name);
                return (
                  <label key={name} style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 12.5, padding: "6px 2px", borderBottom: "1px solid #27272A", cursor: "pointer", color: checked ? "#FFFFFF" : "#636366" }}>
                    <input type="checkbox" checked={checked} onChange={() => togglePrExercise(name)} style={{ accentColor: "#FF9F0A", width: 14, height: 14, cursor: "pointer", flexShrink: 0 }} />
                    {name}
                  </label>
                );
              })}
            </div>
            <button onClick={() => setShowPrPicker(false)} style={{ marginTop: 14, width: "100%", background: "#1C1C1E", color: "#101214", border: "none", borderRadius: 12, padding: "10px 14px", fontWeight: 700, fontSize: 12.5, cursor: "pointer" }}>Done</button>
          </div>
        </div>
      )}

      {showAddExercise && (
        <div style={{ position: "fixed", inset: 0, background: "rgba(8,9,11,0.72)", backdropFilter: "blur(6px)", display: "flex", alignItems: "center", justifyContent: "center", padding: 20, zIndex: 50 }} onClick={() => setShowAddExercise(false)}>
          <div style={{ background: "#1C1C1E", border: "1px solid #2C2C2E", borderRadius: 20, boxShadow: "none", padding: 20, maxWidth: 400, width: "100%" }} onClick={(e) => e.stopPropagation()}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
              <span style={{ fontWeight: 700, fontSize: 15, color: "#FFFFFF" }}>Add an exercise</span>
              <X size={18} style={{ cursor: "pointer", color: "#8E8E93" }} onClick={() => setShowAddExercise(false)} />
            </div>
            <div style={{ fontSize: 11.5, color: "#636366", marginBottom: 14, lineHeight: 1.5 }}>
              For anything not in the built-in reference library. It's added to the entry form immediately and remembered for future paste-parsing.
            </div>
            <div style={{ display: "grid", gap: 10 }}>
              <div>
                <div style={{ fontSize: 11, color: "#8E8E93", marginBottom: 4 }}>Name</div>
                <input type="text" placeholder="e.g. Archer Pull-Ups" value={addExDraft.name} onChange={(e) => setAddExDraft({ ...addExDraft, name: e.target.value })} style={{ width: "100%", background: "#000000", border: "1px solid #2C2C2E", borderRadius: 12, padding: "8px 10px", color: "#F2F2F7", fontSize: 13, boxSizing: "border-box" }} />
              </div>
              <div style={{ display: "flex", gap: 10 }}>
                <div style={{ flex: 1 }}>
                  <div style={{ fontSize: 11, color: "#8E8E93", marginBottom: 4 }}>Muscle group</div>
                  <select value={addExDraft.group} onChange={(e) => setAddExDraft({ ...addExDraft, group: e.target.value })} style={{ width: "100%", background: "#000000", border: "1px solid #2C2C2E", borderRadius: 12, padding: "8px 10px", color: "#F2F2F7", fontSize: 13 }}>
                    {GROUPS.map((g) => <option key={g} value={g}>{g}</option>)}
                  </select>
                </div>
                <div style={{ width: 110 }}>
                  <div style={{ fontSize: 11, color: "#8E8E93", marginBottom: 4 }}>BW ratio</div>
                  <input type="number" step="0.05" min="0" max="1.5" value={addExDraft.ratio} onChange={(e) => setAddExDraft({ ...addExDraft, ratio: e.target.value })} className="mono" style={{ width: "100%", background: "#000000", border: "1px solid #2C2C2E", borderRadius: 12, padding: "8px 10px", color: "#F2F2F7", fontSize: 13, boxSizing: "border-box" }} />
                </div>
              </div>
              <div>
                <div style={{ fontSize: 11, color: "#8E8E93", marginBottom: 4 }}>Target muscle(s) — optional</div>
                <input type="text" placeholder="e.g. Lats, Biceps" value={addExDraft.target} onChange={(e) => setAddExDraft({ ...addExDraft, target: e.target.value })} style={{ width: "100%", background: "#000000", border: "1px solid #2C2C2E", borderRadius: 12, padding: "8px 10px", color: "#F2F2F7", fontSize: 13, boxSizing: "border-box" }} />
              </div>
              <div style={{ fontSize: 10.5, color: "#48484A" }}>Ratio = fraction of bodyweight lifted per rep. Use 0 for a pure-load exercise (barbell/machine).</div>
              <button onClick={addCustomExercise} disabled={!addExDraft.name.trim()} style={{ marginTop: 4, background: "#1C1C1E", color: "#101214", border: "none", borderRadius: 12, padding: "10px 16px", fontWeight: 700, fontSize: 13, cursor: "pointer" }}>Add exercise</button>
            </div>
          </div>
        </div>
      )}

      {showCompare && compareSessions && (
        <div style={{ position: "fixed", inset: 0, background: "rgba(8,9,11,0.72)", backdropFilter: "blur(6px)", display: "flex", alignItems: "center", justifyContent: "center", padding: 20, zIndex: 50 }} onClick={() => setShowCompare(false)}>
          <div style={{ background: "#1C1C1E", border: "1px solid #2C2C2E", borderRadius: 20, boxShadow: "none", padding: 20, maxWidth: 560, width: "100%", maxHeight: "80vh", overflowY: "auto" }} onClick={(e) => e.stopPropagation()}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
              <span style={{ fontWeight: 700, fontSize: 15, color: "#FFFFFF" }}>Session comparison</span>
              <X size={18} style={{ cursor: "pointer", color: "#8E8E93" }} onClick={() => setShowCompare(false)} />
            </div>
            <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12, color: "#636366", marginBottom: 12 }}>
              <span className="mono">{fmtDateFull(compareSessions[0].date)}</span><span className="mono">{fmtDateFull(compareSessions[1].date)}</span>
            </div>
            {compareSessions[0].bodyweight != null && compareSessions[1].bodyweight != null && (
              <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12.5, padding: "8px 0", borderBottom: "1px solid #27272A", marginBottom: 8 }}>
                <span style={{ color: "#8E8E93" }}>Bodyweight</span>
                <span className="mono" style={{ color: "#FFFFFF" }}>{compareSessions[0].bodyweight}kg → {compareSessions[1].bodyweight}kg ({(compareSessions[1].bodyweight - compareSessions[0].bodyweight >= 0 ? "+" : "") + (compareSessions[1].bodyweight - compareSessions[0].bodyweight).toFixed(1)}kg)</span>
              </div>
            )}
            <div style={{ display: "grid", gap: 10 }}>
              {Array.from(new Set([...Object.keys(compareSessions[0].ex), ...Object.keys(compareSessions[1].ex)])).filter((name) => compareSessions[0].ex[name] || compareSessions[1].ex[name]).map((name) => {
                const a = compareSessions[0], b = compareSessions[1];
                const repsA = a.ex[name] ? total(a.ex[name]) : null, repsB = b.ex[name] ? total(b.ex[name]) : null;
                const volARaw = a.ex[name] ? exerciseVolume(a, name) : null;
                const volBRaw = b.ex[name] ? exerciseVolume(b, name) : null;
                const volA = volARaw != null ? Math.round(volARaw) : null;
                const volB = volBRaw != null ? Math.round(volBRaw) : null;
                return (
                  <div key={name} style={{ padding: "10px 0", borderBottom: "1px solid #27272A" }}>
                    <div style={{ fontSize: 12.5, fontWeight: 700, color: colorsMap[name] || "#D1D1D6", marginBottom: 6 }}>{name}</div>
                    <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12, color: "#D1D1D6", marginBottom: 3 }}>
                      <span>{a.ex[name] ? a.ex[name].join("-") : "—"}</span>
                      <span className="mono">{repsA != null && repsB != null ? ((repsB - repsA >= 0 ? "+" : "") + (repsB - repsA) + " reps") : ""}</span>
                      <span>{b.ex[name] ? b.ex[name].join("-") : "—"}</span>
                    </div>
                    {volA != null && volB != null && (<div style={{ fontSize: 11, color: "#636366", textAlign: "right" }}>{volA}kg → {volB}kg ({(volB - volA >= 0 ? "+" : "") + (volB - volA)}kg)</div>)}
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<TrainingLog />);


</script>

(function () {
  var source = document.getElementById("app-source").textContent;
  var result = Babel.transform(source, {
    presets: [["react", { runtime: "classic" }]],
    filename: "app.jsx",
  }).code;
  try {
    (0, eval)(result);
  } catch (err) {
    document.getElementById("root").innerHTML =
      '<div style="color:#FF453A;background:#101214;min-height:100vh;padding:24px;font-family:monospace;white-space:pre-wrap;">Failed to start the app:\n' +
      (err && err.stack ? err.stack : err) + '</div>';
    console.error(err);

</script>
