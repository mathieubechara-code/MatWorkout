                </select>
              </div>
              <div>
                <div style={{ fontSize: 10, color: "#8a8f98", textTransform: "uppercase", letterSpacing: "0.06em", marginBottom: 4 }}>Baseline</div>

                  value={radarBaselineId}
                  onChange={(e) => setRadarBaselineId(e.target.value)}
                  className="mono"
                  style={{ background: "#0c0d10", border: "1px solid #2a2e33", borderRadius: 8, padding: "6px 9px", color: "#c9cdd3", fontSize: 11.5, cursor: "pointer" }}
                >
                  <option value="avg6">Last 6 avg</option>
                  {[...chronSessions].reverse().filter((s) => !radarCurrentSession || s.id !== radarCurrentSession.id).map((s) => (
                    <option key={s.id} value={s.id}>{fmtDate(s.date)}</option>
                  ))}
                </select>
              </div>
            </div>

            <div style={{ display: "flex", gap: 4, flexWrap: "wrap", marginBottom: 14 }}>

                  <button
                    key={m.key}
                    onClick={() => setRadarMetricKeys((prev) => {
                      const next = new Set(prev);
                      if (next.has(m.key)) next.delete(m.key); else next.add(m.key);
                      return next;
                    })}
                    className="pill"
                    style={{
                      cursor: "pointer", background: selected ? m.color : `${m.color}1a`,
                      border: `1.5px solid ${selected ? m.color : m.color + "55"}`,
                      color: selected ? "#0c0d10" : m.color, borderRadius: 12, padding: "5px 10px", fontSize: 11, fontWeight: 700,
                    }}
                  >{m.label}</button>
                );
              })}
            </div>

            {chronSessions.length === 0 ? (
              <div style={{ padding: "26px 10px", textAlign: "center", color: "#5a5f66", fontSize: 12.5 }}>No sessions match the current filters.</div>
            ) : radarData.length < 3 ? (
              <div style={{ padding: "26px 10px", textAlign: "center", color: "#5a5f66", fontSize: 12.5, lineHeight: 1.5 }}>Pick at least 3 metrics above to draw the radar.</div>
            ) : (
              <>
                <ResponsiveContainer width="100%" height={320}>
                  <RadarChart data={radarData} outerRadius="72%">
                    <PolarGrid stroke="#2a2e33" />
                    <PolarAngleAxis dataKey="metric" tick={{ fill: "#9a9fa6", fontSize: 11 }} />
                    <PolarRadiusAxis tick={false} axisLine={false} domain={[-2.4, 2.4]} />
                    <Tooltip
                      contentStyle={{ background: "#0c0d10", border: "1px solid #2a2e33", borderRadius: 12, fontSize: 12 }}
                      formatter={(v, name, props) => {
                        const raw = name === "Baseline" ? props.payload.baselineRaw : props.payload.currentRaw;
                        return [raw != null ? props.payload.fmt(raw) : "—", name];
                      }}
                    />
                    <Legend wrapperStyle={{ fontSize: 11 }} />
                    <Radar name="Baseline" dataKey="baseline" stroke="#6b7078" fill="#6b7078" fillOpacity={0.18} connectNulls />
                    <Radar name="Current" dataKey="current" stroke="#F2994A" fill="#F2994A" fillOpacity={0.32} connectNulls />
                  </RadarChart>
                </ResponsiveContainer>
                <div style={{ fontSize: 10, color: "#5a5f66", marginTop: 6 }}>
                  Each axis is normalized to standard deviations from that metric's own mean across the filtered sessions above, flipped where lower is better (Pace, SWOLF, Energy/100m), so farther out always reads as "better" — real values are in the tooltip.
                  {radarData.some((d) => d.currentRaw == null || d.baselineRaw == null) && " Some axes are missing data for the current filters and are shown centered."}
                </div>
              </>
            )}
          </div>
            </>
          )}

          {/* Session detail — the length-by-length drill-down. Always visible, outside the tab
              switcher above (item 2) — this is where CSS-test flagging happens, so it needs to
              stay reachable regardless of which of the three tabs is selected. History & Log
              has a lighter summary list of the same sessions. */}
          <div style={cardStyle}>
            <div style={{ ...labelStyle, marginBottom: 2 }}>Session detail</div>
            <div style={{ fontSize: 11, color: "#6b7078", marginBottom: 12 }}>Full length-by-length breakdown, glitch flags, and CSS annotations — for a quick summary list instead, see History &amp; Log.</div>
            <div style={{ display: "grid", gap: 8 }}>
              {sortedSessions.map((s) => {
                const isOpen = expandedId === s.id;
                return (
                  <div key={s.id} style={{ border: "1px solid #22262b", borderRadius: 16, overflow: "hidden" }}>
                    <div onClick={() => setExpandedId(isOpen ? null : s.id)} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "12px 14px", cursor: "pointer", background: "#0c0d10", flexWrap: "wrap", gap: 8 }}>
                      <div style={{ display: "flex", alignItems: "center", gap: 10, minWidth: 0 }}>
                        <ChevronDown size={14} style={{ color: "#6b7078", flexShrink: 0, transform: isOpen ? "rotate(180deg)" : "none", transition: "transform 0.15s" }} />
                        <div>
                          <div style={{ fontSize: 13, fontWeight: 700, color: "#F5F3EE", display: "flex", alignItems: "center", gap: 6 }}>
                            {fmtDateFull(s.date)}
                            <span className="mono" style={{ fontSize: 9.5, color: s.isCssTest ? "#2EC4B6" : "#56CCF2", border: `1px solid ${s.isCssTest ? "#2EC4B6" : "#56CCF2"}55`, borderRadius: 5, padding: "1px 5px" }}>{categoryLabelOf(s)}</span>
                            {s.qualityNote && <AlertTriangle size={12} style={{ color: "#F2994A" }} title={s.qualityNote} />}
                          </div>
                          <div className="mono" style={{ fontSize: 11, color: "#6b7078" }}>{s.fileName}</div>
                        </div>
                      </div>
                      <div style={{ display: "flex", gap: 16, fontSize: 12 }}>
                        <div style={{ textAlign: "right" }}><div className="mono" style={{ color: "#F5F3EE", fontWeight: 700 }}>{s.distance != null ? `${s.distance}m` : "—"}</div><div style={{ color: "#6b7078", fontSize: 10 }}>distance</div></div>
                        <div style={{ textAlign: "right" }}><div className="mono" style={{ color: "#F5F3EE", fontWeight: 700 }}>{fmtMinSec(s.swimTimeSec)}</div><div style={{ color: "#6b7078", fontSize: 10 }}>swim time</div></div>
                        <div style={{ textAlign: "right" }}><div className="mono" style={{ color: "#F5F3EE", fontWeight: 700 }}>{s.calories != null ? s.calories : "—"}</div><div style={{ color: "#6b7078", fontSize: 10 }}>kcal</div></div>
                      </div>
                    </div>
                    {isOpen && (
                      <div style={{ padding: "12px 14px", borderTop: "1px solid #1d2024" }}>
                        {s.qualityNote && (
                          <div style={{ fontSize: 11.5, color: "#F2994A", background: "#F2994A14", border: "1px solid #F2994A33", borderRadius: 12, padding: "8px 10px", marginBottom: 10 }}>{s.qualityNote}</div>
                        )}
                        <div style={{ display: "grid", gridTemplateColumns: isMobile ? "1fr 1fr" : "repeat(4, 1fr)", gap: 10, marginBottom: 8, fontSize: 12 }}>
                          <div>
                            <div style={{ color: "#6b7078", fontSize: 10, display: "flex", alignItems: "center", gap: 4 }}>
                              Distance
                              <Pencil size={10} style={{ cursor: "pointer", color: "#5a5f66" }} onClick={(e) => { e.stopPropagation(); setEditingDistanceFor(s.id); setDistanceDraft(String(s.distance != null ? s.distance : "")); }} />
                            </div>
                            <div className="mono" style={{ color: "#c9cdd3" }}>{s.distance != null ? `${s.distance}m` : "—"}</div>
                            {s.distanceCorrection && <div style={{ fontSize: 9.5, color: "#5a5f66" }}>was {s.distanceCorrection.originalDistance}m (FIT-derived)</div>}
                          </div>
                          <div><div style={{ color: "#6b7078", fontSize: 10 }}>Pool length</div><div className="mono" style={{ color: "#c9cdd3" }}>{s.poolLength != null ? `${s.poolLength}m` : "—"}</div></div>
                          <div><div style={{ color: "#6b7078", fontSize: 10 }}>Avg pace</div><div className="mono" style={{ color: "#c9cdd3" }}>{fmtPace100(s.pace100Overall)}</div></div>
                          <div><div style={{ color: "#6b7078", fontSize: 10 }}>Avg HR</div><div className="mono" style={{ color: "#c9cdd3" }}>{s.avgHR != null ? `${s.avgHR} bpm` : "—"}</div></div>
                          <div><div style={{ color: "#6b7078", fontSize: 10 }}>Rest time</div><div className="mono" style={{ color: "#c9cdd3" }}>{fmtMinSec(s.restTimeSec)}</div></div>
                        </div>
                        {editingDistanceFor === s.id && (
                          <div style={{ display: "flex", alignItems: "center", gap: 6, flexWrap: "wrap", background: "#0c0d10", border: "1px solid #2a2e33", borderRadius: 10, padding: "8px 10px", marginBottom: 12 }} onClick={(e) => e.stopPropagation()}>
                            <span style={{ fontSize: 11, color: "#8a8f98" }}>Correct distance to</span>
                            <input type="number" step="0.01" value={distanceDraft} onChange={(e) => setDistanceDraft(e.target.value)} className="mono" style={{ width: 90, background: "#15171b", border: "1px solid #2a2e33", borderRadius: 6, padding: "4px 8px", color: "#E8E6E1", fontSize: 12 }} autoFocus />
                            <span style={{ fontSize: 11, color: "#8a8f98" }}>m</span>
                            <button onClick={() => correctDistance(s.id)} style={{ cursor: "pointer", background: "#56CCF2", color: "#0c0d10", border: "none", borderRadius: 6, padding: "5px 10px", fontWeight: 700, fontSize: 11 }}>Save</button>
                            <button onClick={() => setEditingDistanceFor(null)} style={{ cursor: "pointer", background: "transparent", color: "#9a9fa6", border: "1px solid #2a2e33", borderRadius: 6, padding: "5px 10px", fontWeight: 600, fontSize: 11 }}>Cancel</button>
                            {s.distanceCorrection && <button onClick={() => { resetDistanceCorrection(s.id); setEditingDistanceFor(null); }} style={{ cursor: "pointer", background: "transparent", color: "#E63946", border: "1px solid #E6394655", borderRadius: 6, padding: "5px 10px", fontWeight: 600, fontSize: 11 }}>Reset to FIT value</button>}
                            <div style={{ fontSize: 10, color: "#5a5f66", width: "100%" }}>Pace, PRs, and all charts recalculate from the corrected distance — swim time stays as recorded.</div>
                          </div>
                        )}

                        {/* Activity analysis: pace over the full session, filterable by swim
                            type, with HR overlaid where it's genuinely meaningful (in-session
                            effort context) — real per-length data, not aggregated trends.
                            X-axis is cumulative elapsed time (not distance), so rest breaks
                            and other-stroke segments actually take up real width instead of
                            being invisible gaps between adjacent points. */}
                        {(() => {
                          const sessionStrokes = Object.keys(s.strokeStats || {});
                          // Effective view: original data with the person's corrections applied,
                          // excluded lengths dropped entirely — matches computeSwimSessionMetrics
                          // exactly, so this chart's timeline never disagrees with the numbers above it.
                          const effLengths = s.lengths.filter((l) => !l.userExcluded).map(effectiveLength);
                          const activeLengths = effLengths.filter((l) => l.lengthType === "active");
                          if (activeLengths.length < 2) return null;
                          const currentFilter = activityStrokeFilter[s.id] || "all";

                          // Walk every (non-excluded) length in original order (active + idle)
                          // building [start,end] time windows, so rest and off-filter segments
                          // have a real position/width on the chart instead of just vanishing.
                          let cumTime = 0;
                          const segments = effLengths.map((l) => {
                            const start = cumTime;
                            cumTime += l.elapsedSec;
                            return { ...l, start, end: cumTime };
                          });

                          const restBands = segments.filter((l) => l.lengthType === "idle" && l.end > l.start);
                          const otherStrokeBands = currentFilter === "all"
                            ? []
                            : segments.filter((l) => l.lengthType === "active" && l.stroke !== currentFilter && l.end > l.start);

                          const chartData = segments
                            .filter((l) => l.lengthType === "active")
                            .map((l) => ({
                              x: l.end,
                              pace100: (currentFilter === "all" || l.stroke === currentFilter) ? l.pace100 : null,
                              avgHR: l.avgHR,
                            }));
                          const hasAnyHR = chartData.some((d) => d.avgHR != null);

                          return (
                            <div style={{ marginBottom: 12 }}>
                              <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 8, marginBottom: 6 }}>
                                <div style={{ fontSize: 11, color: "#8a8f98", textTransform: "uppercase", letterSpacing: "0.04em" }}>Pace over this session</div>
                                {sessionStrokes.length > 1 && (
                                  <div style={{ display: "flex", gap: 4, flexWrap: "wrap" }}>
                                    {["all", ...sessionStrokes].map((st) => (
                                      <button key={st} onClick={(e) => { e.stopPropagation(); setActivityStrokeFilter((prev) => ({ ...prev, [s.id]: st })); }} className="pill" style={{
                                        cursor: "pointer", background: currentFilter === st ? "#22262b" : "transparent",
                                        border: "1px solid " + (currentFilter === st ? "#3a3f45" : "#22262b"), color: currentFilter === st ? "#F5F3EE" : "#8a8f98",
                                        borderRadius: 7, padding: "3px 8px", fontSize: 10.5, fontWeight: 600,
                                      }}>{st === "all" ? "All" : SWIM_STROKE_LABELS[st]}</button>
                                    ))}
                                  </div>
                                )}
                              </div>
                              {(restBands.length > 0 || otherStrokeBands.length > 0) && (
                                <div style={{ display: "flex", gap: 12, fontSize: 10, color: "#8a8f98", marginBottom: 6 }}>
                                  {restBands.length > 0 && <span style={{ display: "flex", alignItems: "center", gap: 4 }}><span style={{ width: 9, height: 9, borderRadius: 2, background: "#3a3f4599", display: "inline-block" }} /> rest</span>}
                                  {otherStrokeBands.length > 0 && <span style={{ display: "flex", alignItems: "center", gap: 4 }}><span style={{ width: 9, height: 9, borderRadius: 2, background: "#F2C94C33", display: "inline-block" }} /> other stroke</span>}
                                </div>
                              )}
                              <ResponsiveContainer width="100%" height={160}>
                                <LineChart data={chartData} margin={{ top: 4, right: 8, left: 0, bottom: 0 }}>
                                  <CartesianGrid strokeDasharray="3 3" stroke="#22262b" />
                                  <XAxis dataKey="x" type="number" domain={[0, cumTime]} tick={{ fill: "#6b7078", fontSize: 10 }} tickFormatter={(v) => fmtMinSec(v)} />
                                  <YAxis yAxisId="pace" tick={{ fill: "#6b7078", fontSize: 10 }} tickFormatter={(v) => fmtMinSec(v)} reversed domain={["dataMin - 5", "dataMax + 5"]} />
                                  {hasAnyHR && <YAxis yAxisId="hr" orientation="right" tick={{ fill: "#6b7078", fontSize: 10 }} domain={["dataMin - 5", "dataMax + 5"]} />}
                                  <Tooltip contentStyle={{ background: "#0c0d10", border: "1px solid #2a2e33", borderRadius: 12, fontSize: 12 }} formatter={(v, name) => (name === "Avg HR" ? [v != null ? `${Math.round(v)} bpm` : "—", name] : [fmtPace100(v), name])} labelFormatter={(v) => `${fmtMinSec(v)} elapsed`} />
                                  {restBands.map((b, i) => (<ReferenceArea key={`rest-${i}`} yAxisId="pace" x1={b.start} x2={b.end} fill="#3a3f45" fillOpacity={0.4} strokeWidth={0} />))}
                                  {otherStrokeBands.map((b, i) => (<ReferenceArea key={`other-${i}`} yAxisId="pace" x1={b.start} x2={b.end} fill={SWIM_STROKE_COLORS[b.stroke] || "#F2C94C"} fillOpacity={0.14} strokeWidth={0} />))}
                                  <Line yAxisId="pace" type="monotone" dataKey="pace100" name="Pace" stroke="#56CCF2" strokeWidth={2} dot={{ r: 2.5 }} connectNulls={false} />
                                  {hasAnyHR && <Line yAxisId="hr" type="monotone" dataKey="avgHR" name="Avg HR" stroke="#E63946" strokeWidth={1.5} strokeDasharray="4 3" dot={{ r: 2 }} connectNulls />}
                                </LineChart>
                              </ResponsiveContainer>
                              {!hasAnyHR && <div style={{ fontSize: 10, color: "#5a5f66", marginTop: 4 }}>No HR recorded in this activity.</div>}
                            </div>
                          );
                        })()}

                        {s.reps && s.reps.length > 0 && (
                          <div style={{ marginBottom: 12 }}>
                            <div
                              onClick={(e) => { e.stopPropagation(); setOpenRepsFor((o) => ({ ...o, [s.id]: !o[s.id] })); }}
                              style={{ display: "flex", alignItems: "center", gap: 5, cursor: "pointer", fontSize: 11, color: "#8a8f98", marginBottom: 6, textTransform: "uppercase", letterSpacing: "0.04em", userSelect: "none" }}
                            >
                              <ChevronDown size={12} style={{ transform: openRepsFor[s.id] ? "rotate(180deg)" : "none", transition: "transform 0.15s", flexShrink: 0 }} />
                              Reps / sets
                            </div>
                            {openRepsFor[s.id] && (
                              <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                                <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
                                  {s.reps.map((r, i) => {
                                    const pick = cssRepPick[s.id] || {};
                                    const isShort = pick.short === i, isLong = pick.long === i;
                                    const picked = isShort || isLong;
                                    return (
                                      <div key={i} style={{ display: "flex", alignItems: "center", gap: 3 }}>
                                        <span className="mono" style={{ fontSize: 11, padding: "3px 8px", borderRadius: 6, background: `${SWIM_STROKE_COLORS[r.stroke] || "#9a9fa6"}14`, color: SWIM_STROKE_COLORS[r.stroke] || "#9a9fa6", border: `1px solid ${picked ? "#2EC4B6" : (SWIM_STROKE_COLORS[r.stroke] || "#9a9fa6") + "33"}` }}>
                                          {r.distance}m {SWIM_STROKE_LABELS[r.stroke] || r.stroke} · {fmtMinSec(r.timeSec)}{r.pace100 != null ? ` (${fmtPace100(r.pace100)})` : ""}
                                        </span>
                                        <button onClick={(e) => { e.stopPropagation(); pickCssRep(s.id, "short", i); }} title="Use as CSS short split" style={{ cursor: "pointer", fontSize: 9.5, padding: "3px 6px", borderRadius: 5, background: isShort ? "#2EC4B6" : "transparent", color: isShort ? "#0c0d10" : "#6b7078", border: "1px solid #2EC4B655", fontWeight: 700, minHeight: 22 }}>short</button>
                                        <button onClick={(e) => { e.stopPropagation(); pickCssRep(s.id, "long", i); }} title="Use as CSS long split" style={{ cursor: "pointer", fontSize: 9.5, padding: "3px 6px", borderRadius: 5, background: isLong ? "#2EC4B6" : "transparent", color: isLong ? "#0c0d10" : "#6b7078", border: "1px solid #2EC4B655", fontWeight: 700, minHeight: 22 }}>long</button>
                                      </div>
                                    );
                                  })}
                                </div>
                                <div style={{ fontSize: 10, color: "#5a5f66" }}>Tap <b>short</b>/<b>long</b> on two reps (e.g. your 200m and 400m efforts) to compute CSS from them directly — no manual time entry needed.</div>
                                {cssRepPick[s.id] && (cssRepPick[s.id].short != null || cssRepPick[s.id].long != null) && (
                                  <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap", fontSize: 10.5, color: "#8a8f98" }}>
                                    <span>
                                      Picked: {cssRepPick[s.id].short != null ? `${s.reps[cssRepPick[s.id].short].distance}m` : "—"} + {cssRepPick[s.id].long != null ? `${s.reps[cssRepPick[s.id].long].distance}m` : "—"}
                                    </span>
                                    <button
                                      disabled={cssRepPick[s.id].short == null || cssRepPick[s.id].long == null}
                                      onClick={(e) => { e.stopPropagation(); applyCssRepPick(s.id); }}
                                      style={{ cursor: "pointer", background: "#2EC4B6", color: "#0c0d10", border: "none", borderRadius: 6, padding: "4px 9px", fontWeight: 700, fontSize: 10.5, opacity: (cssRepPick[s.id].short == null || cssRepPick[s.id].long == null) ? 0.4 : 1 }}
                                    >Save as CSS test</button>
                                    <button onClick={(e) => { e.stopPropagation(); clearCssPick(s.id); }} style={{ cursor: "pointer", background: "transparent", border: "1px solid #2a2e33", color: "#9a9fa6", borderRadius: 6, padding: "4px 9px", fontWeight: 600, fontSize: 10.5 }}>Clear pick</button>
                                  </div>
                                )}
                                {s.isCssTest && (
                                  <button onClick={(e) => { e.stopPropagation(); unmarkCssTest(s.id); }} style={{ cursor: "pointer", alignSelf: "flex-start", background: "transparent", border: "1px solid #E6394655", color: "#E63946", borderRadius: 6, padding: "4px 9px", fontWeight: 600, fontSize: 10.5 }}>Unmark as CSS test</button>
                                )}
                              </div>
                            )}
                          </div>
                        )}

                        <div style={{ marginBottom: 12 }}>
                          <div
                            onClick={(e) => { e.stopPropagation(); setOpenLengthsFor((o) => ({ ...o, [s.id]: !o[s.id] })); }}
                            style={{ display: "flex", alignItems: "center", gap: 5, cursor: "pointer", fontSize: 11, color: "#8a8f98", marginBottom: 6, textTransform: "uppercase", letterSpacing: "0.04em", userSelect: "none" }}
                          >
                            <ChevronDown size={12} style={{ transform: openLengthsFor[s.id] ? "rotate(180deg)" : "none", transition: "transform 0.15s", flexShrink: 0 }} />
                            Length by length
                          </div>
                          {openLengthsFor[s.id] && (
                            <>
                              <div style={{ fontSize: 10, color: "var(--text-faint, #5a5f66)", marginBottom: 8, lineHeight: 1.5 }}>
                                You're in control here: nothing is ever removed or changed automatically. ⚠ marks a length the app thinks looks off (kept in your totals either way) — tap <b>Exclude</b> if it's wrong, <b>Include</b> to undo. Tap a stroke to relabel it, or flip a row between Active/Idle.
                              </div>
                              <div style={{ overflowX: "auto" }}>
                                <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 11.5 }}>
                                  <thead>
                                    <tr style={{ borderBottom: "1px solid var(--border, #22262b)" }}>
                                      <th style={{ textAlign: "left", padding: "6px 8px", color: "var(--text-dimmer, #6b7078)", fontWeight: 600 }}>#</th>
                                      <th style={{ textAlign: "left", padding: "6px 8px", color: "var(--text-dimmer, #6b7078)", fontWeight: 600 }}>Type</th>
                                      <th style={{ textAlign: "left", padding: "6px 8px", color: "var(--text-dimmer, #6b7078)", fontWeight: 600 }}>Stroke</th>
                                      <th style={{ textAlign: "right", padding: "6px 8px", color: "var(--text-dimmer, #6b7078)", fontWeight: 600 }}>Time</th>
                                      <th style={{ textAlign: "right", padding: "6px 8px", color: "var(--text-dimmer, #6b7078)", fontWeight: 600 }}>Strokes</th>
                                      <th style={{ textAlign: "right", padding: "6px 8px", color: "var(--text-dimmer, #6b7078)", fontWeight: 600 }}>Cadence</th>
                                      <th style={{ textAlign: "right", padding: "6px 8px", color: "var(--text-dimmer, #6b7078)", fontWeight: 600 }}>SWOLF</th>
                                      <th style={{ textAlign: "right", padding: "6px 8px", color: "var(--text-dimmer, #6b7078)", fontWeight: 600, position: "sticky", right: 0, background: "var(--card, #0c0d10)" }}>Status</th>
                                    </tr>
                                  </thead>
                                  <tbody>
                                    {s.lengths.map((l) => {
                                      const eff = effectiveLength(l);
                                      const excluded = !!l.userExcluded;
                                      const rowStyle = {
                                        background: excluded ? "transparent" : (l.glitch ? "#F2994A14" : "transparent"),
                                        opacity: excluded ? 0.45 : 1,
                                        borderTop: "1px solid var(--border, #1d2024)",
                                      };
                                      // Strike-through communicates "excluded" on the data cells only — it must
                                      // never land on the actions column, or the "Include" button label itself
                                      // reads as struck through.
                                      const dataCellStyle = { textDecoration: excluded ? "line-through" : "none" };
                                      const showActivePicker = idleToActiveFor && idleToActiveFor.sessionId === s.id && idleToActiveFor.lengthIndex === l.index;
                                      return (
                                        <React.Fragment key={l.index}>
                                        <tr style={rowStyle}>
                                          <td className="mono" style={{ padding: "5px 8px", color: "var(--text-dimmer, #6b7078)", ...dataCellStyle }}>{l.index + 1}</td>
                                          <td style={{ padding: "5px 8px", color: eff.lengthType === "idle" ? "var(--text-dimmer, #6b7078)" : "var(--text-dim, #c9cdd3)", ...dataCellStyle }}>
                                            {eff.lengthType}{l.glitch && !excluded ? " ⚠" : ""}{eff.isOverridden ? " ✎" : ""}
                                          </td>
                                          <td style={{ padding: "5px 8px", ...dataCellStyle }}>
                                            {eff.lengthType === "active" ? (
                                              <select
                                                value={EDITABLE_SWIM_STROKES.includes(eff.stroke) ? eff.stroke : "__other__"}
                                                onChange={(e) => updateLengthStroke(s.id, l.index, e.target.value)}
                                                onClick={(e) => e.stopPropagation()}
                                                disabled={excluded}
                                                className="mono"
                                                style={{ background: "var(--bg, #0c0d10)", border: "1px solid var(--border-2, #2a2e33)", borderRadius: 6, padding: "4px 6px", fontSize: 16, color: SWIM_STROKE_COLORS[eff.stroke] || "var(--text-dim, #c9cdd3)", cursor: excluded ? "default" : "pointer", minHeight: 28, maxWidth: 118 }}
                                              >
                                                {!EDITABLE_SWIM_STROKES.includes(eff.stroke) && (
                                                  <option value="__other__" disabled>{SWIM_STROKE_LABELS[eff.stroke] || eff.stroke}</option>
                                                )}
                                                {EDITABLE_SWIM_STROKES.map((opt) => (
                                                  <option key={opt} value={opt}>{SWIM_STROKE_LABELS[opt]}</option>
                                                ))}
                                              </select>
                                            ) : "—"}
                                          </td>
                                          <td className="mono" style={{ padding: "5px 8px", textAlign: "right", color: "var(--text-dim, #c9cdd3)", ...dataCellStyle }}>{l.elapsedSec.toFixed(1)}s</td>
                                          <td className="mono" style={{ padding: "5px 8px", textAlign: "right", color: "var(--text-dim, #c9cdd3)", ...dataCellStyle }}>{eff.lengthType === "active" ? l.totalStrokes : "—"}</td>
                                          <td className="mono" style={{ padding: "5px 8px", textAlign: "right", color: "var(--text-dim, #c9cdd3)", ...dataCellStyle }}>{eff.lengthType === "active" ? l.avgCadence : "—"}</td>
                                          <td className="mono" style={{ padding: "5px 8px", textAlign: "right", color: "var(--text-dim, #c9cdd3)", ...dataCellStyle }}>{eff.lengthType === "active" ? l.swolf : "—"}</td>
                                          <td style={{ padding: "5px 4px", textAlign: "right", position: "sticky", right: 0, background: l.glitch && !excluded ? "#1a1712" : "var(--card, #0c0d10)" }} onClick={(e) => e.stopPropagation()}>
                                            <div style={{ display: "flex", gap: 4, justifyContent: "flex-end", flexWrap: "wrap" }}>
                                              {eff.isOverridden && !excluded && (
                                                <button onClick={() => resetLengthOverrides(s.id, l.index)} title="Revert to original" style={lenBtnStyle("neutral")}>Revert</button>
                                              )}
                                              {!excluded && eff.lengthType === "active" && (
                                                <button onClick={() => markLengthIdle(s.id, l.index)} style={lenBtnStyle("neutral")}>Mark idle</button>
                                              )}
                                              {!excluded && eff.lengthType === "idle" && (
                                                <button onClick={() => setIdleToActiveFor({ sessionId: s.id, lengthIndex: l.index })} style={lenBtnStyle("neutral")}>Mark active</button>
                                              )}
                                              <button onClick={() => toggleExcludeLength(s.id, l.index)} style={lenBtnStyle(excluded ? "positive" : "negative")}>
                                                {excluded ? "Include" : "Exclude"}
                                              </button>
                                            </div>
                                          </td>
                                        </tr>
                                        {showActivePicker && (
                                          <tr>
                                            <td colSpan={8} style={{ padding: "10px 8px", background: "var(--card-2, #191c21)", borderTop: "1px solid var(--border-2, #2b2e36)" }} onClick={(e) => e.stopPropagation()}>
                                              <div style={{ fontSize: 11, color: "var(--text-dim, #9a9fa6)", marginBottom: 8 }}>Length {l.index + 1}: pick a swim type to mark it Active</div>
                                              <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                                                {EDITABLE_SWIM_STROKES.map((opt) => (
                                                  <button
                                                    key={opt}
                                                    onClick={() => { markLengthActive(s.id, l.index, opt); setIdleToActiveFor(null); }}
                                                    style={{ cursor: "pointer", background: `${SWIM_STROKE_COLORS[opt]}1f`, color: SWIM_STROKE_COLORS[opt], border: `1px solid ${SWIM_STROKE_COLORS[opt]}55`, borderRadius: 8, padding: "8px 12px", fontWeight: 700, fontSize: 12, minHeight: 36 }}
                                                  >
                                                    {SWIM_STROKE_LABELS[opt]}
                                                  </button>
                                                ))}
                                                <button onClick={() => setIdleToActiveFor(null)} style={{ cursor: "pointer", background: "transparent", color: "var(--text-dim, #9a9fa6)", border: "1px solid var(--border-2, #2a2e33)", borderRadius: 8, padding: "8px 12px", fontWeight: 600, fontSize: 12, minHeight: 36 }}>Cancel</button>
                                              </div>
                                            </td>
                                          </tr>
                                        )}
                                        </React.Fragment>
                                      );
                                    })}
                                  </tbody>
                                </table>
                              </div>
                              {s.lengths.some((l) => l.glitch && !l.userExcluded) && (
                                <div style={{ fontSize: 10.5, color: "var(--text-dimmer, #6b7078)", marginTop: 6 }}>⚠ rows may be sensor glitches (phantom lengths / implausible cadence) — they're still counted in your totals above. Review and Exclude any that are wrong.</div>
                              )}
                            </>
                          )}
                        </div>

                        <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center" }}>
                          {s.isCssTest && s.cssTest && (
                            <span className="mono" style={{ fontSize: 11.5, color: "#2EC4B6" }}>CSS pace: {fmtPace100(s.cssTest.pace100)} ({s.cssTest.cssSpeed.toFixed(2)} m/s)</span>
                          )}
                          <button onClick={() => deleteSession(s.id)} style={{ marginLeft: "auto", cursor: "pointer", background: "transparent", border: "1px solid #E6394655", color: "#E63946", borderRadius: 12, padding: "7px 12px", fontWeight: 600, fontSize: 11.5, display: "flex", alignItems: "center", gap: 5 }}><Trash2 size={12} /> Delete</button>
                        </div>
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          </div>
        </>
      )}
    </div>
  );
}

function TrainingLog() {
  const [sessions, setSessions] = useState(null);
  const [tab, setTab] = useState("dashboard");
  const [filter, setFilter] = useState("All");
  const [metric, setMetric] = useState("reps");
  const [range, setRange] = useState("all");
  const [timeView, setTimeView] = useState("day"); // "day" (per session) or "week" (aggregated)
  const [showForm, setShowForm] = useState(false);
  const [editingId, setEditingId] = useState(null);
  const [saving, setSaving] = useState(false);
  const [confirmDelete, setConfirmDelete] = useState(null);
  const [confirmDeleteAllScope, setConfirmDeleteAllScope] = useState(null); // null | "workout" | "swim" | "all"
  const [trackedExercises, setTrackedExercises] = useState([]);
  const [customExercises, setCustomExercises] = useState([]);
  const [ownerName, setOwnerName] = useState("");
  const [editingName, setEditingName] = useState(false);
  const [nameDraft, setNameDraft] = useState("");
  const [showAddExercise, setShowAddExercise] = useState(false);
  const [addExDraft, setAddExDraft] = useState({ name: "", group: "Pull", ratio: "1.0", target: "" });
  const [draft, setDraft] = useState(() => emptyDraft([]));
  const [pasteText, setPasteText] = useState("");
  const [parseNote, setParseNote] = useState("");
  const [unmatchedNames, setUnmatchedNames] = useState([]);
  const [selectedCompare, setSelectedCompare] = useState([]);
  const [showCompare, setShowCompare] = useState(false);
  const [importMsg, setImportMsg] = useState("");
  const [isMobile, setIsMobile] = useState(typeof window !== "undefined" ? window.innerWidth < 560 : false);
  const [targetSettings, setTargetSettings] = useState(null); // { startDate, weeks } — null until loaded, then falls back to defaults
  const [editingTarget, setEditingTarget] = useState(false);
  const [targetDraft, setTargetDraft] = useState({ startDate: "", weeks: "12" });
  const [selectedHeatDate, setSelectedHeatDate] = useState(null);
  const [chartFocus, setChartFocus] = useState(null);
  const [showLibrary, setShowLibrary] = useState(false);
  // Which exercises show up in the PR card. null = show all (default); array = only these.
  const [prSelection, setPrSelection] = useState(null);
  const [showPrPicker, setShowPrPicker] = useState(false);
  // Fluid heatmap: the square size is computed from the container's actual measured width
  // (see the effect near HEATMAP_WEEKS below) rather than a fixed pixel value, so 24 weeks
  // always fit exactly without needing horizontal scroll/swipe on narrow phone screens.
  const [heatmapCellSize, setHeatmapCellSize] = useState(14);
  const heatmapGridRef = useRef(null);
  const TARGET_KEY = "target-settings-v1";
  const TRACKED_KEY = "tracked-exercises-v1";
  const CUSTOM_LIB_KEY = "custom-exercises-v1";
  const OWNER_KEY = "owner-name-v1";
  const PR_SELECTION_KEY = "pr-selection-v1";
  const fileInputRef = useRef(null);

  // ---- History & Log: Workout / Swim toggle -------------------------------------------
  // Controls which "log new session" flow shows (paste/manual form vs. .FIT upload) and
  // what the Import button expects (JSON vs. .FIT). Logging itself lives here now; the
  // Swimming tab is dashboard-only and simply re-reads SWIM_KEY whenever it mounts.
  const [viewMode, setViewMode] = useState("workout"); // "workout" | "swim"
  const [swimSessions, setSwimSessions] = useState(null);
  const [swimUploading, setSwimUploading] = useState(false);
  const [swimUploadMsg, setSwimUploadMsg] = useState("");
  const [swimMarkCss, setSwimMarkCss] = useState(false); // "Mark as CSS test" toggle at upload time
  const [pendingCssUpload, setPendingCssUpload] = useState(null); // { drafts: [...] } awaiting confirmation
  const swimFileInputRef = useRef(null);
  const swimImportInputRef = useRef(null);
  const SWIM_KEY = "swim-sessions-v1";

  useEffect(() => {
    (async () => {
      try {
        const res = await window.storage.get(SWIM_KEY, false);
        const raw = res && res.value ? JSON.parse(res.value) : [];
        const { sessions: fixed, changed } = backfillSwimSessions(raw);
        setSwimSessions(fixed);
        if (changed) { try { await window.storage.set(SWIM_KEY, JSON.stringify(fixed), false); } catch (_) {} }
      } catch (e) {
        setSwimSessions([]);
      }
    })();
  }, []);

  const persistSwim = async (next) => {
    setSwimSessions(next);
    try { await window.storage.set(SWIM_KEY, JSON.stringify(next), false); } catch (_) {}
  };

  // Attempts to auto-fill the 200m/400m split times for a CSS test from the session's own
  // reconstructed reps (consecutive-active-length grouping, computed in processSwimFit).
  // Looks for a rep whose distance is within one pool length of 200m / 400m. Returns
  // { t200, t400, auto200, auto400 } — any value not found is left blank for manual entry.
  const autoDetectCssSplits = (swimSession) => {
    const tol = swimSession.poolLength || 25;
    const reps = swimSession.reps || [];
    const findRep = (target) => reps.find((r) => Math.abs(r.distance - target) <= tol);
    const rep200 = findRep(200);
    const rep400 = findRep(400);
    return {
      t200: rep200 ? paceSecToStr((rep200.timeSec / rep200.distance) * 100) : "",
      t400: rep400 ? paceSecToStr((rep400.timeSec / rep400.distance) * 100) : "",
      auto200: !!rep200,
      auto400: !!rep400,
    };
  };

  const finalizeSwimUpload = async (parsedSessions, markCss) => {
    if (!markCss) {
      const next = [...(swimSessions || []), ...parsedSessions].sort((a, b) => (a.date < b.date ? 1 : -1));
      await persistSwim(next);
      return true;
    }
    const drafts = parsedSessions.map((s) => ({ session: s, ...autoDetectCssSplits(s) }));
    setPendingCssUpload({ drafts });
    return false; // awaiting confirmation — not persisted yet
  };

  const handleSwimFitUpload = async (e) => {
    const files = Array.from(e.target.files || []);
    if (!files.length) return;
    setSwimUploading(true);
    setSwimUploadMsg("");
    const added = [];
    const errors = [];
    for (const file of files) {
      try {
        const buf = await file.arrayBuffer();
        const parsed = parseFitBinary(buf);
        const swimSession = processSwimFit(parsed, file.name);
        added.push(swimSession);
      } catch (err) {
        errors.push(`${file.name}: ${err.message || "failed to parse"}`);
      }
    }
    setSwimUploading(false);
    if (added.length) await finalizeSwimUpload(added, swimMarkCss);
    const parts = [];
    if (added.length && !swimMarkCss) parts.push(`Imported ${added.length} swim session${added.length > 1 ? "s" : ""}.`);
    if (added.length && swimMarkCss) parts.push(`Parsed ${added.length} swim session${added.length > 1 ? "s" : ""} — confirm CSS test times below before saving.`);
    if (errors.length) parts.push(`Failed: ${errors.join(" · ")}`);
    setSwimUploadMsg(parts.join(" "));
    if (swimFileInputRef.current) swimFileInputRef.current.value = "";
    if (swimImportInputRef.current) swimImportInputRef.current.value = "";
  };

  const updatePendingCssDraft = (idx, field, value) => {
    setPendingCssUpload((cur) => {
      if (!cur) return cur;
      const drafts = cur.drafts.map((d, i) => (i === idx ? { ...d, [field]: value } : d));
      return { drafts };
    });
  };

  const confirmPendingCssUpload = async () => {
    if (!pendingCssUpload) return;
    const finished = pendingCssUpload.drafts.map(({ session, t200, t400 }) => {
      const pace200 = paceStrToSec(t200), pace400 = paceStrToSec(t400);
      // t200/t400 are entered/displayed as min/100m pace; the CSS formula needs total
      // elapsed time for the actual 200m/400m swims, so convert back here.
      const n200 = isFinite(pace200) ? pace200 * 2 : NaN;
      const n400 = isFinite(pace400) ? pace400 * 4 : NaN;
      if (n200 > 0 && n400 > 0 && n400 > n200) {
        const cssSpeed = (400 - 200) / (n400 - n200);
        const pace100 = cssSpeed > 0 ? 100 / cssSpeed : null;
        return { ...session, isCssTest: true, cssTest: { t200: n200, t400: n400, cssSpeed, pace100 } };
      }
      return session; // left blank/invalid — saved as a normal (non-CSS-test) session
    });
    const next = [...(swimSessions || []), ...finished].sort((a, b) => (a.date < b.date ? 1 : -1));
    await persistSwim(next);
    setPendingCssUpload(null);
    setSwimUploadMsg(`Saved ${finished.length} swim session${finished.length > 1 ? "s" : ""}.`);
  };

  const cancelPendingCssUpload = () => {
    setPendingCssUpload(null);
    setSwimUploadMsg("Discarded — nothing was saved.");
  };

  useEffect(() => {
    const onResize = () => setIsMobile(window.innerWidth < 560);
    window.addEventListener("resize", onResize);
    return () => window.removeEventListener("resize", onResize);
  }, []);

  useEffect(() => {
    (async () => {
      try {
        const res = await window.storage.get(STORAGE_KEY, false);
        if (res && res.value) {
          const migrated = migrate(JSON.parse(res.value));
          setSessions(migrated);
          await window.storage.set(STORAGE_KEY, JSON.stringify(migrated), false);
        } else {
          setSessions(SEED_SESSIONS);
          await window.storage.set(STORAGE_KEY, JSON.stringify(SEED_SESSIONS), false);
        }
      } catch (e) {
        setSessions(SEED_SESSIONS);
        try { await window.storage.set(STORAGE_KEY, JSON.stringify(SEED_SESSIONS), false); } catch (_) {}
      }
    })();
  }, []);

  useEffect(() => {
    (async () => {
      try {
        const res = await window.storage.get(TARGET_KEY, false);
        setTargetSettings(res && res.value ? JSON.parse(res.value) : {});
      } catch (e) {
        setTargetSettings({});
      }
    })();
  }, []);

  // Which exercises to show in the PR card (null = all — the default).
  useEffect(() => {
    (async () => {
      try {
        const res = await window.storage.get(PR_SELECTION_KEY, false);
        setPrSelection(res && res.value ? JSON.parse(res.value) : null);
      } catch (e) {
        setPrSelection(null);
      }
    })();
  }, []);

  // Which exercises currently have a field in the entry form. Starts empty — nothing is
  // hardcoded — and grows automatically as pasted workouts are recognized, or manually via
  // "Add exercise".
  useEffect(() => {
    (async () => {
      try {
        const res = await window.storage.get(TRACKED_KEY, false);
        setTrackedExercises(res && res.value ? JSON.parse(res.value) : []);
      } catch (e) {
        setTrackedExercises([]);
      }
    })();
  }, []);

  // Custom exercises the user has defined that aren't in the built-in reference library.
  useEffect(() => {
    (async () => {
      try {
        const res = await window.storage.get(CUSTOM_LIB_KEY, false);
        setCustomExercises(res && res.value ? JSON.parse(res.value) : []);
      } catch (e) {
        setCustomExercises([]);
      }
    })();
  }, []);

  useEffect(() => {
    (async () => {
      try {
        const res = await window.storage.get(OWNER_KEY, false);
        setOwnerName(res && res.value ? res.value : "");
      } catch (e) {
        setOwnerName("");
      }
    })();
  }, []);

  const persistTracked = async (next) => {
    setTrackedExercises(next);
    try { await window.storage.set(TRACKED_KEY, JSON.stringify(next), false); } catch (_) {}
  };

  const persistPrSelection = async (next) => {
    setPrSelection(next);
    try { await window.storage.set(PR_SELECTION_KEY, JSON.stringify(next), false); } catch (_) {}
  };
  const togglePrExercise = (name) => {
    const current = prSelection == null ? [...chartExercises] : prSelection;
    const next = current.includes(name) ? current.filter((n) => n !== name) : [...current, name];
    persistPrSelection(next);
  };

  const persistCustom = async (next) => {
    setCustomExercises(next);
    try { await window.storage.set(CUSTOM_LIB_KEY, JSON.stringify(next), false); } catch (_) {}
  };

  const saveOwnerName = async () => {
    const trimmed = nameDraft.trim();
    setOwnerName(trimmed);
    setEditingName(false);
    try { await window.storage.set(OWNER_KEY, trimmed, false); } catch (_) {}
  };

  // Full matchable library = built-in reference exercises + anything the user has added
  // manually that isn't in the built-in list.
  const fullLibrary = useMemo(() => [...EXERCISE_LIBRARY, ...customExercises], [customExercises]);
  const colorsMap = useMemo(() => {
    const map = { ...COLORS };
    customExercises.forEach((e, i) => { map[e.name] = e.color || colorForIndex(EXERCISE_LIBRARY.length + i); });
    return map;
  }, [customExercises]);
  const muscleGroupMap = useMemo(() => {
    const map = { ...MUSCLE_GROUP };
    customExercises.forEach((e) => { map[e.name] = e.group; });
    return map;
  }, [customExercises]);
  const bwRatioMap = useMemo(() => {
    const map = { ...BW_RATIO };
    customExercises.forEach((e) => { map[e.name] = e.ratio; });
    return map;
  }, [customExercises]);

  // Exercises to actually draw on the charts/summary tiles/PR list. Deliberately derived
  // ONLY from what's currently present in your saved sessions — not from `trackedExercises`
  // (which just controls which fields show in the "new session" form). This way, an exercise
  // you tried once and then deleted (or fully removed the sets from) stops appearing here
  // immediately, instead of lingering forever just because it was tracked at some point.
  const chartExercises = useMemo(() => {
    const loggedNames = new Set();
    (sessions || []).forEach((s) => Object.keys(s.ex || {}).forEach((n) => { if (s.ex[n] && s.ex[n].length) loggedNames.add(n); }));
    const libOrder = fullLibrary.map((e) => e.name);
    return Array.from(loggedNames).sort((a, b) => {
      const ia = libOrder.indexOf(a), ib = libOrder.indexOf(b);
      if (ia === -1 && ib === -1) return a.localeCompare(b);
      if (ia === -1) return 1;
      if (ib === -1) return -1;
      return ia - ib;
    });
  }, [sessions, fullLibrary]);

  const doDeleteAllLogs = async () => {
    const scope = confirmDeleteAllScope;
    if (scope === "workout" || scope === "all") {
      await persist([]);
      setSelectedCompare([]);
    }
    if (scope === "swim" || scope === "all") {
      await persistSwim([]);
    }
    setConfirmDeleteAllScope(null);
  };

  const addCustomExercise = async () => {
    const name = addExDraft.name.trim();
    if (!name) return;
    const ratioNum = parseFloat(addExDraft.ratio);
    const entry = {
      name,
      group: addExDraft.group,
      ratio: Number.isFinite(ratioNum) ? ratioNum : 1.0,
      target: addExDraft.target.trim(),
      aliases: [name.toLowerCase()],
    };
    const nextCustom = [...customExercises.filter((e) => e.name !== name), entry];
    await persistCustom(nextCustom);
    if (!trackedExercises.includes(name)) await persistTracked([...trackedExercises, name]);
    setDraft((d) => ({ ...d, ex: { ...d.ex, [name]: d.ex[name] ?? "" }, load: { ...d.load, [name]: d.load[name] ?? "" } }));
    setAddExDraft({ name: "", group: "Pull", ratio: "1.0", target: "" });
    setShowAddExercise(false);
  };

  // Opens the "Add exercise" modal prefilled with a name the paste-parser couldn't match at
  // all, so fixing an unmatched entry is one click instead of retyping it.
  const openAddExerciseFor = (name) => {
    setAddExDraft({ name, group: "Pull", ratio: "1.0", target: "" });
    setShowAddExercise(true);
  };

  const trackLibraryExercise = async (name) => {
    if (!trackedExercises.includes(name)) await persistTracked([...trackedExercises, name]);
    setDraft((d) => ({ ...d, ex: { ...d.ex, [name]: d.ex[name] ?? "" }, load: { ...d.load, [name]: d.load[name] ?? "" } }));
  };

  // Removes an exercise from the tracked/entry-form list. Past logged data for it is
  // untouched (history, charts, and PRs are driven live off actual session data — see
  // `chartExercises` — so they're unaffected either way), but it stops showing up as a
  // field to log going forward, in both the entry form and the library "tracked" list.
  const untrackExercise = async (name) => {
    await persistTracked(trackedExercises.filter((n) => n !== name));
    setDraft((d) => {
      const nextEx = { ...d.ex }; const nextLoad = { ...d.load };
      delete nextEx[name]; delete nextLoad[name];
      return { ...d, ex: nextEx, load: nextLoad };
    });
  };

  const persist = async (next) => {
    setSessions(next);
    try { await window.storage.set(STORAGE_KEY, JSON.stringify(next), false); } catch (_) {}
  };

  const saveTargetSettings = async () => {
    const weeksNum = parseInt(targetDraft.weeks, 10);
    const next = {
      startDate: targetDraft.startDate || null,
      weeks: Number.isFinite(weeksNum) && weeksNum > 0 ? weeksNum : 12,
    };
    setTargetSettings(next);
    setEditingTarget(false);
    try { await window.storage.set(TARGET_KEY, JSON.stringify(next), false); } catch (_) {}
  };

  const doDelete = async (id, kind) => {
    if (kind === "swim") {
      await persistSwim((swimSessions || []).filter((s) => s.id !== id));
    } else {
      await persist(sessions.filter((s) => s.id !== id));
      setSelectedCompare((sc) => sc.filter((x) => x !== id));
    }
    setConfirmDelete(null);
  };

  const startEdit = (s) => {
    setEditingId(s.id);
    // Include every exercise the session actually has data for (even if it's since been
    // untracked) plus all currently tracked fields, so nothing gets silently dropped on save.
    const namesForEdit = Array.from(new Set([...trackedExercises, ...Object.keys(s.ex)]));
    setDraft({
      date: s.date, label: s.label, bodyweight: s.bodyweight != null ? String(s.bodyweight) : "", notes: s.notes || "",
      ex: Object.fromEntries(namesForEdit.map((e) => [e, s.ex[e] ? s.ex[e].join(",") : ""])),
      load: Object.fromEntries(namesForEdit.map((e) => [e, (s.load || {})[e] && s.load[e].length ? s.load[e].join(",") : ""])),
    });
    setShowForm(true);
  };

  const cancelForm = () => { setShowForm(false); setEditingId(null); setDraft(emptyDraft(trackedExercises)); setPasteText(""); setParseNote(""); };

  const handleParseFill = async () => {
    const { results, matchedEntries, unmatched } = parseFreeform(pasteText, fullLibrary);
    const matchedNames = Object.keys(results);
    if (!matchedNames.length && !matchedEntries.length && !unmatched.length) {
      setParseNote('Couldn\'t parse anything — check the format (e.g. "12 rep x 3 sets body weight").');
      setUnmatchedNames([]);
      return;
    }
    // Any recognized exercise — from the full library, not just your prior tracked fields —
    // is added to the tracked list automatically so it gets a real field going forward.
    const newlyTracked = matchedEntries.map((e) => e.name).filter((name) => !trackedExercises.includes(name));
    if (newlyTracked.length) await persistTracked([...trackedExercises, ...newlyTracked]);
    setDraft((d) => {
      const nextEx = { ...d.ex };
      const nextLoad = { ...d.load };
      matchedNames.forEach((name) => {
        nextEx[name] = results[name].reps.join(",");
        if (results[name].weights.some((w) => w > 0)) nextLoad[name] = results[name].weights.join(",");
      });
      matchedEntries.forEach((e) => {
        if (nextEx[e.name] === undefined) nextEx[e.name] = "";
        if (nextLoad[e.name] === undefined) nextLoad[e.name] = "";
      });
      return { ...d, ex: nextEx, load: nextLoad };
    });
    const notes = [];
    if (newlyTracked.length) notes.push(`Now tracking: ${newlyTracked.join(", ")}.`);
    if (unmatched.length) notes.push(`Couldn't match at all: ${unmatched.join(", ")} — tap "Add" below to fill in muscle group & ratio, or enter it manually.`);
    setParseNote(notes.join(" ") || "Filled in below — review before saving.");
    setUnmatchedNames(unmatched);
    setPasteText("");
  };

  const saveSession = async () => {
    if (!sessions) return;
    setSaving(true);
    const exData = {}; const loadData = {};
    Object.keys(draft.ex).forEach((name) => {
      const parsed = draft.ex[name].split(",").map((v) => parseInt(v.trim(), 10)).filter((n) => Number.isFinite(n) && n >= 0);
      if (parsed.length) exData[name] = parsed;
      // Weight is entered as a comma list aligned to the sets above (e.g. "15,15,5,5" next to
      // "12,12,10,10"). A single value ("15") still works and applies to every set — if fewer
      // weights than sets are given, the last one entered is repeated for the remaining sets.
      const weightsRaw = (draft.load[name] || "").split(",").map((v) => v.trim()).filter((v) => v !== "").map((v) => parseFloat(v)).filter((n) => Number.isFinite(n) && n >= 0);
      if (parsed.length && weightsRaw.length) {
        loadData[name] = parsed.map((_, i) => (i < weightsRaw.length ? weightsRaw[i] : weightsRaw[weightsRaw.length - 1]));
      }
    });
    const bw = parseFloat(draft.bodyweight);
    let next;
    if (editingId) {
      next = sessions.map((s) => s.id === editingId
        ? { ...s, date: draft.date, label: draft.label.trim() || "Session", bodyweight: Number.isFinite(bw) ? bw : null, load: loadData, ex: exData, notes: draft.notes.trim() }
        : s);
    } else {
      const newSession = { id: "s" + Date.now(), date: draft.date, label: draft.label.trim() || "Session", bodyweight: Number.isFinite(bw) ? bw : null, load: loadData, ex: exData, notes: draft.notes.trim() };
      next = [...sessions, newSession];
    }
    next = next.sort((a, b) => a.date.localeCompare(b.date));
    await persist(next);
    cancelForm();
    setSaving(false);
  };

  // Export reads every settings key straight from storage rather than from component state,
  // because several of them (weight target, swim target) are only loaded lazily when the
  // Dashboard tab has been visited — reading state here would silently omit them if the
  // person exports from History & Log without ever opening Dashboard first.
  const readSettingJSON = async (key) => {
    try { const res = await window.storage.get(key, false); return res && res.value ? JSON.parse(res.value) : null; } catch (_) { return null; }
  };
  const readSettingRaw = async (key) => {
    try { const res = await window.storage.get(key, false); return res && res.value ? res.value : ""; } catch (_) { return ""; }
  };

  // Swim sessions are read straight from storage here too, for the same reason as the
  // settings above: the Swimming (Dashboard) tab keeps its own copy of this data in its own
  // component state and writes length-by-length edits (stroke reclassification, exclude/include,
  // distance corrections) straight to storage — it never updates this component's `swimSessions`
  // state. Exporting from `swimSessions` directly would silently drop any edit made in the
  // Swimming tab unless the page happened to be reloaded since. Reading SWIM_KEY fresh guarantees
  // the export always reflects the latest saved edits, no matter which tab was visited last.
  const readSwimSessionsFresh = async () => {
    try {
      const res = await window.storage.get(SWIM_KEY, false);
      return res && res.value ? JSON.parse(res.value) : (swimSessions || []);
    } catch (_) { return swimSessions || []; }
  };

  const exportJSON = async () => {
    let payload, suffix;
    const workoutSettings = {
      ownerName: await readSettingRaw(OWNER_KEY),
      targetSettings: await readSettingJSON(TARGET_KEY),
      trackedExercises: await readSettingJSON(TRACKED_KEY),
      customExercises: await readSettingJSON(CUSTOM_LIB_KEY),
      prSelection: await readSettingJSON(PR_SELECTION_KEY),
      weightTargetSettings: await readSettingJSON(WEIGHT_TARGET_KEY),
    };
    const swimTargetSettings = await readSettingJSON("swim-target-settings-v1");
    const freshSwimSessions = viewMode === "workout" ? null : await readSwimSessionsFresh();
    if (viewMode === "workout") { payload = { sessions, settings: workoutSettings }; suffix = "workout"; }
    else if (viewMode === "swim") { payload = { swimSessions: freshSwimSessions, settings: { swimTargetSettings } }; suffix = "swim"; }
    else { payload = { sessions, swimSessions: freshSwimSessions, settings: { ...workoutSettings, swimTargetSettings } }; suffix = "all"; }
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `training-log-${suffix}-` + new Date().toISOString().slice(0, 10) + ".json";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  };

  const exportCSV = () => {
    const rows = [["date", "label", "bodyweight_kg", "exercise", "reps_per_set", "added_kg_per_set", "total_reps", "notes"]];
    sessions.forEach((s) => {
      Object.keys(s.ex).forEach((name) => {
        if (!s.ex[name]) return;
        const weights = (s.load || {})[name] || [];
        rows.push([s.date, s.label, s.bodyweight ?? "", name, s.ex[name].join("-"), weights.length ? weights.join("-") : 0, total(s.ex[name]), s.notes || ""]);
      });
    });
    const csv = rows.map((r) => r.map((c) => `"${String(c).replace(/"/g, '""')}"`).join(",")).join("\n");
    const blob = new Blob([csv], { type: "text/csv" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "training-log-" + new Date().toISOString().slice(0, 10) + ".csv";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  };

  const handleImport = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async (ev) => {
      try {
        const parsed = JSON.parse(ev.target.result);
        // Recognizes: a bare array (legacy workout-only export), { swimSessions } (swim-only
        // export), or { sessions, swimSessions } (unified export) — importing whichever
        // pieces are present, regardless of which fields are missing.
        const isObj = parsed && !Array.isArray(parsed);
        const workoutArr = isObj && Array.isArray(parsed.sessions) ? parsed.sessions : Array.isArray(parsed) ? parsed : null;
        const swimArr = isObj && Array.isArray(parsed.swimSessions) ? parsed.swimSessions : null;
        if (!workoutArr && !swimArr) throw new Error("unrecognized shape");

        let workoutMsg = "";
        if (workoutArr) {
          const existingDates = new Set(sessions.map((s) => s.date));
          const toAdd = migrate(workoutArr.filter((s) => s && s.date && s.ex && !existingDates.has(s.date)));
          const skipped = workoutArr.length - toAdd.length;
          const next = [...sessions, ...toAdd].sort((a, b) => a.date.localeCompare(b.date));
          await persist(next);
          workoutMsg = `Imported ${toAdd.length} workout session(s)${skipped ? `, skipped ${skipped} duplicate date(s)` : ""}.`;
        }

        let swimMsg = "";
        if (swimArr && swimArr.length) {
          const existingSwimIds = new Set((swimSessions || []).map((s) => s.id));
          const swimToAdd = swimArr.filter((s) => s && s.id && !existingSwimIds.has(s.id));
          const swimSkipped = swimArr.length - swimToAdd.length;
          const nextSwim = [...(swimSessions || []), ...swimToAdd].sort((a, b) => (a.date < b.date ? 1 : -1));
          await persistSwim(nextSwim);
          swimMsg = ` Imported ${swimToAdd.length} swim session(s)${swimSkipped ? `, skipped ${swimSkipped} duplicate(s)` : ""}.`;
        }

        // Restore settings (target names/header, PR-card selection, tracked/custom exercises,
        // weight + swim targets) if the export included them — overwrites whatever's currently
        // saved, since importing a backup is an intentional restore.
        let settingsMsg = "";
        if (parsed && isObj && parsed.settings && typeof parsed.settings === "object") {
          const st = parsed.settings;
          try {
            if (st.ownerName) { setOwnerName(st.ownerName); await window.storage.set(OWNER_KEY, st.ownerName, false); }
            if (st.targetSettings != null) { setTargetSettings(st.targetSettings); await window.storage.set(TARGET_KEY, JSON.stringify(st.targetSettings), false); }
            if (st.trackedExercises != null) { setTrackedExercises(st.trackedExercises); await window.storage.set(TRACKED_KEY, JSON.stringify(st.trackedExercises), false); }
            if (st.customExercises != null) { setCustomExercises(st.customExercises); await window.storage.set(CUSTOM_LIB_KEY, JSON.stringify(st.customExercises), false); }
            if (st.prSelection != null) { setPrSelection(st.prSelection); await window.storage.set(PR_SELECTION_KEY, JSON.stringify(st.prSelection), false); }
            if (st.weightTargetSettings != null) { setWeightTargetSettings(st.weightTargetSettings); await window.storage.set(WEIGHT_TARGET_KEY, JSON.stringify(st.weightTargetSettings), false); }
            if (st.swimTargetSettings != null) { setSwimTargetSettingsView(st.swimTargetSettings); await window.storage.set("swim-target-settings-v1", JSON.stringify(st.swimTargetSettings), false); }
            settingsMsg = " Settings restored.";
          } catch (_) {}
        }

        setImportMsg((workoutMsg || swimMsg || settingsMsg) ? `${workoutMsg}${swimMsg}${settingsMsg}` : "Nothing new to import.");
      } catch (err) {
        setImportMsg("Import failed — file doesn't look like a valid export.");
      }
      if (fileInputRef.current) fileInputRef.current.value = "";
      setTimeout(() => setImportMsg(""), 6000);
    };
    reader.readAsText(file);
  };

  const todayStr = toISODate(new Date());

  // Which exercises are "loadable" is detected from your actual data — any exercise that has
  // ever had added weight logged against it gets load-aware charts + hypertrophy coaching.
  const loadableSet = useMemo(() => {
    const s = new Set();
    (sessions || []).forEach((sess) => {
      Object.keys(sess.load || {}).forEach((name) => { if (((sess.load || {})[name] || []).some((w) => w > 0)) s.add(name); });
    });
    return s;
  }, [sessions]);

  // Carries the last logged bodyweight forward for any session where it wasn't entered,
  // so volume/PR math doesn't silently break just because bodyweight was left blank that day.
  const bwMap = useMemo(() => {
    const map = {};
    let last = null;
    (sessions || []).forEach((s) => {
      if (s.bodyweight != null) last = s.bodyweight;
      map[s.id] = last;
    });
    return map;
  }, [sessions]);

  // Per-set "load per rep" (bodyweight × ratio + THAT set's added weight), aligned with
  // s.ex[name] — since weight is now tracked per set rather than once per session, volume
  // math has to look at each set's own weight instead of assuming one value for all of them.
  // Returns null (session-wide) if bodyweight is unknown, same as before.
  const setLoadsFor = (s, name) => {
    const bw = bwMap[s.id];
    if (bw == null) return null;
    const ratio = bwRatioMap[name] != null ? bwRatioMap[name] : 1;
    const reps = s.ex[name] || [];
    const weights = (s.load || {})[name] || [];
    return reps.map((_, i) => bw * ratio + (weights[i] || 0));
  };

  // Total volume for one exercise within one session: sum of each set's reps × that set's
  // own load-per-rep. Null if bodyweight is unknown for the session.
  const exerciseVolume = (s, name) => {
    const loads = setLoadsFor(s, name);
    if (loads == null) return null;
    const reps = s.ex[name] || [];
    return reps.reduce((sum, r, i) => sum + r * loads[i], 0);
  };

  // Estimated one-rep max for the single best (heaviest-effort) set within a session, via the
  // Epley formula: 1RM = system weight × (1 + reps / 30), where system weight is that set's
  // own load-per-rep (bodyweight × ratio + that set's added weight). Volume rewards doing more
  // work, but two sessions with identical volume can reflect very different intensity — 1RM
  // isolates the intensity side instead. Returns null if bodyweight is unknown for the session.
  // Capped at 12 reps/set for hypertrophy-style training, where Epley stays reasonably accurate.
  const bestSet1RM = (s, name) => {
    const loads = setLoadsFor(s, name);
    if (loads == null) return null;
    const reps = s.ex[name] || [];
    const weights = (s.load || {})[name] || [];
    let best = null;
    reps.forEach((r, i) => {
      const oneRM = loads[i] * (1 + r / 30);
      if (!best || oneRM > best.oneRM) best = { oneRM, reps: r, weight: weights[i] || 0 };
    });
    return best;
  };
  const exercise1RM = (s, name) => {
    const b = bestSet1RM(s, name);
    return b ? b.oneRM : null;
  };

  const rangedSessions = useMemo(() => {
    if (!sessions) return [];
    if (range === "all") return sessions;
    const days = range === "30" ? 30 : 90;
    return sessions.filter((s) => dayDiff(s.date, todayStr) <= days);
  }, [sessions, range]);

  const chartData = useMemo(() => rangedSessions.map((s) => {
    const row = { date: fmtDate(s.date), fullDate: s.date };
    let totalVol = 0, anyVol = false;
    chartExercises.forEach((name) => {
      if (!s.ex[name]) { row[name] = null; return; }
      if (metric === "reps") { row[name] = total(s.ex[name]); return; }
      if (metric === "1rm") { const rm = exercise1RM(s, name); row[name] = rm == null ? null : Math.round(rm); return; }
      const v = exerciseVolume(s, name);
      row[name] = v == null ? null : Math.round(v);
      if (v != null) { totalVol += v; anyVol = true; }
    });
    if (metric === "volume") row.Total = anyVol ? totalVol : null;
    return row;
  }), [rangedSessions, metric, chartExercises]);

  const perSetData = useMemo(() => {
    if (filter === "All" || filter.startsWith("group:")) return [];
    return rangedSessions.filter((s) => s.ex[filter]).map((s) => {
      const row = { date: fmtDate(s.date) };
      const loads = setLoadsFor(s, filter); // per-set load-per-rep, or null if bodyweight unknown
      let totalVol = 0, anyVol = false, best1RM = null;
      s.ex[filter].forEach((r, i) => {
        if (metric === "reps") { row["Set " + (i + 1)] = r; return; }
        if (metric === "1rm") {
          const rm = loads == null ? null : loads[i] * (1 + r / 30);
          row["Set " + (i + 1)] = rm == null ? null : Math.round(rm);
          if (rm != null && (best1RM == null || rm > best1RM)) best1RM = rm;
          return;
        }
        const v = loads == null ? null : Math.round(r * loads[i]);
        row["Set " + (i + 1)] = v;
        if (v != null) { totalVol += v; anyVol = true; }
      });
      row.Total = metric === "reps" ? total(s.ex[filter]) : metric === "1rm" ? (best1RM == null ? null : Math.round(best1RM)) : (anyVol ? Math.round(totalVol) : null);
      return row;
    });
  }, [rangedSessions, filter, metric]);

  const loadStepData = useMemo(() => {
    if (!loadableSet.has(filter)) return [];
    // Weight can now vary per set within a session (e.g. drop sets) — the step chart shows
    // the top (heaviest) set of the session as the representative "working weight".
    return rangedSessions.filter((s) => s.ex[filter]).map((s) => {
      const weights = (s.load || {})[filter] || [];
      return { date: fmtDate(s.date), "Added load (kg)": weights.length ? Math.max(...weights) : 0 };
    });
  }, [rangedSessions, filter, loadableSet]);

  const bodyweightData = useMemo(() => rangedSessions.filter((s) => s.bodyweight != null).map((s) => ({ date: fmtDate(s.date), kg: s.bodyweight })), [rangedSessions]);

  const groupChartData = useMemo(() => {
    if (!filter.startsWith("group:")) return [];
    const group = filter.slice(6);
    return rangedSessions
      .filter((s) => chartExercises.some((name) => muscleGroupMap[name] === group && s.ex[name]))
      .map((s) => {
        let val = 0, best1RM = null;
        chartExercises.forEach((name) => {
          if (muscleGroupMap[name] !== group || !s.ex[name]) return;
          if (metric === "reps") { val += total(s.ex[name]); return; }
          if (metric === "1rm") { const rm = exercise1RM(s, name); if (rm != null && (best1RM == null || rm > best1RM)) best1RM = rm; return; }
          const v = exerciseVolume(s, name);
          if (v != null) val += v;
        });
        return { date: fmtDate(s.date), value: metric === "1rm" ? (best1RM == null ? null : Math.round(best1RM)) : Math.round(val) };
      });
  }, [rangedSessions, filter, metric, chartExercises, muscleGroupMap]);

  // --- Weekly (aggregated) equivalents of the datasets above, for the Day/Week chart toggle ---
  // Sessions are bucketed into ISO weeks (Monday start, same convention as the consistency
  // streak) and summed/averaged within each week, rather than plotted one point per session.
  const weekKeyOf = (dateStr) => toISODate(mondayOf(dateStr));

  const weeklySessionGroups = useMemo(() => {
    const map = new Map();
    rangedSessions.forEach((s) => {
      const key = weekKeyOf(s.date);
      if (!map.has(key)) map.set(key, []);
      map.get(key).push(s);
    });
    return Array.from(map.entries())
      .sort((a, b) => a[0].localeCompare(b[0]))
      .map(([weekStart, weekSessions]) => ({ weekStart, sessions: weekSessions }));
  }, [rangedSessions]);

  const weeklyChartData = useMemo(() => weeklySessionGroups.map(({ weekStart, sessions: weekSessions }) => {
    const row = { date: "Wk of " + fmtDate(weekStart), fullDate: weekStart };
    let totalVol = 0, anyVol = false;
    chartExercises.forEach((name) => {
      let repsSum = 0, volSum = 0, best1RM = null, any = false;
      weekSessions.forEach((s) => {
        if (!s.ex[name]) return;
        any = true;
        repsSum += total(s.ex[name]);
        const v = exerciseVolume(s, name);
        if (v != null) volSum += v;
        const rm = exercise1RM(s, name);
        if (rm != null && (best1RM == null || rm > best1RM)) best1RM = rm;
      });
      if (!any) { row[name] = null; return; }
      row[name] = metric === "reps" ? repsSum : metric === "1rm" ? (best1RM == null ? null : Math.round(best1RM)) : Math.round(volSum);
      if (metric === "volume") { totalVol += volSum; anyVol = true; }
    });
    if (metric === "volume") row.Total = anyVol ? Math.round(totalVol) : null;
    return row;
  }), [weeklySessionGroups, chartExercises, metric]);

  const weeklyGroupChartData = useMemo(() => {
    if (!filter.startsWith("group:")) return [];
    const group = filter.slice(6);
    return weeklySessionGroups
      .filter(({ sessions: weekSessions }) => weekSessions.some((s) => chartExercises.some((name) => muscleGroupMap[name] === group && s.ex[name])))
      .map(({ weekStart, sessions: weekSessions }) => {
        let val = 0, best1RM = null;
        weekSessions.forEach((s) => {
          chartExercises.forEach((name) => {
            if (muscleGroupMap[name] !== group || !s.ex[name]) return;
            if (metric === "reps") { val += total(s.ex[name]); return; }
            if (metric === "1rm") { const rm = exercise1RM(s, name); if (rm != null && (best1RM == null || rm > best1RM)) best1RM = rm; return; }
            const v = exerciseVolume(s, name);
            if (v != null) val += v;
          });
        });
        return { date: "Wk of " + fmtDate(weekStart), value: metric === "1rm" ? (best1RM == null ? null : Math.round(best1RM)) : Math.round(val) };
      });
  }, [weeklySessionGroups, filter, metric, chartExercises, muscleGroupMap]);

  // Per-set breakdown doesn't aggregate cleanly across a week (different session/set counts),
  // so the weekly view for a single exercise collapses to just its weekly Total line.
  const weeklySingleData = useMemo(() => {
    if (filter === "All" || filter.startsWith("group:")) return [];
    return weeklySessionGroups
      .filter(({ sessions: weekSessions }) => weekSessions.some((s) => s.ex[filter]))
      .map(({ weekStart, sessions: weekSessions }) => {
        let reps = 0, vol = 0, best1RM = null;
        weekSessions.forEach((s) => {
          if (!s.ex[filter]) return;
          reps += total(s.ex[filter]);
          const v = exerciseVolume(s, filter);
          if (v != null) vol += v;
          const rm = exercise1RM(s, filter);
          if (rm != null && (best1RM == null || rm > best1RM)) best1RM = rm;
        });
        return { date: "Wk of " + fmtDate(weekStart), Total: metric === "reps" ? reps : metric === "1rm" ? (best1RM == null ? null : Math.round(best1RM)) : Math.round(vol) };
      });
  }, [weeklySessionGroups, filter, metric]);

  const weeklyBodyweightData = useMemo(() => weeklySessionGroups.map(({ weekStart, sessions: weekSessions }) => {
    const vals = weekSessions.filter((s) => s.bodyweight != null).map((s) => s.bodyweight);
    return { date: "Wk of " + fmtDate(weekStart), kg: vals.length ? Math.round((vals.reduce((a, b) => a + b, 0) / vals.length) * 10) / 10 : null };
  }), [weeklySessionGroups]);

  // Most recent added-load entry within the week — load changes are step-like (you bump it
  // and hold there), so "latest in the week" is more representative than an average.
  const weeklyLoadStepData = useMemo(() => {
    if (!loadableSet.has(filter)) return [];
    return weeklySessionGroups
      .filter(({ sessions: weekSessions }) => weekSessions.some((s) => s.ex[filter]))
      .map(({ weekStart, sessions: weekSessions }) => {
        const withLoad = weekSessions.filter((s) => s.ex[filter]);
        const lastWeights = withLoad.length ? ((withLoad[withLoad.length - 1].load || {})[filter] || []) : [];
        const lastVal = lastWeights.length ? Math.max(...lastWeights) : 0;
        return { date: "Wk of " + fmtDate(weekStart), "Added load (kg)": lastVal };
      });
  }, [weeklySessionGroups, filter, loadableSet]);

  // The datasets actually handed to the charts below, switching on the Day/Week toggle.
  const chartDataView = timeView === "week" ? weeklyChartData : chartData;
  const groupChartDataView = timeView === "week" ? weeklyGroupChartData : groupChartData;
  const bodyweightDataView = timeView === "week" ? weeklyBodyweightData : bodyweightData;
  const loadStepDataView = timeView === "week" ? weeklyLoadStepData : loadStepData;

  const maxSets = useMemo(() => ((filter === "All" || filter.startsWith("group:") || timeView === "week") ? 0 : Math.max(0, ...rangedSessions.map((s) => (s.ex[filter] || []).length))), [rangedSessions, filter, timeView]);

  // The muscle group tied to the currently selected exercise (or group filter), used to
  // highlight the matching row in the "Volume by muscle group" panel.
  const activeGroup = filter === "All" ? null : filter.startsWith("group:") ? filter.slice(6) : muscleGroupMap[filter] || null;

  const latest = sessions && sessions.length ? sessions[sessions.length - 1] : null;
  const first = sessions && sessions.length ? sessions[0] : null;

  const deltaFor = (name) => {
    if (!latest || !first || !latest.ex[name] || !first.ex[name]) return null;
    return total(latest.ex[name]) - total(first.ex[name]);
  };
