  async get(key, shared) {
    try {
      const raw = localStorage.getItem(key);
      if (raw === null) return null;
      return { key, value: raw, shared: !!shared };
    } catch (e) { return null; }
  },
  async set(key, value, shared) {
    try {
      localStorage.setItem(key, value);
      return { key, value, shared: !!shared };
    } catch (e) { return null; }
  },
  async delete(key, shared) {
    try {
      localStorage.removeItem(key);
      return { key, deleted: true, shared: !!shared };
    } catch (e) { return null; }
  },
  async list(prefix, shared) {
    try {
      const keys = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (!prefix || (k && k.startsWith(prefix))) keys.push(k);
      }
      return { keys, prefix, shared: !!shared };
    } catch (e) { return null; }

function levenshtein(a, b) {
  if (a === b) return 0;
  const m = a.length, n = b.length;
  if (!m) return n;
  if (!n) return m;
  const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
  for (let i = 0; i <= m; i++) dp[i][0] = i;
  for (let j = 0; j <= n; j++) dp[0][j] = j;
  for (let i = 1; i <= m; i++) {
    for (let j = 1; j <= n; j++) {
      dp[i][j] = a[i - 1] === b[j - 1] ? dp[i - 1][j - 1] : 1 + Math.min(dp[i - 1][j], dp[i][j - 1], dp[i - 1][j - 1]);
    }
  }
  return dp[m][n];
}

// Fuzzy-matches a pasted header line against the full exercise reference library — not just
// your 7 tracked fields — so both typos and exercises you haven't logged before get
// recognized. Tries exact alias substrings first (longest alias wins), then falls back to
// edit-distance matching for typos (e.g. "wide grip pul ups").
function matchExercise(header, library) {
  const lib = library || EXERCISE_LIBRARY;
  const norm = header.toLowerCase().replace(/[^a-z0-9 ]/g, " ").replace(/\s+/g, " ").trim();
  if (!norm) return null;
  let best = null, bestLen = 0;
  lib.forEach((entry) => {
    (entry.aliases || [entry.name.toLowerCase()]).forEach((alias) => {
      if (norm.includes(alias) && alias.length > bestLen) { best = entry; bestLen = alias.length; }
    });
  });
  if (best) return best;
  let bestFuzzy = null, bestDist = Infinity;
  lib.forEach((entry) => {
    (entry.aliases || [entry.name.toLowerCase()]).forEach((alias) => {
      const dist = levenshtein(norm, alias);
      const tolerance = Math.max(1, Math.floor(alias.length * 0.22));
      if (dist <= tolerance && dist < bestDist) { bestFuzzy = entry; bestDist = dist; }
    });
  });
  return bestFuzzy;
}

// Parses a freeform pasted summary. Supports two paste styles:
//   1. Two-line: a header line ("Push-Ups"), then one "N rep(s) x M set(s) ..." line per
//      set-group (M repeats of N reps). Blank lines and "super set" markers are ignored.
//   2. Single-line shorthand: "Exercise : N x M" on one line (e.g. "biceps curl : 12 x 4") —
//      the "rep(s)"/"set(s)" words are optional in both styles, so "12 x 4" alone also counts
//      as a valid set line, not just "12 reps x 4 sets".
// Headers are matched against the FULL exercise reference library (not a fixed 5-6 field
// subset) plus any custom exercises the user has added — so any recognized exercise gets
// filled in and auto-added to the tracked list, whether or not it's ever been logged before.
// Only headers that truly don't match anything in the library land in `unmatched`.
function parseFreeform(text, library) {
  const lines = text.split("\n").map((l) => l.trim());
  const setLineRe = /^(\d+)\s*(?:reps?)?\s*x\s*(\d+)\s*(?:sets?)?\s*(.*)$/i;
  // Same shape as setLineRe but not anchored to the start of the line, and requires a name
  // (non-empty, non-numeric lead-in) before the numbers — used to pull "N x M" out of a line
  // that has no colon at all, e.g. "Squats 12 x 3 10kg".
  const embeddedSetRe = /^(.+?)\s+(\d+)\s*(?:reps?)?\s*x\s*(\d+)\s*(?:sets?)?\s*(.*)$/i;
  const supersetRe = /^super\s*set$/i;
  const results = {};
  const matchedEntries = [];
  const unmatched = [];
  let current = null; // matched library entry | null

  const applySetMatch = (name, setMatch) => {
    const reps = parseInt(setMatch[1], 10);
    const setsCount = parseInt(setMatch[2], 10) || 1;
    const rest = setMatch[3] || "";
    const kgMatch = rest.match(/(\d+(?:\.\d+)?)\s*kg/i);
    const weight = kgMatch ? parseFloat(kgMatch[1]) : 0;
    if (!results[name]) results[name] = { reps: [], weights: [] };
    // Each line's weight is pushed alongside its own reps, one entry per set, so a later
    // line for the same exercise (e.g. a drop set at a different weight) doesn't overwrite
    // an earlier line's weight — every set keeps the weight it was actually logged at.
    for (let i = 0; i < setsCount; i++) { results[name].reps.push(reps); results[name].weights.push(weight); }
  };

  const matchAndApply = (name, setMatch) => {
    const entry = matchExercise(name, library);
    if (entry) {
      current = entry;
      if (!matchedEntries.some((r) => r.name === entry.name)) matchedEntries.push(entry);
      applySetMatch(entry.name, setMatch);
      return true;
    }
    current = null;
    if (name) unmatched.push(name);
    return false;
  };

  lines.forEach((raw) => {
    if (!raw || supersetRe.test(raw)) return;

    // Single-line shorthand: split on the FIRST colon and see if the right side alone reads
    // as a set line ("N x M ..."). If so, the left side is the exercise name for THIS line
    // only — no need for a following line.
    const colonIdx = raw.indexOf(":");
    if (colonIdx !== -1) {
      const left = raw.slice(0, colonIdx).trim();
      const right = raw.slice(colonIdx + 1).trim();
      const rightSetMatch = right.match(setLineRe);
      if (left && rightSetMatch) { matchAndApply(left, rightSetMatch); return; }
    }

    // Pure set line for a `current` set by a previous header line (the original two-line style).
    const setMatch = raw.match(setLineRe);
    if (setMatch) {
      if (current) applySetMatch(current.name, setMatch);
      return;
    }

    // No colon, but the line still ends in "N x M ..." after a name with no separator at
    // all, e.g. "Squats 12 x 3 10kg" — pull the name out and match+fill in one step.
    const embeddedMatch = raw.match(embeddedSetRe);
    if (embeddedMatch) {
      const name = embeddedMatch[1].trim();
      matchAndApply(name, [raw, embeddedMatch[2], embeddedMatch[3], embeddedMatch[4]]);
      return;
    }

    const header = raw.replace(/:\s*$/, "").trim();
    const entry = matchExercise(header, library);
    if (entry) {
      current = entry;
      if (!matchedEntries.some((r) => r.name === entry.name)) matchedEntries.push(entry);
    } else {
      current = null;
      if (header) unmatched.push(header);
    }
  });
  return { results, matchedEntries, unmatched };
}

  const w = weights || [];
  if (!w.length || !w.some((x) => x > 0)) return "";
  return w.every((x) => x === w[0]) ? ` (+${w[0]}kg)` : ` (+${w.join("/")}kg)`;
};
const fmtDate = (d) => new Date(d + "T00:00:00").toLocaleDateString("en-US", { month: "short", day: "numeric" });
const fmtDateFull = (d) => new Date(d + "T00:00:00").toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
const dayDiff = (a, b) => Math.round((new Date(b + "T00:00:00") - new Date(a + "T00:00:00")) / 86400000);
const loadPerRep = (s, name) => (s.bodyweight == null ? null : s.bodyweight * (BW_RATIO[name] != null ? BW_RATIO[name] : 1) + ((s.load || {})[name] || 0));
// Local-date formatter (NOT toISOString, which converts to UTC and can shift the
// calendar date backward by one day for any timezone ahead of UTC — that off-by-one
// was misaligning heatmap columns/day-of-week and skewing the streak count).
const toISODate = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const mondayOf = (dateStr) => { const d = new Date(dateStr + "T00:00:00"); const dow = (d.getDay() + 6) % 7; d.setDate(d.getDate() - dow); return d; };
const emptyDraft = (trackedList) => ({ date: new Date().toISOString().slice(0, 10), label: "", bodyweight: "", notes: "", ex: Object.fromEntries((trackedList || []).map((e) => [e, ""])), load: Object.fromEntries((trackedList || []).map((e) => [e, ""])) });

const migrate = (loaded) =>
  loaded.map((s) => {
    let out = s;
    if (out.bodyweight === undefined) out = { ...out, bodyweight: null, load: out.load || {} };
    if (out.notes === undefined) out = { ...out, notes: "" };
    // Legacy sessions stored one added-weight number per exercise for the whole session
    // (`load[name] = 15`). Weight is now tracked per set, aligned with `ex[name]`
    // (`load[name] = [15,15,5,5]`). Expand any legacy scalar into an array of that same
    // value repeated for every set the exercise has, so old data keeps working unchanged.
    // Already-migrated sessions (load[name] already an array) pass through untouched.
    const ex = out.ex || {};
    const oldLoad = out.load || {};
    const migratedLoad = {};
    Object.keys(oldLoad).forEach((name) => {
      const v = oldLoad[name];
      if (Array.isArray(v)) { migratedLoad[name] = v; return; }
      const setsCount = (ex[name] || []).length || 1;
      migratedLoad[name] = Array.from({ length: setsCount }, () => v);
    });
    out = { ...out, load: migratedLoad };
    return out;
  });

// =====================================================================================
// SWIMMING — FIT file parsing + swim dashboard. Self-contained: its own storage keys,
// its own state, its own render tree. Does not touch any calisthenics state/logic above.
// =====================================================================================

// ---- Minimal client-side Garmin .FIT binary parser -----------------------------------
// Implements just enough of the FIT protocol (definition/data messages, normal +
// compressed-timestamp headers, little/big-endian) to pull session/length/record
// messages out of a swim activity. Not a general-purpose FIT SDK.
const FIT_BASE_TYPES = {
  0x00: "enum", 0x01: "sint8", 0x02: "uint8", 0x83: "sint16", 0x84: "uint16",
  0x85: "sint32", 0x86: "uint32", 0x07: "string", 0x88: "float32", 0x89: "float64",
  0x0a: "uint8z", 0x8b: "uint16z", 0x8c: "uint32z", 0x0d: "byte", 0x8e: "sint64",
  0x8f: "uint64", 0x90: "uint64z",
};
const FIT_INVALID = {
  enum: 0xff, sint8: 0x7f, uint8: 0xff, sint16: 0x7fff, uint16: 0xffff,
  sint32: 0x7fffffff, uint32: 0xffffffff, uint8z: 0, uint16z: 0, uint32z: 0, byte: 0xff,
};
const FIT_EPOCH_OFFSET = 631065600; // seconds between Unix epoch and FIT epoch (1989-12-31T00:00:00Z)

function fitTimestampToDate(raw) {
  if (raw == null) return null;
  return new Date((raw + FIT_EPOCH_OFFSET) * 1000);
}

// Parses raw FIT bytes into arrays of loosely-typed message records, keyed by field number
// (e.g. `f253` = field 253 = timestamp on most message types). Global message numbers used:
// 18 = session, 19 = lap, 101 = length, 20 = record.
function parseFitBinary(arrayBuffer) {
  const view = new DataView(arrayBuffer);
  const byteLength = arrayBuffer.byteLength;
  if (byteLength < 14) throw new Error("File too small to be a valid .FIT file.");
  const headerSize = view.getUint8(0);
  const sig = String.fromCharCode(view.getUint8(8), view.getUint8(9), view.getUint8(10), view.getUint8(11));
  if (sig !== ".FIT") throw new Error("Not a recognized .FIT file (missing signature).");
  const dataSize = view.getUint32(4, true);
  const end = Math.min(headerSize + dataSize, byteLength - 2);

  const localDefs = {};
  let lastTimestamp = null;
  const messages = { 18: [], 19: [], 101: [], 20: [] }; // session, lap, length, record

  function readScalar(off, baseTypeName, littleEndian) {
    switch (baseTypeName) {
      case "enum": case "uint8": case "uint8z": case "byte": return view.getUint8(off);
      case "sint8": return view.getInt8(off);
      case "uint16": case "uint16z": return view.getUint16(off, littleEndian);
      case "sint16": return view.getInt16(off, littleEndian);
      case "uint32": case "uint32z": return view.getUint32(off, littleEndian);
      case "sint32": return view.getInt32(off, littleEndian);
      case "float32": return view.getFloat32(off, littleEndian);
      case "float64": return view.getFloat64(off, littleEndian);
      case "string": return null; // strings unused for our fields; skip decoding
      default: return view.getUint8(off);
    }
  }

  function readDataMessage(def, startOff) {
    let off = startOff;
    const rec = {};
    for (const f of def.fields) {
      const typeName = FIT_BASE_TYPES[f.baseType] || "byte";
      // Fields we care about are always single scalars; if a field's declared size is
      // larger than one element (array field), just read the first element and skip the rest.
      const val = readScalar(off, typeName, def.littleEndian);
      if (val != null && val !== FIT_INVALID[typeName]) rec["f" + f.fieldNum] = val;
      off += f.size;
    }
    for (const df of def.devFields) off += df.size; // developer fields: skip raw bytes, unused
    return { rec, newOffset: off };
  }

  let offset = headerSize;
  while (offset < end) {
    const headerByte = view.getUint8(offset); offset += 1;
    const isCompressed = (headerByte & 0x80) !== 0;
    let globalMesgNum, rec, newOffset;

    if (isCompressed) {
      const localType = (headerByte >> 5) & 0x03;
      const timeOffset = headerByte & 0x1f;
      const def = localDefs[localType];
      if (!def) break; // malformed / unsupported stream — stop rather than misread
      ({ rec, newOffset: offset } = readDataMessage(def, offset));
      if (lastTimestamp != null) {
        const base = lastTimestamp - (lastTimestamp & 0x1f);
        let ts = base + timeOffset;
        if (timeOffset < (lastTimestamp & 0x1f)) ts += 32;
        lastTimestamp = ts;
      }
      if (rec.f253 == null && lastTimestamp != null) rec.f253 = lastTimestamp;
      globalMesgNum = def.globalMesgNum;
    } else {
      const isDefinition = (headerByte & 0x40) !== 0;
      const localType = headerByte & 0x0f;
      if (isDefinition) {
        const hasDevFields = (headerByte & 0x20) !== 0;
        offset += 1; // reserved byte
        const arch = view.getUint8(offset); offset += 1;
        const littleEndian = arch === 0;
        const gmn = view.getUint16(offset, littleEndian); offset += 2;
        const numFields = view.getUint8(offset); offset += 1;
        const fields = [];
        for (let i = 0; i < numFields; i++) {
          fields.push({ fieldNum: view.getUint8(offset), size: view.getUint8(offset + 1), baseType: view.getUint8(offset + 2) });
          offset += 3;
        }
        const devFields = [];
        if (hasDevFields) {
          const numDev = view.getUint8(offset); offset += 1;
          for (let i = 0; i < numDev; i++) {
            devFields.push({ fieldNum: view.getUint8(offset), size: view.getUint8(offset + 1), devIndex: view.getUint8(offset + 2) });
            offset += 3;
          }
        }
        localDefs[localType] = { globalMesgNum: gmn, littleEndian, fields, devFields };
        continue;
      } else {
        const def = localDefs[localType];
        if (!def) break;
        ({ rec, newOffset: offset } = readDataMessage(def, offset));
        if (rec.f253 != null) lastTimestamp = rec.f253;
        globalMesgNum = def.globalMesgNum;
      }
    }
    if (messages[globalMesgNum]) messages[globalMesgNum].push(rec);
  }
  return { sessionMsgs: messages[18], lapMsgs: messages[19], lengthMsgs: messages[101], recordMsgs: messages[20] };
}

const SWIM_STROKE_NAMES = { 0: "freestyle", 1: "backstroke", 2: "breaststroke", 3: "butterfly", 4: "drill", 5: "mixed", 6: "im" };
// kick_free / kick_frog are not FIT-reported stroke codes — they only ever get set by the
// person manually reclassifying a length in the Session detail table (kickboard work reads
// as a normal stroke to the watch, so it has to be corrected after the fact).
const SWIM_STROKE_LABELS = { freestyle: "Freestyle", backstroke: "Backstroke", breaststroke: "Breaststroke", butterfly: "Butterfly", drill: "Drill", mixed: "Mixed", im: "IM", unknown: "Unknown", kick_free: "Board Kick (Freestyle)", kick_frog: "Board Kick (Frog)" };

// Short "why this comparison matters" captions for the Compare chart's mode selector. Kept to
// one line each, no statistical language — the point is orientation before the user reads the
// chart, not an explanation of the underlying math.
const COMPARE_MODE_DESCRIPTIONS = {
  cadence: "Speed vs turnover — see whether you're getting faster by increasing stroke rate.",
  dps: "Speed vs efficiency — see whether you're getting faster by covering more distance per stroke.",
  hr: "Speed vs effort — see whether you're getting faster without your heart rate climbing.",
  swolfhr: "Efficiency vs effort — see whether your stroke efficiency is improving without more cardiovascular strain.",
};
const SWIM_STROKE_COLORS = { freestyle: "#56CCF2", backstroke: "#BB86FC", breaststroke: "#F2994A", butterfly: "#E63946", drill: "#9CCC65", mixed: "#F2C94C", im: "#2EC4B6", unknown: "#6b7078", kick_free: "#FF8FA3", kick_frog: "#F4B183" };
// Shared background for every floating/sticky bar in the app (top tab nav + the Swim tab's
// swim-type filter bar) — a warm, dark cream tone (not a cold near-black) so the two bars read
// as one continuous, deliberately-toned piece rather than separate floating panels. Solid (no
// blur/translucency) so it reads as one clear block instead of a see-through layer while
// scrolling.
const FLOATING_BAR_BG = "#1b1712";
const FLOATING_BAR_BG_SOFT = "rgba(27,23,18,0.92)"; // translucent variant for the backdrop-blur wrapper
const FLOATING_BAR_BORDER = "#332b20";
// Rough plausibility ceilings for avg swimming cadence (strokes/min) per stroke type — used
// only to flag likely sensor glitches, never to silently drop data outside this filter.
const SWIM_MAX_PLAUSIBLE_CADENCE = { freestyle: 130, backstroke: 110, breaststroke: 60, butterfly: 60, drill: 100, mixed: 130, im: 130, unknown: 130, kick_free: 130, kick_frog: 90 };
// The set of swim types a person can manually assign to a length in Session detail — the 4
// standard competitive strokes plus the two board-kick drills.
const EDITABLE_SWIM_STROKES = ["freestyle", "backstroke", "breaststroke", "butterfly", "kick_free", "kick_frog"];
// Per-chart overlay options for the expanded swim trend charts — each chart offers only the
// secondary metrics that are actually meaningful for it, rather than one fixed global overlay.
// Per-chart overlay options for the expanded swim trend charts. HR overlay is only offered
// where a whole-session HR average is actually a meaningful pairing (effort-linked metrics:
// pace, SWOLF). Stroke rate and distance/stroke are technique-driven, not effort-driven, so a
// single session-average HR line is a weak/misleading overlay there — omitted on purpose.
const SWIM_CHART_OVERLAY_OPTIONS = {
  pace: [{ value: "none", label: "None" }],
  swolf: [{ value: "none", label: "None" }],
  cadence: [{ value: "none", label: "None" }],
  dps: [{ value: "none", label: "None" }],
};

// Single source of truth for which direction counts as "better" per Trends metric — "lower"
// flips the Y axis (and z-score sign, where z-scores are used) so improvement always reads as
// "up"; "higher" leaves it as-is; "neutral" means there's no universal better direction (e.g.
// whole-session HR moves with effort, not fitness). Every place that needs to reverse an axis
// or flip a sign for one of these metrics reads from HERE instead of re-deciding locally —
// that's the actual fix for item 6: the previous pass patched the SWOLF branch's `reversed`
// prop directly, which is exactly the kind of per-branch fix that's easy to apply in one place
// and miss in another. Centralizing it means collapsed sparklines, every expanded-chart branch,
// and the radar tab's z-score flip all agree by construction.
const METRIC_AXIS_DIRECTION = { pace: "lower", swolf: "lower", cadence: "higher", dps: "higher", heart: "neutral" };

// ---- Length-level correction/override layer (Part 1E / Part 9) -----------------------------
// Every length keeps its original imported fields (stroke, lengthType) untouched forever.
// A person's corrections live alongside them in userExcluded / userLengthType / userStroke and
// are the ONLY thing ever written by the length editor. effectiveLength() resolves "what the
// analysis should actually use" for a given length, without ever mutating the original.
function effectiveLength(l) {
  const lengthType = l.userLengthType || l.lengthType;
  const stroke = l.userStroke || l.stroke;
  return { ...l, lengthType, stroke, isOverridden: !!(l.userLengthType || l.userStroke) };
}

// Single source of truth for every derived swim-session number (distance, swim/rest time,
// pace, per-stroke stats, reps). Takes a session's `lengths` array (with whatever user
// overrides are currently set) and recomputes everything downstream from scratch — called
// both at initial FIT import (with no overrides yet) and after every length edit, so the
// numbers on screen never go stale (Part 1F).
function computeSwimSessionMetrics(lengths, poolLength) {
  const eff = lengths.map(effectiveLength);
  const validActive = eff.filter((l) => l.lengthType === "active" && !l.userExcluded);
  const idleLengths = eff.filter((l) => l.lengthType === "idle" && !l.userExcluded);

  const distance = poolLength != null ? Math.round(validActive.length * poolLength * 100) / 100 : null;
  const swimTimeSec = validActive.reduce((a, l) => a + l.elapsedSec, 0);
  const restTimeSec = idleLengths.reduce((a, l) => a + l.elapsedSec, 0);
  const pace100Overall = swimTimeSec > 0 && distance ? (swimTimeSec / distance) * 100 : null;

  const strokeGroups = {};
  validActive.forEach((l) => {
    if (!strokeGroups[l.stroke]) strokeGroups[l.stroke] = { swolfs: [], cadences: [], distPerStroke: [], timeSec: 0, lengthCount: 0 };
    const swolf = l.elapsedSec != null && l.totalStrokes != null ? Math.round(l.elapsedSec + l.totalStrokes) : null;
    if (swolf != null) strokeGroups[l.stroke].swolfs.push(swolf);
    if (l.avgCadence > 0) strokeGroups[l.stroke].cadences.push(l.avgCadence);
    if (l.totalStrokes > 0 && poolLength) strokeGroups[l.stroke].distPerStroke.push(poolLength / l.totalStrokes);
    strokeGroups[l.stroke].timeSec += l.elapsedSec;
    strokeGroups[l.stroke].lengthCount += 1;
  });
  const avg = (arr) => (arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : null);
  const strokeStats = {};
  Object.keys(strokeGroups).forEach((stroke) => {
    const g = strokeGroups[stroke];
    const strokeDistance = poolLength != null ? g.lengthCount * poolLength : null;
    strokeStats[stroke] = {
      count: g.swolfs.length,
      avgSwolf: avg(g.swolfs),
      avgCadence: avg(g.cadences),
      avgDistPerStroke: avg(g.distPerStroke),
      pace100: g.timeSec > 0 && strokeDistance ? (g.timeSec / strokeDistance) * 100 : null,
    };
  });

  // Reconstruct reps/sets from consecutive active lengths (a run broken by any idle length,
  // in original recorded order, honoring exclusions and IDLE/ACTIVE overrides).
  const reps = [];
  let currentRep = null;
  eff.forEach((l) => {
    if (l.userExcluded) return;
    if (l.lengthType === "active") {
      if (!currentRep) currentRep = { startIndex: l.index, lengthCount: 0, timeSec: 0, strokeSet: new Set() };
      currentRep.lengthCount += 1;
      currentRep.timeSec += l.elapsedSec;
      currentRep.strokeSet.add(l.stroke);
    } else if (l.lengthType === "idle") {
      if (currentRep) { reps.push(currentRep); currentRep = null; }
    }
  });
  if (currentRep) reps.push(currentRep);
  const repSummaries = poolLength ? reps.map((r) => {
    const repDistance = r.lengthCount * poolLength;
    const pace100 = r.timeSec > 0 && repDistance > 0 ? (r.timeSec / repDistance) * 100 : null;
    return { lengthCount: r.lengthCount, distance: repDistance, timeSec: r.timeSec, pace100, stroke: r.strokeSet.size === 1 ? Array.from(r.strokeSet)[0] : "mixed" };
  }) : [];

  const totalActiveLengths = eff.filter((l) => l.lengthType === "active").length;
  const suspiciousKept = eff.filter((l) => l.glitch && l.lengthType === "active" && !l.userExcluded).length;
  const excludedCount = eff.filter((l) => l.userExcluded).length;
  const parts = [];
  if (suspiciousKept > 0) parts.push(`${suspiciousKept} suspicious length${suspiciousKept === 1 ? "" : "s"} flagged for review (kept in the totals until you decide)`);
  if (excludedCount > 0) parts.push(`${excludedCount} length${excludedCount === 1 ? "" : "s"} excluded by you`);
  const qualityNote = parts.length ? parts.join("; ") + "." : null;

  return { distance, swimTimeSec, restTimeSec, pace100Overall, strokeStats, reps: repSummaries, totalActiveLengths, validActiveLengths: validActive.length, excludedCount, qualityNote };
}

// Turns raw parsed FIT messages into a fully-computed swim session object, applying the
// data-quality filtering rules (phantom lengths, implausible cadence) before any metric
// is derived from the length data.
function processSwimFit(parsed, fileName) {
  const { sessionMsgs, lengthMsgs, recordMsgs } = parsed;
  if (!lengthMsgs || lengthMsgs.length === 0) throw new Error("No per-length swim data found in this file (is it a pool-swim activity?).");
  const sessionRec = sessionMsgs && sessionMsgs[0] ? sessionMsgs[0] : {};

  const poolLength = sessionRec.f44 != null ? sessionRec.f44 / 100 : null; // meters
  const sessionCalories = sessionRec.f11 != null ? sessionRec.f11 : null;
  const reportedDistanceRaw = sessionRec.f9 != null ? sessionRec.f9 / 100 : null; // informational only, cross-checked below
  const sessionStart = fitTimestampToDate(sessionRec.f2 != null ? sessionRec.f2 : sessionRec.f253);

  const rawLengths = lengthMsgs.map((l) => {
    const stroke = SWIM_STROKE_NAMES[l.f7] || "unknown";
    const lengthType = l.f12 === 1 ? "active" : l.f12 === 0 ? "idle" : "unknown";
    const totalStrokes = l.f5 != null ? l.f5 : 0;
    const avgCadence = l.f9 != null ? l.f9 : 0;
    const elapsedSec = l.f3 != null ? l.f3 / 1000 : (l.f4 != null ? l.f4 / 1000 : 0);
    const startTimeRaw = l.f2 != null ? l.f2 : l.f253; // raw FIT timestamp, for matching against record messages below
    const startTime = fitTimestampToDate(startTimeRaw);
    const calories = l.f11 != null ? l.f11 : null;
    return { stroke, lengthType, totalStrokes, avgCadence, elapsedSec, startTime, startTimeRaw, calories };
  });

  // Per-length HR: average of record-message heart-rate readings whose timestamp falls
  // within that length's own [start, start+elapsed) window. This is a real, derived signal
  // from the FIT record stream (not invented) — it's what makes HR meaningful *within* a
  // single activity (pace vs. effort over the course of the swim), as opposed to the
  // aggregate trend charts where only one flattened whole-session average exists.
  const hrRecordsSorted = (recordMsgs || [])
    .filter((r) => r.f253 != null && r.f3 != null && r.f3 > 0)
    .map((r) => ({ ts: r.f253, hr: r.f3 }))
    .sort((a, b) => a.ts - b.ts);
  const hrForWindow = (startRaw, elapsedSec) => {
    if (startRaw == null || hrRecordsSorted.length === 0) return null;
    const windowEnd = startRaw + Math.max(elapsedSec, 1);
    const inWindow = hrRecordsSorted.filter((r) => r.ts >= startRaw && r.ts < windowEnd);
    return inWindow.length ? Math.round(inWindow.reduce((a, r) => a + r.hr, 0) / inWindow.length) : null;
  };

  // A 0-stroke/0-cadence "active" length is flagged as *suspicious* if it's also too short to
  // physically be a real length (implausibly fast), or if its cadence is implausibly high for
  // its stroke. This flag (`glitch`) is surfaced in the UI — it is NEVER used to silently
  // drop or modify data. The person decides, per length, whether to exclude it (Part 1B/C/D).
  const PHANTOM_MAX_PLAUSIBLE_SEC = 5;
  const lengths = rawLengths.map((len, index) => {
    let glitch = null;
    if (len.lengthType === "active") {
      if (len.totalStrokes === 0 && len.avgCadence === 0) {
        if (len.elapsedSec < PHANTOM_MAX_PLAUSIBLE_SEC) {
          glitch = `phantom length (0 strokes, 0 cadence, ${len.elapsedSec.toFixed(1)}s — too short to be a real length)`;
        }
        // else: 0/0 with a normal/long duration -> plausible real length.
      } else {
        const maxC = SWIM_MAX_PLAUSIBLE_CADENCE[len.stroke] || 130;
        if (len.avgCadence > maxC) glitch = `implausible cadence (${len.avgCadence} spm > ${maxC} plausible max for ${SWIM_STROKE_LABELS[len.stroke]})`;
      }
    }
    const swolf = len.lengthType === "active" ? Math.round(len.elapsedSec + len.totalStrokes) : null;
    const avgHR = hrForWindow(len.startTimeRaw, len.elapsedSec);
    const pace100 = len.lengthType === "active" && poolLength ? (len.elapsedSec / poolLength) * 100 : null;
    if (glitch) {
      console.warn(`[swim-fit] flagged length #${index} as suspicious (not excluded): elapsedSec=${len.elapsedSec.toFixed(2)}, totalStrokes=${len.totalStrokes}, avgCadence=${len.avgCadence}, reason="${glitch}"`);
    }
    // userExcluded/userLengthType/userStroke form the correction/override layer (Part 1E/9):
    // null/false means "use the original imported value". Only ever set later by explicit
    // person action in the Length-by-length editor — never touched automatically.
    return { ...len, index, glitch, swolf, avgHR, pace100, userExcluded: false, userLengthType: null, userStroke: null };
  });

  const metrics = computeSwimSessionMetrics(lengths, poolLength);

  // Cross-check the FIT session-level total_distance against our length-based count rather
  // than trusting it outright — surfaced in the quality note if they disagree.
  let distanceMismatchNote = null;
  if (reportedDistanceRaw != null && metrics.distance != null && Math.abs(reportedDistanceRaw - metrics.distance) > (poolLength || 25) * 0.5) {
    distanceMismatchNote = `FIT file reported ${reportedDistanceRaw}m at the session level, which disagrees with the ${metrics.distance}m computed from length records — using the computed figure.`;
  }
  let qualityNote = metrics.qualityNote;
  if (distanceMismatchNote) qualityNote = qualityNote ? qualityNote + " " + distanceMismatchNote : distanceMismatchNote;

  // Average + peak HR from record messages within the session's timeframe (if the device
  // recorded HR). Peak is a genuine max of real readings, not estimated.
  const hrValues = (recordMsgs || []).map((r) => r.f3).filter((v) => v != null && v > 0);
  const avgHR = hrValues.length ? Math.round(hrValues.reduce((a, b) => a + b, 0) / hrValues.length) : null;
  const peakHR = hrValues.length ? Math.max(...hrValues) : null;

  const dateISO = sessionStart ? toISODate(sessionStart) : new Date().toISOString().slice(0, 10);

  return {
    id: "swim-" + Date.now() + "-" + Math.random().toString(36).slice(2, 8),
    fileName,
    date: dateISO,
    startTime: sessionStart ? sessionStart.toISOString() : null,
    poolLength,
    calories: sessionCalories,
    distance: metrics.distance,
    distanceCorrection: null, // { originalDistance, correctedAt } — set only if the person manually corrects distance later
    swimTimeSec: metrics.swimTimeSec,
    restTimeSec: metrics.restTimeSec,
    pace100Overall: metrics.pace100Overall,
    avgHR,
    peakHR,
    totalActiveLengths: metrics.totalActiveLengths,
    validActiveLengths: metrics.validActiveLengths,
    excludedCount: metrics.excludedCount,
    qualityNote,
    strokeStats: metrics.strokeStats,
    lengths,
    reps: metrics.reps,
    isCssTest: false,
    cssTest: null, // { t200, t400 } seconds, entered manually — see SwimmingTab
  };
}

// Thin wrapper kept for call-site compatibility: recomputes just strokeStats + reps from a
// session's `lengths` array (with whatever overrides are set), delegating to the single
// source of truth above so this and processSwimFit can never drift out of sync.
function recomputeSwimDerived(lengths, poolLength) {
  const { strokeStats, reps } = computeSwimSessionMetrics(lengths, poolLength);
  return { strokeStats, reps };
}

// Sessions parsed before per-length and per-stroke pace were added to processSwimFit are
// missing the `pace100` field in two places: on each entry in `lengths` (used by the
// "Pace over this session" chart) and on each stroke in `strokeStats` (used by the per-
// stroke trend cards). Rather than requiring a re-upload of the original .FIT file, both
// are recomputed from data already stored on the session — elapsedSec/poolLength for
// per-length pace, the same grouping processSwimFit uses at parse time for per-stroke
// pace. Returns the session unchanged if nothing needs backfilling.
function backfillSwimSessionStrokeStats(session) {
  if (!session || !session.lengths) return session;

  const lengthsNeedBackfill = session.lengths.some((l) => l.lengthType === "active" && l.pace100 == null);
  const fixedLengths = lengthsNeedBackfill
    ? session.lengths.map((l) => {
        if (l.lengthType !== "active" || l.pace100 != null || !session.poolLength) return l;
        return { ...l, pace100: (l.elapsedSec / session.poolLength) * 100, swolf: l.swolf != null ? l.swolf : Math.round(l.elapsedSec + l.totalStrokes) };
      })
    : session.lengths;

  const strokes = session.strokeStats ? Object.keys(session.strokeStats) : [];
  const strokeStatsNeedBackfill = strokes.some((k) => session.strokeStats[k] && session.strokeStats[k].pace100 == null);
  let fixedStrokeStats = session.strokeStats;
  if (strokeStatsNeedBackfill) {
    const validActive = fixedLengths.filter((l) => l.lengthType === "active" && !l.userExcluded);
    const groups = {};
    validActive.forEach((l) => {
      if (!groups[l.stroke]) groups[l.stroke] = { timeSec: 0, lengthCount: 0 };
      groups[l.stroke].timeSec += l.elapsedSec;
      groups[l.stroke].lengthCount += 1;
    });
    fixedStrokeStats = {};
    strokes.forEach((stroke) => {
      const existing = session.strokeStats[stroke];
      const g = groups[stroke];
      const strokeDistance = g && session.poolLength != null ? g.lengthCount * session.poolLength : null;
      const recomputedPace100 = g && g.timeSec > 0 && strokeDistance ? (g.timeSec / strokeDistance) * 100 : null;
      fixedStrokeStats[stroke] = { ...existing, pace100: existing.pace100 != null ? existing.pace100 : recomputedPace100 };
    });
  }

  if (!lengthsNeedBackfill && !strokeStatsNeedBackfill) return session;
  return { ...session, lengths: fixedLengths, strokeStats: fixedStrokeStats };
}

// One-time migration for sessions imported before the Part 1 correction layer existed: adds
// the userExcluded/userLengthType/userStroke fields (defaulting to "no override", i.e.
// unchanged behavior for that length) and re-derives every session-level number through
// computeSwimSessionMetrics, since older sessions had glitch-flagged lengths silently
// excluded at parse time — the new behavior keeps them counted unless the person excludes
// them explicitly. A pre-existing manual distance correction (distanceCorrection) is
// preserved as-is (it's an explicit person decision), but its pace is refreshed against the
// migrated swim time so it stays internally consistent.
function migrateSwimSessionToOverrideLayer(session) {
  if (!session || !session.lengths) return session;
  const alreadyMigrated = session.lengths.every((l) => "userExcluded" in l);
  if (alreadyMigrated) return session;

  const lengths = session.lengths.map((l) => ({ ...l, userExcluded: false, userLengthType: null, userStroke: null }));
  const metrics = computeSwimSessionMetrics(lengths, session.poolLength);
  const distance = session.distanceCorrection ? session.distance : metrics.distance;
  const pace100Overall = session.distanceCorrection && distance
    ? (metrics.swimTimeSec > 0 ? (metrics.swimTimeSec / distance) * 100 : null)
    : metrics.pace100Overall;

  return {
    ...session,
    lengths,
    distance,
    pace100Overall,
    swimTimeSec: metrics.swimTimeSec,
    restTimeSec: metrics.restTimeSec,
    strokeStats: metrics.strokeStats,
    reps: metrics.reps,
    totalActiveLengths: metrics.totalActiveLengths,
    validActiveLengths: metrics.validActiveLengths,
    excludedCount: metrics.excludedCount,
    qualityNote: metrics.qualityNote,
  };
}

// Runs the backfill across a whole session list. Returns { sessions, changed } so callers
// can decide whether to write the backfilled data back to storage.
function backfillSwimSessions(list) {
  let changed = false;
  const next = (list || []).map((s) => {
    const migrated = migrateSwimSessionToOverrideLayer(s);
    let fixed = backfillSwimSessionStrokeStats(migrated);
    if (fixed !== s) changed = true;
    return fixed;
  });
  return { sessions: next, changed };
}

// Clean numeric formatter for chart axes/tooltips: caps decimals at maxDecimals, strips
// trailing zeros, and never shows raw floating-point noise like 82.34999999999.
const fmtNum = (v, maxDecimals = 2) => {
  if (v == null || !isFinite(v)) return "—";
  const factor = Math.pow(10, maxDecimals);
  const rounded = Math.round(v * factor) / factor;
  return rounded % 1 === 0 ? String(rounded) : String(parseFloat(rounded.toFixed(maxDecimals)));
};
const fmtMinSec = (totalSec) => {
  if (totalSec == null || !isFinite(totalSec)) return "—";
  const s = Math.round(totalSec);
  const m = Math.floor(s / 60);
  const rem = s % 60;
  return `${m}:${String(rem).padStart(2, "0")}`;
};
const fmtPace100 = (secPer100) => (secPer100 == null ? "—" : `${fmtMinSec(secPer100)}/100m`);

// Editable-field counterparts to fmtMinSec/fmtPace100, used where a pace needs to be both
// displayed AND typed back in (the CSS confirm dialog) — one decimal place of precision,
// e.g. "1:58.2", rather than fmtMinSec's whole-second display rounding.
const paceSecToStr = (paceSec) => {
  if (paceSec == null || !isFinite(paceSec) || paceSec < 0) return "";
  const m = Math.floor(paceSec / 60);
  const rem = paceSec - m * 60;
  return `${m}:${rem < 10 ? "0" : ""}${rem.toFixed(1)}`;
};
// Parses "M:SS" / "M:SS.s" back into seconds-per-100m. Also accepts a bare number of
// seconds-per-100m (no colon), so pasting a plain figure still works.
const paceStrToSec = (str) => {
  if (str == null) return NaN;
  const s = String(str).trim();
  if (s === "") return NaN;
  if (s.includes(":")) {
    const [mPart, sPart] = s.split(":");
    const m = parseFloat(mPart), sec = parseFloat(sPart);
    if (!isFinite(m) || !isFinite(sec)) return NaN;
    return m * 60 + sec;
  }
  return parseFloat(s);
};

// Length-by-length editor action buttons — deliberately sized for comfortable mobile tapping
// (Part 8), not the tiny icon-buttons the rest of this dense table uses elsewhere.
function lenBtnStyle(variant) {
  const palette = {
    neutral: { bg: "transparent", color: "var(--text-dim, #9a9fa6)", border: "var(--border-2, #2a2e33)" },
    positive: { bg: "#6FCF9722", color: "var(--positive, #6FCF97)", border: "#6FCF9755" },
    negative: { bg: "#E6394622", color: "var(--negative, #E63946)", border: "#E6394655" },
  }[variant] || {};
  return {
    cursor: "pointer", background: palette.bg, color: palette.color, border: `1px solid ${palette.border}`,
    borderRadius: 7, padding: "6px 10px", fontWeight: 600, fontSize: 10.5, minHeight: 30, whiteSpace: "nowrap",
  };
}

// ---- Normalization helpers for overlaying two differently-scaled metrics (e.g. pace in
// seconds, HR in bpm) on a single shared axis without one series drowning the other out.
// Converts each to "standard deviations from its own mean" (z-score) so both land on a
// comparable, unitless scale — the standard technique for eyeballing correlation between
// series that don't share units, rather than giving each its own independently-scaled axis
// (which just stretches both to fill the chart regardless of real magnitude).
function computeMeanStd(values) {
  const vals = values.filter((v) => v != null && isFinite(v));
  if (vals.length < 2) return null;
  const mean = vals.reduce((a, b) => a + b, 0) / vals.length;
  const variance = vals.reduce((a, b) => a + (b - mean) ** 2, 0) / vals.length;
  return { mean, std: Math.sqrt(variance) };
}
function zScoreOf(v, stats) {
  if (v == null || stats == null) return null;
  return stats.std > 0 ? (v - stats.mean) / stats.std : 0;
}

// ============================================================================================
// SWIM INSIGHTS — rule-based, fully local/deterministic interpretation engine.
// No AI, no network calls. Every function below is a pure function over data the app already
// computes (trendData / chronSessions) and returns either null (not enough signal to say
// anything responsible) or a structured insight object. Thresholds are centralized so they can
// be tuned in one place without touching the generator logic.
// ============================================================================================
const INSIGHT_THRESHOLDS = {
  paceMeaningfulPct: 0.025,   // ~2.5% pace change to be worth mentioning
  swolfMeaningfulPct: 0.03,   // ~3%
  dpsMeaningfulPct: 0.03,     // ~3% distance-per-stroke change
  cadenceMeaningfulPct: 0.04, // stroke-rate tolerance — noisier metric, wider band
  hrMeaningfulBpm: 3,         // absolute bpm difference floor — don't read into 1-2bpm noise
  recentWindow: 3,            // "latest session" comparisons use the last N sessions as "recent"
  minBaselineWindow: 2,       // need at least this many sessions before the recent window
  minPointsForPB: 4,          // minimum comparable sessions before calling something a personal best
  mediumTermWeeks: 6,         // "improvement over time" lookback
  frequencyGapMultiplier: 1.6,// gap-since-last-swim vs. typical gap, before nudging "time to swim"
};

// Semantic categories — color is always paired with an icon + title/text, never the sole signal.
const INSIGHT_CATEGORIES = {
  positive:     { color: "#6FCF97", bg: "rgba(111,207,151,0.12)", Icon: TrendingUp,     label: "Improving" },
  neutral:      { color: "#56CCF2", bg: "rgba(86,204,242,0.12)",  Icon: Info,           label: "Steady" },
  warning:      { color: "#F2994A", bg: "rgba(242,153,74,0.12)",  Icon: TrendingDown,   label: "Watch" },
  achievement:  { color: "#F2C94C", bg: "rgba(242,201,76,0.14)",  Icon: Award,          label: "Personal best" },
  reminder:     { color: "#BB86FC", bg: "rgba(187,134,252,0.12)", Icon: Clock,          label: "Reminder" },
  insufficient: { color: "#6b7078", bg: "rgba(107,112,120,0.10)", Icon: Info,           label: "Building baseline" },
};

const avgOf = (arr) => (arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : null);
// Median of comparable recent/baseline values — preferred over a plain mean as the primary
// basis for interpretation, since a single unusual session, drill set, or recording glitch can
// skew a mean but has much less effect on a median. Standard deviation is intentionally not used
// here to decide whether the swimmer improved; it remains available elsewhere only as an
// optional secondary/confidence signal (e.g. the Compare chart's z-score axis).
const medianOf = (arr) => {
  if (!arr.length) return null;
  const sorted = [...arr].sort((a, b) => a - b);
  const mid = Math.floor(sorted.length / 2);
  return sorted.length % 2 ? sorted[mid] : (sorted[mid - 1] + sorted[mid]) / 2;
};

// Splits a chronological (oldest→newest) series of {date, v} points into a "recent window"
// (last N) and everything before it as "baseline". Returns null when there isn't enough data
// on both sides to make a responsible comparison. Uses the median of each window as the
// representative "typical" value (see medianOf above) rather than a mean.
function splitRecentBaseline(points, recentWindow, minBaseline) {
  if (points.length < recentWindow + minBaseline) return null;
  const recent = points.slice(-recentWindow);
  const baseline = points.slice(0, points.length - recentWindow);
  return { recent, baseline, recentAvg: medianOf(recent.map((p) => p.v)), baselineAvg: medianOf(baseline.map((p) => p.v)) };
}

const pctChange = (recentAvg, baselineAvg) => (baselineAvg == null || baselineAvg === 0 || recentAvg == null ? null : (recentAvg - baselineAvg) / baselineAvg);

// Extracts a clean, null-free, oldest→newest {date, v} series for one stroke's metric (or the
// whole-session series when stroke is null) from trendData.
function extractSeries(trendData, stroke, field) {
  const key = stroke ? `${field}_${stroke}` : field;
  return trendData.map((d) => ({ date: d.date, v: d[key] })).filter((p) => p.v != null);
}

// ---- 1. Personal best -----------------------------------------------------------------------
// Only fires when the LATEST comparable point is strictly the best in its own history — never
// inferred from a short recent window.
function generatePersonalBestInsight(strokeLabel, paceSeries, swolfSeries) {
  const th = INSIGHT_THRESHOLDS;
  const checkBest = (series, label, unitFmt) => {
    if (series.length < th.minPointsForPB) return null;
    const latest = series[series.length - 1];
    const priorBest = Math.min(...series.slice(0, -1).map((p) => p.v));
    if (latest.v < priorBest) {
      return { label, value: latest.v, unitFmt };
    }
    return null;
  };
  const paceBest = checkBest(paceSeries, "pace", fmtPace100);
  if (paceBest) {
    return {
      id: "pb-pace", category: "achievement", priority: 1, confidence: "high",
      title: `New ${strokeLabel} pace best`,
      message: `Your latest ${strokeLabel.toLowerCase()} pace of ${fmtPace100(paceBest.value)} is the fastest in your available history for this stroke.`,
      metrics: [{ label: "Pace", value: fmtPace100(paceBest.value) }],
    };
  }
  const swolfBest = checkBest(swolfSeries, "swolf", (v) => Math.round(v));
  if (swolfBest) {
    return {
      id: "pb-swolf", category: "achievement", priority: 1, confidence: "high",
      title: "New efficiency best",
      message: `This is your lowest comparable SWOLF for ${strokeLabel.toLowerCase()} — ${Math.round(swolfBest.value)}, better than anything else in your history for this stroke.`,
      metrics: [{ label: "SWOLF", value: Math.round(swolfBest.value) }],
    };
  }
  return null;
}

// ---- 2. Medium-term improvement (~6 weeks) --------------------------------------------------
function generateImprovementInsight(strokeLabel, paceSeries, swolfSeries, dpsSeries, weeks) {
  const th = INSIGHT_THRESHOLDS;
  if (paceSeries.length < th.minPointsForPB) return null;
  const cutoff = new Date(); cutoff.setDate(cutoff.getDate() - weeks * 7);
  const cutoffStr = toISODate(cutoff);
  const recent = paceSeries.filter((p) => p.date >= cutoffStr);
  const older = paceSeries.filter((p) => p.date < cutoffStr);
  if (recent.length < 2 || older.length < 2) return null;
  const recentAvg = medianOf(recent.map((p) => p.v)), olderAvg = medianOf(older.map((p) => p.v));
  const pct = pctChange(recentAvg, olderAvg);
  if (pct == null || Math.abs(pct) < th.paceMeaningfulPct) return null;
  const improving = pct < 0; // lower pace = faster
  const pctAbs = Math.round(Math.abs(pct) * 1000) / 10;

  // Check whether swolf/dps moved in a way consistent with an efficiency story over the same window.
  const swolfRecent = swolfSeries.filter((p) => p.date >= cutoffStr), swolfOlder = swolfSeries.filter((p) => p.date < cutoffStr);
  const dpsRecent = dpsSeries.filter((p) => p.date >= cutoffStr), dpsOlder = dpsSeries.filter((p) => p.date < cutoffStr);
  const swolfPct = swolfRecent.length >= 2 && swolfOlder.length >= 2 ? pctChange(medianOf(swolfRecent.map((p) => p.v)), medianOf(swolfOlder.map((p) => p.v))) : null;
  const dpsPct = dpsRecent.length >= 2 && dpsOlder.length >= 2 ? pctChange(medianOf(dpsRecent.map((p) => p.v)), medianOf(dpsOlder.map((p) => p.v))) : null;

  if (improving) {
    let extra = "";
    if (swolfPct != null && swolfPct < -th.swolfMeaningfulPct && dpsPct != null && dpsPct > th.dpsMeaningfulPct) {
      extra = " SWOLF decreased and distance per stroke increased over the same window — that combination is consistent with improved efficiency rather than just swimming harder.";
    } else if (swolfPct != null && swolfPct < -th.swolfMeaningfulPct) {
      extra = " SWOLF also decreased over the same window, which points toward better efficiency.";
    }
    return {
      id: "improve-pace", category: "positive", priority: 2, confidence: recent.length >= 3 ? "high" : "medium",
      title: "You're getting faster",
      message: `Your ${strokeLabel.toLowerCase()} pace improved ${pctAbs}% over the last ${weeks} weeks compared to your baseline before that.${extra}`,
      metrics: [{ label: "Pace", value: `${pctAbs}% faster` }],
    };
  }
  return {
    id: "decline-pace", category: "warning", priority: 2, confidence: recent.length >= 3 ? "high" : "medium",
    title: "Pace has slipped recently",
    message: `Your ${strokeLabel.toLowerCase()} pace is ${pctAbs}% slower over the last ${weeks} weeks compared to your baseline before that. Worth keeping an eye on, not necessarily a problem.`,
    metrics: [{ label: "Pace", value: `${pctAbs}% slower` }],
  };
}

// ---- 3. Strong / weak latest session ---------------------------------------------------------
function generateLatestSessionInsight(strokeLabel, paceSeries) {
  const th = INSIGHT_THRESHOLDS;
  const split = splitRecentBaseline(paceSeries, 1, th.recentWindow + th.minBaselineWindow - 1);
  if (!split) return null;
  const baselineRecent = paceSeries.slice(-(th.recentWindow + 1), -1); // the window just before the latest
  if (baselineRecent.length < 2) return null;
  const latest = paceSeries[paceSeries.length - 1];
  const baselineAvg = medianOf(baselineRecent.map((p) => p.v));
  const pct = pctChange(latest.v, baselineAvg);
  if (pct == null || Math.abs(pct) < th.paceMeaningfulPct) return null;
  const pctAbs = Math.round(Math.abs(pct) * 1000) / 10;
  if (pct < 0) {
    return {
      id: "latest-strong", category: "positive", priority: 3, confidence: "medium",
      title: "Strong latest session",
      message: `Your latest ${strokeLabel.toLowerCase()} swim was faster than your recent baseline — pace was ${pctAbs}% quicker than your last few sessions.`,
      metrics: [{ label: "Pace", value: `${pctAbs}% faster than recent baseline` }],
    };
  }
  return {
    id: "latest-weak", category: "warning", priority: 3, confidence: "medium",
    title: "Slower than your recent average",
    message: `Your latest ${strokeLabel.toLowerCase()} swim was ${pctAbs}% slower than your last few sessions. Could just be an off day — one session isn't a trend.`,
    metrics: [{ label: "Pace", value: `${pctAbs}% slower than recent baseline` }],
  };
}

// ---- 5/6. Pace vs. stroke rate, pace vs. stroke distance --------------------------------------
function generatePaceRelationshipInsight(strokeLabel, paceSeries, otherSeries, otherField, weeks) {
  const th = INSIGHT_THRESHOLDS;
  const cutoff = new Date(); cutoff.setDate(cutoff.getDate() - weeks * 7);
  const cutoffStr = toISODate(cutoff);
  const pRecent = paceSeries.filter((p) => p.date >= cutoffStr), pOlder = paceSeries.filter((p) => p.date < cutoffStr);
  const oRecent = otherSeries.filter((p) => p.date >= cutoffStr), oOlder = otherSeries.filter((p) => p.date < cutoffStr);
  if (pRecent.length < 2 || pOlder.length < 2 || oRecent.length < 2 || oOlder.length < 2) return null;
  const pacePct = pctChange(medianOf(pRecent.map((p) => p.v)), medianOf(pOlder.map((p) => p.v)));
  const otherPct = pctChange(medianOf(oRecent.map((p) => p.v)), medianOf(oOlder.map((p) => p.v)));
  if (pacePct == null || otherPct == null || pacePct >= -th.paceMeaningfulPct) return null; // only interpret when pace actually improved
  const pacePctAbs = Math.round(Math.abs(pacePct) * 1000) / 10;

  if (otherField === "cadence") {
    const th2 = th.cadenceMeaningfulPct;
    if (Math.abs(otherPct) < th2) {
      return {
        id: "rel-strokerate-stable", category: "positive", priority: 5, confidence: "medium",
        title: "Faster without higher turnover",
        message: `Your ${strokeLabel.toLowerCase()} pace improved ${pacePctAbs}% while stroke rate stayed about the same. That suggests the improvement is coming from covering more distance per stroke rather than just turning over faster.`,
        metrics: [{ label: "Pace", value: `${pacePctAbs}% faster` }, { label: "Stroke rate", value: "stable" }],
      };
    }
    if (otherPct > th2) {
      return {
        id: "rel-strokerate-up", category: "neutral", priority: 5, confidence: "medium",
        title: "Faster, with more turnover",
        message: `Your ${strokeLabel.toLowerCase()} pace improved ${pacePctAbs}%, but stroke rate also increased. You're moving faster, though the data suggests greater turnover is contributing to it.`,
        metrics: [{ label: "Pace", value: `${pacePctAbs}% faster` }, { label: "Stroke rate", value: "up" }],
      };
    }
  }
  if (otherField === "dps") {
    const th2 = th.dpsMeaningfulPct;
    if (otherPct > th2) {
      return {
        id: "rel-strokedist-up", category: "positive", priority: 6, confidence: "medium",
        title: "More distance per stroke",
        message: `You're swimming ${strokeLabel.toLowerCase()} ${pacePctAbs}% faster while covering more distance with each stroke. This is consistent with improving efficiency.`,
        metrics: [{ label: "Pace", value: `${pacePctAbs}% faster` }, { label: "Distance/stroke", value: "up" }],
      };
    }
    if (otherPct < -th2) {
      return {
        id: "rel-strokedist-down", category: "neutral", priority: 6, confidence: "medium",
        title: "Faster, but not necessarily more efficient",
        message: `Your ${strokeLabel.toLowerCase()} pace improved ${pacePctAbs}%, although distance per stroke decreased. The improvement may be coming from increased stroke turnover rather than efficiency.`,
        metrics: [{ label: "Pace", value: `${pacePctAbs}% faster` }, { label: "Distance/stroke", value: "down" }],
      };
    }
  }
  return null;
}

// ---- 7. Pace vs. heart rate --------------------------------------------------------------------
// HR is only ever recorded whole-session in this app (not per-stroke), so this always compares
// whole-session pace against whole-session HR — never a specific stroke's pace.
function generateHeartRateInsight(overallPaceSeries, hrSeries, weeks, strokeFilterActive) {
  const th = INSIGHT_THRESHOLDS;
  const cutoff = new Date(); cutoff.setDate(cutoff.getDate() - weeks * 7);
  const cutoffStr = toISODate(cutoff);
  const pRecent = overallPaceSeries.filter((p) => p.date >= cutoffStr), pOlder = overallPaceSeries.filter((p) => p.date < cutoffStr);
  const hRecent = hrSeries.filter((p) => p.date >= cutoffStr), hOlder = hrSeries.filter((p) => p.date < cutoffStr);
  if (pRecent.length < 2 || pOlder.length < 2 || hRecent.length < 2 || hOlder.length < 2) return null;
  const pacePct = pctChange(medianOf(pRecent.map((p) => p.v)), medianOf(pOlder.map((p) => p.v)));
  if (pacePct == null || pacePct >= -th.paceMeaningfulPct) return null;
  const hrRecentAvg = medianOf(hRecent.map((p) => p.v)), hrOlderAvg = medianOf(hOlder.map((p) => p.v));
  const hrDiff = hrRecentAvg - hrOlderAvg;
  const pacePctAbs = Math.round(Math.abs(pacePct) * 1000) / 10;
  const caveat = strokeFilterActive ? " (heart rate reflects the whole session, not just this stroke)" : "";
  if (Math.abs(hrDiff) < th.hrMeaningfulBpm) {
    return {
      id: "hr-similar-effort", category: "positive", priority: 7, confidence: "medium",
      title: "Faster at similar effort",
      message: `Your recent pace is ${pacePctAbs}% faster while average heart rate stayed close to your usual baseline${caveat}. That's a positive sign for aerobic performance.`,
      metrics: [{ label: "Pace", value: `${pacePctAbs}% faster` }, { label: "Avg HR", value: "~unchanged" }],
    };
  }
  if (hrDiff > th.hrMeaningfulBpm) {
    return {
      id: "hr-more-effort", category: "neutral", priority: 7, confidence: "medium",
      title: "Faster, but with more effort",
      message: `Pace improved ${pacePctAbs}%, although average heart rate was also higher than your normal baseline${caveat}.`,
      metrics: [{ label: "Pace", value: `${pacePctAbs}% faster` }, { label: "Avg HR", value: `+${Math.round(hrDiff)} bpm` }],
    };
  }
  return null;
}

// ---- 8. Training frequency / "time to swim" ----------------------------------------------------
function generateFrequencyInsight(chronSessions, todayStr) {
  if (chronSessions.length < 3) return null;
  const recent = chronSessions.slice(-8);
  const gaps = [];
  for (let i = 1; i < recent.length; i++) gaps.push(dayDiff(recent[i - 1].date, recent[i].date));
  if (gaps.length < 2) return null;
  const sortedGaps = [...gaps].sort((a, b) => a - b);
  const medianGap = sortedGaps[Math.floor(sortedGaps.length / 2)];
  if (medianGap <= 0) return null;
  const daysSinceLast = dayDiff(chronSessions[chronSessions.length - 1].date, todayStr);
  if (daysSinceLast < medianGap * INSIGHT_THRESHOLDS.frequencyGapMultiplier || daysSinceLast < 3) return null;
  const perWeek = Math.max(1, Math.round((7 / medianGap) * 10) / 10);
  return {
    id: "frequency-gap", category: "reminder", priority: 8, confidence: "medium",
    title: "Time to swim",
    message: `You haven't logged a swim in ${daysSinceLast} days. You normally swim around ${perWeek} time${perWeek === 1 ? "" : "s"} per week — a swim today would bring you back toward your usual rhythm.`,
    metrics: [{ label: "Days since last swim", value: daysSinceLast }],
  };
}

// ---- 9. Compare chart trend interpretation -----------------------------------------------------
// Turns the currently-displayed Compare chart (primary metric = pace or SWOLF, both
// "lower is better"; secondary metric = cadence, distance/stroke, or HR) into one short,
// plain-language line. Deliberately mirrors the raw/median-based approach used everywhere else
// in Insights (see medianOf above) rather than reasoning from standard deviation — the chart's
// z-score axis is a display technique only, not part of this decision.
function generateCompareTrendInterpretation(compareMode, primaryPoints, secPoints, weeks) {
  const th = INSIGHT_THRESHOLDS;
  const cutoff = new Date(); cutoff.setDate(cutoff.getDate() - weeks * 7);
  const cutoffStr = toISODate(cutoff);
  const pRecent = primaryPoints.filter((p) => p.date >= cutoffStr), pOlder = primaryPoints.filter((p) => p.date < cutoffStr);
  const sRecent = secPoints.filter((p) => p.date >= cutoffStr), sOlder = secPoints.filter((p) => p.date < cutoffStr);
  if (pRecent.length < 2 || pOlder.length < 2 || sRecent.length < 2 || sOlder.length < 2) return null;

  const primaryRecentMed = medianOf(pRecent.map((p) => p.v)), primaryOlderMed = medianOf(pOlder.map((p) => p.v));
  const primaryPct = pctChange(primaryRecentMed, primaryOlderMed); // negative = improved (pace & SWOLF are both lower-is-better)
  const primaryTh = compareMode === "swolfhr" ? th.swolfMeaningfulPct : th.paceMeaningfulPct;
  const primaryImproved = primaryPct != null && primaryPct <= -primaryTh;
  const primaryWorse = primaryPct != null && primaryPct >= primaryTh;
  const primaryPctAbs = primaryPct != null ? Math.round(Math.abs(primaryPct) * 1000) / 10 : null;

  const isHrSecondary = compareMode === "hr" || compareMode === "swolfhr";
  const secRecentMed = medianOf(sRecent.map((p) => p.v)), secOlderMed = medianOf(sOlder.map((p) => p.v));
  let secUp, secDown, secPctAbs;
  if (isHrSecondary) {
    const diff = secRecentMed - secOlderMed;
    secUp = diff > th.hrMeaningfulBpm;
    secDown = diff < -th.hrMeaningfulBpm;
  } else {
    const secPct = pctChange(secRecentMed, secOlderMed);
    const secTh = compareMode === "cadence" ? th.cadenceMeaningfulPct : th.dpsMeaningfulPct;
    secUp = secPct != null && secPct > secTh;
    secDown = secPct != null && secPct < -secTh;
    secPctAbs = secPct != null ? Math.round(Math.abs(secPct) * 1000) / 10 : null;
  }
  const secStable = !secUp && !secDown;

  // ---- Pace + Stroke Rate ----
  if (compareMode === "cadence") {
    if (primaryImproved && secStable) return { category: "positive", headline: "Faster without higher turnover.", detail: `Pace improved ${primaryPctAbs}% while stroke rate stayed about the same.` };
    if (primaryImproved && secUp) return { category: "neutral", headline: "Faster through turnover.", detail: `Pace improved ${primaryPctAbs}%, but stroke rate increased as well.` };
    if (primaryImproved && secDown) return { category: "positive", headline: "Faster with a longer stroke.", detail: `Pace improved ${primaryPctAbs}% while stroke rate decreased — likely more distance per stroke.` };
    if (!primaryWorse && secUp) return { category: "neutral", headline: "Turnover up, speed unchanged.", detail: "Stroke rate increased without a meaningful pace improvement." };
    if (primaryWorse && secStable) return { category: "warning", headline: "Pace has slipped.", detail: `Pace is ${primaryPctAbs}% slower while stroke rate stayed about the same.` };
    if (primaryWorse) return { category: "warning", headline: "Slower, turnover changed too.", detail: `Pace is ${primaryPctAbs}% slower, alongside a change in stroke rate.` };
    return { category: "neutral", headline: "Steady.", detail: "Pace and stroke rate have both stayed about the same recently." };
  }

  // ---- Pace + Stroke Distance ----
  if (compareMode === "dps") {
    if (primaryImproved && secUp) return { category: "positive", headline: "More efficient.", detail: `Pace improved ${primaryPctAbs}% while distance per stroke increased.` };
    if (primaryImproved && secDown) return { category: "neutral", headline: "Faster, but not more efficient.", detail: `Pace improved ${primaryPctAbs}% while distance per stroke decreased.` };
    if (primaryImproved && secStable) return { category: "positive", headline: "Efficiency is stable.", detail: `Pace improved ${primaryPctAbs}% while distance per stroke stayed about the same.` };
    if (!primaryWorse && secUp) return { category: "positive", headline: "More efficient, pace steady.", detail: "Distance per stroke increased without a meaningful pace change yet." };
    if (!primaryWorse && secDown) return { category: "warning", headline: "Less efficient, pace steady.", detail: "Distance per stroke decreased without a meaningful pace change." };
    if (primaryWorse && secDown) return { category: "warning", headline: "Slower and less efficient.", detail: "Pace slipped alongside a drop in distance per stroke." };
    if (primaryWorse) return { category: "warning", headline: "Pace has slipped.", detail: `Pace is ${primaryPctAbs}% slower.` };
    return { category: "neutral", headline: "Steady.", detail: "Pace and distance per stroke have both stayed about the same recently." };
  }

  // ---- Pace + HR ----
  if (compareMode === "hr") {
    if (primaryImproved && secStable) return { category: "positive", headline: "Faster at similar effort.", detail: `Pace improved ${primaryPctAbs}% while heart rate stayed close to its usual level.` };
    if (primaryImproved && secDown) return { category: "positive", headline: "Faster with less effort.", detail: `Pace improved ${primaryPctAbs}% while heart rate was also lower than usual.` };
    if (primaryImproved && secUp) return { category: "neutral", headline: "Faster, but with more effort.", detail: `Pace improved ${primaryPctAbs}%, though heart rate was also higher than usual.` };
    if (!primaryWorse && secUp) return { category: "warning", headline: "More effort, speed unchanged.", detail: "Heart rate increased without a meaningful pace improvement." };
    if (primaryWorse) return { category: "warning", headline: "Pace has slipped.", detail: `Pace is ${primaryPctAbs}% slower.` };
    return { category: "neutral", headline: "Steady.", detail: "Pace and heart rate have both stayed about the same recently." };
  }

  // ---- SWOLF + HR ----
  if (primaryImproved && secStable) return { category: "positive", headline: "More efficient at similar effort.", detail: "Stroke efficiency improved while heart rate stayed close to its usual level." };
  if (primaryImproved && secDown) return { category: "positive", headline: "More efficient with less effort.", detail: "Stroke efficiency improved while heart rate was also lower than usual." };
  if (primaryImproved && secUp) return { category: "neutral", headline: "More efficient, but with more effort.", detail: "Stroke efficiency improved, though heart rate was also higher than usual." };
  if (!primaryWorse && secUp) return { category: "warning", headline: "More effort, efficiency unchanged.", detail: "Heart rate increased without a meaningful efficiency improvement." };
  if (primaryWorse) return { category: "warning", headline: "Efficiency has slipped.", detail: `SWOLF is ${primaryPctAbs}% worse than its recent baseline.` };
  return { category: "neutral", headline: "Steady.", detail: "Efficiency and heart rate have both stayed about the same recently." };
}

// ---- 10. Compare chart — single selected-session interpretation --------------------------------
// Mirrors generateCompareTrendInterpretation's category logic, but compares one tapped session's
// raw values against the median of its other comparable sessions (same stroke, same chart data)
// instead of a recent-vs-older window. Returns null when there aren't at least 2 other comparable
// sessions to form a responsible baseline.
function generateCompareSessionInterpretation(compareMode, strokeLabel, selectedPrimary, selectedSecondary, baselinePrimaryVals, baselineSecondaryVals, primaryFmt, otherFmt) {
  const th = INSIGHT_THRESHOLDS;
  if (selectedPrimary == null || selectedSecondary == null) return null;
  if (baselinePrimaryVals.length < 2 || baselineSecondaryVals.length < 2) return null;

  const baselinePrimaryMed = medianOf(baselinePrimaryVals);
  const baselineSecondaryMed = medianOf(baselineSecondaryVals);
  const primaryPct = pctChange(selectedPrimary, baselinePrimaryMed);
  const primaryTh = compareMode === "swolfhr" ? th.swolfMeaningfulPct : th.paceMeaningfulPct;
  const primaryImproved = primaryPct != null && primaryPct <= -primaryTh;
  const primaryWorse = primaryPct != null && primaryPct >= primaryTh;
  const primaryPctAbs = primaryPct != null ? Math.round(Math.abs(primaryPct) * 1000) / 10 : null;

  const isHr = compareMode === "hr" || compareMode === "swolfhr";
  let secUp, secDown;
  if (isHr) {
    const diff = selectedSecondary - baselineSecondaryMed;
    secUp = diff > th.hrMeaningfulBpm;
    secDown = diff < -th.hrMeaningfulBpm;
  } else {
    const secPct = pctChange(selectedSecondary, baselineSecondaryMed);
    const secTh = compareMode === "cadence" ? th.cadenceMeaningfulPct : th.dpsMeaningfulPct;
    secUp = secPct != null && secPct > secTh;
    secDown = secPct != null && secPct < -secTh;
  }
  const secStable = !secUp && !secDown;

  const modeWords = {
    cadence: { noun: "stroke rate", up: "increased", down: "decreased", stable: "stayed close to normal" },
    dps: { noun: "distance per stroke", up: "increased", down: "decreased", stable: "stayed about the same" },
    hr: { noun: "heart rate", up: "was higher than usual", down: "was lower than usual", stable: "stayed close to your usual level" },
    swolfhr: { noun: "heart rate", up: "was higher than usual", down: "was lower than usual", stable: "stayed close to your usual level" },
  }[compareMode];
  const secPhrase = secUp ? `${modeWords.noun} ${modeWords.up}` : secDown ? `${modeWords.noun} ${modeWords.down}` : `${modeWords.noun} ${modeWords.stable}`;

  const primaryWord = compareMode === "swolfhr" ? "Efficiency" : "Pace";
  const primaryDirWord = primaryImproved ? "faster" : primaryWorse ? "slower" : "close to typical";
  const primaryDetail = primaryPctAbs != null && (primaryImproved || primaryWorse)
    ? `${primaryWord} was ${primaryFmt(selectedPrimary)}, around ${primaryPctAbs}% ${primaryDirWord} than your recent ${strokeLabel.toLowerCase()} baseline (${primaryFmt(baselinePrimaryMed)})`
    : `${primaryWord} was ${primaryFmt(selectedPrimary)}, close to your recent ${strokeLabel.toLowerCase()} baseline (${primaryFmt(baselinePrimaryMed)})`;
  const detail = `${primaryDetail}, while ${secPhrase} (${otherFmt(selectedSecondary)} vs ${otherFmt(baselineSecondaryMed)}).`;

  const headlines = {
    cadence: {
      "improved-stable": ["positive", "Faster without higher turnover."],
      "improved-up": ["neutral", "Faster, with more turnover."],
      "improved-down": ["positive", "Faster with a longer stroke."],
      "steady-up": ["neutral", "More turnover, speed unchanged."],
      "steady-down": ["neutral", "Less turnover, speed unchanged."],
      "steady-stable": ["neutral", "Close to your usual swim."],
      "worse-any": ["warning", "Slower than usual."],
    },
    dps: {
      "improved-up": ["positive", "Efficiency gain."],
      "improved-down": ["neutral", "Faster, but not more efficient."],
      "improved-stable": ["positive", "Efficiency is stable."],
      "steady-up": ["positive", "More efficient, pace steady."],
      "steady-down": ["warning", "Less efficient, pace steady."],
      "steady-stable": ["neutral", "Close to your usual swim."],
      "worse-any": ["warning", "Slower than usual."],
    },
    hr: {
      "improved-stable": ["positive", "Faster at similar effort."],
      "improved-down": ["positive", "Faster with less effort."],
      "improved-up": ["neutral", "Faster, but with more effort."],
      "steady-up": ["warning", "More effort, speed unchanged."],
      "steady-down": ["neutral", "Less effort, speed unchanged."],
      "steady-stable": ["neutral", "Close to your usual swim."],
      "worse-any": ["warning", "Slower than usual."],
    },
  };
  headlines.swolfhr = {
    "improved-stable": ["positive", "More efficient at similar effort."],
    "improved-down": ["positive", "More efficient with less effort."],
    "improved-up": ["neutral", "More efficient, but with more effort."],
    "steady-up": ["warning", "More effort, efficiency unchanged."],
    "steady-down": ["neutral", "Less effort, efficiency unchanged."],
    "steady-stable": ["neutral", "Close to your usual swim."],
    "worse-any": ["warning", "Efficiency slipped."],
  };

  const secKey = secUp ? "up" : secDown ? "down" : "stable";
  const key = primaryWorse ? "worse-any" : primaryImproved ? `improved-${secKey}` : `steady-${secKey}`;
  const [category, headline] = headlines[compareMode][key] || ["neutral", "Close to your usual swim."];

  return { category, headline, detail };
}

// ---- Orchestration: gather everything applicable, rank, dedupe, return top 1-3 -----------------
function buildSwimInsights({ chronSessions, trendData, activeStroke, strokeLabel, todayStr, strokeFilterActive }) {
  if (!chronSessions || chronSessions.length === 0) return [];
  if (chronSessions.length === 1) {
    return [{
      id: "baseline", category: "insufficient", priority: 99, confidence: "n/a",
      title: "Build your baseline",
      message: "Keep logging swims. Once MatWorkout has a few comparable sessions, Insights will start identifying meaningful pace, efficiency and consistency trends.",
      metrics: [],
    }];
  }
  if (!activeStroke) return [];
  const paceSeries = extractSeries(trendData, activeStroke, "pace100");
  const swolfSeries = extractSeries(trendData, activeStroke, "swolf");
  const cadenceSeries = extractSeries(trendData, activeStroke, "cadence");
  const dpsSeries = extractSeries(trendData, activeStroke, "dps");
  const overallPaceSeries = extractSeries(trendData, null, "pace100");
  const hrSeries = extractSeries(trendData, null, "avgHR");

  if (paceSeries.length < 2) {
    return [{
      id: "baseline", category: "insufficient", priority: 99, confidence: "n/a",
      title: "Build your baseline",
      message: `Not enough comparable ${strokeLabel.toLowerCase()} sessions yet to interpret a trend. Keep logging and Insights will fill in.`,
      metrics: [],
    }];
  }

  const weeks = INSIGHT_THRESHOLDS.mediumTermWeeks;
  const candidates = [
    generatePersonalBestInsight(strokeLabel, paceSeries, swolfSeries),
    generateImprovementInsight(strokeLabel, paceSeries, swolfSeries, dpsSeries, weeks),
    generateLatestSessionInsight(strokeLabel, paceSeries),
    generatePaceRelationshipInsight(strokeLabel, paceSeries, cadenceSeries, "cadence", weeks),
    generatePaceRelationshipInsight(strokeLabel, paceSeries, dpsSeries, "dps", weeks),
    generateHeartRateInsight(overallPaceSeries, hrSeries, weeks, strokeFilterActive),
    generateFrequencyInsight(chronSessions, todayStr),
  ].filter(Boolean);

  // Dedup: a personal-best or medium-term improvement already tells the "getting faster" story,
  // so suppress the more granular single-session verdict to avoid three cards saying the same thing.
  const hasBigStory = candidates.some((c) => c.id === "pb-pace" || c.id === "improve-pace");
  const deduped = candidates.filter((c) => !(hasBigStory && (c.id === "latest-strong")));

  deduped.sort((a, b) => a.priority - b.priority);
  const top = deduped.slice(0, 3);
  if (top.length === 0) {
    // There IS comparable data for this stroke (we got past the paceSeries.length < 2 check
    // above), it just hasn't cleared any individual insight's threshold yet — an honest
    // "still building" state, not the same as "no data at all".
    return [{
      id: "baseline", category: "insufficient", priority: 99, confidence: "n/a",
      title: "Building your baseline",
      message: `You have ${paceSeries.length} comparable ${strokeLabel.toLowerCase()} session${paceSeries.length === 1 ? "" : "s"} logged so far — not quite enough yet to call a meaningful trend. Keep logging and Insights will fill in here.`,
      metrics: [],
    }];
  }
  return top;
}

function SwimmingTab({ isMobile }) {
  const [sessions, setSessions] = useState(null);
  const [expandedId, setExpandedId] = useState(null);
  const [strokeFilter, setStrokeFilter] = useState("all");
  const [expandedMetrics, setExpandedMetrics] = useState(() => new Set()); // set of trend-card keys currently expanded
  const [swimTimeView, setSwimTimeView] = useState("day"); // "day" (per session) or "week" (aggregated) — scoped to this tab only
  const [chartOverlaySel, setChartOverlaySel] = useState({ pace: "none", swolf: "none", cadence: "none", dps: "none" }); // per-chart overlay choice
  const [compareMode, setCompareMode] = useState("cadence"); // "cadence" | "dps" — Pace+StrokeRate vs Pace+StrokeDistance overlay
  const [selectedComparePoint, setSelectedComparePoint] = useState(null); // date string of a tapped Compare chart dot, or null for "overall trend" view
  const [showCompareInfo, setShowCompareInfo] = useState(false); // toggles the Compare chart's "what is this" info popover
  const [editingDistanceFor, setEditingDistanceFor] = useState(null); // session id currently being corrected
  const [distanceDraft, setDistanceDraft] = useState("");
  const [activityStrokeFilter, setActivityStrokeFilter] = useState({}); // { [sessionId]: strokeName | "all" } — per-session pace chart filter
  const [openRepsFor, setOpenRepsFor] = useState({}); // { [sessionId]: bool } — Reps/sets sub-section, collapsed by default
  const [openLengthsFor, setOpenLengthsFor] = useState({}); // { [sessionId]: bool } — Length by length sub-section, collapsed by default
  const [metricValueMode, setMetricValueMode] = useState("latest"); // "latest" | "avg6" — headline number on each Trends card
  const [swimSection, setSwimSection] = useState("dashboard"); // "dashboard" | "trends" | "compare" | "radar" — the 4 tabs within the Swim tab. Session Detail
                                                              // lives below the switcher now, outside all three (see render, item 2).
  const [categoryFilter, setCategoryFilter] = useState("all"); // "all" | "workout" | "csstest" — filters Trends + Compare only (Session
                                                                 // Detail below always shows everything). Derived straight from isCssTest,
                                                                 // no separate category field (see categoryValueOf below).
  const [radarMetricKeys, setRadarMetricKeys] = useState(() => new Set(["pace", "swolf", "cadence", "avgHR", "energy100"])); // Web chart axis picker
  const [radarCurrentId, setRadarCurrentId] = useState(null); // session id for the radar's "Current" polygon — null falls back to the latest session
  const [radarBaselineId, setRadarBaselineId] = useState("avg6"); // "avg6" (last-6-session average) or a specific session id
  const SWIM_KEY = "swim-sessions-v1";

  useEffect(() => {
    (async () => {
      try {
        const res = await window.storage.get(SWIM_KEY, false);
        const raw = res && res.value ? JSON.parse(res.value) : [];
        const { sessions: fixed, changed } = backfillSwimSessions(raw);
        setSessions(fixed);
        if (changed) { try { await window.storage.set(SWIM_KEY, JSON.stringify(fixed), false); } catch (_) {} }
      } catch (e) {
        setSessions([]);
      }
    })();
  }, []);

  const persist = async (next) => {
    setSessions(next);
    try { await window.storage.set(SWIM_KEY, JSON.stringify(next), false); } catch (_) {}
  };

  const deleteSession = async (id) => {
    const next = (sessions || []).filter((s) => s.id !== id);
    await persist(next);
  };

  // Manual distance correction (Option A: correct in-app rather than rebuild the .FIT file).
  // The app already treats distance as a computed value (valid active lengths × pool length),
  // never a literal stored FIT field, so a manual override is consistent with how it already
  // works — not a workaround. Recomputes and PERSISTS distance + pace so every card, chart,
  // and PR that reads s.distance/s.pace100Overall picks up the correction automatically,
  // without needing every read-site in the app to know about an override. The original
  // FIT-derived figure is kept in distanceCorrection for transparency and is only captured
  // once, so re-correcting a second time doesn't lose the true original.
  const correctDistance = async (id) => {
    const newDistance = parseFloat(distanceDraft);
    if (!Number.isFinite(newDistance) || newDistance <= 0) { setEditingDistanceFor(null); return; }
    const next = (sessions || []).map((s) => {
      if (s.id !== id) return s;
      const originalDistance = s.distanceCorrection ? s.distanceCorrection.originalDistance : s.distance;
      const newPace100 = s.swimTimeSec > 0 && newDistance > 0 ? (s.swimTimeSec / newDistance) * 100 : null;
      return {
        ...s,
        distance: Math.round(newDistance * 100) / 100,
        pace100Overall: newPace100,
        distanceCorrection: { originalDistance, correctedAt: new Date().toISOString() },
      };
    });
    await persist(next);
    setEditingDistanceFor(null);
    setDistanceDraft("");
  };

  const resetDistanceCorrection = async (id) => {
    const next = (sessions || []).map((s) => {
      if (s.id !== id || !s.distanceCorrection) return s;
      const restoredDistance = s.distanceCorrection.originalDistance;
      const restoredPace = s.swimTimeSec > 0 && restoredDistance ? (s.swimTimeSec / restoredDistance) * 100 : null;
      return { ...s, distance: restoredDistance, pace100Overall: restoredPace, distanceCorrection: null };
    });
    await persist(next);
  };

  // Applies a length-level edit (stroke reclassification, exclude/include, IDLE<->ACTIVE) via
  // an updater function over one session's `lengths` array, then re-derives EVERY dependent
  // metric (distance, swim/rest time, pace, strokeStats, reps) from scratch through
