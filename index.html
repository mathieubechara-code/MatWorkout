function levenshtein(a, b) {
  if (a === b) return 0;
  const m = a.length, n = b.length;
  if (!m) return n;
  if (!n) return m;
  const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
  for (let i = 0; i <= m; i++) dp[i][0] = i;
  for (let j = 0; j <= n; j++) dp[0][j] = j;
  for (let i = 1; i <= m; i++) {
    for (let j = 1; j <= n; j++) {
      dp[i][j] = a[i - 1] === b[j - 1] ? dp[i - 1][j - 1] : 1 + Math.min(dp[i - 1][j], dp[i][j - 1], dp[i - 1][j - 1]);
    }
  }
  return dp[m][n];
}

// Fuzzy-matches a pasted header line against the full exercise reference library — not just
// your 7 tracked fields — so both typos and exercises you haven't logged before get
// recognized. Tries exact alias substrings first (longest alias wins), then falls back to
// edit-distance matching for typos (e.g. "wide grip pul ups").
function matchExercise(header, library) {
  const lib = library || EXERCISE_LIBRARY;
  const norm = header.toLowerCase().replace(/[^a-z0-9 ]/g, " ").replace(/\s+/g, " ").trim();
  if (!norm) return null;
  let best = null, bestLen = 0;
  lib.forEach((entry) => {
    (entry.aliases || [entry.name.toLowerCase()]).forEach((alias) => {
      if (norm.includes(alias) && alias.length > bestLen) { best = entry; bestLen = alias.length; }
    });
  });
  if (best) return best;
  let bestFuzzy = null, bestDist = Infinity;
  lib.forEach((entry) => {
    (entry.aliases || [entry.name.toLowerCase()]).forEach((alias) => {
      const dist = levenshtein(norm, alias);
      const tolerance = Math.max(1, Math.floor(alias.length * 0.22));
      if (dist <= tolerance && dist < bestDist) { bestFuzzy = entry; bestDist = dist; }
    });
  });
  return bestFuzzy;
}

// Parses a freeform pasted summary. Supports two paste styles:
//   1. Two-line: a header line ("Push-Ups"), then one "N rep(s) x M set(s) ..." line per
//      set-group (M repeats of N reps). Blank lines and "super set" markers are ignored.
//   2. Single-line shorthand: "Exercise : N x M" on one line (e.g. "biceps curl : 12 x 4") —
//      the "rep(s)"/"set(s)" words are optional in both styles, so "12 x 4" alone also counts
//      as a valid set line, not just "12 reps x 4 sets".
// Headers are matched against the FULL exercise reference library (not a fixed 5-6 field
// subset) plus any custom exercises the user has added — so any recognized exercise gets
// filled in and auto-added to the tracked list, whether or not it's ever been logged before.
// Only headers that truly don't match anything in the library land in `unmatched`.
function parseFreeform(text, library) {
  const lines = text.split("\n").map((l) => l.trim());
  const setLineRe = /^(\d+)\s*(?:reps?)?\s*x\s*(\d+)\s*(?:sets?)?\s*(.*)$/i;
  // Same shape as setLineRe but not anchored to the start of the line, and requires a name
  // (non-empty, non-numeric lead-in) before the numbers — used to pull "N x M" out of a line
  // that has no colon at all, e.g. "Squats 12 x 3 10kg".
  const embeddedSetRe = /^(.+?)\s+(\d+)\s*(?:reps?)?\s*x\s*(\d+)\s*(?:sets?)?\s*(.*)$/i;
  const supersetRe = /^super\s*set$/i;
  const results = {};
  const matchedEntries = [];
  const unmatched = [];
  let current = null; // matched library entry | null

  const applySetMatch = (name, setMatch) => {
    const reps = parseInt(setMatch[1], 10);
    const setsCount = parseInt(setMatch[2], 10) || 1;
    const rest = setMatch[3] || "";
    const kgMatch = rest.match(/(\d+(?:\.\d+)?)\s*kg/i);
    const weight = kgMatch ? parseFloat(kgMatch[1]) : 0;
    if (!results[name]) results[name] = { reps: [], weights: [] };
    // Each line's weight is pushed alongside its own reps, one entry per set, so a later
    // line for the same exercise (e.g. a drop set at a different weight) doesn't overwrite
    // an earlier line's weight — every set keeps the weight it was actually logged at.
    for (let i = 0; i < setsCount; i++) { results[name].reps.push(reps); results[name].weights.push(weight); }
  };

  const matchAndApply = (name, setMatch) => {
    const entry = matchExercise(name, library);
    if (entry) {
      current = entry;
      if (!matchedEntries.some((r) => r.name === entry.name)) matchedEntries.push(entry);
      applySetMatch(entry.name, setMatch);
      return true;
    }
    current = null;
    if (name) unmatched.push(name);
    return false;
  };

  lines.forEach((raw) => {
    if (!raw || supersetRe.test(raw)) return;

    // Single-line shorthand: split on the FIRST colon and see if the right side alone reads
    // as a set line ("N x M ..."). If so, the left side is the exercise name for THIS line
    // only — no need for a following line.
    const colonIdx = raw.indexOf(":");
    if (colonIdx !== -1) {
      const left = raw.slice(0, colonIdx).trim();
      const right = raw.slice(colonIdx + 1).trim();
      const rightSetMatch = right.match(setLineRe);
      if (left && rightSetMatch) { matchAndApply(left, rightSetMatch); return; }
    }

    // Pure set line for a `current` set by a previous header line (the original two-line style).
    const setMatch = raw.match(setLineRe);
    if (setMatch) {
      if (current) applySetMatch(current.name, setMatch);
      return;
    }

    // No colon, but the line still ends in "N x M ..." after a name with no separator at
    // all, e.g. "Squats 12 x 3 10kg" — pull the name out and match+fill in one step.
    const embeddedMatch = raw.match(embeddedSetRe);
    if (embeddedMatch) {
      const name = embeddedMatch[1].trim();
      matchAndApply(name, [raw, embeddedMatch[2], embeddedMatch[3], embeddedMatch[4]]);
      return;
    }

    const header = raw.replace(/:\s*$/, "").trim();
    const entry = matchExercise(header, library);
    if (entry) {
      current = entry;
      if (!matchedEntries.some((r) => r.name === entry.name)) matchedEntries.push(entry);
    } else {
      current = null;
      if (header) unmatched.push(header);
    }
  });
  return { results, matchedEntries, unmatched };
}

// ---- Minimal client-side Garmin .FIT binary parser -----------------------------------
// Implements just enough of the FIT protocol (definition/data messages, normal +
// compressed-timestamp headers, little/big-endian) to pull session/length/record
// messages out of a swim activity. Not a general-purpose FIT SDK.
const FIT_BASE_TYPES = {
  0x00: "enum", 0x01: "sint8", 0x02: "uint8", 0x83: "sint16", 0x84: "uint16",
  0x85: "sint32", 0x86: "uint32", 0x07: "string", 0x88: "float32", 0x89: "float64",
  0x0a: "uint8z", 0x8b: "uint16z", 0x8c: "uint32z", 0x0d: "byte", 0x8e: "sint64",
  0x8f: "uint64", 0x90: "uint64z",
};
const FIT_INVALID = {
  enum: 0xff, sint8: 0x7f, uint8: 0xff, sint16: 0x7fff, uint16: 0xffff,
  sint32: 0x7fffffff, uint32: 0xffffffff, uint8z: 0, uint16z: 0, uint32z: 0, byte: 0xff,
};
const FIT_EPOCH_OFFSET = 631065600; // seconds between Unix epoch and FIT epoch (1989-12-31T00:00:00Z)

function fitTimestampToDate(raw) {
  if (raw == null) return null;
  return new Date((raw + FIT_EPOCH_OFFSET) * 1000);
}

// Parses raw FIT bytes into arrays of loosely-typed message records, keyed by field number
// (e.g. `f253` = field 253 = timestamp on most message types). Global message numbers used:
// 18 = session, 19 = lap, 101 = length, 20 = record.
function parseFitBinary(arrayBuffer) {
  const view = new DataView(arrayBuffer);
  const byteLength = arrayBuffer.byteLength;
  if (byteLength < 14) throw new Error("File too small to be a valid .FIT file.");
  const headerSize = view.getUint8(0);
  const sig = String.fromCharCode(view.getUint8(8), view.getUint8(9), view.getUint8(10), view.getUint8(11));
  if (sig !== ".FIT") throw new Error("Not a recognized .FIT file (missing signature).");
  const dataSize = view.getUint32(4, true);
  const end = Math.min(headerSize + dataSize, byteLength - 2);

  const localDefs = {};
  let lastTimestamp = null;
  const messages = { 18: [], 19: [], 101: [], 20: [] }; // session, lap, length, record

  function readScalar(off, baseTypeName, littleEndian) {
    switch (baseTypeName) {
      case "enum": case "uint8": case "uint8z": case "byte": return view.getUint8(off);
      case "sint8": return view.getInt8(off);
      case "uint16": case "uint16z": return view.getUint16(off, littleEndian);
      case "sint16": return view.getInt16(off, littleEndian);
      case "uint32": case "uint32z": return view.getUint32(off, littleEndian);
      case "sint32": return view.getInt32(off, littleEndian);
      case "float32": return view.getFloat32(off, littleEndian);
      case "float64": return view.getFloat64(off, littleEndian);
      case "string": return null; // strings unused for our fields; skip decoding
      default: return view.getUint8(off);
    }
  }

  function readDataMessage(def, startOff) {
    let off = startOff;
    const rec = {};
    for (const f of def.fields) {
      const typeName = FIT_BASE_TYPES[f.baseType] || "byte";
      // Fields we care about are always single scalars; if a field's declared size is
      // larger than one element (array field), just read the first element and skip the rest.
      const val = readScalar(off, typeName, def.littleEndian);
      if (val != null && val !== FIT_INVALID[typeName]) rec["f" + f.fieldNum] = val;
      off += f.size;
    }
    for (const df of def.devFields) off += df.size; // developer fields: skip raw bytes, unused
    return { rec, newOffset: off };
  }

  let offset = headerSize;
  while (offset < end) {
    const headerByte = view.getUint8(offset); offset += 1;
    const isCompressed = (headerByte & 0x80) !== 0;
    let globalMesgNum, rec, newOffset;

    if (isCompressed) {
      const localType = (headerByte >> 5) & 0x03;
      const timeOffset = headerByte & 0x1f;
      const def = localDefs[localType];
      if (!def) break; // malformed / unsupported stream — stop rather than misread
      ({ rec, newOffset: offset } = readDataMessage(def, offset));
      if (lastTimestamp != null) {
        const base = lastTimestamp - (lastTimestamp & 0x1f);
        let ts = base + timeOffset;
        if (timeOffset < (lastTimestamp & 0x1f)) ts += 32;
        lastTimestamp = ts;
      }
      if (rec.f253 == null && lastTimestamp != null) rec.f253 = lastTimestamp;
      globalMesgNum = def.globalMesgNum;
    } else {
      const isDefinition = (headerByte & 0x40) !== 0;
      const localType = headerByte & 0x0f;
      if (isDefinition) {
        const hasDevFields = (headerByte & 0x20) !== 0;
        offset += 1; // reserved byte
        const arch = view.getUint8(offset); offset += 1;
        const littleEndian = arch === 0;
        const gmn = view.getUint16(offset, littleEndian); offset += 2;
        const numFields = view.getUint8(offset); offset += 1;
        const fields = [];
        for (let i = 0; i < numFields; i++) {
          fields.push({ fieldNum: view.getUint8(offset), size: view.getUint8(offset + 1), baseType: view.getUint8(offset + 2) });
          offset += 3;
        }
        const devFields = [];
        if (hasDevFields) {
          const numDev = view.getUint8(offset); offset += 1;
          for (let i = 0; i < numDev; i++) {
            devFields.push({ fieldNum: view.getUint8(offset), size: view.getUint8(offset + 1), devIndex: view.getUint8(offset + 2) });
            offset += 3;
          }
        }
        localDefs[localType] = { globalMesgNum: gmn, littleEndian, fields, devFields };
        continue;
      } else {
        const def = localDefs[localType];
        if (!def) break;
        ({ rec, newOffset: offset } = readDataMessage(def, offset));
        if (rec.f253 != null) lastTimestamp = rec.f253;
        globalMesgNum = def.globalMesgNum;
      }
    }
    if (messages[globalMesgNum]) messages[globalMesgNum].push(rec);
  }
  return { sessionMsgs: messages[18], lapMsgs: messages[19], lengthMsgs: messages[101], recordMsgs: messages[20] };
}

const SWIM_STROKE_NAMES = { 0: "freestyle", 1: "backstroke", 2: "breaststroke", 3: "butterfly", 4: "drill", 5: "mixed", 6: "im" };

const EDITABLE_SWIM_STROKES = ["freestyle", "backstroke", "breaststroke", "butterfly", "kick_free", "kick_frog"];

const TECHNIQUE_SWIM_STROKES = new Set(["freestyle", "backstroke", "breaststroke", "butterfly"]);
// Per-chart overlay options for the expanded swim trend charts — each chart offers only the

// Single source of truth for which direction counts as "better" per Trends metric — "lower"
// flips the Y axis (and z-score sign, where z-scores are used) so improvement always reads as
// "up"; "higher" leaves it as-is; "neutral" means there's no universal better direction (e.g.
// whole-session HR moves with effort, not fitness). Every place that needs to reverse an axis
// or flip a sign for one of these metrics reads from HERE instead of re-deciding locally —
// that's the actual fix for item 6: the previous pass patched the SWOLF branch's `reversed`
// prop directly, which is exactly the kind of per-branch fix that's easy to apply in one place
// and miss in another. Centralizing it means collapsed sparklines, every expanded-chart branch,

const METRIC_AXIS_DIRECTION = { pace: "lower", swolf: "lower", cadence: "higher", dps: "higher", heart: "neutral" };

// ---- Length-level correction/override layer (Part 1E / Part 9) -----------------------------
// Every length keeps its original imported fields (stroke, lengthType) untouched forever.
// A person's corrections live alongside them in userExcluded / userLengthType / userStroke and
// are the ONLY thing ever written by the length editor. effectiveLength() resolves "what the
// analysis should actually use" for a given length, without ever mutating the original.
function effectiveLength(l) {
  const lengthType = l.userLengthType || l.lengthType;
  const stroke = l.userStroke || l.stroke;
  return { ...l, lengthType, stroke, isOverridden: !!(l.userLengthType || l.userStroke) };

const SWIM_EFFORT_META = {
  easy:  { label: "Easy",  color: "#30D158" },
  work:  { label: "Work",  color: "#64D2FF" },
  speed: { label: "Speed", color: "#FF9F0A" },
};
const validSwimEffort = (v) => ["easy", "work", "speed"].includes(v);
const swimMedianLocal = (values) => {
  const vals = values.filter((v) => v != null && Number.isFinite(v)).slice().sort((a,b) => a-b);
  if (!vals.length) return null;
  const mid = Math.floor(vals.length / 2);
  return vals.length % 2 ? vals[mid] : (vals[mid - 1] + vals[mid]) / 2;
};

// Deterministic personal classifier. It deliberately avoids absolute pace cutoffs.
// With limited history it defaults toward Work instead of pretending to know intensity.
// Once enough personal same-stroke data exists, clearly faster/slower lengths can become
// Speed/Easy; nearby rest and session position are used only as supporting context.
function buildSwimEffortAssignments(sessions) {
  const chron = [...(sessions || [])].sort((a,b) => (a.date < b.date ? -1 : 1));
  const byStrokePool = {};
  const byStroke = {};
  const push = (obj, key, v) => { if (!obj[key]) obj[key] = []; obj[key].push(v); };

  chron.forEach((s) => {
    (s.lengths || []).forEach((raw) => {
      const l = effectiveLength(raw);
      if (l.lengthType !== "active" || raw.userExcluded || raw.glitch || l.pace100 == null || !Number.isFinite(l.pace100) || l.pace100 <= 0) return;
      const poolKey = s.poolLength != null ? `${l.stroke}|${Math.round(s.poolLength * 100) / 100}` : null;
      if (poolKey) push(byStrokePool, poolKey, l.pace100);
      push(byStroke, l.stroke, l.pace100);
    });
  });

  const assignments = {};
  chron.forEach((s) => {
    const allEff = (s.lengths || []).map((raw) => ({ raw, eff: effectiveLength(raw) }));
    const active = allEff.filter(({ raw, eff }) => eff.lengthType === "active" && !raw.userExcluded && eff.pace100 != null && Number.isFinite(eff.pace100) && eff.pace100 > 0);
    const sessionAllPaces = active.map(({ eff }) => eff.pace100);
    const sessionByStroke = {};
    active.forEach(({ eff }) => push(sessionByStroke, eff.stroke, eff.pace100));
    assignments[s.id] = {};

    active.forEach(({ raw, eff }, activePos) => {
      // Drill pace is not a reliable intensity signal; keep it neutral unless the user overrides it.
      if (eff.stroke === "drill") {
        assignments[s.id][raw.index] = "work";
        return;
      }

      const poolKey = s.poolLength != null ? `${eff.stroke}|${Math.round(s.poolLength * 100) / 100}` : null;
      let sample = poolKey && (byStrokePool[poolKey] || []).length >= 8 ? byStrokePool[poolKey]
        : (byStroke[eff.stroke] || []).length >= 8 ? byStroke[eff.stroke]
        : (sessionByStroke[eff.stroke] || []).length >= 5 ? sessionByStroke[eff.stroke]
        : null;

      if (!sample || sample.length < 5) {
        assignments[s.id][raw.index] = "work";
        return;

      const absDev = sample.map((v) => Math.abs(v - med));
      const mad = swimMedianLocal(absDev);
      const relMad = med > 0 && mad != null ? mad / med : 0;

      // remains conservative and doesn't turn normal noise into Speed/Easy.
      const band = Math.max(0.055, Math.min(0.11, relMad * 2.2 || 0.055));
      const fastCut = med * (1 - band);
      const easyCut = med * (1 + band);

      const rawPos = (s.lengths || []).findIndex((x) => x.index === raw.index);
      const prev = rawPos > 0 ? effectiveLength(s.lengths[rawPos - 1]) : null;
      const next = rawPos >= 0 && rawPos < s.lengths.length - 1 ? effectiveLength(s.lengths[rawPos + 1]) : null;
      const prevRaw = rawPos > 0 ? s.lengths[rawPos - 1] : null;
      const nextRaw = rawPos >= 0 && rawPos < s.lengths.length - 1 ? s.lengths[rawPos + 1] : null;
      const restBefore = prev && prev.lengthType === "idle" && !prevRaw.userExcluded ? (prev.elapsedSec || 0) : 0;
      const restAfter = next && next.lengthType === "idle" && !nextRaw.userExcluded ? (next.elapsedSec || 0) : 0;
      const meaningfulRest = Math.max(restBefore, restAfter) >= Math.max(6, (eff.elapsedSec || 0) * 0.25);
      const edgeOfSession = activePos <= 1 || activePos >= active.length - 2;

      if (eff.pace100 <= med * 0.90 || (eff.pace100 <= fastCut && (meaningfulRest || s.isCssTest))) {
        assignments[s.id][raw.index] = "speed";
      } else if (eff.pace100 >= med * 1.12 || (eff.pace100 >= easyCut && edgeOfSession)) {
        assignments[s.id][raw.index] = "easy";
      } else {
        assignments[s.id][raw.index] = "work";
      }
    });
  });
  return assignments;
}

const swimEffortForLength = (session, rawLength, assignments) => {
  if (validSwimEffort(rawLength && rawLength.userEffort)) return rawLength.userEffort;
  return (assignments && assignments[session.id] && assignments[session.id][rawLength.index]) || "work";

const swimEffortComposition = (session, assignments) => {
  const counts = { easy: 0, work: 0, speed: 0 };
  (session && session.lengths || []).forEach((raw) => {
    const l = effectiveLength(raw);
    if (l.lengthType !== "active" || raw.userExcluded) return;
    counts[swimEffortForLength(session, raw, assignments)] += 1;
  });
  const pool = session && session.poolLength;
  const distances = Object.fromEntries(Object.entries(counts).map(([k,v]) => [k, pool != null ? Math.round(v * pool * 100) / 100 : null]));

// Returns the original session object unchanged for All. For a specific effort, only
// matching active lengths contribute to pace/distance/stroke metrics. Whole-session calories
// are intentionally omitted rather than guessed. HR is a real time-weighted average of
// selected lengths that actually contain HR data.
function deriveSwimSessionForEffort(session, effort, assignments) {
  if (!session || effort === "all") return session;
  const selectedOriginal = [];
  const filteredLengths = (session.lengths || []).map((raw) => {
    const eff = effectiveLength(raw);
    if (eff.lengthType !== "active" || raw.userExcluded) return raw;
    const keep = swimEffortForLength(session, raw, assignments) === effort;
    if (keep) selectedOriginal.push(raw);
    return keep ? raw : { ...raw, userExcluded: true };
  });
  if (!selectedOriginal.length) return null;

  const metrics = computeSwimSessionMetrics(filteredLengths, session.poolLength);
  const hrLengths = selectedOriginal
    .map((raw) => effectiveLength(raw))
    .filter((l) => l.avgHR != null && Number.isFinite(l.avgHR) && l.avgHR > 0 && l.elapsedSec > 0);
  const hrSec = hrLengths.reduce((a,l) => a + l.elapsedSec, 0);
  const avgHR = hrSec > 0 ? hrLengths.reduce((a,l) => a + l.avgHR * l.elapsedSec, 0) / hrSec : null;

  return {
    ...session,
    lengths: filteredLengths,
    distance: metrics.distance,
    distanceCorrection: null,
    swimTimeSec: metrics.swimTimeSec,
    restTimeSec: metrics.restTimeSec,
    pace100Overall: metrics.pace100Overall,
    strokeStats: metrics.strokeStats,
    reps: metrics.reps,
    totalActiveLengths: metrics.totalActiveLengths,
    validActiveLengths: metrics.validActiveLengths,
    avgHR,
    peakHR: null,
    calories: null,
    effortView: effort,
  };
}

// Single source of truth for every derived swim-session number (distance, swim/rest time,

    strokeStats: metrics.strokeStats,
    reps: metrics.reps,
    totalActiveLengths: metrics.totalActiveLengths,
    validActiveLengths: metrics.validActiveLengths,
    excludedCount: metrics.excludedCount,
    qualityNote: metrics.qualityNote,
  };
};

// Review-only data-quality pass. It never excludes or rewrites a length.
// It flags extreme same-stroke combinations where BOTH pace and Garmin stroke count move
// implausibly together relative to the swimmer's own session (e.g. a "25m breaststroke"
// recorded vastly faster with only a fraction of the normal stroke count). This catches
// likely transitions/misdetected lengths that simple cadence ceilings cannot catch.
function applyPersonalSwimOutlierFlags(lengths) {
  if (!Array.isArray(lengths)) return lengths || [];
  const groups = {};
  lengths.forEach((raw) => {
    const eff = effectiveLength(raw);
    if (
      eff.lengthType !== "active" ||
      raw.userExcluded ||
      !TECHNIQUE_SWIM_STROKES.has(eff.stroke) ||
      eff.pace100 == null || !Number.isFinite(eff.pace100) || eff.pace100 <= 0
    ) return;
    if (!groups[eff.stroke]) groups[eff.stroke] = [];
    groups[eff.stroke].push({ raw, eff });
  });

  const med = (vals) => {
    if (!vals.length) return null;
    const a = [...vals].sort((x,y)=>x-y);
    const m = Math.floor(a.length/2);
    return a.length % 2 ? a[m] : (a[m-1]+a[m])/2;
  };

  const flagged = new Map();
  Object.entries(groups).forEach(([stroke, rows]) => {
    if (rows.length < 5) return;
    const paceMed = med(rows.map(({eff})=>eff.pace100));
    const strokeCounts = rows.map(({eff})=>eff.totalStrokes).filter((v)=>v!=null && Number.isFinite(v) && v>0);
    if (!(paceMed > 0) || strokeCounts.length < 5) return;
    const strokeMed = med(strokeCounts);
    if (!(strokeMed > 0)) return;

    rows.forEach(({raw,eff}) => {
      const sc = eff.totalStrokes;
      if (!(sc > 0)) return;
      const extremeFastLowCount = eff.pace100 < paceMed * 0.60 && sc < strokeMed * 0.60;
      const extremeSlowHighCount = eff.pace100 > paceMed * 1.70 && sc > strokeMed * 1.30;
      if (extremeFastLowCount || extremeSlowHighCount) {
        const reason = extremeFastLowCount
          ? `possible misdetected/transition length: pace ${Math.round(eff.pace100)}s/100m and ${sc} strokes are both far below this session's ${SWIM_STROKE_LABELS[stroke]} pattern`
          : `possible misdetected/transition length: pace ${Math.round(eff.pace100)}s/100m and ${sc} strokes are both far above this session's ${SWIM_STROKE_LABELS[stroke]} pattern`;
        flagged.set(raw.index, reason);
      }
    });
  });

  return lengths.map((raw) => {
    const personalFlag = flagged.get(raw.index);
    // Preserve parser-level/device-field warnings if already present; otherwise add this
    // personal-pattern review flag. The person still decides whether to exclude/reclassify it.
    if (!personalFlag || raw.glitch) return raw;
    return { ...raw, glitch: personalFlag };
  });
}

function computeSwimSessionMetrics(lengths, poolLength) {
  const eff = lengths.map(effectiveLength);
  const validActive = eff.filter((l) => l.lengthType === "active" && !l.userExcluded);
  const idleLengths = eff.filter((l) => l.lengthType === "idle" && !l.userExcluded);

  const distance = poolLength != null ? Math.round(validActive.length * poolLength * 100) / 100 : null;
  const swimTimeSec = validActive.reduce((a, l) => a + (l.elapsedSec || 0), 0);
  const restTimeSec = idleLengths.reduce((a, l) => a + (l.elapsedSec || 0), 0);
  const pace100Overall = swimTimeSec > 0 && distance ? (swimTimeSec / distance) * 100 : null;

  const strokeGroups = {};
  validActive.forEach((l) => {
    if (!strokeGroups[l.stroke]) strokeGroups[l.stroke] = {
      swolfs: [], timeSec: 0, lengthCount: 0,
      countedStrokeTotal: 0, countedStrokeTimeSec: 0, countedStrokeLengths: 0
    };
    const g = strokeGroups[l.stroke];
    const elapsed = l.elapsedSec != null && Number.isFinite(l.elapsedSec) ? l.elapsedSec : 0;
    g.timeSec += elapsed;
    g.lengthCount += 1;

    if (TECHNIQUE_SWIM_STROKES.has(l.stroke)) {
      if (l.elapsedSec != null && l.totalStrokes != null && Number.isFinite(l.totalStrokes)) {
        g.swolfs.push(Math.round(l.elapsedSec + l.totalStrokes));
      }
      if (l.totalStrokes != null && Number.isFinite(l.totalStrokes) && l.totalStrokes > 0 && elapsed > 0) {
        g.countedStrokeTotal += l.totalStrokes;
        g.countedStrokeTimeSec += elapsed;
        g.countedStrokeLengths += 1;
      }
    }
  });

  const avg = (arr) => (arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : null);
  const strokeStats = {};
  Object.keys(strokeGroups).forEach((stroke) => {
    const g = strokeGroups[stroke];
    const strokeDistance = poolLength != null ? g.lengthCount * poolLength : null;
    const countedDistance = poolLength != null ? g.countedStrokeLengths * poolLength : null;
    strokeStats[stroke] = {
      count: g.lengthCount,
      avgSwolf: TECHNIQUE_SWIM_STROKES.has(stroke) ? avg(g.swolfs) : null,
      // True ratio-of-totals. This keeps Pace ≈ DPS × Stroke Rate mathematically coherent
      // whenever all contributing lengths have valid Garmin stroke counts.
      avgCadence: g.countedStrokeTotal > 0 && g.countedStrokeTimeSec > 0
        ? (g.countedStrokeTotal / g.countedStrokeTimeSec) * 60
        : null,
      avgDistPerStroke: g.countedStrokeTotal > 0 && countedDistance
        ? countedDistance / g.countedStrokeTotal
        : null,
      pace100: g.timeSec > 0 && strokeDistance ? (g.timeSec / strokeDistance) * 100 : null,
    };
  });

  // Reconstruct reps/sets from consecutive active lengths (a run broken by any idle length,
  // in original recorded order, honoring exclusions and IDLE/ACTIVE overrides).
  const reps = [];
  let currentRep = null;
  eff.forEach((l) => {
    if (l.userExcluded) return;
    if (l.lengthType === "active") {
      if (!currentRep) currentRep = { startIndex: l.index, lengthCount: 0, timeSec: 0, strokeSet: new Set() };
      currentRep.lengthCount += 1;
      currentRep.timeSec += l.elapsedSec || 0;
      currentRep.strokeSet.add(l.stroke);
    } else if (l.lengthType === "idle") {
      if (currentRep) { reps.push(currentRep); currentRep = null; }
    }
  });
  if (currentRep) reps.push(currentRep);
  const repSummaries = poolLength ? reps.map((r) => {
    const repDistance = r.lengthCount * poolLength;
    const pace100 = r.timeSec > 0 && repDistance > 0 ? (r.timeSec / repDistance) * 100 : null;
    return { lengthCount: r.lengthCount, distance: repDistance, timeSec: r.timeSec, pace100, stroke: r.strokeSet.size === 1 ? Array.from(r.strokeSet)[0] : "mixed" };
  }) : [];

  const totalActiveLengths = eff.filter((l) => l.lengthType === "active").length;
  const suspiciousKept = eff.filter((l) => l.glitch && l.lengthType === "active" && !l.userExcluded).length;
  const excludedCount = eff.filter((l) => l.userExcluded).length;
  const parts = [];
  if (suspiciousKept > 0) parts.push(`${suspiciousKept} suspicious length${suspiciousKept === 1 ? "" : "s"} flagged for review (kept in the totals until you decide)`);
  if (excludedCount > 0) parts.push(`${excludedCount} length${excludedCount === 1 ? "" : "s"} excluded by you`);
  const qualityNote = parts.length ? parts.join("; ") + "." : null;

  return { distance, swimTimeSec, restTimeSec, pace100Overall, strokeStats, reps: repSummaries, totalActiveLengths, validActiveLengths: validActive.length, excludedCount, qualityNote };
}

// Turns raw parsed FIT messages into a fully-computed swim session object, applying the
// data-quality filtering rules (phantom lengths, implausible cadence) before any metric
// is derived from the length data.
function processSwimFit(parsed, fileName) {
  const { sessionMsgs, lengthMsgs, recordMsgs } = parsed;
  if (!lengthMsgs || lengthMsgs.length === 0) throw new Error("No per-length swim data found in this file (is it a pool-swim activity?).");
  const sessionRec = sessionMsgs && sessionMsgs[0] ? sessionMsgs[0] : {};

  const detectedPoolLength = sessionRec.f44 != null ? sessionRec.f44 / 100 : null; // FIT stores meters
  const poolLength = detectedPoolLength != null && Number.isFinite(detectedPoolLength) && detectedPoolLength > 0 ? detectedPoolLength : null;
  const sessionCalories = sessionRec.f11 != null ? sessionRec.f11 : null;
  const reportedDistanceRaw = sessionRec.f9 != null ? sessionRec.f9 / 100 : null; // informational only, cross-checked below
  const sessionStart = fitTimestampToDate(sessionRec.f2 != null ? sessionRec.f2 : sessionRec.f253);

  const rawLengths = lengthMsgs.map((l) => {
    const stroke = SWIM_STROKE_NAMES[l.f7] || "unknown";
    const lengthType = l.f12 === 1 ? "active" : l.f12 === 0 ? "idle" : "unknown";
    const totalStrokes = l.f5 != null ? l.f5 : 0;
    const fitAvgCadence = l.f9 != null ? l.f9 : null;
    const elapsedSec = l.f3 != null ? l.f3 / 1000 : (l.f4 != null ? l.f4 / 1000 : 0);
    const avgCadence = totalStrokes > 0 && elapsedSec > 0
      ? (totalStrokes / elapsedSec) * 60
      : (fitAvgCadence != null ? fitAvgCadence : 0);
    const startTimeRaw = l.f2 != null ? l.f2 : l.f253; // raw FIT timestamp, for matching against record messages below
    const startTime = fitTimestampToDate(startTimeRaw);
    const calories = l.f11 != null ? l.f11 : null;
    return { stroke, lengthType, totalStrokes, avgCadence, fitAvgCadence, elapsedSec, startTime, startTimeRaw, calories };
  });

  // Per-length HR: average of record-message heart-rate readings whose timestamp falls
  // within that length's own [start, start+elapsed) window. This is a real, derived signal
  // from the FIT record stream (not invented) — it's what makes HR meaningful *within* a
  // single activity (pace vs. effort over the course of the swim), as opposed to the
  // aggregate trend charts where only one flattened whole-session average exists.
  const hrRecordsSorted = (recordMsgs || [])
    .filter((r) => r.f253 != null && r.f3 != null && r.f3 > 0)
    .map((r) => ({ ts: r.f253, hr: r.f3 }))
    .sort((a, b) => a.ts - b.ts);
  const hrForWindow = (startRaw, elapsedSec) => {
    if (startRaw == null || hrRecordsSorted.length === 0) return null;
    const windowEnd = startRaw + Math.max(elapsedSec, 1);
    const inWindow = hrRecordsSorted.filter((r) => r.ts >= startRaw && r.ts < windowEnd);
    return inWindow.length ? Math.round(inWindow.reduce((a, r) => a + r.hr, 0) / inWindow.length) : null;
  };

  // A 0-stroke/0-cadence "active" length is flagged as *suspicious* if it's also too short to
  // physically be a real length (implausibly fast), or if its cadence is implausibly high for
  // its stroke. This flag (`glitch`) is surfaced in the UI — it is NEVER used to silently
  // drop or modify data. The person decides, per length, whether to exclude it (Part 1B/C/D).
  const PHANTOM_MAX_PLAUSIBLE_SEC = 5;
  const lengths = rawLengths.map((len, index) => {
    let glitch = null;
    if (len.lengthType === "active") {
      if (len.totalStrokes === 0 && len.avgCadence === 0) {
        if (len.elapsedSec < PHANTOM_MAX_PLAUSIBLE_SEC) {
          glitch = `phantom length (0 strokes, 0 cadence, ${len.elapsedSec.toFixed(1)}s — too short to be a real length)`;
        }
        // else: 0/0 with a normal/long duration -> plausible real length.
      } else {
        const canonicalCadence = canonicalSwimCadence(len);
        const maxC = SWIM_MAX_PLAUSIBLE_CADENCE[len.stroke] || 130;
        if (canonicalCadence != null && canonicalCadence > maxC) {
          glitch = `implausible cadence (${canonicalCadence.toFixed(1)} spm > ${maxC} plausible max for ${SWIM_STROKE_LABELS[len.stroke]})`;
        } else if (len.fitAvgCadence != null && canonicalCadence != null && canonicalCadence > 0) {
          const cadenceDiffPct = Math.abs(len.fitAvgCadence - canonicalCadence) / canonicalCadence;
          // Do not alter/exclude the length. This only surfaces a possible firmware/device
          // convention discrepancy if Garmin's own cadence is materially different from
          // total_strokes / elapsed_time.
          if (cadenceDiffPct > 0.20 && Math.abs(len.fitAvgCadence - canonicalCadence) > 4) {
            glitch = `cadence fields disagree (FIT ${len.fitAvgCadence} spm vs ${canonicalCadence.toFixed(1)} spm derived from stroke count/time)`;
          }
        }
      }
    }
    const swolf = len.lengthType === "active" ? Math.round(len.elapsedSec + len.totalStrokes) : null;
    const avgHR = hrForWindow(len.startTimeRaw, len.elapsedSec);
    const pace100 = len.lengthType === "active" && poolLength ? (len.elapsedSec / poolLength) * 100 : null;
    if (glitch) {
      console.warn(`[swim-fit] flagged length #${index} as suspicious (not excluded): elapsedSec=${len.elapsedSec.toFixed(2)}, totalStrokes=${len.totalStrokes}, avgCadence=${len.avgCadence}, reason="${glitch}"`);
    }
    // userExcluded/userLengthType/userStroke form the correction/override layer (Part 1E/9):
    // null/false means "use the original imported value". Only ever set later by explicit
    // person action in the Length-by-length editor — never touched automatically.
    return { ...len, index, glitch, swolf, avgHR, pace100, userExcluded: false, userLengthType: null, userStroke: null, userEffort: null };
  });

  const qualityFlaggedLengths = applyPersonalSwimOutlierFlags(lengths);
  const metrics = computeSwimSessionMetrics(qualityFlaggedLengths, poolLength);

  // Cross-check the FIT session-level total_distance against our length-based count rather
  // than trusting it outright — surfaced in the quality note if they disagree.
  let distanceMismatchNote = null;
  if (reportedDistanceRaw != null && metrics.distance != null && Math.abs(reportedDistanceRaw - metrics.distance) > (poolLength || 25) * 0.5) {
    distanceMismatchNote = `FIT file reported ${reportedDistanceRaw}m at the session level, which disagrees with the ${metrics.distance}m computed from length records — using the computed figure.`;
  }
  let qualityNote = metrics.qualityNote;
  if (distanceMismatchNote) qualityNote = qualityNote ? qualityNote + " " + distanceMismatchNote : distanceMismatchNote;

  // Average + peak HR from record messages within the session's timeframe (if the device
  // recorded HR). Peak is a genuine max of real readings, not estimated.
  const hrValues = (recordMsgs || []).map((r) => r.f3).filter((v) => v != null && v > 0);
  const avgHR = hrValues.length ? Math.round(hrValues.reduce((a, b) => a + b, 0) / hrValues.length) : null;
  const peakHR = hrValues.length ? Math.max(...hrValues) : null;

  const dateISO = sessionStart ? toISODate(sessionStart) : new Date().toISOString().slice(0, 10);

  return {
    id: "swim-" + Date.now() + "-" + Math.random().toString(36).slice(2, 8),
    fileName,
    date: dateISO,
    startTime: sessionStart ? sessionStart.toISOString() : null,
    poolLength,
    poolLengthSource: poolLength != null ? "fit" : null,
    calories: sessionCalories,
    distance: metrics.distance,
    distanceCorrection: null, // { originalDistance, correctedAt } — set only if the person manually corrects distance later
    swimTimeSec: metrics.swimTimeSec,
    restTimeSec: metrics.restTimeSec,
    pace100Overall: metrics.pace100Overall,
    avgHR,
    peakHR,
    totalActiveLengths: metrics.totalActiveLengths,
    validActiveLengths: metrics.validActiveLengths,
    excludedCount: metrics.excludedCount,
    qualityNote,
    strokeStats: metrics.strokeStats,
    lengths: qualityFlaggedLengths,
    reps: metrics.reps,
    isCssTest: false,
    cssTest: null, // { t200, t400 } seconds, entered manually — see SwimmingTab
  };
}

// Thin wrapper kept for call-site compatibility: recomputes just strokeStats + reps from a
// session's `lengths` array (with whatever overrides are set), delegating to the single
// source of truth above so this and processSwimFit can never drift out of sync.
function recomputeSwimDerived(lengths, poolLength) {
  const { strokeStats, reps } = computeSwimSessionMetrics(lengths, poolLength);
  return { strokeStats, reps };
}

// Sessions parsed before per-length and per-stroke pace were added to processSwimFit are
// missing the `pace100` field in two places: on each entry in `lengths` (used by the
// "Pace over this session" chart) and on each stroke in `strokeStats` (used by the per-
// stroke trend cards). Rather than requiring a re-upload of the original .FIT file, both
// are recomputed from data already stored on the session — elapsedSec/poolLength for
// per-length pace, the same grouping processSwimFit uses at parse time for per-stroke
// pace. Returns the session unchanged if nothing needs backfilling.
function backfillSwimSessionStrokeStats(session) {
  if (!session || !session.lengths) return session;

  const lengthsNeedBackfill = session.lengths.some((l) => l.lengthType === "active" && l.pace100 == null);
  const fixedLengths = lengthsNeedBackfill
    ? session.lengths.map((l) => {
        if (l.lengthType !== "active" || l.pace100 != null || !session.poolLength) return l;
        return { ...l, pace100: (l.elapsedSec / session.poolLength) * 100, swolf: l.swolf != null ? l.swolf : Math.round(l.elapsedSec + l.totalStrokes) };
      })
    : session.lengths;

  const strokes = session.strokeStats ? Object.keys(session.strokeStats) : [];
  const strokeStatsNeedBackfill = strokes.some((k) => session.strokeStats[k] && session.strokeStats[k].pace100 == null);
  let fixedStrokeStats = session.strokeStats;
  if (strokeStatsNeedBackfill) {
    const validActive = fixedLengths.filter((l) => l.lengthType === "active" && !l.userExcluded);
    const groups = {};
    validActive.forEach((l) => {
      if (!groups[l.stroke]) groups[l.stroke] = { timeSec: 0, lengthCount: 0 };
      groups[l.stroke].timeSec += l.elapsedSec;
      groups[l.stroke].lengthCount += 1;
    });
    fixedStrokeStats = {};
    strokes.forEach((stroke) => {
      const existing = session.strokeStats[stroke];
      const g = groups[stroke];
      const strokeDistance = g && session.poolLength != null ? g.lengthCount * session.poolLength : null;
      const recomputedPace100 = g && g.timeSec > 0 && strokeDistance ? (g.timeSec / strokeDistance) * 100 : null;
      fixedStrokeStats[stroke] = { ...existing, pace100: existing.pace100 != null ? existing.pace100 : recomputedPace100 };
    });
  }

  if (!lengthsNeedBackfill && !strokeStatsNeedBackfill) return session;
  return { ...session, lengths: fixedLengths, strokeStats: fixedStrokeStats };
}

// One-time migration for sessions imported before the Part 1 correction layer existed: adds
// the userExcluded/userLengthType/userStroke fields (defaulting to "no override", i.e.
// unchanged behavior for that length) and re-derives every session-level number through
// computeSwimSessionMetrics, since older sessions had glitch-flagged lengths silently
// excluded at parse time — the new behavior keeps them counted unless the person excludes
// them explicitly. A pre-existing manual distance correction (distanceCorrection) is
// preserved as-is (it's an explicit person decision), but its pace is refreshed against the
// migrated swim time so it stays internally consistent.
function migrateSwimSessionToOverrideLayer(session) {
  if (!session || !session.lengths) return session;
  const alreadyMigrated = session.lengths.every((l) => "userExcluded" in l && "userEffort" in l);
  if (alreadyMigrated) return session;

  const lengths = session.lengths.map((l) => ({
    ...l,
    userExcluded: "userExcluded" in l ? !!l.userExcluded : false,
    userLengthType: l.userLengthType || null,
    userStroke: l.userStroke || null,
    userEffort: validSwimEffort(l.userEffort) ? l.userEffort : null,
  }));
  const metrics = computeSwimSessionMetrics(lengths, session.poolLength);
  const distance = session.distanceCorrection ? session.distance : metrics.distance;
  const pace100Overall = session.distanceCorrection && distance
    ? (metrics.swimTimeSec > 0 ? (metrics.swimTimeSec / distance) * 100 : null)
    : metrics.pace100Overall;

  return {
    ...session,
    lengths,
    distance,
    pace100Overall,
    swimTimeSec: metrics.swimTimeSec,
    restTimeSec: metrics.restTimeSec,
    strokeStats: metrics.strokeStats,
    reps: metrics.reps,
    totalActiveLengths: metrics.totalActiveLengths,
    validActiveLengths: metrics.validActiveLengths,
    excludedCount: metrics.excludedCount,
    qualityNote: metrics.qualityNote,
  };
}

// Runs the backfill across a whole session list. Returns { sessions, changed } so callers
// can decide whether to write the backfilled data back to storage.
function backfillSwimSessions(list) {
  let changed = false;
  const next = (list || []).map((s) => {
    const migrated = migrateSwimSessionToOverrideLayer(s);
    let fixed = backfillSwimSessionStrokeStats(migrated);
    if (fixed && fixed.lengths && fixed.poolLength) {
      const flaggedLengths = applyPersonalSwimOutlierFlags(fixed.lengths);
      const metrics = computeSwimSessionMetrics(flaggedLengths, fixed.poolLength);
      const preservedDistance = fixed.distanceCorrection ? fixed.distance : metrics.distance;
      const preservedPace = fixed.distanceCorrection && preservedDistance
        ? (metrics.swimTimeSec > 0 ? (metrics.swimTimeSec / preservedDistance) * 100 : null)
        : metrics.pace100Overall;
      fixed = {
        ...fixed,
        lengths: flaggedLengths,
        distance: preservedDistance,
        pace100Overall: preservedPace,
        swimTimeSec: metrics.swimTimeSec,
        restTimeSec: metrics.restTimeSec,
        strokeStats: metrics.strokeStats,
        reps: metrics.reps,
        totalActiveLengths: metrics.totalActiveLengths,
        validActiveLengths: metrics.validActiveLengths,
        excludedCount: metrics.excludedCount,
        qualityNote: metrics.qualityNote,
        derivedMetricsVersion: 2,
      };
    }
    if (fixed && fixed.poolLength != null && !fixed.poolLengthSource) fixed = { ...fixed, poolLengthSource: "legacy" };
    if (fixed !== s || s.derivedMetricsVersion !== 2) changed = true;
    return fixed;
  });
  return { sessions: next, changed };
}

// Clean numeric formatter for chart axes/tooltips: caps decimals at maxDecimals, strips
// trailing zeros, and never shows raw floating-point noise like 82.34999999999.
const fmtNum = (v, maxDecimals = 2) => {
  if (v == null || !isFinite(v)) return "—";
  const factor = Math.pow(10, maxDecimals);
  const rounded = Math.round(v * factor) / factor;
  return rounded % 1 === 0 ? String(rounded) : String(parseFloat(rounded.toFixed(maxDecimals)));
};
const fmtMinSec = (totalSec) => {
  if (totalSec == null || !isFinite(totalSec)) return "—";
  const s = Math.round(totalSec);
  const m = Math.floor(s / 60);
  const rem = s % 60;
  return `${m}:${String(rem).padStart(2, "0")}`;
};
const fmtPace100 = (secPer100) => (secPer100 == null ? "—" : `${fmtMinSec(secPer100)}/100m`);

// Editable-field counterparts to fmtMinSec/fmtPace100, used where a pace needs to be both
// displayed AND typed back in (the CSS confirm dialog) — one decimal place of precision,
// e.g. "1:58.2", rather than fmtMinSec's whole-second display rounding.
const paceSecToStr = (paceSec) => {
  if (paceSec == null || !isFinite(paceSec) || paceSec < 0) return "";
  const m = Math.floor(paceSec / 60);
  const rem = paceSec - m * 60;
  return `${m}:${rem < 10 ? "0" : ""}${rem.toFixed(1)}`;
};
// Parses "M:SS" / "M:SS.s" back into seconds-per-100m. Also accepts a bare number of
// seconds-per-100m (no colon), so pasting a plain figure still works.
const paceStrToSec = (str) => {
  if (str == null) return NaN;
  const s = String(str).trim();
  if (s === "") return NaN;
  if (s.includes(":")) {
    const [mPart, sPart] = s.split(":");
    const m = parseFloat(mPart), sec = parseFloat(sPart);
    if (!isFinite(m) || !isFinite(sec)) return NaN;
    return m * 60 + sec;
  }
  return parseFloat(s);
};

// Length-by-length editor action buttons — deliberately sized for comfortable mobile tapping
// (Part 8), not the tiny icon-buttons the rest of this dense table uses elsewhere.
function lenBtnStyle(variant) {
  const palette = {
    neutral: { bg: "transparent", color: "var(--text-dim, #8E8E93)", border: "var(--border-2, #2C2C2E)" },
    positive: { bg: "#30D15822", color: "var(--positive, #30D158)", border: "#30D15855" },
    negative: { bg: "#FF453A22", color: "var(--negative, #FF453A)", border: "#FF453A55" },
  }[variant] || {};
  return {
    cursor: "pointer", background: palette.bg, color: palette.color, border: `1px solid ${palette.border}`,
    borderRadius: 7, padding: "6px 10px", fontWeight: 600, fontSize: 10.5, minHeight: 30, whiteSpace: "nowrap",
  };
}

// ---- Normalization helpers for overlaying two differently-scaled metrics (e.g. pace in
// seconds, HR in bpm) on a single shared axis without one series drowning the other out.
// Converts each to "standard deviations from its own mean" (z-score) so both land on a
// comparable, unitless scale — the standard technique for eyeballing correlation between
// series that don't share units, rather than giving each its own independently-scaled axis
// (which just stretches both to fill the chart regardless of real magnitude).
function computeMeanStd(values) {
  const vals = values.filter((v) => v != null && isFinite(v));
  if (vals.length < 2) return null;
  const mean = vals.reduce((a, b) => a + b, 0) / vals.length;
  const variance = vals.reduce((a, b) => a + (b - mean) ** 2, 0) / vals.length;

// ============================================================================================
// SWIM INSIGHTS — rule-based, fully local/deterministic interpretation engine.
// No AI, no network calls. Every function below is a pure function over data the app already
// computes (trendData / chronSessions) and returns either null (not enough signal to say
// anything responsible) or a structured insight object. Thresholds are centralized so they can
// be tuned in one place without touching the generator logic.
// ============================================================================================
const INSIGHT_THRESHOLDS = {
  paceMeaningfulPct: 0.025,   // ~2.5% pace change to be worth mentioning
  swolfMeaningfulPct: 0.03,   // ~3%
  dpsMeaningfulPct: 0.03,     // ~3% distance-per-stroke change
  cadenceMeaningfulPct: 0.04, // stroke-rate tolerance — noisier metric, wider band
  hrMeaningfulBpm: 3,         // absolute bpm difference floor — don't read into 1-2bpm noise
  recentWindow: 3,            // "latest session" comparisons use the last N sessions as "recent"
  minBaselineWindow: 2,       // need at least this many sessions before the recent window
  minPointsForPB: 4,          // minimum comparable sessions before calling something a personal best
  mediumTermWeeks: 6,         // "improvement over time" lookback
  frequencyGapMultiplier: 1.6,// gap-since-last-swim vs. typical gap, before nudging "time to swim"
};

// Semantic categories — color is always paired with an icon + title/text, never the sole signal.
const INSIGHT_CATEGORIES = {
  positive:     { color: "#30D158", bg: "rgba(111,207,151,0.12)", Icon: TrendingUp,     label: "Improving" },
  neutral:      { color: "#64D2FF", bg: "rgba(86,204,242,0.12)",  Icon: Info,           label: "Steady" },
  warning:      { color: "#FF9F0A", bg: "rgba(242,153,74,0.12)",  Icon: TrendingDown,   label: "Watch" },
  achievement:  { color: "#FF9F0A", bg: "rgba(242,201,76,0.14)",  Icon: Award,          label: "Personal best" },
  reminder:     { color: "#BF5AF2", bg: "rgba(187,134,252,0.12)", Icon: Clock,          label: "Reminder" },
  insufficient: { color: "#636366", bg: "rgba(107,112,120,0.10)", Icon: Info,           label: "Building baseline" },
};

const avgOf = (arr) => (arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : null);
// Median of comparable recent/baseline values — preferred over a plain mean as the primary
// basis for interpretation, since a single unusual session, drill set, or recording glitch can
// skew a mean but has much less effect on a median. Standard deviation is intentionally not used
// here to decide whether the swimmer improved; it remains available elsewhere only as an
// optional secondary/confidence signal (e.g. the Compare chart's z-score axis).
const medianOf = (arr) => {
  if (!arr.length) return null;
  const sorted = [...arr].sort((a, b) => a - b);
  const mid = Math.floor(sorted.length / 2);
  return sorted.length % 2 ? sorted[mid] : (sorted[mid - 1] + sorted[mid]) / 2;
};

// Splits a chronological (oldest→newest) series of {date, v} points into a "recent window"
// (last N) and everything before it as "baseline". Returns null when there isn't enough data
// on both sides to make a responsible comparison. Uses the median of each window as the
// representative "typical" value (see medianOf above) rather than a mean.
function splitRecentBaseline(points, recentWindow, minBaseline) {
  if (points.length < recentWindow + minBaseline) return null;
  const recent = points.slice(-recentWindow);
  const baseline = points.slice(0, points.length - recentWindow);
  return { recent, baseline, recentAvg: medianOf(recent.map((p) => p.v)), baselineAvg: medianOf(baseline.map((p) => p.v)) };
}

const pctChange = (recentAvg, baselineAvg) => (baselineAvg == null || baselineAvg === 0 || recentAvg == null ? null : (recentAvg - baselineAvg) / baselineAvg);

// Extracts a clean, null-free, oldest→newest {date, v} series for one stroke's metric (or the
// whole-session series when stroke is null) from trendData.
function extractSeries(trendData, stroke, field) {
  const key = stroke ? `${field}_${stroke}` : field;
  return trendData.map((d) => ({ date: d.date, v: d[key] })).filter((p) => p.v != null);
}
function extractSeriesKey(trendData, key) {
  return trendData.map((d) => ({ date: d.date, v: d[key] })).filter((p) => p.v != null);
}
function pairSeriesByDate(primaryPoints, secondaryPoints) {
  const secByDate = new Map(secondaryPoints.map((p) => [p.date, p.v]));
  return primaryPoints
    .filter((p) => secByDate.has(p.date))
    .map((p) => ({ date: p.date, primary: p.v, secondary: secByDate.get(p.date) }));
}
// Prefer a true latest-session-anchored time split. If the whole history sits inside that
// window (common for a newer log), fall back to recent-vs-earlier comparable sessions rather
// than incorrectly saying there is "not enough data".
function splitTrendWindows(points, weeks, preferredRecent = 3, minBaseline = 2) {
  if (!points || points.length < minBaseline + 2) return null;
  const latest = points[points.length - 1];
  const cutoff = new Date(`${latest.date}T00:00:00`);
  cutoff.setDate(cutoff.getDate() - weeks * 7);
  const cutoffStr = toISODate(cutoff);
  const recentByTime = points.filter((p) => p.date >= cutoffStr);
  const olderByTime = points.filter((p) => p.date < cutoffStr);
  if (recentByTime.length >= 2 && olderByTime.length >= minBaseline) {
    return { recent: recentByTime, baseline: olderByTime, basis: "time", weeks };
  }
  const recentCount = Math.min(preferredRecent, Math.max(2, Math.floor(points.length / 2)));
  const recent = points.slice(-recentCount);
  const baseline = points.slice(0, -recentCount);
  if (recent.length >= 2 && baseline.length >= minBaseline) {
    return { recent, baseline, basis: "rolling", weeks };
  }
  return null;
}
const trendWindowPhrase = (split) => split && split.basis === "time"
  ? `over the last ${split.weeks} weeks compared with your earlier baseline`
  : "across your recent sessions compared with your earlier comparable sessions";

// ---- 1. Personal best -----------------------------------------------------------------------
// Only fires when the LATEST comparable point is strictly the best in its own history — never
// inferred from a short recent window.
function generatePersonalBestInsight(strokeLabel, paceSeries, swolfSeries) {
  const th = INSIGHT_THRESHOLDS;
  const checkBest = (series, label, unitFmt) => {
    if (series.length < th.minPointsForPB) return null;
    const latest = series[series.length - 1];
    const priorBest = Math.min(...series.slice(0, -1).map((p) => p.v));
    if (latest.v < priorBest) {
      return { label, value: latest.v, unitFmt };
    }
    return null;
  };
  const paceBest = checkBest(paceSeries, "pace", fmtPace100);
  if (paceBest) {
    return {
      id: "pb-pace", category: "achievement", priority: 1, confidence: "high",
      title: `New ${strokeLabel} pace best`,
      message: `That's your quickest ${strokeLabel.toLowerCase()} swim in the history we can compare.`,
      metrics: [{ label: "Pace", value: fmtPace100(paceBest.value) }],
    };
  }
  const swolfBest = checkBest(swolfSeries, "swolf", (v) => Math.round(v));
  if (swolfBest) {
    return {
      id: "pb-swolf", category: "achievement", priority: 1, confidence: "high",
      title: "New efficiency best",
      message: `That's your best same-pool SWOLF for ${strokeLabel.toLowerCase()} so far.`,
      metrics: [{ label: "SWOLF", value: Math.round(swolfBest.value) }],
    };
  }
  return null;
}

// ---- 2. Medium-term improvement (~6 weeks) --------------------------------------------------
function generateImprovementInsight(strokeLabel, paceSeries, swolfSeries, dpsSeries, weeks) {
  const th = INSIGHT_THRESHOLDS;
  const paceSplit = splitTrendWindows(paceSeries, weeks);
  if (!paceSplit) return null;
  const recentAvg = medianOf(paceSplit.recent.map((p) => p.v));
  const olderAvg = medianOf(paceSplit.baseline.map((p) => p.v));
  const pct = pctChange(recentAvg, olderAvg);
  if (pct == null || Math.abs(pct) < th.paceMeaningfulPct) return null;
  const improving = pct < 0;
  const pctAbs = Math.round(Math.abs(pct) * 1000) / 10;
  const basisPhrase = trendWindowPhrase(paceSplit);

  // Supporting efficiency evidence uses its own valid comparable windows. SWOLF is already
  // pool-aware upstream, so an efficiency claim cannot silently mix pool lengths.
  const swolfSplit = splitTrendWindows(swolfSeries, weeks);
  const dpsSplit = splitTrendWindows(dpsSeries, weeks);
  const swolfPct = swolfSplit ? pctChange(medianOf(swolfSplit.recent.map((p) => p.v)), medianOf(swolfSplit.baseline.map((p) => p.v))) : null;
  const dpsPct = dpsSplit ? pctChange(medianOf(dpsSplit.recent.map((p) => p.v)), medianOf(dpsSplit.baseline.map((p) => p.v))) : null;

  if (improving) {
    let extra = "";
    if (swolfPct != null && swolfPct < -th.swolfMeaningfulPct && dpsPct != null && dpsPct > th.dpsMeaningfulPct) {
      extra = " SWOLF decreased and distance per stroke increased as well, which supports an efficiency improvement.";
    } else if (swolfPct != null && swolfPct < -th.swolfMeaningfulPct) {
      extra = " Comparable same-pool SWOLF also decreased, which supports an efficiency improvement.";
    }
    return {
      id: "improve-pace", category: "positive", priority: 2,
      confidence: paceSeries.length >= 6 ? "high" : "medium",
      title: "You're getting faster",
      message: `Your recent ${strokeLabel.toLowerCase()} swims are moving in the right direction.${extra}`,
      metrics: [{ label: "Pace", value: `${pctAbs}% faster` }],
    };
  }
  return {
    id: "decline-pace", category: "warning", priority: 2,
    confidence: paceSeries.length >= 6 ? "high" : "medium",
    title: "A slower patch",
    message: `Your recent ${strokeLabel.toLowerCase()} swims have been a little slower than your earlier ones. One patch doesn't define the trend — we'll keep watching it.`,
    metrics: [{ label: "Pace", value: `${pctAbs}% slower` }],
  };
}

// ---- 3. Strong / weak latest session ---------------------------------------------------------
function generateLatestSessionInsight(strokeLabel, paceSeries) {
  const th = INSIGHT_THRESHOLDS;
  if (!paceSeries || paceSeries.length < 3) return null;
  const latest = paceSeries[paceSeries.length - 1];
  const baselineRecent = paceSeries.slice(0, -1).slice(-Math.min(3, paceSeries.length - 1));
  if (baselineRecent.length < 2) return null;
  const baselineAvg = medianOf(baselineRecent.map((p) => p.v));
  const pct = pctChange(latest.v, baselineAvg);
  if (pct == null || Math.abs(pct) < th.paceMeaningfulPct) return null;
  const pctAbs = Math.round(Math.abs(pct) * 1000) / 10;
  if (pct < 0) {
    return {
      id: "latest-strong", category: "positive", priority: 3, confidence: paceSeries.length >= 5 ? "medium" : "low",
      title: "Strong latest swim",
      message: `You were clearly quicker than you've been recently.`,
      metrics: [{ label: "Pace", value: `${pctAbs}% faster · vs previous ${baselineRecent.length}` }],
    };
  }
  return {
    id: "latest-weak", category: "warning", priority: 3, confidence: paceSeries.length >= 5 ? "medium" : "low",
    title: "An easier day",
    message: `Your latest swim was slower than your recent pace. That's one session, not a trend.`,
    metrics: [{ label: "Pace", value: `${pctAbs}% slower · vs previous ${baselineRecent.length}` }],
  };
}

// ---- 5/6. Pace vs. stroke rate, pace vs. stroke distance --------------------------------------
function generatePaceRelationshipInsight(strokeLabel, paceSeries, otherSeries, otherField, weeks) {
  const th = INSIGHT_THRESHOLDS;
  const paired = pairSeriesByDate(paceSeries, otherSeries);
  const pairedPrimary = paired.map((p) => ({ date: p.date, v: p.primary }));
  const split = splitTrendWindows(pairedPrimary, weeks);
  if (!split) return null;
  const recentDates = new Set(split.recent.map((p) => p.date));
  const baselineDates = new Set(split.baseline.map((p) => p.date));
  const recentPairs = paired.filter((p) => recentDates.has(p.date));
  const baselinePairs = paired.filter((p) => baselineDates.has(p.date));
  if (recentPairs.length < 2 || baselinePairs.length < 2) return null;

  const pacePct = pctChange(medianOf(recentPairs.map((p) => p.primary)), medianOf(baselinePairs.map((p) => p.primary)));
  const otherPct = pctChange(medianOf(recentPairs.map((p) => p.secondary)), medianOf(baselinePairs.map((p) => p.secondary)));
  if (pacePct == null || otherPct == null || pacePct >= -th.paceMeaningfulPct) return null;
  const pacePctAbs = Math.round(Math.abs(pacePct) * 1000) / 10;

  if (otherField === "cadence") {
    const th2 = th.cadenceMeaningfulPct;
    if (Math.abs(otherPct) < th2) {
      return {
        id: "rel-strokerate-stable", category: "positive", priority: 5, confidence: "medium",
        title: "Faster without higher turnover",
        message: `Your ${strokeLabel.toLowerCase()} pace improved ${pacePctAbs}% while stroke rate stayed about the same.`,
        metrics: [{ label: "Pace", value: `${pacePctAbs}% faster` }, { label: "Stroke rate", value: "stable" }],
      };
    }
    if (otherPct > th2) {
      return {
        id: "rel-strokerate-up", category: "neutral", priority: 5, confidence: "medium",
        title: "Faster, with more turnover",
        message: `Your ${strokeLabel.toLowerCase()} pace improved ${pacePctAbs}%, while stroke rate also increased.`,
        metrics: [{ label: "Pace", value: `${pacePctAbs}% faster` }, { label: "Stroke rate", value: "higher" }],
      };
    }
    return {
      id: "rel-strokerate-down", category: "positive", priority: 5, confidence: "medium",
      title: "Faster with lower turnover",
      message: `Your ${strokeLabel.toLowerCase()} pace improved ${pacePctAbs}% while stroke rate decreased. Distance per stroke is tracked separately, so this does not assume why turnover changed.`,
      metrics: [{ label: "Pace", value: `${pacePctAbs}% faster` }, { label: "Stroke rate", value: "lower" }],
    };
  }

  const th2 = th.dpsMeaningfulPct;
  if (otherPct > th2) {
    return {
      id: "rel-dps-up", category: "positive", priority: 6, confidence: "medium",
      title: "Faster with more distance per stroke",
      message: `Your ${strokeLabel.toLowerCase()} pace improved ${pacePctAbs}% while distance per stroke increased.`,
      metrics: [{ label: "Pace", value: `${pacePctAbs}% faster` }, { label: "Distance/stroke", value: "higher" }],
    };
  }
  if (otherPct < -th2) {
    return {
      id: "rel-dps-down", category: "neutral", priority: 6, confidence: "medium",
      title: "Faster, but with less distance per stroke",
      message: `Your ${strokeLabel.toLowerCase()} pace improved ${pacePctAbs}%, while distance per stroke decreased.`,
      metrics: [{ label: "Pace", value: `${pacePctAbs}% faster` }, { label: "Distance/stroke", value: "lower" }],
    };
  }
  return null;
}

// ---- 7. Pace vs. heart rate --------------------------------------------------------------------
// HR is only ever recorded whole-session in this app (not per-stroke), so this always compares
// whole-session pace against whole-session HR — never a specific stroke's pace.
function generateHeartRateInsight(overallPaceSeries, hrSeries, weeks, strokeFilterActive) {
  const th = INSIGHT_THRESHOLDS;
  const paired = pairSeriesByDate(overallPaceSeries, hrSeries);
  const pairedPrimary = paired.map((p) => ({ date: p.date, v: p.primary }));
  const split = splitTrendWindows(pairedPrimary, weeks);
  if (!split) return null;
  const recentDates = new Set(split.recent.map((p) => p.date));
  const baselineDates = new Set(split.baseline.map((p) => p.date));
  const recent = paired.filter((p) => recentDates.has(p.date));
  const baseline = paired.filter((p) => baselineDates.has(p.date));
  if (recent.length < 2 || baseline.length < 2) return null;

  const pacePct = pctChange(medianOf(recent.map((p) => p.primary)), medianOf(baseline.map((p) => p.primary)));
  if (pacePct == null || pacePct >= -th.paceMeaningfulPct) return null;
  const hrDiff = medianOf(recent.map((p) => p.secondary)) - medianOf(baseline.map((p) => p.secondary));
  const pacePctAbs = Math.round(Math.abs(pacePct) * 1000) / 10;
  const caveat = strokeFilterActive ? " Heart rate is whole-session data, not stroke-specific." : "";
  if (Math.abs(hrDiff) <= th.hrMeaningfulBpm) {
    return {
      id: "hr-similar-effort", category: "positive", priority: 7, confidence: "medium",
      title: "Faster at similar effort",
      message: `Pace improved ${pacePctAbs}% while average heart rate stayed within about ${th.hrMeaningfulBpm} bpm of baseline.${caveat}`,
      metrics: [{ label: "Pace", value: `${pacePctAbs}% faster` }, { label: "Avg HR", value: "~unchanged" }],
    };
  }
  if (hrDiff > th.hrMeaningfulBpm) {
    return {
      id: "hr-more-effort", category: "neutral", priority: 7, confidence: "medium",
      title: "Faster, but with more effort",
      message: `Pace improved ${pacePctAbs}%, while average heart rate was about ${Math.round(hrDiff)} bpm higher than baseline.${caveat}`,
      metrics: [{ label: "Pace", value: `${pacePctAbs}% faster` }, { label: "Avg HR", value: `+${Math.round(hrDiff)} bpm` }],
    };
  }
  return {
    id: "hr-less-effort", category: "positive", priority: 7, confidence: "medium",
    title: "Faster with lower heart rate",
    message: `Pace improved ${pacePctAbs}%, while average heart rate was about ${Math.abs(Math.round(hrDiff))} bpm lower than baseline.${caveat}`,
    metrics: [{ label: "Pace", value: `${pacePctAbs}% faster` }, { label: "Avg HR", value: `${Math.round(hrDiff)} bpm` }],
  };
}

// ---- 8. Training frequency / "time to swim" ----------------------------------------------------
function generateFrequencyInsight(chronSessions, todayStr) {
  if (chronSessions.length < 3) return null;
  const recent = chronSessions.slice(-8);
  const gaps = [];
  for (let i = 1; i < recent.length; i++) gaps.push(dayDiff(recent[i - 1].date, recent[i].date));
  if (gaps.length < 2) return null;
  const sortedGaps = [...gaps].sort((a, b) => a - b);
  const medianGap = sortedGaps[Math.floor(sortedGaps.length / 2)];
  if (medianGap <= 0) return null;
  const daysSinceLast = dayDiff(chronSessions[chronSessions.length - 1].date, todayStr);
  if (daysSinceLast < medianGap * INSIGHT_THRESHOLDS.frequencyGapMultiplier || daysSinceLast < 3) return null;
  const perWeek = Math.max(1, Math.round((7 / medianGap) * 10) / 10);
  return {
    id: "frequency-gap", category: "reminder", priority: 8, confidence: "medium",
    title: "Time to swim",
    message: `You haven't logged a swim in ${daysSinceLast} days. You normally swim around ${perWeek} time${perWeek === 1 ? "" : "s"} per week — a swim today would bring you back toward your usual rhythm.`,
    metrics: [{ label: "Days since last swim", value: daysSinceLast }],
  };
}

// Multi-metric Compare interpretation. This summarizes directional patterns only; it never
// claims causation. The comparison is recent median vs earlier median across paired/available
// sessions within the current filtered context.
const compareMetricMeta = {
  pace:    { label: "Pace", color: "#F5F5F7", thresholdKind: "pct", threshold: INSIGHT_THRESHOLDS.paceMeaningfulPct, favorable: "down" },
  dps:     { label: "Distance / Stroke", color: "#30D158", thresholdKind: "pct", threshold: INSIGHT_THRESHOLDS.dpsMeaningfulPct, favorable: null },
  cadence: { label: "Stroke Rate", color: "#64D2FF", thresholdKind: "pct", threshold: INSIGHT_THRESHOLDS.cadenceMeaningfulPct, favorable: null },
  swolf:   { label: "SWOLF", color: "#BF5AF2", thresholdKind: "pct", threshold: INSIGHT_THRESHOLDS.swolfMeaningfulPct, favorable: "down" },
  hr:      { label: "Avg HR", color: "#FF453A", thresholdKind: "absolute", threshold: INSIGHT_THRESHOLDS.hrMeaningfulBpm, favorable: null },
};
function summarizeCompareMetricChange(metricId, recentVals, baselineVals) {
  const meta = compareMetricMeta[metricId];
  const recent = medianOf((recentVals || []).filter((v) => v != null && Number.isFinite(v)));
  const baseline = medianOf((baselineVals || []).filter((v) => v != null && Number.isFinite(v)));
  if (!meta || recent == null || baseline == null) return null;
  let delta, magnitude, direction;
  if (meta.thresholdKind === "absolute") {
    delta = recent - baseline;
    magnitude = Math.round(Math.abs(delta) * 10) / 10;
    direction = Math.abs(delta) <= meta.threshold ? "steady" : delta > 0 ? "up" : "down";
  } else {
    delta = baseline !== 0 ? (recent - baseline) / baseline : null;
    if (delta == null) return null;
    magnitude = Math.round(Math.abs(delta) * 1000) / 10;
    direction = Math.abs(delta) <= meta.threshold ? "steady" : delta > 0 ? "up" : "down";
  }
  const unit = meta.thresholdKind === "absolute" ? " bpm" : "%";
  let phrase;
  if (direction === "steady") phrase = `${meta.label} stayed near its recent baseline`;
  else if (metricId === "pace") phrase = direction === "down" ? `Pace became ${magnitude}% faster` : `Pace became ${magnitude}% slower`;
  else if (metricId === "swolf") phrase = direction === "down" ? `SWOLF decreased ${magnitude}%` : `SWOLF increased ${magnitude}%`;
  else if (metricId === "dps") phrase = direction === "up" ? `Distance / Stroke increased ${magnitude}%` : `Distance / Stroke decreased ${magnitude}%`;
  else if (metricId === "cadence") phrase = direction === "up" ? `Stroke Rate increased ${magnitude}%` : `Stroke Rate decreased ${magnitude}%`;
  else phrase = direction === "up" ? `Avg HR increased ${magnitude}${unit}` : `Avg HR decreased ${magnitude}${unit}`;

function compareStoryFromChanges(changes, scopeLabel = "Recent swimming") {
  if (!changes || !changes.length) return null;
  const byId = Object.fromEntries(changes.map((c) => [c.metricId, c]));
  const pace = byId.pace, dps = byId.dps, cadence = byId.cadence, swolf = byId.swolf, hr = byId.hr;

  const changed = (c) => c && c.direction !== "steady";
  const namesOfChanged = [dps, cadence, swolf, hr].filter(changed).map((c) => c.meta.label);
  const changedText = namesOfChanged.length
    ? ` (${namesOfChanged.slice(0,3).join(", ")}${namesOfChanged.length > 3 ? ", +" + (namesOfChanged.length - 3) + " more" : ""})`
    : "";

  let category = "neutral";
  let headline = `${scopeLabel}: mixed signals.`;
  let story = "";

  // --- PERFORMANCE ANCHOR: Pace -------------------------------------------------
  if (pace) {
    // Faster
    if (pace.direction === "down") {
      category = "positive";

      // Strongest efficiency stories first.
      if (dps?.direction === "up" && hr?.direction === "down") {
        headline = `${scopeLabel}: faster with a stronger stroke and lower cardiovascular cost.`;
        story = "Pace improved, distance per stroke increased, and average heart rate fell — a strong overall efficiency pattern.";
      } else if (dps?.direction === "up" && hr?.direction === "steady") {
        headline = `${scopeLabel}: faster with a stronger stroke at similar cardiovascular cost.`;
        story = "Pace improved while distance per stroke increased, without a meaningful rise in average heart rate.";
      } else if (swolf?.direction === "down" && dps?.direction === "up") {
        headline = `${scopeLabel}: faster with better stroke economy.`;
        story = "Pace improved, SWOLF decreased, and distance per stroke increased — several efficiency signals moved favorably together.";
      } else if (swolf?.direction === "down" && hr?.direction === "down") {
        headline = `${scopeLabel}: faster with better SWOLF and lower cardiovascular cost.`;
        story = "Pace improved while SWOLF and average heart rate both moved favorably.";
      } else if (dps?.direction === "up" && cadence?.direction !== "up") {
        headline = `${scopeLabel}: faster with more distance per stroke.`;
        story = "Pace improved while each Garmin-counted stroke covered more distance, without clearly relying on higher turnover.";
      } else if (cadence?.direction === "up" && dps?.direction === "down") {
        headline = `${scopeLabel}: faster mainly through turnover.`;
        story = "You gained speed with a higher stroke rate while distance per stroke fell — the improvement looks turnover-driven.";
      } else if (cadence?.direction === "up" && (!dps || dps.direction === "steady")) {
        headline = `${scopeLabel}: faster through higher turnover.`;
        story = "Pace improved while stroke rate increased; the selected metrics suggest turnover contributed to the extra speed.";
      } else if (hr?.direction === "down") {
        headline = `${scopeLabel}: faster at a lower cardiovascular cost.`;
        story = "Pace improved while average heart rate fell — a favorable performance/cost relationship.";
      } else if (hr?.direction === "steady") {
        headline = `${scopeLabel}: faster at a similar cardiovascular cost.`;
        story = "Pace improved without a meaningful rise in average heart rate.";
      } else if (hr?.direction === "up") {
        headline = `${scopeLabel}: faster, but at a higher cardiovascular cost.`;
        story = "Performance improved, but the faster pace came with a higher heart-rate response.";
      } else if (swolf?.direction === "down") {
        headline = `${scopeLabel}: faster with better SWOLF.`;
        story = "Pace improved and SWOLF decreased — both moved favorably, but the selected metrics do not identify the mechanism.";
      } else if (swolf?.direction === "up") {
        headline = `${scopeLabel}: faster, but SWOLF worsened.`;
        story = "Pace improved, but SWOLF moved unfavorably — speed increased without a matching SWOLF improvement.";
      } else if (dps?.direction === "down") {
        headline = `${scopeLabel}: faster with a shorter stroke.`;
        story = "Pace improved even though distance per stroke fell; the selected metrics do not show one clear cause.";
      } else {
        headline = `${scopeLabel}: faster.`;
        story = changedText
          ? `Pace improved while supporting metrics also changed${changedText}, but no single mechanism is clear.`
          : "Pace improved while the selected supporting metrics stayed near baseline.";
      }

    // Slower
    } else if (pace.direction === "up") {
      category = "warning";

      if (hr?.direction === "up") {
        headline = `${scopeLabel}: slower despite a higher cardiovascular cost.`;
        story = "Pace fell while average heart rate rose — an unfavorable performance/cost relationship.";
      } else if (cadence?.direction === "up") {
        headline = `${scopeLabel}: more turnover without more speed.`;
        story = "Stroke rate increased, but pace became slower.";
      } else if (dps?.direction === "down" && swolf?.direction === "up") {
        headline = `${scopeLabel}: slower with weaker stroke-economy signals.`;
        story = "Pace slowed, distance per stroke decreased, and SWOLF worsened.";
      } else if (dps?.direction === "up") {
        headline = `${scopeLabel}: longer stroke, but speed was lost.`;
        story = "Distance per stroke increased, but pace became slower — more length/glide did not translate into speed.";
      } else if (swolf?.direction === "up") {
        headline = `${scopeLabel}: slower with worse SWOLF.`;
        story = "Pace slowed and SWOLF increased — both moved unfavorably.";
      } else if (swolf?.direction === "down") {
        headline = `${scopeLabel}: slower, despite better SWOLF.`;
        story = "SWOLF improved, but pace slowed — the efficiency indicator and actual speed disagreed.";
      } else if (dps?.direction === "down") {
        headline = `${scopeLabel}: slower with less distance per stroke.`;
        story = "Both speed and distance covered per stroke moved unfavorably.";
      } else {
        headline = `${scopeLabel}: slower.`;
        story = changedText
          ? `Pace slowed while supporting metrics changed${changedText}; the selected metrics do not identify one clear cause.`
          : "Pace slowed while the selected supporting metrics stayed near baseline.";
      }

    // Pace stable
    } else {
      const supporting = [dps, cadence, swolf, hr].filter(Boolean);
      const changedSupporting = supporting.filter(changed);
      const selectedNames = [pace, ...supporting].filter(Boolean).map((c) => c.meta.label);

      if (!changedSupporting.length) {
        headline = `${scopeLabel}: stable.`;
        story = `Selected metrics (${selectedNames.join(", ")}) all stayed close to their recent baseline.`;
      } else if (hr?.direction === "down") {
        category = "positive";
        headline = `${scopeLabel}: same pace at a lower cardiovascular cost.`;
        story = `Pace stayed stable while average heart rate fell${changedText}.`;
      } else if (dps?.direction === "up" && cadence?.direction === "down") {
        category = "positive";
        headline = `${scopeLabel}: same speed with a longer, lower-turnover stroke.`;
        story = `Pace stayed stable while distance per stroke increased and stroke rate decreased${changedText}.`;
      } else if (swolf?.direction === "down") {
        category = "positive";
        headline = `${scopeLabel}: same speed with better SWOLF.`;
        story = `Pace stayed stable while SWOLF improved${changedText}.`;
      } else if (cadence?.direction === "up") {
        headline = `${scopeLabel}: more turnover, same speed.`;
        story = `Stroke rate increased without a meaningful pace improvement${changedText}.`;
      } else {
        headline = `${scopeLabel}: pace stayed stable.`;
        story = `Your pace stayed close to normal. Supporting metrics changed${changedText}, but your overall speed remained stable.`;
      }
    }

  // --- NO PACE SELECTED ----------------------------------------------------------
  } else {
    if (swolf && dps) {
      if (swolf.direction === "down" && dps.direction === "up") {
        category = "positive";
        headline = `${scopeLabel}: technique indicators moved favorably.`;
        story = "SWOLF improved while distance per stroke increased, but Pace is not selected so this is not enough to claim faster swimming.";
      } else if (swolf.direction === "up" && dps.direction === "down") {
        category = "warning";
        headline = `${scopeLabel}: technique indicators moved unfavorably.`;
        story = "SWOLF worsened while distance per stroke decreased.";
      } else {
        headline = `${scopeLabel}: mixed technique signals.`;
        story = "SWOLF and distance per stroke moved in different directions. Add Pace to judge whether the pattern improved performance.";
      }
    } else if (hr && cadence && changed(hr) && changed(cadence)) {
      headline = `${scopeLabel}: effort and turnover changed.`;
      story = "Heart rate and stroke rate changed, but without Pace there is no defensible good/bad performance conclusion.";
    } else {
      headline = `${scopeLabel}: context only.`;
      story = "These selected metrics do not have an intrinsic good/bad direction on their own. Add Pace to judge whether the change helped performance.";
    }
  }

  const notes = changes.map((c) => c.phrase);
  return { category, headline, story, notes };
}

function buildMultiMetricCompareInterpretation(selectedCfgs, trendDataView) {
  if (!selectedCfgs?.length || !trendDataView || trendDataView.length < 4) return null;
  const usableDates = trendDataView.filter((d) => selectedCfgs.every((cfg) => d[cfg.key] != null));
  if (usableDates.length < 4) return null;
  const splitAt = Math.max(2, Math.floor(usableDates.length / 2));
  const baselineRows = usableDates.slice(0, splitAt);
  const recentRows = usableDates.slice(splitAt);
  if (recentRows.length < 2) return null;
  const changes = selectedCfgs.map((cfg) => summarizeCompareMetricChange(
    cfg.id, recentRows.map((d) => d[cfg.key]), baselineRows.map((d) => d[cfg.key])
  )).filter(Boolean);
  const story = compareStoryFromChanges(changes, "Recent swimming");
  if (!story) return null;
  return { ...story, baselineCount: baselineRows.length, recentCount: recentRows.length, mode: "trend" };
}

function buildMultiMetricSessionInterpretation(selectedCfgs, trendDataView, selectedDate) {
  if (!selectedDate || !selectedCfgs?.length) return null;
  const selected = trendDataView.find((d) => d.date === selectedDate);
  if (!selected) return null;
  if (!selectedCfgs.every((cfg) => selected[cfg.key] != null)) return null;
  const priorRows = trendDataView
    .filter((d) => d.date < selectedDate && selectedCfgs.every((cfg) => d[cfg.key] != null))
    .slice(-6);
  if (priorRows.length < 2) return null;
  const changes = selectedCfgs.map((cfg) => summarizeCompareMetricChange(
    cfg.id,
    selected[cfg.key] != null ? [selected[cfg.key]] : [],
    priorRows.map((d) => d[cfg.key])
  )).filter(Boolean);
  const story = compareStoryFromChanges(changes, fmtDate(selectedDate));
  if (!story) return null;
  return { ...story, baselineCount: priorRows.length, recentCount: 1, mode: "session", selectedDate };
}

// ---- 9. Flexible Compare metric interpretation ------------------------------------------------
// Compare no longer hard-codes metric pairs. Any two metrics can be selected; each metric carries
// its own threshold and direction semantics. Interpretation describes the two observed changes
