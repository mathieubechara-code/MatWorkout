// without claiming causation (e.g. DPS + HR can suggest a useful relationship, not prove power).
const compareMetricThreshold = (metric) => {
  if (metric === "hr") return { kind: "absolute", value: INSIGHT_THRESHOLDS.hrMeaningfulBpm };
  if (metric === "cadence") return { kind: "pct", value: INSIGHT_THRESHOLDS.cadenceMeaningfulPct };
  if (metric === "dps") return { kind: "pct", value: INSIGHT_THRESHOLDS.dpsMeaningfulPct };
  if (metric === "swolf") return { kind: "pct", value: INSIGHT_THRESHOLDS.swolfMeaningfulPct };
  return { kind: "pct", value: INSIGHT_THRESHOLDS.paceMeaningfulPct };
};
const compareMetricChange = (metric, current, baseline) => {
  if (current == null || baseline == null) return null;
  const th = compareMetricThreshold(metric);
  if (th.kind === "absolute") {
    const delta = current - baseline;
    return { direction: delta > th.value ? "up" : delta < -th.value ? "down" : "steady", magnitude: Math.abs(delta), unit: "bpm" };
  }
  const pct = pctChange(current, baseline);
  if (pct == null) return null;
  return { direction: pct > th.value ? "up" : pct < -th.value ? "down" : "steady", magnitude: Math.round(Math.abs(pct) * 1000) / 10, unit: "%" };
};
const compareMetricPhrase = (metric, change) => {
  if (!change || change.direction === "steady") {
    return metric === "pace" ? "pace stayed near baseline"
      : metric === "dps" ? "distance per stroke stayed near baseline"
      : metric === "cadence" ? "stroke rate stayed near baseline"
      : metric === "swolf" ? "SWOLF stayed near baseline"
      : "heart rate stayed near baseline";
  }
  const m = `${change.magnitude}${change.unit}`;
  if (metric === "pace") return change.direction === "down" ? `pace was ${m} faster` : `pace was ${m} slower`;
  if (metric === "dps") return change.direction === "up" ? `distance per stroke was ${m} higher` : `distance per stroke was ${m} lower`;
  if (metric === "cadence") return change.direction === "up" ? `stroke rate was ${m} higher` : `stroke rate was ${m} lower`;
  if (metric === "swolf") return change.direction === "down" ? `SWOLF was ${m} lower` : `SWOLF was ${m} higher`;
  return change.direction === "up" ? `heart rate was ${m} higher` : `heart rate was ${m} lower`;
};
function generateFlexibleCompareTrendInterpretation(metricA, metricB, primaryPoints, secPoints, weeks) {
  const paired = pairSeriesByDate(primaryPoints, secPoints);
  const split = splitTrendWindows(paired.map((p) => ({ date: p.date, v: p.primary })), weeks);
  if (!split) return null;
  const recentDates = new Set(split.recent.map((p) => p.date));
  const baselineDates = new Set(split.baseline.map((p) => p.date));
  const recent = paired.filter((p) => recentDates.has(p.date));
  const baseline = paired.filter((p) => baselineDates.has(p.date));
  if (recent.length < 2 || baseline.length < 2) return null;
  const a = compareMetricChange(metricA, medianOf(recent.map(p=>p.primary)), medianOf(baseline.map(p=>p.primary)));
  const b = compareMetricChange(metricB, medianOf(recent.map(p=>p.secondary)), medianOf(baseline.map(p=>p.secondary)));
  if (!a || !b) return null;
  const bothSteady = a.direction === "steady" && b.direction === "steady";
  return {
    category: bothSteady ? "neutral" : "neutral",
    headline: bothSteady ? "Both metrics are steady." : "Relationship changing.",
    detail: `${compareMetricPhrase(metricA, a)}; ${compareMetricPhrase(metricB, b)}.`
  };
}
function generateFlexibleCompareSessionInterpretation(metricA, metricB, selectedA, selectedB, baselineAVals, baselineBVals) {
  if (selectedA == null || selectedB == null || baselineAVals.length < 2 || baselineBVals.length < 2) return null;
  const a = compareMetricChange(metricA, selectedA, medianOf(baselineAVals));
  const b = compareMetricChange(metricB, selectedB, medianOf(baselineBVals));
  if (!a || !b) return null;
  return {
    category: "neutral",
    headline: "Selected session vs your recent baseline.",
    detail: `${compareMetricPhrase(metricA, a)}; ${compareMetricPhrase(metricB, b)}.`
  };
}

// ---- 9. Compare chart trend interpretation -----------------------------------------------------
// Turns the currently-displayed Compare chart (primary metric = pace or SWOLF, both
// "lower is better"; secondary metric = cadence, distance/stroke, or HR) into one short,
// plain-language line. Deliberately mirrors the raw/median-based approach used everywhere else
// in Insights (see medianOf above) rather than reasoning from standard deviation — the chart's
// z-score axis is a display technique only, not part of this decision.
function generateCompareTrendInterpretation(compareMode, primaryPoints, secPoints, weeks) {
  const th = INSIGHT_THRESHOLDS;
  const paired = pairSeriesByDate(primaryPoints, secPoints);
  const primaryPaired = paired.map((p) => ({ date: p.date, v: p.primary }));
  const split = splitTrendWindows(primaryPaired, weeks);
  if (!split) return null;
  const recentDates = new Set(split.recent.map((p) => p.date));
  const baselineDates = new Set(split.baseline.map((p) => p.date));
  const recent = paired.filter((p) => recentDates.has(p.date));
  const baseline = paired.filter((p) => baselineDates.has(p.date));
  if (recent.length < 2 || baseline.length < 2) return null;

  const primaryPct = pctChange(medianOf(recent.map((p) => p.primary)), medianOf(baseline.map((p) => p.primary)));
  const primaryTh = compareMode === "swolfhr" ? th.swolfMeaningfulPct : th.paceMeaningfulPct;
  const primaryImproved = primaryPct != null && primaryPct <= -primaryTh;
  const primaryWorse = primaryPct != null && primaryPct >= primaryTh;
  const primaryPctAbs = primaryPct != null ? Math.round(Math.abs(primaryPct) * 1000) / 10 : null;

  const isHrSecondary = compareMode === "hr" || compareMode === "swolfhr";
  let secUp = false, secDown = false;
  if (isHrSecondary) {
    const diff = medianOf(recent.map((p) => p.secondary)) - medianOf(baseline.map((p) => p.secondary));
    secUp = diff > th.hrMeaningfulBpm;
    secDown = diff < -th.hrMeaningfulBpm;
  } else {
    const secPct = pctChange(medianOf(recent.map((p) => p.secondary)), medianOf(baseline.map((p) => p.secondary)));
    const secTh = compareMode === "cadence" ? th.cadenceMeaningfulPct : th.dpsMeaningfulPct;
    secUp = secPct != null && secPct > secTh;
    secDown = secPct != null && secPct < -secTh;
  }
  const secStable = !secUp && !secDown;

  if (compareMode === "cadence") {
    if (primaryImproved && secStable) return { category: "positive", headline: "Faster without higher turnover.", detail: `Pace improved ${primaryPctAbs}% while stroke rate stayed about the same.` };
    if (primaryImproved && secUp) return { category: "neutral", headline: "Faster through turnover.", detail: `Pace improved ${primaryPctAbs}%, while stroke rate increased as well.` };
    if (primaryImproved && secDown) return { category: "positive", headline: "Faster with lower turnover.", detail: `Pace improved ${primaryPctAbs}% while stroke rate decreased. This does not assume a distance-per-stroke change.` };
    if (!primaryWorse && secUp) return { category: "neutral", headline: "Turnover up, speed unchanged.", detail: "Stroke rate increased without a meaningful pace change." };
    if (!primaryWorse && secDown) return { category: "neutral", headline: "Turnover down, speed unchanged.", detail: "Stroke rate decreased without a meaningful pace change." };
    if (primaryWorse && secStable) return { category: "warning", headline: "Pace has slipped.", detail: `Pace is ${primaryPctAbs}% slower while stroke rate stayed about the same.` };
    if (primaryWorse) return { category: "warning", headline: "Slower, turnover changed too.", detail: `Pace is ${primaryPctAbs}% slower, alongside a change in stroke rate.` };
    return { category: "neutral", headline: "Steady.", detail: "Pace and stroke rate have both stayed within their meaningful-change bands." };
  }

  if (compareMode === "dps") {
    if (primaryImproved && secUp) return { category: "positive", headline: "More efficient.", detail: `Pace improved ${primaryPctAbs}% while distance per stroke increased.` };
    if (primaryImproved && secDown) return { category: "neutral", headline: "Faster, but not more efficient.", detail: `Pace improved ${primaryPctAbs}% while distance per stroke decreased.` };
    if (primaryImproved && secStable) return { category: "positive", headline: "Efficiency is stable.", detail: `Pace improved ${primaryPctAbs}% while distance per stroke stayed about the same.` };
    if (!primaryWorse && secUp) return { category: "positive", headline: "More efficient, pace steady.", detail: "Distance per stroke increased without a meaningful pace change." };
    if (!primaryWorse && secDown) return { category: "warning", headline: "Less efficient, pace steady.", detail: "Distance per stroke decreased without a meaningful pace change." };
    if (primaryWorse && secDown) return { category: "warning", headline: "Slower and less efficient.", detail: "Pace slipped alongside a drop in distance per stroke." };
    if (primaryWorse) return { category: "warning", headline: "Pace has slipped.", detail: `Pace is ${primaryPctAbs}% slower.` };
    return { category: "neutral", headline: "Steady.", detail: "Pace and distance per stroke have both stayed within their meaningful-change bands." };
  }

  if (compareMode === "hr") {
    if (primaryImproved && secStable) return { category: "positive", headline: "Faster at similar effort.", detail: `Pace improved ${primaryPctAbs}% while heart rate stayed close to baseline.` };
    if (primaryImproved && secDown) return { category: "positive", headline: "Faster with less effort.", detail: `Pace improved ${primaryPctAbs}% while heart rate was lower.` };
    if (primaryImproved && secUp) return { category: "neutral", headline: "Faster, but with more effort.", detail: `Pace improved ${primaryPctAbs}%, while heart rate was also higher.` };
    if (!primaryWorse && secUp) return { category: "warning", headline: "More effort, speed unchanged.", detail: "Heart rate increased without a meaningful pace change." };
    if (!primaryWorse && secDown) return { category: "neutral", headline: "Lower heart rate, pace steady.", detail: "Heart rate decreased while pace stayed within its meaningful-change band." };
    if (primaryWorse) return { category: "warning", headline: "Pace has slipped.", detail: `Pace is ${primaryPctAbs}% slower.` };
    return { category: "neutral", headline: "Steady.", detail: "Pace and heart rate have both stayed close to baseline." };
  }

  if (primaryImproved && secStable) return { category: "positive", headline: "More efficient at similar effort.", detail: "Same-pool SWOLF improved while heart rate stayed close to baseline." };
  if (primaryImproved && secDown) return { category: "positive", headline: "More efficient with less effort.", detail: "Same-pool SWOLF improved while heart rate was lower." };
  if (primaryImproved && secUp) return { category: "neutral", headline: "More efficient, but with more effort.", detail: "Same-pool SWOLF improved, while heart rate was higher." };
  if (!primaryWorse && secUp) return { category: "warning", headline: "More effort, efficiency unchanged.", detail: "Heart rate increased without a meaningful same-pool SWOLF improvement." };
  if (!primaryWorse && secDown) return { category: "neutral", headline: "Lower heart rate, efficiency steady.", detail: "Heart rate decreased while same-pool SWOLF stayed within its meaningful-change band." };
  if (primaryWorse) return { category: "warning", headline: "Efficiency has slipped.", detail: `Same-pool SWOLF is ${primaryPctAbs}% worse than baseline.` };
  return { category: "neutral", headline: "Steady.", detail: "Same-pool SWOLF and heart rate have both stayed close to baseline." };
}

// ---- 10. Compare chart — single selected-session interpretation --------------------------------
// Mirrors generateCompareTrendInterpretation's category logic, but compares one tapped session's
// raw values against the median of its other comparable sessions (same stroke, same chart data)
// instead of a recent-vs-older window. Returns null when there aren't at least 2 other comparable
// sessions to form a responsible baseline.
function generateCompareSessionInterpretation(compareMode, strokeLabel, selectedPrimary, selectedSecondary, baselinePrimaryVals, baselineSecondaryVals, primaryFmt, otherFmt) {
  const th = INSIGHT_THRESHOLDS;
  if (selectedPrimary == null || selectedSecondary == null) return null;
  if (baselinePrimaryVals.length < 2 || baselineSecondaryVals.length < 2) return null;

  const baselinePrimaryMed = medianOf(baselinePrimaryVals);
  const baselineSecondaryMed = medianOf(baselineSecondaryVals);
  const primaryPct = pctChange(selectedPrimary, baselinePrimaryMed);
  const primaryTh = compareMode === "swolfhr" ? th.swolfMeaningfulPct : th.paceMeaningfulPct;
  const primaryImproved = primaryPct != null && primaryPct <= -primaryTh;
  const primaryWorse = primaryPct != null && primaryPct >= primaryTh;
  const primaryPctAbs = primaryPct != null ? Math.round(Math.abs(primaryPct) * 1000) / 10 : null;

  const isHr = compareMode === "hr" || compareMode === "swolfhr";
  let secUp, secDown;
  if (isHr) {
    const diff = selectedSecondary - baselineSecondaryMed;
    secUp = diff > th.hrMeaningfulBpm;
    secDown = diff < -th.hrMeaningfulBpm;
  } else {
    const secPct = pctChange(selectedSecondary, baselineSecondaryMed);
    const secTh = compareMode === "cadence" ? th.cadenceMeaningfulPct : th.dpsMeaningfulPct;
    secUp = secPct != null && secPct > secTh;
    secDown = secPct != null && secPct < -secTh;
  }
  const secStable = !secUp && !secDown;

  const modeWords = {
    cadence: { noun: "stroke rate", up: "increased", down: "decreased", stable: "stayed close to normal" },
    dps: { noun: "distance per stroke", up: "increased", down: "decreased", stable: "stayed about the same" },
    hr: { noun: "heart rate", up: "was higher than usual", down: "was lower than usual", stable: "stayed close to your usual level" },
    swolfhr: { noun: "heart rate", up: "was higher than usual", down: "was lower than usual", stable: "stayed close to your usual level" },
  }[compareMode];
  const secPhrase = secUp ? `${modeWords.noun} ${modeWords.up}` : secDown ? `${modeWords.noun} ${modeWords.down}` : `${modeWords.noun} ${modeWords.stable}`;

  const primaryWord = compareMode === "swolfhr" ? "Efficiency" : "Pace";
  const primaryDirWord = primaryImproved ? "faster" : primaryWorse ? "slower" : "close to typical";
  const primaryDetail = primaryPctAbs != null && (primaryImproved || primaryWorse)
    ? `${primaryWord} was ${primaryFmt(selectedPrimary)}, around ${primaryPctAbs}% ${primaryDirWord} than your recent ${strokeLabel.toLowerCase()} baseline (${primaryFmt(baselinePrimaryMed)})`
    : `${primaryWord} was ${primaryFmt(selectedPrimary)}, close to your recent ${strokeLabel.toLowerCase()} baseline (${primaryFmt(baselinePrimaryMed)})`;
  const detail = `${primaryDetail}, while ${secPhrase} (${otherFmt(selectedSecondary)} vs ${otherFmt(baselineSecondaryMed)}).`;

  const headlines = {
    cadence: {
      "improved-stable": ["positive", "Faster without higher turnover."],
      "improved-up": ["neutral", "Faster, with more turnover."],
      "improved-down": ["positive", "Faster with lower turnover."],
      "steady-up": ["neutral", "More turnover, speed unchanged."],
      "steady-down": ["neutral", "Less turnover, speed unchanged."],
      "steady-stable": ["neutral", "Close to your usual swim."],
      "worse-any": ["warning", "Slower than usual."],
    },
    dps: {
      "improved-up": ["positive", "Efficiency gain."],
      "improved-down": ["neutral", "Faster, but not more efficient."],
      "improved-stable": ["positive", "Efficiency is stable."],
      "steady-up": ["positive", "More efficient, pace steady."],
      "steady-down": ["warning", "Less efficient, pace steady."],
      "steady-stable": ["neutral", "Close to your usual swim."],
      "worse-any": ["warning", "Slower than usual."],
    },
    hr: {
      "improved-stable": ["positive", "Faster at similar effort."],
      "improved-down": ["positive", "Faster with less effort."],
      "improved-up": ["neutral", "Faster, but with more effort."],
      "steady-up": ["warning", "More effort, speed unchanged."],
      "steady-down": ["neutral", "Less effort, speed unchanged."],
      "steady-stable": ["neutral", "Close to your usual swim."],
      "worse-any": ["warning", "Slower than usual."],
    },
  };
  headlines.swolfhr = {
    "improved-stable": ["positive", "More efficient at similar effort."],
    "improved-down": ["positive", "More efficient with less effort."],
    "improved-up": ["neutral", "More efficient, but with more effort."],
    "steady-up": ["warning", "More effort, efficiency unchanged."],
    "steady-down": ["neutral", "Less effort, efficiency unchanged."],
    "steady-stable": ["neutral", "Close to your usual swim."],
    "worse-any": ["warning", "Efficiency slipped."],
  };

  const secKey = secUp ? "up" : secDown ? "down" : "stable";
  const key = primaryWorse ? "worse-any" : primaryImproved ? `improved-${secKey}` : `steady-${secKey}`;
  const [category, headline] = headlines[compareMode][key] || ["neutral", "Close to your usual swim."];

  return { category, headline, detail };
}

// ---- Orchestration: gather everything applicable, rank, dedupe, return top 1-3 -----------------
function buildSwimInsights({ chronSessions, trendData, activeStroke, strokeLabel, todayStr, strokeFilterActive }) {
  if (!chronSessions || chronSessions.length === 0) return [];
  const allMode = !activeStroke;
  const paceSeries = allMode ? extractSeriesKey(trendData, "pace100") : extractSeries(trendData, activeStroke, "pace100");
  // Mixed-stroke technique values are descriptive only; Garmin explicitly treats SWOLF as
  // non-comparable across stroke types. Overall Dashboard insights therefore use whole-session
  // pace/HR/frequency, while technique stories are reserved for a concrete stroke.
  const swolfSeries = allMode ? [] : extractSeries(trendData, activeStroke, "swolf");
  const cadenceSeries = allMode ? [] : extractSeries(trendData, activeStroke, "cadence");
  const dpsSeries = allMode ? [] : extractSeries(trendData, activeStroke, "dps");
  const overallPaceSeries = extractSeriesKey(trendData, "pace100");
  const hrSeries = extractSeriesKey(trendData, "avgHR");

  if (paceSeries.length < 2) {
    return [{
      id: "baseline", category: "insufficient", priority: 99, confidence: "n/a",
      title: "Just getting started",
      message: `Keep swimming — we need another ${strokeLabel.toLowerCase()} session before there's enough history to show a direction.`,
      metrics: [{ label: "Swims logged", value: paceSeries.length }],
    }];
  }

  const weeks = INSIGHT_THRESHOLDS.mediumTermWeeks;
  const candidates = [
    generatePersonalBestInsight(strokeLabel, paceSeries, swolfSeries),
    generateImprovementInsight(strokeLabel, paceSeries, swolfSeries, dpsSeries, weeks),
    generateLatestSessionInsight(strokeLabel, paceSeries),
    generatePaceRelationshipInsight(strokeLabel, paceSeries, cadenceSeries, "cadence", weeks),
    generatePaceRelationshipInsight(strokeLabel, paceSeries, dpsSeries, "dps", weeks),
    generateHeartRateInsight(overallPaceSeries, hrSeries, weeks, strokeFilterActive),
    generateFrequencyInsight(chronSessions, todayStr),
  ].filter(Boolean);

  const hasBigStory = candidates.some((c) => c.id === "pb-pace" || c.id === "improve-pace");
  const hasSlowerPatch = candidates.some((c) => c.id === "decline-pace");
  // Avoid telling the athlete the same story twice: a medium-term slower patch already
  // explains the direction, so only surface the latest-session warning when it adds a
  // genuinely separate signal.
  const deduped = candidates.filter((c) =>
    !(hasBigStory && c.id === "latest-strong") &&
    !(hasSlowerPatch && c.id === "latest-weak")
  );
  deduped.sort((a, b) => a.priority - b.priority);
  const top = deduped.slice(0, 3);

  if (top.length === 0) {
    if (paceSeries.length >= 4) {
      const latestWindow = paceSeries.slice(-Math.min(3, paceSeries.length));
      const priorWindow = paceSeries.slice(0, -latestWindow.length);
      let detail = "";
      if (priorWindow.length >= 2) {
        const pct = pctChange(medianOf(latestWindow.map((p) => p.v)), medianOf(priorWindow.map((p) => p.v)));
        if (pct != null) detail = ` Recent median pace is ${Math.abs(pct) < INSIGHT_THRESHOLDS.paceMeaningfulPct ? "within" : "near"} the app's ${Math.round(INSIGHT_THRESHOLDS.paceMeaningfulPct * 1000) / 10}% meaningful-change band.`;
      }
      return [{
        id: "stable-profile", category: "neutral", priority: 50, confidence: paceSeries.length >= 6 ? "high" : "medium",
        title: "Holding steady",
        message: `Your recent swims are staying pretty consistent. Nothing is moving strongly up or down yet — keep swimming and we'll watch for the trend.`,
        metrics: [{ label: "Swims", value: paceSeries.length }, { label: "Pace", value: "stable" }],
      }];
    }
    return [{
      id: "baseline", category: "insufficient", priority: 99, confidence: "n/a",
      title: "Building your picture",
      message: `A direction is starting to form, but a few more swims will make it easier to trust.`,
      metrics: [{ label: "Swims", value: paceSeries.length }],
    }];
  }
  return top;
}

function SwimmingTab({ isMobile, onExit }) {
  const [sessions, setSessions] = useState(null);
  const [expandedId, setExpandedId] = useState(null);
  const [strokeFilter, setStrokeFilter] = useState("all");
  const [expandedMetrics, setExpandedMetrics] = useState(() => new Set()); // set of trend-card keys currently expanded
  const [swimTimeView, setSwimTimeView] = useState("day"); // "day" (per session) or "week" (aggregated) — scoped to this tab only
  const [chartOverlaySel, setChartOverlaySel] = useState({ pace: "none", swolf: "none", cadence: "none", dps: "none" }); // per-chart overlay choice
  const [compareMetrics, setCompareMetrics] = useState(["pace", "cadence"]); // freely selectable Compare metrics
  const [compareHelpOpen, setCompareHelpOpen] = useState(false);
  const [selectedComparePoint, setSelectedComparePoint] = useState(null); // date string of a tapped Compare chart dot, or null for "overall trend" view
  const [showCompareInfo, setShowCompareInfo] = useState(false); // toggles the Compare chart's "what is this" info popover
  const [editingDistanceFor, setEditingDistanceFor] = useState(null); // session id currently being corrected
  const [distanceDraft, setDistanceDraft] = useState("");
  const [activityStrokeFilter, setActivityStrokeFilter] = useState({}); // { [sessionId]: strokeName | "all" } — per-session pace chart filter
  const [openRepsFor, setOpenRepsFor] = useState({}); // { [sessionId]: bool } — Reps/sets sub-section, collapsed by default
  const [openLengthsFor, setOpenLengthsFor] = useState({}); // { [sessionId]: bool } — Length by length sub-section, collapsed by default
  const [metricValueMode, setMetricValueMode] = useState("latest"); // "latest" | "avg6" — headline number on each Trends card
  const [swimSection, setSwimSection] = useState(() => {
    try {
      const saved = localStorage.getItem("swim-section-v1");
      return ["dashboard", "trends", "compare", "radar"].includes(saved) ? saved : "dashboard";
    } catch { return "dashboard"; }
  }); // "dashboard" | "trends" | "compare" | "radar" — the 4 tabs within the Swim tab. Session Detail
                                                              // lives below the switcher now, outside all three (see render, item 2).
  useEffect(() => {
    try { localStorage.setItem("swim-section-v1", swimSection); } catch {}
  }, [swimSection]);

  const [categoryFilter, setCategoryFilter] = useState("all"); // session context: All | Workout | CSS Test
  const [effortFilter, setEffortFilter] = useState("all"); // length role: All | Easy | Work | Speed; independent of session context
  const [radarMetricKeys, setRadarMetricKeys] = useState(() => new Set(["pace", "efficiency", "consistency", "endurance", "aerobic"])); // personalized Radar axis visibility picker
  const [radarCurrentId, setRadarCurrentId] = useState(null); // session id for the radar's "Current" polygon — null falls back to the latest session
  const [radarBaselineId, setRadarBaselineId] = useState("avg6"); // "avg6" (last-6-session average) or a specific session id
  const SWIM_KEY = "swim-sessions-v1";

  useEffect(() => {
    (async () => {
      try {
        const res = await window.storage.get(SWIM_KEY, false);
        const raw = res && res.value ? JSON.parse(res.value) : [];
        const { sessions: fixed, changed } = backfillSwimSessions(raw);
        setSessions(fixed);
        if (changed) { try { await window.storage.set(SWIM_KEY, JSON.stringify(fixed), false); } catch (_) {} }
      } catch (e) {
        setSessions([]);
      }
    })();
  }, []);

  const persist = async (next) => {
    setSessions(next);
    try { await window.storage.set(SWIM_KEY, JSON.stringify(next), false); } catch (_) {}
  };

  const deleteSession = async (id) => {
    const next = (sessions || []).filter((s) => s.id !== id);
    await persist(next);
  };

  // Manual distance correction (Option A: correct in-app rather than rebuild the .FIT file).
  // The app already treats distance as a computed value (valid active lengths × pool length),
  // never a literal stored FIT field, so a manual override is consistent with how it already
  // works — not a workaround. Recomputes and PERSISTS distance + pace so every card, chart,
  // and PR that reads s.distance/s.pace100Overall picks up the correction automatically,
  // without needing every read-site in the app to know about an override. The original
  // FIT-derived figure is kept in distanceCorrection for transparency and is only captured
  // once, so re-correcting a second time doesn't lose the true original.
  const correctDistance = async (id) => {
    const newDistance = parseFloat(distanceDraft);
    if (!Number.isFinite(newDistance) || newDistance <= 0) { setEditingDistanceFor(null); return; }
    const next = (sessions || []).map((s) => {
      if (s.id !== id) return s;
      const originalDistance = s.distanceCorrection ? s.distanceCorrection.originalDistance : s.distance;
      const newPace100 = s.swimTimeSec > 0 && newDistance > 0 ? (s.swimTimeSec / newDistance) * 100 : null;
      return {
        ...s,
        distance: Math.round(newDistance * 100) / 100,
        pace100Overall: newPace100,
        distanceCorrection: { originalDistance, correctedAt: new Date().toISOString() },
      };
    });
    await persist(next);
    setEditingDistanceFor(null);
    setDistanceDraft("");
  };

  const resetDistanceCorrection = async (id) => {
    const next = (sessions || []).map((s) => {
      if (s.id !== id || !s.distanceCorrection) return s;
      const restoredDistance = s.distanceCorrection.originalDistance;
      const restoredPace = s.swimTimeSec > 0 && restoredDistance ? (s.swimTimeSec / restoredDistance) * 100 : null;
      return { ...s, distance: restoredDistance, pace100Overall: restoredPace, distanceCorrection: null };
    });
    await persist(next);
  };

  // Applies a length-level edit (stroke reclassification, exclude/include, IDLE<->ACTIVE) via
  // an updater function over one session's `lengths` array, then re-derives EVERY dependent
  // metric (distance, swim/rest time, pace, strokeStats, reps) from scratch through
  // computeSwimSessionMetrics — the single source of truth — so nothing on screen goes stale
  // (Part 1F). A manual distance correction, if one was set earlier, is superseded the moment
  // a length is edited, since the length-level system is now the authoritative source.
  const applyLengthEdit = async (sessionId, lengthIndex, updater) => {
    const next = (sessions || []).map((s) => {
      if (s.id !== sessionId) return s;
      const lengths = s.lengths.map((l) => (l.index === lengthIndex ? updater(l) : l));
      const metrics = computeSwimSessionMetrics(lengths, s.poolLength);
      return {
        ...s,
        lengths,
        distance: metrics.distance,
        swimTimeSec: metrics.swimTimeSec,
        restTimeSec: metrics.restTimeSec,
        pace100Overall: metrics.pace100Overall,
        strokeStats: metrics.strokeStats,
        reps: metrics.reps,
        totalActiveLengths: metrics.totalActiveLengths,
        validActiveLengths: metrics.validActiveLengths,
        excludedCount: metrics.excludedCount,
        qualityNote: metrics.qualityNote,
        distanceCorrection: null,
      };
    });
    await persist(next);
  };

  // Part 1C/1D: correct a length's stroke, or reclassify IDLE<->ACTIVE. Never overwrites the
  // original `stroke`/`lengthType` fields — writes into the userStroke/userLengthType override
  // layer instead, so the original imported value stays visible and the edit is reversible.
  const updateLengthStroke = (sessionId, lengthIndex, newStroke) =>
    applyLengthEdit(sessionId, lengthIndex, (l) => ({ ...l, userStroke: newStroke === l.stroke ? null : newStroke }));

  const markLengthActive = (sessionId, lengthIndex, stroke) =>
    applyLengthEdit(sessionId, lengthIndex, (l) => ({ ...l, userLengthType: "active", userStroke: stroke }));

  const markLengthIdle = (sessionId, lengthIndex) =>
    applyLengthEdit(sessionId, lengthIndex, (l) => ({ ...l, userLengthType: l.lengthType === "idle" ? null : "idle", userStroke: null }));

  // Part 1A/1B: exclude/include a length from analysis entirely (accidental lap press,
  // duplicate/parasite length, GPS artifact...). Reversible any time — see "Include" below.
  const toggleExcludeLength = (sessionId, lengthIndex) =>
    applyLengthEdit(sessionId, lengthIndex, (l) => ({ ...l, userExcluded: !l.userExcluded }));

  // Reverts every override on a single length back to the original imported values.
  const resetLengthOverrides = (sessionId, lengthIndex) =>
    applyLengthEdit(sessionId, lengthIndex, (l) => ({ ...l, userExcluded: false, userLengthType: null, userStroke: null }));

  const [idleToActiveFor, setIdleToActiveFor] = useState(null); // { sessionId, lengthIndex } — length currently prompting for a swim-type pick

  // Session-detail CSS flagging: lets a person retroactively mark two of a session's own
  // reconstructed reps (Reps/sets) as the short/long split for a CSS calculation, instead of
  // only being able to set this at upload time. { [sessionId]: { short: repIdx, long: repIdx } }
  const [cssRepPick, setCssRepPick] = useState({});

  const pickCssRep = (sessionId, slot, repIdx) => {
    setCssRepPick((prev) => {
      const cur = prev[sessionId] || {};
      return { ...prev, [sessionId]: { ...cur, [slot]: cur[slot] === repIdx ? null : repIdx } };
    });
  };

  // Computes CSS from whichever two reps were picked, using their actual distances/times
  // (not a hardcoded 200/400) — so it works whether the reps were exactly 200m/400m or just
  // close to it. Stored under the same cssTest.{t200,t400} shape the rest of the app expects.
  const applyCssRepPick = async (sessionId) => {
    const pick = cssRepPick[sessionId];
    const session = (sessions || []).find((s) => s.id === sessionId);
    if (!pick || !session || pick.short == null || pick.long == null || pick.short === pick.long) return;
    const repA = session.reps[pick.short], repB = session.reps[pick.long];
    if (!repA || !repB) return;
    const [shortRep, longRep] = repA.distance <= repB.distance ? [repA, repB] : [repB, repA];
    if (longRep.distance === shortRep.distance || longRep.timeSec <= shortRep.timeSec) return;
    const cssSpeed = (longRep.distance - shortRep.distance) / (longRep.timeSec - shortRep.timeSec);
    const pace100 = cssSpeed > 0 ? 100 / cssSpeed : null;
    const next = (sessions || []).map((s) => (s.id === sessionId ? { ...s, isCssTest: true, cssTest: { t200: shortRep.timeSec, t400: longRep.timeSec, cssSpeed, pace100 } } : s));
    await persist(next);
    setCssRepPick((prev) => { const cp = { ...prev }; delete cp[sessionId]; return cp; });
  };

  const clearCssPick = (sessionId) => setCssRepPick((prev) => ({ ...prev, [sessionId]: {} }));

  const unmarkCssTest = async (sessionId) => {
    const next = (sessions || []).map((s) => (s.id === sessionId ? { ...s, isCssTest: false, cssTest: null } : s));
    await persist(next);
  };

  const todayStr = toISODate(new Date());

  const streak = useMemo(() => {
    if (!sessions || sessions.length === 0) return null;
    const weekKeySet = new Set(sessions.map((s) => toISODate(mondayOf(s.date))));
    const currentMonday = mondayOf(todayStr);
    let wStreak = 0, firstIter = true;
    let cursor = new Date(currentMonday);
    for (let i = 0; i < 104; i++) {
      const key = toISODate(cursor);
      if (weekKeySet.has(key)) wStreak++;
      else if (!firstIter) break;
      firstIter = false;
      cursor.setDate(cursor.getDate() - 7);
    }
    const dayKeySet = new Set(sessions.map((s) => s.date));
    let dStreak = 0; let dCursor = new Date(todayStr + "T00:00:00");
    // Day streak starts counting from today/yesterday backward; if nothing logged today it
    // still counts an active streak through yesterday.
    if (!dayKeySet.has(toISODate(dCursor))) dCursor.setDate(dCursor.getDate() - 1);
    for (let i = 0; i < 365; i++) {
      const key = toISODate(dCursor);
      if (dayKeySet.has(key)) { dStreak++; dCursor.setDate(dCursor.getDate() - 1); } else break;
    }
    const sorted = [...sessions].sort((a, b) => (a.date < b.date ? -1 : 1));
    const daysSinceLast = dayDiff(sorted[sorted.length - 1].date, todayStr);
    return { weekStreak: wStreak, dayStreak: dStreak, daysSinceLast, totalSessions: sessions.length };
  }, [sessions, todayStr]);

  // Category is derived straight from the existing isCssTest boolean — no separate settable
  // field. Whatever already marks a session as a CSS test (the Reps/sets picker below, or
  // upload-time in History & Log) is the single source of truth for this label everywhere.
  const categoryLabelOf = (s) => (s.isCssTest ? "CSS Test" : "Workout");
  const categoryValueOf = (s) => (s.isCssTest ? "csstest" : "workout");

  // Auto effort detection always sees the complete swim history; changing a slicer must not
  // move the classifier's own reference point. Manual userEffort overrides are read on top.
  const effortAssignments = useMemo(() => buildSwimEffortAssignments(sessions || []), [sessions]);

  // Shared eligibility pipeline for Trend + Compare + Radar + Insights:
  // 1) existing session category filter, then 2) optional Easy/Work/Speed length view.
  // Effort=All returns the original sessions untouched, so V79 behavior is exactly preserved.
  const chronSessions = useMemo(() => {
    const chron = sessions ? [...sessions].sort((a, b) => (a.date < b.date ? -1 : 1)) : [];
    const categoryChron = categoryFilter === "all" ? chron : chron.filter((s) => categoryValueOf(s) === categoryFilter);
    if (effortFilter === "all") return categoryChron;
    return categoryChron.map((s) => deriveSwimSessionForEffort(s, effortFilter, effortAssignments)).filter(Boolean);
  }, [sessions, categoryFilter, effortFilter, effortAssignments]);
  const sortedSessions = useMemo(() => (sessions ? [...sessions].sort((a, b) => (a.date < b.date ? 1 : -1)) : []), [sessions]);

  // Dashboard is intentionally filter-neutral. Analysis filters belong to Trend / Compare /
  // Radar and remain remembered there, but must never leak into the overview/Insights.
  const dashboardChronSessions = useMemo(
    () => sessions ? [...sessions].sort((a, b) => (a.date < b.date ? -1 : 1)) : [],
    [sessions]
  );

  const allStrokesSeen = useMemo(() => {
    const set = new Set();
    (chronSessions || []).forEach((s) => Object.keys(s.strokeStats || {}).forEach((k) => set.add(k)));
    return Array.from(set);
  }, [chronSessions]);

  // The stroke with the most sessions of data — used as the default single line shown on the
  // collapsed sparkline cards for the per-stroke metrics (SWOLF, cadence, distance/stroke).
  const primaryStroke = useMemo(() => {
    const counts = {};
    (chronSessions || []).forEach((s) => Object.keys(s.strokeStats || {}).forEach((k) => { counts[k] = (counts[k] || 0) + 1; }));
    let best = null, bestCount = -1;
    Object.keys(counts).forEach((k) => { if (counts[k] > bestCount) { best = k; bestCount = counts[k]; } });
    return best;
  }, [chronSessions]);

  // "All strokes" technique metrics must represent the whole swim, not the most-common
  // stroke. Per-stroke stats are length-level averages with `count` = contributing lengths,
  // so a count-weighted aggregation gives one session value across every swim type present.
  const swimHrContext = (s, stroke = null) => {
    if (!s || !Array.isArray(s.lengths)) return { avgHR: null, coveredSec: 0, totalSec: 0, coverage: 0 };
    const active = s.lengths
      .map((raw) => ({ raw, eff: effectiveLength(raw) }))
      .filter(({ raw, eff }) =>
        eff.lengthType === "active" &&
        !raw.userExcluded &&
        eff.elapsedSec != null &&
        Number.isFinite(eff.elapsedSec) &&
        eff.elapsedSec > 0 &&
        (!stroke || eff.stroke === stroke)
      );
    const totalSec = active.reduce((a,{eff})=>a+eff.elapsedSec,0);
    const withHr = active.filter(({eff})=>eff.avgHR != null && Number.isFinite(eff.avgHR) && eff.avgHR > 0);
    const coveredSec = withHr.reduce((a,{eff})=>a+eff.elapsedSec,0);
    const avgHR = coveredSec > 0 ? withHr.reduce((a,{eff})=>a+eff.avgHR*eff.elapsedSec,0)/coveredSec : null;
    return { avgHR, coveredSec, totalSec, coverage: totalSec > 0 ? coveredSec/totalSec : 0 };
  };

  const allStrokeMetric = (s, field) => {
    if (!s || !Array.isArray(s.lengths) || !s.poolLength) return null;
    const active = s.lengths
      .map((raw) => ({ raw, eff: effectiveLength(raw) }))
      .filter(({ raw, eff }) =>
        eff.lengthType === "active" &&
        !raw.userExcluded &&
        TECHNIQUE_SWIM_STROKES.has(eff.stroke)
      );
    if (!active.length) return null;

    if (field === "avgSwolf") {
      const vals = active
        .filter(({ eff }) => eff.elapsedSec != null && eff.totalStrokes != null && Number.isFinite(eff.totalStrokes))
        .map(({ eff }) => Math.round(eff.elapsedSec + eff.totalStrokes));
      return vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : null;
    }

    const counted = active.filter(({ eff }) =>
      eff.totalStrokes != null && Number.isFinite(eff.totalStrokes) && eff.totalStrokes > 0 &&
      eff.elapsedSec != null && Number.isFinite(eff.elapsedSec) && eff.elapsedSec > 0
    );
    if (!counted.length) return null;
    const totalStrokes = counted.reduce((a,{eff})=>a+eff.totalStrokes,0);
    if (!(totalStrokes > 0)) return null;
    if (field === "avgCadence") {
      const totalSec = counted.reduce((a,{eff})=>a+eff.elapsedSec,0);
      return totalSec > 0 ? (totalStrokes / totalSec) * 60 : null;
    }
    if (field === "avgDistPerStroke") {
      return (counted.length * s.poolLength) / totalStrokes;
    }
    return null;
  };

  const dashboardSwolfReferencePool = useMemo(() => {
    for (let i = dashboardChronSessions.length - 1; i >= 0; i--) {
      const s = dashboardChronSessions[i];
      if (s.poolLength != null) return s.poolLength;
    }
    return null;
  }, [dashboardChronSessions]);

  const dashboardTrendData = useMemo(() => dashboardChronSessions.map((s) => ({
    date: s.date,
    label: fmtDate(s.date),
    pace100: s.pace100Overall,
    swolf_all: poolLengthsMatch(s.poolLength, dashboardSwolfReferencePool) ? allStrokeMetric(s, "avgSwolf") : null,
    cadence_all: allStrokeMetric(s, "avgCadence"),
    dps_all: poolLengthsMatch(s.poolLength, dashboardSwolfReferencePool) ? allStrokeMetric(s, "avgDistPerStroke") : null,
    avgHR: swimHrContext(s).avgHR,
    peakHR: s.peakHR,
    energy100: s.calories != null && s.distance ? (s.calories / s.distance) * 100 : null,
  })), [dashboardChronSessions, dashboardSwolfReferencePool]);

  const swolfReferencePools = useMemo(() => {
    const refs = { all: null };
    for (let i = chronSessions.length - 1; i >= 0; i--) {
      const s = chronSessions[i];
      if (refs.all == null && s.poolLength != null) refs.all = s.poolLength;
      Object.keys(s.strokeStats || {}).forEach((stroke) => {
        if (refs[stroke] == null && s.poolLength != null && s.strokeStats[stroke] && s.strokeStats[stroke].avgSwolf != null) refs[stroke] = s.poolLength;
      });
    }
    return refs;
  }, [chronSessions]);

  // Trend series, oldest -> newest, one point per session.
  const trendData = useMemo(() => {
    return chronSessions.map((s) => {
      const energy100 = s.calories != null && s.distance ? (s.calories / s.distance) * 100 : null;
      const point = {
        date: s.date, label: fmtDate(s.date), pace100: s.pace100Overall,
        swolf_all: poolLengthsMatch(s.poolLength, swolfReferencePools.all) ? allStrokeMetric(s, "avgSwolf") : null,
        cadence_all: allStrokeMetric(s, "avgCadence"),
        dps_all: poolLengthsMatch(s.poolLength, swolfReferencePools.all) ? allStrokeMetric(s, "avgDistPerStroke") : null,
        avgHR: swimHrContext(s).avgHR, peakHR: s.peakHR, energy100,
      };
      allStrokesSeen.forEach((stroke) => {
        const st = s.strokeStats && s.strokeStats[stroke];
        point[`pace100_${stroke}`] = st ? st.pace100 : null;
        point[`swolf_${stroke}`] = st && poolLengthsMatch(s.poolLength, swolfReferencePools[stroke]) ? st.avgSwolf : null;
        point[`cadence_${stroke}`] = st ? st.avgCadence : null;
        point[`dps_${stroke}`] = st && poolLengthsMatch(s.poolLength, swolfReferencePools[stroke]) ? st.avgDistPerStroke : null;
        point[`hr_${stroke}`] = swimHrContext(s, stroke).avgHR;
      });
      return point;
    });
  }, [chronSessions, allStrokesSeen, swolfReferencePools]);

  // Weekly-aggregated equivalent of trendData, for the Day/Week trend toggle. Sessions are
  // bucketed by the Monday of their week (same mondayOf/toISODate helpers used elsewhere);
  // weeks with zero sessions simply don't appear (no null-padded gaps).
  const weeklyTrendData = useMemo(() => {
    if (chronSessions.length === 0) return [];
    const buckets = {};
    chronSessions.forEach((s) => {
      const weekKey = toISODate(mondayOf(s.date));
      if (!buckets[weekKey]) buckets[weekKey] = [];
      buckets[weekKey].push(s);
    });

    const pooledFor = (weekSessions, stroke = null, requirePool = null) => {
      let timeSec = 0, distance = 0, totalStrokes = 0, countedSec = 0, countedDistance = 0;
      const swolfs = [];
      let hrWeighted = 0, hrSec = 0;
      weekSessions.forEach((s) => {
        if (requirePool != null && !poolLengthsMatch(s.poolLength, requirePool)) return;
        (s.lengths || []).forEach((raw) => {
          const eff = effectiveLength(raw);
          if (eff.lengthType !== "active" || raw.userExcluded || (stroke && eff.stroke !== stroke)) return;
          const elapsed = eff.elapsedSec != null && Number.isFinite(eff.elapsedSec) ? eff.elapsedSec : 0;
          timeSec += elapsed;
          if (s.poolLength) distance += s.poolLength;

          if ((!stroke || TECHNIQUE_SWIM_STROKES.has(eff.stroke)) && TECHNIQUE_SWIM_STROKES.has(eff.stroke)) {
            if (eff.totalStrokes != null && Number.isFinite(eff.totalStrokes)) swolfs.push(Math.round(elapsed + eff.totalStrokes));
            if (eff.totalStrokes != null && Number.isFinite(eff.totalStrokes) && eff.totalStrokes > 0 && elapsed > 0) {
              totalStrokes += eff.totalStrokes;
              countedSec += elapsed;
              if (s.poolLength) countedDistance += s.poolLength;
            }
          }
          if (eff.avgHR != null && Number.isFinite(eff.avgHR) && eff.avgHR > 0 && elapsed > 0) {
            hrWeighted += eff.avgHR * elapsed;
            hrSec += elapsed;
          }
        });
      });
      return {
        pace100: timeSec > 0 && distance > 0 ? (timeSec / distance) * 100 : null,
        swolf: swolfs.length ? swolfs.reduce((a,b)=>a+b,0)/swolfs.length : null,
        cadence: totalStrokes > 0 && countedSec > 0 ? (totalStrokes / countedSec) * 60 : null,
        dps: totalStrokes > 0 && countedDistance > 0 ? countedDistance / totalStrokes : null,
        avgHR: hrSec > 0 ? hrWeighted/hrSec : null,
      };
    };

    return Object.keys(buckets).sort().map((weekKey) => {
      const weekSessions = buckets[weekKey];
      const overall = pooledFor(weekSessions, null, null);
      const samePoolAll = pooledFor(weekSessions, null, swolfReferencePools.all);
      const peakHrVals = weekSessions.map((s)=>s.peakHR).filter((v)=>v!=null);
      const totalCalories = weekSessions.reduce((a,s)=>a+(s.calories || 0),0);
      const totalDistance = weekSessions.reduce((a,s)=>a+(s.distance || 0),0);
      const point = {
        date: weekKey,
        label: `Wk ${fmtDate(weekKey)}`,
        pace100: overall.pace100,
        swolf_all: samePoolAll.swolf,
        cadence_all: overall.cadence,
        dps_all: samePoolAll.dps,
        avgHR: overall.avgHR,
        peakHR: peakHrVals.length ? Math.max(...peakHrVals) : null,
        energy100: totalCalories > 0 && totalDistance > 0 ? (totalCalories/totalDistance)*100 : null,
        sessionCount: weekSessions.length,
      };
      allStrokesSeen.forEach((stroke) => {
        const pooled = pooledFor(weekSessions, stroke, null);
        const pooledSame = pooledFor(weekSessions, stroke, swolfReferencePools[stroke]);
        point[`pace100_${stroke}`] = pooled.pace100;
        point[`swolf_${stroke}`] = pooledSame.swolf;
        point[`cadence_${stroke}`] = pooled.cadence;
        point[`dps_${stroke}`] = pooledSame.dps;
        point[`hr_${stroke}`] = pooled.avgHR;
      });
      return point;
    });
  }, [chronSessions, allStrokesSeen, swolfReferencePools]);

  // The series actually feeding the sparkline cards + expanded charts, switched by the
  // Day/Week toggle. Collapsed cards and their expanded charts always read from this same
  // source, so they never disagree.
  const trendDataView = swimTimeView === "week" ? weeklyTrendData : trendData;

  const cssTrendData = useMemo(() => {
    const chron = sessions ? [...sessions].filter((s) => s.isCssTest && s.cssTest).sort((a, b) => (a.date < b.date ? -1 : 1)) : [];
    return chron.map((s) => ({ date: s.date, label: fmtDate(s.date), cssPace100: s.cssTest.pace100, cssSpeed: s.cssTest.cssSpeed }));
  }, [sessions]);

  // ---- Distance by swim type: latest session vs 6-week total, plus stroke mix ----------
  // For each stroke seen, shows the distance swum in that stroke during the most recent
  // session that included it, the raw *total* distance in that stroke over the last 6
  // calendar weeks (Mon-Sun, including the current in-progress week — no division, so a
  // single 900m session shows as 900m, not amortized down to 150m/week), and that stroke's
  // % share of total swim distance across all strokes over the same 6-week window.
  const strokeDistanceStats = useMemo(() => {
    if (!sessions || sessions.length === 0 || allStrokesSeen.length === 0) return [];
    const currentMonday = mondayOf(todayStr);
    const weekKeys = [];
    for (let w = 5; w >= 0; w--) {
      const d = new Date(currentMonday); d.setDate(d.getDate() - w * 7);
      weekKeys.push(toISODate(d));
    }
    const weekKeySet = new Set(weekKeys);
    const rows = allStrokesSeen.map((stroke) => {
      // Latest: most recent session (sortedSessions is newest-first) that included this stroke.
      let latest = null;
      for (let i = 0; i < sortedSessions.length; i++) {
        const s = sortedSessions[i];
        const st = s.strokeStats && s.strokeStats[stroke];
        if (st && st.count > 0 && s.poolLength != null) {
          latest = { date: s.date, distance: Math.round(st.count * s.poolLength * 100) / 100 };
          break;
        }
      }
      let sixWeekTotal = 0;
      sessions.forEach((s) => {
        const wk = toISODate(mondayOf(s.date));
        if (!weekKeySet.has(wk)) return;
        const st = s.strokeStats && s.strokeStats[stroke];
        if (st && st.count > 0 && s.poolLength != null) sixWeekTotal += st.count * s.poolLength;
      });
      return { stroke, latest, sixWeekTotal: Math.round(sixWeekTotal) };
    });
    const grandTotal = rows.reduce((a, r) => a + r.sixWeekTotal, 0);
    return rows
      .map((r) => ({ ...r, pct: grandTotal > 0 ? (r.sixWeekTotal / grandTotal) * 100 : null }))
      .sort((a, b) => b.sixWeekTotal - a.sixWeekTotal);
  }, [sessions, sortedSessions, allStrokesSeen, todayStr]);

  // ---- Swim PR card -------------------------------------------------------------------
  // Best pace also records that session's dominant stroke (the one with the most lengths),
  // shown as a small tag next to the PR so "1:32/100m" isn't ambiguous about which stroke it
  // was swum in — whole-session pace can otherwise mix strokes together silently.
  const bestPacePR = useMemo(() => {
    if (!sessions) return null;
    let best = null;
    sessions.forEach((s) => {
      if (s.pace100Overall == null) return;
      if (!best || s.pace100Overall < best.value) {
        const stats = s.strokeStats || {};
        let domStroke = null, domCount = -1;
        Object.keys(stats).forEach((k) => { if (stats[k].count > domCount) { domStroke = k; domCount = stats[k].count; } });
        best = { value: s.pace100Overall, date: s.date, stroke: domStroke };
      }
    });
    return best;
  }, [sessions]);

  // Only compared within the same pool length as the most recent session, since SWOLF isn't
  // meaningfully comparable across different pool lengths.
  const bestSwolfPR = useMemo(() => {
    if (!sessions || sessions.length === 0) return null;
    const refPoolLength = sortedSessions[0] ? sortedSessions[0].poolLength : null;
    let best = null;
    sessions.forEach((s) => {
      if (s.poolLength !== refPoolLength) return;
      const vals = Object.values(s.strokeStats || {}).map((st) => st.avgSwolf).filter((v) => v != null);
      if (!vals.length) return;
      const sessionMin = Math.min(...vals);
      if (!best || sessionMin < best.value) best = { value: sessionMin, date: s.date };
    });
    return best;
  }, [sessions, sortedSessions]);

  const longestSessionPR = useMemo(() => {
    if (!sessions) return null;
    let best = null;
    sessions.forEach((s) => {
      if (s.distance == null) return;
      if (!best || s.distance > best.value) best = { value: s.distance, date: s.date };
    });
    return best;
  }, [sessions]);

  const bestCssPR = useMemo(() => {
    if (!sessions) return null;
    let best = null;
    sessions.forEach((s) => {
      if (!s.isCssTest || !s.cssTest || s.cssTest.pace100 == null) return;
      if (!best || s.cssTest.pace100 < best.value) best = { value: s.cssTest.pace100, date: s.date };
    });
    return best;
  }, [sessions]);

  if (sessions === null) {
    return <div style={{ color: "#636366", fontSize: 13, padding: "24px 0" }}>Loading swim data…</div>;
  }

  const cardStyle = { background: "#1C1C1E", border: "1px solid #2C2C2E", borderRadius: 20, boxShadow: "none", padding: isMobile ? 14 : 18, marginBottom: 18 };
  const labelStyle = { fontSize: 11, color: "#8E8E93", textTransform: "uppercase", letterSpacing: "0.06em", marginBottom: 6 };

  // ---- Compact "bevel" sparkline trend cards ------------------------------------------
  // Each card: small hidden-axis sparkline, headline (most recent value), and a colored
  // Improving/Steady/Slower verdict comparing the last 3 sessions' average against the
  // 3 before that. Tapping expands into the full chart (with stroke filter pills, for the
  // per-stroke metrics).
  const seriesFor = (key) => trendDataView.map((d) => (d[key] == null ? null : d[key]));

  // Trend status is deliberately "latest vs typical", not recent-window vs prior-window.
  // Typical = mean of the prior comparable values in the currently displayed/filtered series;
  // the latest point is excluded so it cannot move its own reference line.
  const computeVerdict = (series, direction, threshold = 0.025, labels = {}) => {
    const vals = series.filter((v) => v != null && Number.isFinite(v));
    if (vals.length < 2) return null;
    const latest = vals[vals.length - 1];
    const prior = vals.slice(0, -1);
    if (!prior.length) return null;
    const typical = prior.reduce((a, b) => a + b, 0) / prior.length;
    if (typical == null || typical === 0) return null;
    const change = (latest - typical) / typical;
    const pctAbs = Math.round(Math.abs(change) * 1000) / 10;

    if (Math.abs(change) < threshold) {
      return { label: `${labels.steady || "Steady"} · ${pctAbs}% vs typical`, color: "#8E8E93" };
    }
    if (direction === "neutral") {
      return change > 0
        ? { label: `${labels.up || "Higher"} · ${pctAbs}% vs typical`, color: "#64D2FF" }
        : { label: `${labels.down || "Lower"} · ${pctAbs}% vs typical`, color: "#64D2FF" };
    }

    const better = direction === "lower-better" ? change < 0 : change > 0;
    return better
      ? { label: `${labels.better || "Improving"} · ${pctAbs}% vs typical`, color: "#30D158" }
      : { label: `${labels.worse || "Declining"} · ${pctAbs}% vs typical`, color: "#FF453A" };
  };

  const sparkPoints = (series) => series.map((v, i) => ({ i, v })).filter((p) => p.v != null);

  // The stroke used by views that need one concrete stroke label (e.g. Compare/Radar).
  // Trend technique cards do NOT use this fallback when "All strokes" is selected.
  const activeStroke = strokeFilter === "all" ? primaryStroke : strokeFilter;
  // "All strokes" uses genuine whole-session pace plus count-weighted technique metrics
  // across every swim type present. A specific filter switches each metric to that stroke.
  const paceDataKey = strokeFilter === "all" ? "pace100" : `pace100_${strokeFilter}`;
  const paceSeries = seriesFor(paceDataKey);
  const swolfSeries = seriesFor(strokeFilter === "all" ? "swolf_all" : `swolf_${strokeFilter}`);
  const cadenceSeries = seriesFor(strokeFilter === "all" ? "cadence_all" : `cadence_${strokeFilter}`);
  const dpsSeries = seriesFor(strokeFilter === "all" ? "dps_all" : `dps_${strokeFilter}`);

  const latestOf = (series) => { const vals = series.filter((v) => v != null); return vals.length ? vals[vals.length - 1] : null; };
  const sixWeekAverageFromRows = (rows, key) => {
    const valid = (rows || []).filter((d) => d && d.date && d[key] != null && Number.isFinite(d[key]));
    if (!valid.length) return null;
    const latestDate = valid[valid.length - 1].date;
    const cutoff = new Date(`${latestDate}T00:00:00`);
    cutoff.setDate(cutoff.getDate() - 42);
    const cutoffStr = toISODate(cutoff);
    const vals = valid.filter((d) => d.date >= cutoffStr && d.date <= latestDate).map((d) => d[key]);
    return vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null;
  };
  const headlineOf = (series, dataKey = null, sourceRows = trendDataView) => (
    metricValueMode === "avg6" && dataKey
      ? sixWeekAverageFromRows(sourceRows, dataKey)
      : latestOf(series)
  );

  // Card accent color: Pace is the only one of these four that has a genuine "All strokes"
  // value (pace100 is a real whole-session figure — total time ÷ total distance across every
  // stroke swum, not any one stroke's number). SWOLF, stroke rate, and distance/stroke are all
  // When "All strokes" is selected, technique cards use the genuine count-weighted
  // aggregate across every swim type in the session rather than silently falling back to one
  // stroke. Keep the neutral "all" color so the card does not imply a single stroke is shown.
  const strokeCardColor = strokeFilter === "all" ? "#FFFFFF" : (SWIM_STROKE_COLORS[strokeFilter] || "#FFFFFF");
  const strokeTitleSuffix = (stroke) => {
    if (strokeFilter === "all") return " (All swim types)";
    if (!stroke) return "";
    return ` (${SWIM_STROKE_LABELS[stroke]})`;
  };

  // ---- Personalized Radar profile ----------------------------------------------------------
  // IMPORTANT: this is the single Radar calculation layer. It keeps raw metrics, baseline
  // values, relative scores and display values separate so presentation/interpretation cannot
  // silently change the underlying calculation.
  // Radar session pool inherits the selected Swim Type before choosing "latest".
  // All = every qualifying session; a specific swim type = sessions that actually contain it.
  // This mirrors Trend's stroke-specific non-null behavior instead of selecting the latest
  // overall session first and only then discovering that the chosen stroke is absent.
  const radarEligibleSessions = strokeFilter === "all"
    ? chronSessions
    : chronSessions.filter((s) => {
        const st = s && s.strokeStats ? s.strokeStats[strokeFilter] : null;
        return !!(st && (st.pace100 != null || st.avgSwolf != null || st.avgDistPerStroke != null));
      });
  const radarLatestSession = radarEligibleSessions.length ? radarEligibleSessions[radarEligibleSessions.length - 1] : null;
  // Distance for the exact current Radar context.
  // Category is already applied by chronSessions. When Easy/Work/Speed is selected,
  // deriveSwimSessionForEffort has already marked non-matching active lengths excluded.
  // This final helper also applies the selected stroke, so e.g. Freestyle · Work means
  // Freestyle Work metres only — never whole-session distance.
  const radarContextDistance = (s) => {
    if (!s || !Array.isArray(s.lengths) || s.poolLength == null || !Number.isFinite(s.poolLength) || s.poolLength <= 0) return null;
    const qualifyingLengths = s.lengths
      .map((raw) => ({ raw, eff: effectiveLength(raw) }))
      .filter(({ raw, eff }) =>
        eff.lengthType === "active" &&
        !raw.userExcluded &&
        (strokeFilter === "all" || eff.stroke === strokeFilter)
      ).length;
    return qualifyingLengths > 0 ? qualifyingLengths * s.poolLength : null;
  };

  const radarMetricValue = (s, key) => {
    if (!s) return null;
    if (key === "pace") return strokeFilter === "all" ? s.pace100Overall : (s.strokeStats && s.strokeStats[strokeFilter] ? s.strokeStats[strokeFilter].pace100 : null);
    if (key === "swolf") return strokeFilter === "all" ? allStrokeMetric(s, "avgSwolf") : (s.strokeStats && s.strokeStats[strokeFilter] ? s.strokeStats[strokeFilter].avgSwolf : null);
    if (key === "dps") return strokeFilter === "all" ? allStrokeMetric(s, "avgDistPerStroke") : (s.strokeStats && s.strokeStats[strokeFilter] ? s.strokeStats[strokeFilter].avgDistPerStroke : null);
    if (key === "distance") return radarContextDistance(s);
    return null;
  };
  // Within-session pace consistency for the current Radar context.
  // Uses comparable active lengths only: the current effort filter is already reflected in
  // chronSessions, and a selected stroke further restricts the lengths here.
  // CV (standard deviation / mean) makes variability comparable across different pace levels.
  // Lower CV = more stable pacing.
  const radarSessionPaceVariability = (s) => {
    if (!s || !Array.isArray(s.lengths)) return null;
    const groups = {};
    s.lengths
      .map((raw) => ({ raw, eff: effectiveLength(raw) }))
      .filter(({ raw, eff }) =>
        eff.lengthType === "active" &&
        !raw.userExcluded &&
        eff.pace100 != null &&
        Number.isFinite(eff.pace100) &&
        eff.pace100 > 0 &&
        (strokeFilter === "all" ? TECHNIQUE_SWIM_STROKES.has(eff.stroke) : eff.stroke === strokeFilter)
      )
      .forEach(({ eff }) => {
        if (!groups[eff.stroke]) groups[eff.stroke] = [];
        groups[eff.stroke].push(eff.pace100);
      });

    const groupStats = Object.entries(groups).map(([stroke,paces]) => {
      if (paces.length < 3) return null;
      const mean = paces.reduce((a,b)=>a+b,0)/paces.length;
      if (!(mean > 0)) return null;
      const variance = paces.reduce((a,b)=>a+(b-mean)**2,0)/paces.length;
      const sd = Math.sqrt(variance);
      return { stroke, cv: sd/mean, mean, sd, count: paces.length };
    }).filter(Boolean);
    if (!groupStats.length) return null;

    // All-strokes Consistency means "within-stroke pacing stability across the session";
    // it never treats the normal pace difference between freestyle and breaststroke as inconsistency.
    const weight = groupStats.reduce((a,g)=>a+g.count,0);
    const cv = groupStats.reduce((a,g)=>a+g.cv*g.count,0)/weight;
    return { cv, count: weight, groups: groupStats };
  };

  const radarMean = (values) => {
    const vals = values.filter((v) => v != null && Number.isFinite(v));
    return vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null;
  };
  const radarStd = (values) => {
    const vals = values.filter((v) => v != null && Number.isFinite(v));
    if (vals.length < 2) return null;
    const mean = vals.reduce((a, b) => a + b, 0) / vals.length;
    return Math.sqrt(vals.reduce((a, b) => a + (b - mean) ** 2, 0) / vals.length);
  };
  const radarZ = (value, values) => {
    if (value == null) return null;
    const mean = radarMean(values), sd = radarStd(values);
    if (mean == null || sd == null) return null;
    return sd > 0 ? (value - mean) / sd : 0;
  };
  const radarHrContext = (s) => {
    if (!s || !Array.isArray(s.lengths)) return { coverage: 0, avgHR: null };
    const active = s.lengths
      .map((raw) => ({ raw, eff: effectiveLength(raw) }))
      .filter(({ raw, eff }) =>
        eff.lengthType === "active" &&
        !raw.userExcluded &&
        eff.elapsedSec > 0 &&
        (strokeFilter === "all" || eff.stroke === strokeFilter)
      );
    const totalSec = active.reduce((a, { eff }) => a + eff.elapsedSec, 0);
    const withHr = active.filter(({ eff }) => eff.avgHR != null && Number.isFinite(eff.avgHR) && eff.avgHR > 0);
    const coveredSec = withHr.reduce((a, { eff }) => a + eff.elapsedSec, 0);
    const weightedHr = coveredSec > 0
      ? withHr.reduce((a, { eff }) => a + eff.avgHR * eff.elapsedSec, 0) / coveredSec
      : null;
    return { coverage: totalSec > 0 ? coveredSec / totalSec : 0, avgHR: weightedHr };
  };
  const radarHrCoverage = (s) => radarHrContext(s).coverage;

  // Session-based previous-6-week baseline. chronSessions is already the shared Trend/Compare
  // eligibility + category filter, so the Radar inherits exactly that pool. Latest is excluded.
  const radarBaselineSessions = (() => {
    if (!radarLatestSession) return [];
    const cutoff = new Date(`${radarLatestSession.date}T00:00:00`);
    cutoff.setDate(cutoff.getDate() - 42);
    const cutoffStr = toISODate(cutoff);
    return radarEligibleSessions.slice(0, -1).filter((s) => s.date >= cutoffStr && s.date < radarLatestSession.date);
  })();

  const radarAxisMeta = {
    pace: { label: "Speed", color: "#64D2FF" },
    efficiency: { label: "Stroke Efficiency", color: "#30D158" },
    consistency: { label: "Consistency", color: "#BF5AF2" },
    endurance: { label: "Endurance", color: "#FF9F0A" },
    aerobic: { label: "Aerobic Efficiency", color: "#FF453A" },
  };

  const radarProfile = (() => {
    const latest = radarLatestSession;
    if (!latest) return [];
    const profile = [];
    const addAxis = (key, rawMetric, baselineRaw, score, detail) => {
      if (rawMetric == null || baselineRaw == null || score == null || !Number.isFinite(score)) return;
      profile.push({ key, label: radarAxisMeta[key].label, color: radarAxisMeta[key].color, rawMetric, baselineRaw, score, displayValue: Math.max(70, Math.min(130, score)), detail });
    };

    // 1. Speed — pace is lower-is-better.
    const paceBaseline = radarBaselineSessions.map((s) => radarMetricValue(s, "pace"));
    const paceBase = radarMean(paceBaseline);
    const latestPace = radarMetricValue(latest, "pace");
    if (radarBaselineSessions.length >= 2 && latestPace != null && paceBase != null && latestPace > 0) addAxis("pace", latestPace, paceBase, 100 * (paceBase / latestPace), { latest: latestPace, baseline: paceBase });

    // 2. Stroke Efficiency — same-pool, and never compares SWOLF directly across stroke types.
    // Each component is converted to a favorable ratio around baseline=100:
    // lower SWOLF => >100, higher DPS => >100. Their geometric mean gives one balanced score.
    if (strokeFilter === "all") {
      const latestStrokeEntries = Object.entries(latest.strokeStats || {})
        .filter(([stroke, st]) => TECHNIQUE_SWIM_STROKES.has(stroke) && st && st.avgSwolf != null && st.avgDistPerStroke != null && st.count > 0);
      const components = [];
      latestStrokeEntries.forEach(([stroke, latestSt]) => {
        const baseRows = radarBaselineSessions
          .filter((s) => poolLengthsMatch(s.poolLength, latest.poolLength))
          .map((s) => s.strokeStats && s.strokeStats[stroke])
          .filter((st) => st && st.avgSwolf != null && st.avgDistPerStroke != null);
        if (baseRows.length < 2) return;
        const baseSwolf = radarMean(baseRows.map((st)=>st.avgSwolf));
        const baseDps = radarMean(baseRows.map((st)=>st.avgDistPerStroke));
        if (!(baseSwolf > 0) || !(baseDps > 0) || !(latestSt.avgSwolf > 0) || !(latestSt.avgDistPerStroke > 0)) return;
        const score = 100 * Math.sqrt((baseSwolf / latestSt.avgSwolf) * (latestSt.avgDistPerStroke / baseDps));
        components.push({ stroke, score, weight: latestSt.count, latestSwolf: latestSt.avgSwolf, latestDps: latestSt.avgDistPerStroke, baseSwolf, baseDps, baselineCount: baseRows.length });
      });
      if (components.length) {
        const weight = components.reduce((a,c)=>a+c.weight,0);
        const score = components.reduce((a,c)=>a+c.score*c.weight,0)/weight;
        addAxis("efficiency", score, 100, score, { components });
      }
    } else {
      const efficiencyBaseline = radarBaselineSessions
        .filter((s) => poolLengthsMatch(s.poolLength, latest.poolLength))
        .map((s) => ({ swolf: radarMetricValue(s, "swolf"), dps: radarMetricValue(s, "dps") }))
        .filter((x) => x.swolf != null && x.dps != null);
      const latestSwolf = radarMetricValue(latest, "swolf");
      const latestDps = radarMetricValue(latest, "dps");
      if (efficiencyBaseline.length >= 2 && latestSwolf > 0 && latestDps > 0) {
        const baseSwolf = radarMean(efficiencyBaseline.map((x)=>x.swolf));
        const baseDps = radarMean(efficiencyBaseline.map((x)=>x.dps));
        if (baseSwolf > 0 && baseDps > 0) {
          const score = 100 * Math.sqrt((baseSwolf / latestSwolf) * (latestDps / baseDps));
          addAxis("efficiency", { swolf: latestSwolf, dps: latestDps }, { swolf: baseSwolf, dps: baseDps }, score, { baseSwolf, baseDps, baselineCount: efficiencyBaseline.length });
        }
      }
    }

    // 3. Consistency — within-session pace stability, relative to the previous 6-week baseline.
    // Each session gets a pace coefficient of variation (CV = SD / mean) across comparable
    // active lengths. Lower CV means steadier pacing. Score >100 = more consistent than usual.
    const consistencyBaseline = radarBaselineSessions
      .filter((s) => poolLengthsMatch(s.poolLength, latest.poolLength))
      .map((s) => radarSessionPaceVariability(s))
      .filter((x) => x && x.cv != null && Number.isFinite(x.cv));
    const latestConsistency = radarSessionPaceVariability(latest);
    const baselineCv = radarMean(consistencyBaseline.map((x) => x.cv));
    if (latestConsistency && consistencyBaseline.length >= 2 && baselineCv != null) {
      let consistencyScore;
      if (baselineCv === 0) consistencyScore = latestConsistency.cv === 0 ? 100 : 0;
      else consistencyScore = 100 * (baselineCv / Math.max(latestConsistency.cv, 0.000001));
      // Cap extreme ratios for chart readability without changing direction or interpretation.
      consistencyScore = Math.max(0, Math.min(200, consistencyScore));
      addAxis(
        "consistency",
        latestConsistency.cv,
        baselineCv,
        consistencyScore,
        {
          latestCv: latestConsistency.cv,
          baselineCv,
          latestLengthCount: latestConsistency.count,
          baselineSessionCount: consistencyBaseline.length
        }
      );
    }

    // 4. Endurance — distance in the exact selected Radar context (category + effort + stroke).
    const distanceVals = radarBaselineSessions.map((s) => radarMetricValue(s, "distance"));
    const distanceBase = radarMean(distanceVals), latestDistance = radarMetricValue(latest, "distance");
    if (radarBaselineSessions.length >= 2 && latestDistance != null && distanceBase != null && distanceBase > 0) addAxis("endurance", latestDistance, distanceBase, 100 * (latestDistance / distanceBase), { latest: latestDistance, baseline: distanceBase });

    // 5. Aerobic Efficiency — speed produced per unit of cardiovascular response.
    // Pace is seconds/100m, so swimming speed is proportional to 1/pace.
    // Therefore efficiency is proportional to speed/HR = 1/(pace * HR).
    // Higher score is favorable: faster at the same HR, same pace at lower HR, or both.
    // HR must cover >=70% of the relevant active lengths. For a stroke-filtered Radar,
    // HR is calculated from that stroke's own active lengths rather than the whole session.
    const aerobicBaseline = radarBaselineSessions.filter((s) => {
      const hrCtx = radarHrContext(s);
      return hrCtx.coverage >= 0.70 && radarMetricValue(s, "pace") != null && hrCtx.avgHR != null && hrCtx.avgHR > 0;
    });
    const latestHrCtx = radarHrContext(latest);
    const aerobicVals = aerobicBaseline.map((s) => {
      const p = radarMetricValue(s, "pace");
      const h = radarHrContext(s).avgHR;
      return p != null && p > 0 && h != null && h > 0 ? 1 / (p * h) : null;
    }).filter((v) => v != null && Number.isFinite(v) && v > 0);
    const latestAerobicEfficiency = latestPace != null && latestPace > 0 && latestHrCtx.avgHR != null && latestHrCtx.avgHR > 0
      ? 1 / (latestPace * latestHrCtx.avgHR)
      : null;
    const aerobicBase = radarMean(aerobicVals);
    if (aerobicBaseline.length >= 2 && latestHrCtx.coverage >= 0.70 && latestAerobicEfficiency != null && aerobicBase != null && aerobicBase > 0) {
      addAxis(
        "aerobic",
        latestAerobicEfficiency,
        aerobicBase,
        100 * (latestAerobicEfficiency / aerobicBase),
        {
          latest: latestAerobicEfficiency,
          baseline: aerobicBase,
          latestAvgHR: latestHrCtx.avgHR,
          latestHrCoverage: latestHrCtx.coverage,
          baselineCount: aerobicBaseline.length
        }
      );
    }
    return profile;
  })();

  // Presentation-only axis selection. Scores stay in radarProfile unchanged; this only decides
  // which available axes are drawn/read. Missing Aerobic Efficiency never appears as a toggle.
  const radarVisibleProfile = radarProfile.filter((axis) => radarMetricKeys.has(axis.key));
  const toggleRadarAxis = (key) => {
    setRadarMetricKeys((prev) => {
      const next = new Set(prev);
      if (next.has(key)) {
        // Keep a radar drawable: don't allow fewer than 3 currently-available axes.
        const visibleCount = radarProfile.filter((axis) => next.has(axis.key)).length;
        if (visibleCount <= 3) return prev;
        next.delete(key);
      } else {
        next.add(key);
      }
      return next;
    });
  };

  // Deterministic interpretation only. It reads the already-calculated Radar scores; it never
  // recalculates a metric or invents a missing axis.
  const radarProfileStrokeLabel = `${strokeFilter === "all"
    ? "All swim types"
    : (SWIM_STROKE_LABELS[strokeFilter] || strokeFilter)}${effortFilter !== "all" ? ` · ${SWIM_EFFORT_META[effortFilter].label}` : ""}`;
  const radarBaselineColor = "#BF5AF2";
  const radarLatestColor = strokeFilter === "all"
    ? "#F5F5F7"
    : (SWIM_STROKE_COLORS[strokeFilter] || "#F5F5F7");

  const radarInterpretation = (() => {
    const visible = radarVisibleProfile || [];
    if (!visible.length) return null;

    const byKey = Object.fromEntries(visible.map((a) => [a.key, a.score]));
    const state = (v) => v > 105 ? "above" : v < 95 ? "below" : "normal";

    const paceState = byKey.pace != null ? state(byKey.pace) : null;
    const effState = byKey.efficiency != null ? state(byKey.efficiency) : null;
    const enduranceState = byKey.endurance != null ? state(byKey.endurance) : null;
    const aerobicState = byKey.aerobic != null ? state(byKey.aerobic) : null;
    const consistencyState = byKey.consistency != null ? state(byKey.consistency) : null;

    const shiftedSupporting = visible
      .filter((a) => a.key !== "pace" && state(a.score) !== "normal")
      .map((a) => a.label);
    const shiftedText = shiftedSupporting.length
      ? ` (${shiftedSupporting.slice(0,3).join(", ")}${shiftedSupporting.length > 3 ? ", +" + (shiftedSupporting.length - 3) + " more" : ""})`
      : "";

    let category = "neutral";
    let headline = "Profile stayed close to normal.";
    let story = shiftedSupporting.length
      ? `Speed stayed close to normal while supporting dimensions changed${shiftedText}.`
      : "The visible profile stayed close to your 6-week baseline.";

    // Speed anchors the Radar story whenever available.
    if (paceState === "above") {
      category = "positive";

      if (effState === "above" && aerobicState === "above") {
        headline = "Fast, stroke-efficient, and aerobically efficient.";
        story = "Speed, stroke efficiency and aerobic efficiency were all above your 6-week baseline — a strong overall efficiency pattern.";
      } else if (effState === "above" && aerobicState !== "below") {
        headline = "Fast and stroke-efficient.";
        story = "Speed and stroke efficiency were above baseline without an unfavorable aerobic signal.";
      } else if (aerobicState === "above" && effState !== "below") {
        headline = "Fast at a favorable cardiovascular cost.";
        story = "Speed and aerobic efficiency were both above baseline.";
      } else if (aerobicState === "below") {
        headline = "Fast, but costly.";
        story = "Speed was above baseline, but aerobic efficiency was below normal — stronger performance came with a less favorable cardiovascular relationship.";
      } else if (effState === "below") {
        headline = "Fast, but less economical.";
        story = "Speed was above baseline while stroke efficiency was below normal.";
      } else {
        headline = "Faster than normal.";
        story = shiftedSupporting.length
          ? `Speed was above baseline while supporting dimensions also changed${shiftedText}.`
          : "Speed was above your 6-week baseline.";
      }

    } else if (paceState === "below") {
      category = "warning";

      if (effState === "below" && aerobicState === "below") {
        headline = "Slower, less economical, and more costly.";
        story = "Speed, stroke efficiency and aerobic efficiency were all below baseline.";
      } else if (aerobicState === "below") {
        headline = "Slower and more costly.";
        story = "Speed and aerobic efficiency were both below baseline — an unfavorable performance/cost combination.";
      } else if (effState === "below") {
        headline = "Slower with poorer stroke economy.";
        story = "Speed and stroke efficiency were both below baseline.";
      } else if (effState === "above") {
        headline = "Efficient strokes, but less speed.";
        story = "Stroke efficiency was above normal, but speed was below baseline — better stroke-economy signals did not translate into faster swimming.";
      } else if (aerobicState === "above") {
        headline = "Slower, despite a favorable aerobic relationship.";
        story = "Aerobic efficiency was above baseline, but actual speed was below normal.";
      } else {
        headline = "Slower than normal.";
        story = shiftedSupporting.length
          ? `Speed was below baseline while supporting dimensions also changed${shiftedText}.`
          : "Speed was below your 6-week baseline.";
      }

    } else if (paceState === "normal") {
      if (effState === "above" && aerobicState === "above") {
        category = "positive";
        headline = "Normal speed with better overall efficiency.";
        story = "Speed stayed normal while both stroke efficiency and aerobic efficiency were above baseline.";
      } else if (effState === "above") {
        category = "positive";
        headline = "Normal speed with better stroke economy.";
        story = `Speed stayed close to normal while stroke efficiency was above baseline${shiftedSupporting.length > 1 ? `. Other dimensions changed${shiftedText}` : ""}.`;
      } else if (aerobicState === "above") {
        category = "positive";
        headline = "Normal speed at a better aerobic cost.";
        story = `Speed stayed close to normal while aerobic efficiency was above baseline${shiftedSupporting.length > 1 ? `. Other dimensions changed${shiftedText}` : ""}.`;
      } else if (enduranceState === "above") {
        category = "positive";
        headline = "Normal speed over more work.";
        story = effortFilter === "all"
          ? `You maintained normal speed while covering more qualifying distance than usual${shiftedSupporting.length > 1 ? `. Other dimensions changed${shiftedText}` : ""}.`
          : `You maintained normal speed while accumulating more ${SWIM_EFFORT_META[effortFilter].label.toLowerCase()} distance than usual${shiftedSupporting.length > 1 ? `. Other dimensions changed${shiftedText}` : ""}.`;
      } else if (effState === "below" || aerobicState === "below") {
        category = "warning";
        headline = "Speed held, but efficiency weakened.";
        story = `Speed stayed close to normal while supporting efficiency dimensions moved below baseline${shiftedText}.`;
      } else if (shiftedSupporting.length) {
        headline = "Speed stayed stable.";
        story = `Speed stayed close to normal. Supporting dimensions changed${shiftedText}, but overall speed remained stable.`;
      }
    } else {
      // No speed axis available: be explicit that Radar cannot make a performance conclusion.
      if (effState === "above" && aerobicState === "above") {
        category = "positive";
        headline = "Efficiency dimensions were favorable.";
        story = "Stroke efficiency and aerobic efficiency were above baseline, but Speed is not visible so this does not prove better performance.";
      } else if (effState === "below" && aerobicState === "below") {
        category = "warning";
        headline = "Efficiency dimensions were below baseline.";
        story = "Stroke efficiency and aerobic efficiency were both below normal.";
      } else {
        headline = "Mixed supporting profile.";
        story = "Without the Speed axis, these dimensions provide context but not a complete good/bad performance conclusion.";
      }
    }

    const chips = visible.map((a) => ({
      key: a.key,
      label: a.label,
      color: a.color,
      score: a.score,
      state: state(a.score),
      verdict: state(a.score) === "above" ? "Above baseline" : state(a.score) === "below" ? "Below baseline" : "Near baseline"
    }));

    return { category, headline, story, chips };
  })();

  const metricCards = [
    {
      key: "pace",
      title: "Pace" + strokeTitleSuffix(strokeFilter === "all" ? null : strokeFilter),
      series: paceSeries,
      verdict: computeVerdict(paceSeries, "lower-better", INSIGHT_THRESHOLDS.paceMeaningfulPct, { better: "Improving", worse: "Slower" }),
      value: fmtPace100(headlineOf(paceSeries, paceDataKey)),
      perStroke: true,
      lowerBetter: true,
      color: strokeCardColor,
    },
    {
