      key: "swolf",
      title: "SWOLF" + strokeTitleSuffix(activeStroke),
      series: swolfSeries,
      verdict: computeVerdict(
        swolfSeries,
        strokeFilter === "all" ? "neutral" : "lower-better",
        INSIGHT_THRESHOLDS.swolfMeaningfulPct,
        strokeFilter === "all" ? { up: "Higher", down: "Lower" } : { worse: "Less efficient" }
      ),
      value: headlineOf(swolfSeries, strokeFilter === "all" ? "swolf_all" : `swolf_${strokeFilter}`) != null ? Math.round(headlineOf(swolfSeries, strokeFilter === "all" ? "swolf_all" : `swolf_${strokeFilter}`)) : "—",
      perStroke: true,
      lowerBetter: true,
      color: strokeCardColor,
    },
    {
      key: "cadence",
      title: "Stroke rate" + strokeTitleSuffix(activeStroke),
      series: cadenceSeries,
      verdict: computeVerdict(cadenceSeries, "neutral", INSIGHT_THRESHOLDS.cadenceMeaningfulPct, { up: "Higher", down: "Lower" }),
      value: headlineOf(cadenceSeries, strokeFilter === "all" ? "cadence_all" : `cadence_${strokeFilter}`) != null ? `${Math.round(headlineOf(cadenceSeries, strokeFilter === "all" ? "cadence_all" : `cadence_${strokeFilter}`))} spm` : "—",
      perStroke: true,
      color: strokeCardColor,
    },
    {
      key: "dps",
      title: "Distance/stroke" + strokeTitleSuffix(activeStroke) + " · same pool",
      series: dpsSeries,
      verdict: computeVerdict(dpsSeries, "neutral", INSIGHT_THRESHOLDS.dpsMeaningfulPct, { up: "Higher", down: "Lower" }),
      value: headlineOf(dpsSeries, strokeFilter === "all" ? "dps_all" : `dps_${strokeFilter}`) != null ? `${headlineOf(dpsSeries, strokeFilter === "all" ? "dps_all" : `dps_${strokeFilter}`).toFixed(2)}m` : "—",
      perStroke: true,
      color: strokeCardColor,
    },
    {
      key: "css",
      title: "Critical Swim Speed (CSS)",
      series: cssTrendData.map((d) => d.cssPace100),
      verdict: computeVerdict(cssTrendData.map((d) => d.cssPace100), "lower-better", INSIGHT_THRESHOLDS.paceMeaningfulPct, { better: "Improving", worse: "Slower" }),
      value: cssTrendData.length ? fmtPace100(metricValueMode === "avg6" ? sixWeekAverageFromRows(cssTrendData, "cssPace100") : cssTrendData[cssTrendData.length - 1].cssPace100) : "—",
      lowerBetter: true,
      color: "#0A84FF",
    },
  ].filter((c) => effortFilter === "all" || c.key !== "css");

  const allMetricsExpanded = metricCards.length > 0 && metricCards.every((c) => expandedMetrics.has(c.key));
  const toggleMetric = (key) => {
    setExpandedMetrics((prev) => {
      const next = new Set(prev);
      if (next.has(key)) next.delete(key); else next.add(key);
      return next;
    });
  };
  const toggleExpandAllMetrics = () => {
    setExpandedMetrics(allMetricsExpanded ? new Set() : new Set(metricCards.map((c) => c.key)));
  };

  // Shared by the Trends and Compare tabs — both read the same strokeFilter/categoryFilter
  // state, so a pick here filters both tabs even though each only renders this bar while
  // it's the active tab (previously this one bar visually spanned both cards at once, back
  // when Trends+Compare were stacked instead of tabbed).
  const renderFilterBar = () => (
    <div style={{ position: "sticky", top: isMobile ? 52 : 56, zIndex: 30, display: "flex", flexDirection: "column", gap: 8, background: FLOATING_BAR_BG, border: `1px solid ${FLOATING_BAR_BORDER}`, borderRadius: 14, padding: "6px 8px", marginBottom: 10, boxShadow: "none" }}>
      {allStrokesSeen.length > 0 && (
        <div style={{ display: "flex", alignItems: "center", gap: 4, flexWrap: "wrap" }}>
          {["all", ...allStrokesSeen].map((s) => {
            // Part 2: every swim-type slicer button uses that stroke's own color from
            // the centralized SWIM_STROKE_COLORS map, with a strong, unambiguous
            // selected state (solid fill) vs. a tinted, low-contrast unselected state —
            // reused verbatim (same colors) everywhere else in the Swim tab.
            const color = s === "all" ? "#F5F5F7" : (SWIM_STROKE_COLORS[s] || "#8E8E93");
            const selected = strokeFilter === s;
            return (
              <button key={s} onClick={() => setStrokeFilter(s)} className="pill swim-filter-pill" style={{
                cursor: "pointer", background: selected ? color : `${color}1a`,
                border: `1.5px solid ${selected ? color : color + "55"}`, color: selected ? "#000000" : color,
                borderRadius: 9, padding: isMobile ? "3px 6px" : "4px 8px", fontSize: isMobile ? 9.5 : 10.5, fontWeight: 700,
              }}>{s === "all" ? "All strokes" : SWIM_STROKE_LABELS[s]}</button>
            );
          })}
        </div>
      )}
      {/* Workout/CSS Test filter — excludes whichever category isn't picked from Trends +
          Compare + the radar tab (chronSessions itself is filtered by this, so every
          chart/card downstream inherits it automatically). Session Detail always shows
          everything regardless, so nothing is ever hidden for good — this only narrows what
          these tabs analyze. Category comes straight from isCssTest (item 3), not a separate
          field. */}
      {(sessions || []).length > 0 && (
        <>
        <div style={{ display: "flex", alignItems: "center", gap: 4, flexWrap: "wrap", paddingTop: allStrokesSeen.length > 0 ? 6 : 0, borderTop: allStrokesSeen.length > 0 ? "1px solid #2b241a" : "none" }}>
          <span style={{ fontSize: 10, color: "#636366", marginRight: 2 }}>Category</span>
          {[["all", "All", "#FFFFFF", null], ["workout", "Workout", "#64D2FF", Dumbbell], ["csstest", "CSS Test", "#0A84FF", Target]].map(([v, l, c, Ic]) => {
            const selected = categoryFilter === v;
            return (
              <button key={v} onClick={() => { setCategoryFilter(v); setSelectedComparePoint(null); setRadarCurrentId(null); }} className="pill swim-filter-pill" style={{
                display: "flex", alignItems: "center", gap: 4, cursor: "pointer",
                background: selected ? c : `${c}1a`, border: `1.5px solid ${selected ? c : c + "55"}`,
                color: selected ? "#000000" : c, borderRadius: 9, padding: isMobile ? "3px 6px" : "4px 8px", fontSize: isMobile ? 9.5 : 10.5, fontWeight: 700,
              }}>{Ic && <Ic size={11} />}{l}</button>
            );
          })}
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 4, flexWrap: "wrap", paddingTop: 6, borderTop: "1px solid #2b241a" }}>
          <span style={{ fontSize: 10, color: "#636366", marginRight: 2 }}>Effort</span>
          {[["all", "All", "#F5F5F7"], ["easy", "Easy", SWIM_EFFORT_META.easy.color], ["work", "Work", SWIM_EFFORT_META.work.color], ["speed", "Speed", SWIM_EFFORT_META.speed.color]].map(([v,l,c]) => {
            const selected = effortFilter === v;
            return (
              <button key={v} onClick={() => { setEffortFilter(v); setSelectedComparePoint(null); setRadarCurrentId(null); }} className="pill swim-filter-pill" style={{
                cursor: "pointer", background: selected ? c : `${c}1a`,
                border: `1.5px solid ${selected ? c : c + "55"}`, color: selected ? "#000000" : c,
                borderRadius: 9, padding: isMobile ? "3px 6px" : "4px 8px", fontSize: isMobile ? 9.5 : 10.5, fontWeight: 700,
              }}>{l}</button>
            );
          })}
          {effortFilter !== "all" && <span style={{ fontSize: 9.5, color: "#48484A", marginLeft: 2 }}>classified lengths only</span>}
        </div>
        </>
      )}
    </div>
  );

  const expandedChartFor = (key) => {
    const overlay = chartOverlaySel[key] || "none";
    const hasHR = trendDataView.some((d) => d.avgHR != null);
    const showHR = overlay === "hr" && hasHR;
    const options = SWIM_CHART_OVERLAY_OPTIONS[key] || [{ value: "none", label: "None" }];

    const overlaySelector = options.length > 1 && (
      <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 8, flexWrap: "wrap" }}>
        <span style={{ fontSize: 10.5, color: "#636366" }}>Overlay:</span>
        {options.map((opt) => (
          <button key={opt.value} onClick={() => setChartOverlaySel((prev) => ({ ...prev, [key]: opt.value }))} className="pill swim-filter-pill" style={{
            cursor: "pointer", background: overlay === opt.value ? "#27272A" : "transparent",
            border: "1px solid " + (overlay === opt.value ? "#3A3A3C" : "#27272A"),
            color: overlay === opt.value ? "#FFFFFF" : "#8E8E93",
            borderRadius: 7, padding: "3px 8px", fontSize: 10.5, fontWeight: 600,
          }}>{opt.label}</button>
        ))}
        {overlay === "hr" && !hasHR && <span style={{ fontSize: 10, color: "#48484A" }}>No HR data in this range</span>}
      </div>
    );

    const strokeCaption = key !== "pace" && overlay === "hr" && strokeFilter !== "all" && (
      <div style={{ fontSize: 10, color: "#48484A", marginTop: 6 }}>HR is whole-session, not stroke-specific.</div>
    );

    // Presentation-only personal bands. They do not change any metric, verdict, stored value,
    // filtering, or insight logic. They simply describe the displayed series relative to itself.
    const personalBandStats = (values) => {
      const vals = values.filter((v) => v != null && Number.isFinite(v));
      if (vals.length < 2) return null;
      const mean = vals.reduce((a, b) => a + b, 0) / vals.length;
      const variance = vals.reduce((a, b) => a + (b - mean) ** 2, 0) / vals.length;
      const sd = Math.sqrt(variance);
      if (!Number.isFinite(mean) || !Number.isFinite(sd)) return null;
      return { mean, sd };
    };
    const renderPersonalBands = (values, direction = "neutral") => {
      const vals = values.filter((v) => v != null && Number.isFinite(v));
      if (vals.length < 2) return null;
      const baselineVals = vals.slice(0, -1); // latest point never defines its own "Typical"
      const stats = personalBandStats(baselineVals);
      if (!stats) {
        const only = baselineVals[0];
        return only == null ? null : (
          <ReferenceLine
            y={only}
            stroke="#A7A7AC"
            strokeWidth={1}
            strokeDasharray="4 5"
            label={{ value: "Typical", position: "insideTopLeft", fill: "#8E8E93", fontSize: 9 }}
          />
        );
      }
      const span = stats.sd > 0 ? stats.sd : Math.max(Math.abs(stats.mean) * 0.025, 0.5);
      return (
        <>
          {baselineVals.length >= 3 && (
            <ReferenceArea
              y1={stats.mean - span}
              y2={stats.mean + span}
              fill="#8E8E93"
              fillOpacity={0.045}
              strokeWidth={0}
            />
          )}
          <ReferenceLine
            y={stats.mean}
            stroke="#A7A7AC"
            strokeWidth={1}
            strokeDasharray="4 5"
            label={{ value: "Typical", position: "insideTopLeft", fill: "#8E8E93", fontSize: 9 }}
          />
        </>
      );
    };

    if (key === "css") {
      if (cssTrendData.length === 0) {
        return (
          <div style={{ fontSize: 11.5, color: "#636366", padding: "12px 2px 4px", lineHeight: 1.45 }}>
            No CSS test logged yet. CSS is only shown from sessions explicitly marked as CSS tests.
          </div>
        );
      }
      return (
        <div>
          <ResponsiveContainer width="100%" height={200}>
            <LineChart data={cssTrendData} margin={{ top: 4, right: 8, left: 0, bottom: 0 }}>
              <XAxis dataKey="label" tick={{ fill: "#8E8E93", fontSize: 10 }} axisLine={{ stroke: "#8E8E93", strokeOpacity: 0.62 }} tickLine={false} tickMargin={7} minTickGap={10} interval="preserveStartEnd" />
              <YAxis tick={{ fill: "#8E8E93", fontSize: 10 }} tickLine={false} axisLine={{ stroke: "#8E8E93", strokeOpacity: 0.62 }} width={46} tickFormatter={(v) => fmtMinSec(v)} reversed domain={["dataMin - 5", "dataMax + 5"]} />
              <Tooltip contentStyle={{ background: "#000000", border: "1px solid #2C2C2E", borderRadius: 12, fontSize: 12 }} formatter={(v) => fmtPace100(v)} />
              <Line type="monotone" dataKey="cssPace100" name="CSS pace /100m" stroke="#0A84FF" strokeWidth={2} dot={{ r: 4 }} connectNulls />
            </LineChart>
          </ResponsiveContainer>
        </div>
      );
    }

    if (key === "pace") {
      return (
        <div>
          <ResponsiveContainer width="100%" height={200}>
            <LineChart data={trendDataView} margin={{ top: 4, right: 8, left: 0, bottom: 0 }}>
              {renderPersonalBands(trendDataView.map((d) => d[paceDataKey]), "lower")}
              <XAxis dataKey="label" tick={{ fill: "#8E8E93", fontSize: 10 }} axisLine={{ stroke: "#8E8E93", strokeOpacity: 0.62 }} tickLine={false} tickMargin={7} minTickGap={10} interval="preserveStartEnd" />
              <YAxis tick={{ fill: "#8E8E93", fontSize: 10 }} tickLine={false} axisLine={{ stroke: "#8E8E93", strokeOpacity: 0.62 }} width={46} tickFormatter={(v) => fmtMinSec(v)} reversed={METRIC_AXIS_DIRECTION.pace === "lower"} domain={["dataMin - 5", "dataMax + 5"]} />
              <Tooltip contentStyle={{ background: "#000000", border: "1px solid #2C2C2E", borderRadius: 12, fontSize: 12 }} formatter={(v) => fmtPace100(v)} />
              <Line type="monotone" dataKey={paceDataKey} name="Pace /100m" stroke={strokeCardColor} strokeWidth={2} dot={{ r: 3 }} connectNulls />
            </LineChart>
          </ResponsiveContainer>
        </div>
      );
    }

    if (key === "heart") {
      // Whole-session metric — one line, no per-stroke overlay (HR isn't tracked per-stroke),
      // no reason to offer the stroke-rate overlay picker either.
      // reversed reads the METRIC_AXIS_DIRECTION registry — same single source of truth the
      // collapsed sparkline reads (see its YAxis above), so the two can never drift out of
      // sync again the way the SWOLF-only patch previously did (item 6).
      const reversed = METRIC_AXIS_DIRECTION.heart === "lower";
      return (
        <div>
          <ResponsiveContainer width="100%" height={200}>
            <LineChart data={trendDataView} margin={{ top: 4, right: 8, left: 0, bottom: 0 }}>
              {renderPersonalBands(trendDataView.map((d) => d.avgHR), "neutral")}
              <XAxis dataKey="label" tick={{ fill: "#8E8E93", fontSize: 10 }} axisLine={{ stroke: "#8E8E93", strokeOpacity: 0.62 }} tickLine={false} tickMargin={7} minTickGap={10} interval="preserveStartEnd" />
              <YAxis tick={{ fill: "#8E8E93", fontSize: 10 }} tickLine={false} axisLine={{ stroke: "#8E8E93", strokeOpacity: 0.62 }} width={46} tickFormatter={(v) => `${Math.round(v)}`} reversed={reversed} domain={["dataMin - 2", "dataMax + 2"]} />
              <Tooltip contentStyle={{ background: "#000000", border: "1px solid #2C2C2E", borderRadius: 12, fontSize: 12 }} formatter={(v) => (v != null ? `${Math.round(v)} bpm` : "—")} />
              <Line type="monotone" dataKey="avgHR" name="Avg HR" stroke="#FF453A" strokeWidth={2} dot={{ r: 3 }} connectNulls />
            </LineChart>
          </ResponsiveContainer>
        </div>
      );
    }

    const dataKeyPrefix = key === "swolf" ? "swolf_" : key === "cadence" ? "cadence_" : "dps_";
    const aggregateDataKey = key === "swolf" ? "swolf_all" : key === "cadence" ? "cadence_all" : "dps_all";
    const baseFormatter = key === "dps" ? (v) => (v != null ? fmtNum(v, 2) + "m" : "—") : (v) => fmtNum(v, key === "swolf" ? 0 : 1);
    const strokesToShow = strokeFilter === "all" ? [] : [strokeFilter];
    // "Better" direction per metric, read from the shared METRIC_AXIS_DIRECTION registry (item
    // 6) rather than decided locally — lower SWOLF is better (flip, like pace), higher
    // distance-per-stroke is better (no flip), and cadence has no universal "better" direction
    // so it's left unflipped and called out as such.
    const metricDirection = METRIC_AXIS_DIRECTION[key] === "lower" ? "lower-better" : "neutral-or-higher-better";
    const metricLabel = key === "swolf" ? "SWOLF" : key === "cadence" ? "cadence" : "distance per stroke";

    if (!showHR) {
      // No HR overlay requested: raw values on a single axis, exactly as before — no
      // cross-metric scaling problem to solve when only one unit is on the chart.
      const tooltipFormatter = (v, name) => [baseFormatter(v), name];
      return (
        <div>
          {overlaySelector}
          <ResponsiveContainer width="100%" height={220}>
            <LineChart data={trendDataView} margin={{ top: 4, right: 8, left: 0, bottom: 0 }}>
              {(() => {
                const bandKey = strokeFilter === "all"
                  ? (key === "swolf" ? "swolf_all" : key === "cadence" ? "cadence_all" : "dps_all")
                  : `${dataKeyPrefix}${strokeFilter}`;
                const direction = key === "swolf" ? "lower" : key === "dps" ? "higher" : "neutral";
                return renderPersonalBands(trendDataView.map((d) => d[bandKey]), direction);
              })()}
              <XAxis dataKey="label" tick={{ fill: "#8E8E93", fontSize: 10 }} axisLine={{ stroke: "#8E8E93", strokeOpacity: 0.62 }} tickLine={false} tickMargin={7} minTickGap={10} interval="preserveStartEnd" />
              {/* reversed reads METRIC_AXIS_DIRECTION — the same registry the collapsed
                  sparkline's YAxis reads above — instead of a per-branch key check, so this
                  can't quietly drift out of sync with the sparkline again (item 6). */}
              <YAxis tick={{ fill: "#8E8E93", fontSize: 10 }} tickLine={false} axisLine={{ stroke: "#8E8E93", strokeOpacity: 0.62 }} width={46} tickFormatter={(v) => fmtNum(v, 2)} reversed={METRIC_AXIS_DIRECTION[key] === "lower"} domain={["dataMin - 2", "dataMax + 2"]} />
              <Tooltip contentStyle={{ background: "#000000", border: "1px solid #2C2C2E", borderRadius: 12, fontSize: 12 }} formatter={tooltipFormatter} />
              <Legend wrapperStyle={{ fontSize: 11 }} />
              {strokeFilter === "all" ? (
                <Line type="monotone" dataKey={aggregateDataKey} name="All swim types" stroke="#F5F5F7" strokeWidth={2.2} dot={{ r: 3 }} connectNulls />
              ) : (
                strokesToShow.map((stroke) => (
                  <Line key={stroke} type="monotone" dataKey={`${dataKeyPrefix}${stroke}`} name={SWIM_STROKE_LABELS[stroke]} stroke={SWIM_STROKE_COLORS[stroke]} strokeWidth={2} dot={{ r: 3 }} connectNulls />
                ))
              )}
            </LineChart>
          </ResponsiveContainer>
          {strokeCaption}
        </div>
      );
    }

    // HR overlay requested: normalize each stroke's line AND HR to z-scores on one shared
    // axis, same technique as the Pace chart — otherwise two independently-scaled axes just
    // stretch both series to fill the chart regardless of real magnitude.
    const hrStats = computeMeanStd(trendDataView.map((d) => d.avgHR));
    const strokeStatsMap = {};
    strokesToShow.forEach((stroke) => {
      strokeStatsMap[stroke] = computeMeanStd(trendDataView.map((d) => d[`${dataKeyPrefix}${stroke}`]));
    });
    const aggregateStats = strokeFilter === "all" ? computeMeanStd(trendDataView.map((d) => d[aggregateDataKey])) : null;
    const pairedCount = trendDataView.filter(
      (d) => d.avgHR != null && (strokeFilter === "all"
        ? d[aggregateDataKey] != null
        : strokesToShow.some((stroke) => d[`${dataKeyPrefix}${stroke}`] != null))
    ).length;

    if (pairedCount < 2) {
      if (pairedCount === 0) {
        return (
          <div>
            {overlaySelector}
            <div style={{ padding: "26px 10px", textAlign: "center", color: "#48484A", fontSize: 12.5, lineHeight: 1.5 }}>
              No sessions yet with both {metricLabel} and HR recorded — log an HR-tracked swim to see this comparison.
            </div>
          </div>
        );
      }
      // Exactly 1 paired session: a chart isn't meaningful here — with a single value, each
      // axis centers it at 50% height independent of the other, so the dots always land on
      // the same pixel row regardless of the real numbers. That's a coincidence of a lone-point
      // domain, not a real relationship. Just show the values directly instead.
      const only = trendDataView.find(
        (d) => d.avgHR != null && (strokeFilter === "all"
          ? d[aggregateDataKey] != null
          : strokesToShow.some((stroke) => d[`${dataKeyPrefix}${stroke}`] != null))
      ) || trendDataView[0];
      return (
        <div>
          {overlaySelector}
          <div style={{ display: "flex", gap: 28, flexWrap: "wrap", padding: "18px 4px 8px" }}>
            {strokeFilter === "all" ? (
              only[aggregateDataKey] != null && (
                <div>
                  <div style={{ fontSize: 10, color: "#8E8E93", textTransform: "uppercase", letterSpacing: "0.06em" }}>All swim types</div>
                  <div style={{ fontSize: 30, fontWeight: 700, color: "#F5F5F7" }}>{baseFormatter(only[aggregateDataKey])}</div>
                </div>
              )
            ) : strokesToShow.map((stroke) => {
              const raw = only[`${dataKeyPrefix}${stroke}`];
              if (raw == null) return null;
              return (
                <div key={stroke}>
                  <div style={{ fontSize: 10, color: "#8E8E93", textTransform: "uppercase", letterSpacing: "0.06em" }}>{SWIM_STROKE_LABELS[stroke]}</div>
                  <div style={{ fontSize: 30, fontWeight: 700, color: SWIM_STROKE_COLORS[stroke] }}>{baseFormatter(raw)}</div>
                </div>
              );
            })}
            <div>
              <div style={{ fontSize: 10, color: "#8E8E93", textTransform: "uppercase", letterSpacing: "0.06em" }}>Avg HR</div>
              <div style={{ fontSize: 30, fontWeight: 700, color: "#FF453A" }}>{only.avgHR != null ? `${Math.round(only.avgHR)} bpm` : "—"}</div>
            </div>
          </div>
          <div style={{ fontSize: 10, color: "#48484A", marginTop: 4 }}>
            Log one more HR-tracked swim to see {metricLabel} and HR actually plotted against each other.
          </div>
          {strokeCaption}
        </div>
      );
    }

    const normalizedData = trendDataView.map((d) => {
      const point = { ...d, hrZ: zScoreOf(d.avgHR, hrStats) };
      if (strokeFilter === "all") {
        let z = aggregateStats ? zScoreOf(d[aggregateDataKey], aggregateStats) : null;
        if (z != null && metricDirection === "lower-better") z = -z;
        point.z_all = z;
      } else {
        strokesToShow.forEach((stroke) => {
          const stats = strokeStatsMap[stroke];
          let z = stats ? zScoreOf(d[`${dataKeyPrefix}${stroke}`], stats) : null;
          if (z != null && metricDirection === "lower-better") z = -z;
          point[`z_${stroke}`] = z;
        });
      }
      return point;
    });
    const labelToStroke = Object.fromEntries(strokesToShow.map((s) => [SWIM_STROKE_LABELS[s], s]));
    const zTooltipFormatter = (v, name, props) => {
      if (name === "Avg HR") return [props.payload.avgHR != null ? `${Math.round(props.payload.avgHR)} bpm` : "—", name];
      if (name === "All swim types") return [baseFormatter(props.payload[aggregateDataKey]), name];
      const stroke = labelToStroke[name];
      const raw = stroke ? props.payload[`${dataKeyPrefix}${stroke}`] : v;
      return [baseFormatter(raw), name];
    };
    const directionNote =
      metricDirection === "lower-better"
        ? `${metricLabel} is flipped so "up" = better (lower ${metricLabel}), matching "up" = higher HR.`
        : key === "cadence"
        ? `Cadence has no universal "better" direction, so it's shown as-is — a line moving with HR just means cadence and effort moved together, not that higher or lower cadence is good.`
        : `Higher ${metricLabel} is already "better" here, matching "up" = higher HR.`;

    return (
      <div>
        {overlaySelector}
        <ResponsiveContainer width="100%" height={220}>
          <LineChart data={normalizedData} margin={{ top: 4, right: 8, left: 0, bottom: 0 }}>
            <XAxis dataKey="label" tick={{ fill: "#8E8E93", fontSize: 10 }} axisLine={{ stroke: "#8E8E93", strokeOpacity: 0.62 }} tickLine={false} tickMargin={7} minTickGap={10} interval="preserveStartEnd" />
            <YAxis
              tick={{ fill: "#8E8E93", fontSize: 10 }}
              tickFormatter={(v) => `${v > 0 ? "+" : ""}${v.toFixed(1)}σ`}
              domain={[(dataMin) => Math.min(dataMin - 0.3, -1), (dataMax) => Math.max(dataMax + 0.3, 1)]}
            />
            <ReferenceLine y={0} stroke="#A7A7AC" strokeWidth={1} strokeDasharray="4 5" />
            <Tooltip contentStyle={{ background: "#000000", border: "1px solid #2C2C2E", borderRadius: 12, fontSize: 12 }} formatter={zTooltipFormatter} />
            <Legend wrapperStyle={{ fontSize: 11 }} />
            {strokeFilter === "all" ? (
              <Line type="monotone" dataKey="z_all" name="All swim types" stroke="#F5F5F7" strokeWidth={2.2} dot={{ r: 3 }} connectNulls />
            ) : strokesToShow.map((stroke) => (
              <Line key={stroke} type="monotone" dataKey={`z_${stroke}`} name={SWIM_STROKE_LABELS[stroke]} stroke={SWIM_STROKE_COLORS[stroke]} strokeWidth={2} dot={{ r: 3 }} connectNulls />
            ))}
            <Line type="monotone" dataKey="hrZ" name="Avg HR" stroke="#FF453A" strokeWidth={2} strokeDasharray="4 3" dot={{ r: 3 }} connectNulls />
          </LineChart>
        </ResponsiveContainer>
        {strokeCaption}
      </div>
    );
  };

  return (
    <div>
      {sessions.length === 0 ? (
        <div style={{ textAlign: "center", padding: "40px 20px", color: "#636366", fontSize: 13 }}>
          No swim sessions yet — head to History &amp; Log, switch to "Swim", and upload a .FIT file to get started.
        </div>
      ) : (
        <>
          {/* Swim section tabs — Dashboard / Trend / Compare / Radar. Segmented control styled
              like the floating filter bars elsewhere in this tab (solid warm-dark background,
              pill buttons), sticky so it stays reachable while scrolling a long tab's content.
              top is tuned near 0 now that the OUTER nav (Today/Workout/Swim/History & Log) is
              no longer sticky itself — this inner switcher is now the only thing floating above
              this content, so it no longer needs to reserve space for the outer nav above it
              (item 5). Dashboard holds everything that isn't Trend or Compare (PRs, streak,
              distance breakdown, insights) — Radar keeps its own tab as before. */}
          <div className="swim-subnav swim-primary-nav" style={{ position: "sticky", top: isMobile ? 0 : 2, zIndex: 31, display: "flex", gap: 3, background: FLOATING_BAR_BG, border: `1px solid ${FLOATING_BAR_BORDER}`, borderRadius: 16, padding: 5, marginBottom: 14, boxShadow: "none" }}>
            <button
              className="app-nav-pill app-nav-back"
              onClick={() => onExit && onExit()}
              title="Back to Today"
              style={{
                flex: "0 0 auto", display: "flex", alignItems: "center", justifyContent: "center", gap: 3,
                cursor: "pointer", background: "transparent", border: "none", borderRadius: 9,
                color: "#8E8E93", fontWeight: 700, fontSize: isMobile ? 10 : 11,
                padding: isMobile ? "7px 5px" : "8px 7px", whiteSpace: "nowrap"
              }}
            >
              ‹ Today
            </button>
            {[["dashboard", "Dashboard", LayoutGrid], ["trends", "Trend", TrendingUp], ["compare", "Compare", GitCompare], ["radar", "Radar", RadarIcon]].map(([v, l, Ic]) => {
              const selected = swimSection === v;
              return (
                <button key={v} className="app-nav-pill" onClick={() => setSwimSection(v)} style={{
                  flex: 1, display: "flex", alignItems: "center", justifyContent: "center", gap: 6, cursor: "pointer",
                  background: selected ? "#FF9F0A" : "transparent", border: "none", borderRadius: 10,
                  color: selected ? "#000000" : "#8E8E93", fontWeight: 700, fontSize: isMobile ? 10 : 12, padding: isMobile ? "7px 4px" : "8px 7px",
                  transition: "background 0.15s, color 0.15s",
                }}>
                  <Ic size={isMobile ? 11 : 13} />
                  {l}
                </button>
              );
            })}
          </div>

          <React.Fragment key={`swim-section-${swimSection}-${strokeFilter}-${categoryFilter}-${effortFilter}-${compareMetrics.join("-")}`}>
          {swimSection === "dashboard" && (
            <>
          {/* Insights — rule-based, deterministic interpretation of your swim data. No AI, no
              network calls: every line below is generated locally from data already computed
              above (trendData / chronSessions). See buildSwimInsights and its generator
              functions near the top of the file. */}
          <div style={cardStyle}>
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8, marginBottom: 12, flexWrap: "wrap" }}>
              <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                <Sparkles size={13} color="#FF9F0A" />
                <div style={{ ...labelStyle, marginBottom: 0 }}>Insights</div>
              </div>
              <span className="mono" style={{ fontSize: 9.5, color: "#636366" }}>Overall swim profile</span>
            </div>
            {(() => {
              const swimInsights = buildSwimInsights({
                chronSessions: dashboardChronSessions,
                trendData: dashboardTrendData,
                activeStroke: null,
                strokeLabel: "Overall",
                todayStr,
                strokeFilterActive: false,
              });
              if (swimInsights.length === 0) {
                return <div style={{ fontSize: 12.5, color: "#636366" }}>Log a swim to start seeing insights here.</div>;
              }
              return (
                <div style={{ display: "grid", gap: 10 }}>
                  {swimInsights.map((ins) => {
                    const cat = INSIGHT_CATEGORIES[ins.category];
                    return (
                      <div key={ins.id} style={{
                        background: cat.bg, borderLeft: `3px solid ${cat.color}`, borderRadius: 10,
                        padding: "12px 14px", display: "flex", gap: 10, alignItems: "flex-start",
                      }}>
                        <cat.Icon size={16} color={cat.color} style={{ flexShrink: 0, marginTop: 1 }} />
                        <div style={{ minWidth: 0, flex: 1 }}>
                          <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 4, flexWrap: "wrap" }}>
                            <span style={{ fontSize: 13, fontWeight: 700, color: "#FFFFFF" }}>{ins.title}</span>
                            <span className="mono" style={{ fontSize: 9, color: cat.color, textTransform: "uppercase", letterSpacing: "0.05em", fontWeight: 700 }}>{cat.label}</span>
                          </div>
                          <div style={{ fontSize: 12.5, color: "#D1D1D6", lineHeight: 1.5 }}>{ins.message}</div>
                          {ins.metrics.length > 0 && (
                            <div style={{ display: "flex", gap: 14, marginTop: 8, flexWrap: "wrap" }}>
                              {ins.metrics.map((m, i) => (
                                <div key={i} className="mono" style={{ fontSize: 10.5, color: "#8E8E93" }}>
                                  {m.label.toUpperCase()} <span style={{ color: "#FFFFFF", fontWeight: 700 }}>{m.value}</span>
                                </div>
                              ))}
                            </div>
                          )}
                        </div>
                      </div>
                    );
                  })}
                </div>
              );
            })()}
          </div>

          {/* PR card — top, matching the Workout tab's emphasis on PRs first */}
          <div style={{ background: "#1C1C1E", border: "1px solid #27272A", borderRadius: 20, boxShadow: "none", padding: 16, marginBottom: 12 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 10 }}>
              <Award size={14} color="#64D2FF" />
              <span style={{ fontSize: 11, color: "#8E8E93", fontWeight: 600, textTransform: "uppercase", letterSpacing: "0.04em" }}>Swim PRs</span>
            </div>
            <div style={{ display: "grid", gridTemplateColumns: isMobile ? "1fr" : "repeat(2, 1fr)", gap: 10 }}>
              {[
                { label: "Best pace", pr: bestPacePR, fmt: (v) => fmtPace100(v) },
                { label: "Best SWOLF (same pool length)", pr: bestSwolfPR, fmt: (v) => Math.round(v) },
                { label: "Longest session", pr: longestSessionPR, fmt: (v) => `${v}m` },
                { label: "Best CSS pace", pr: bestCssPR, fmt: (v) => fmtPace100(v) },
              ].map(({ label, pr, fmt }) => {
                const age = pr ? agingLabel(dayDiff(pr.date, todayStr)) : null;
                return (
                  <div key={label}>
                    <div style={{ display: "flex", justifyContent: "space-between", gap: 8, fontSize: 12 }}>
                      <span style={{ color: "#8E8E93" }}>{label}</span>
                      <span className="mono" style={{ color: "#D1D1D6", fontWeight: 700, whiteSpace: "nowrap" }}>{pr ? fmt(pr.value) : "—"}</span>
                    </div>
                    <div style={{ display: "flex", justifyContent: "space-between", fontSize: 10 }} className="mono">
                      <span style={{ color: "#48484A" }}>
                        {pr ? fmtDate(pr.date) : label === "Best CSS pace" ? "no CSS test logged yet" : ""}
                        {pr && pr.stroke && <span style={{ color: SWIM_STROKE_COLORS[pr.stroke] || "#48484A" }}> · {SWIM_STROKE_LABELS[pr.stroke]}</span>}
                      </span>
                      {age && <span style={{ color: age.color }}>{age.text}</span>}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>

          {/* Streak — small, secondary to PR */}
          <div style={{ background: "#1C1C1E", border: "1px solid #27272A", borderRadius: 20, boxShadow: "none", padding: "10px 16px", marginBottom: 18 }}>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 10 }}>
              <div>
                <div className="disp" style={{ fontSize: 28, fontWeight: 700, color: "#64D2FF" }}>{streak.weekStreak}</div>
                <div style={{ fontSize: 10, color: "#8E8E93" }}>Week streak</div>
              </div>
              <div>
                <div className="disp" style={{ fontSize: 28, fontWeight: 700, color: "#FFFFFF" }}>{streak.totalSessions}</div>
                <div style={{ fontSize: 10, color: "#8E8E93" }}>Swims logged</div>
              </div>
              <div>
                <div className="disp" style={{ fontSize: 28, fontWeight: 700, color: streak.daysSinceLast > 7 ? "#FF453A" : "#FFFFFF" }}>{streak.daysSinceLast}d</div>
                <div style={{ fontSize: 10, color: "#8E8E93" }}>Since last swim</div>
              </div>
            </div>
          </div>

          {/* Distance by swim type — latest session vs 6-week total distance, plus each
              stroke's % share of total distance over that same 6-week window. See
              strokeDistanceStats above for exactly how these are computed. */}
          {strokeDistanceStats.length > 0 && (
            <div style={cardStyle}>
              <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 2 }}>
                <TrendingUp size={13} color="#64D2FF" />
                <div style={{ ...labelStyle, marginBottom: 0 }}>Distance by swim type</div>
              </div>
              <div style={{ fontSize: 10.5, color: "#48484A", marginBottom: 12 }}>
                % share of your total distance across all strokes, last 6 weeks
              </div>
              <div style={{ display: "grid", gap: 14 }}>
                {strokeDistanceStats.map(({ stroke, latest, sixWeekTotal, pct }) => (
                  <div key={stroke}>
                    <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10, marginBottom: 5 }}>
                      <div style={{ display: "flex", alignItems: "center", gap: 8, minWidth: 0 }}>
                        <span style={{ width: 8, height: 8, borderRadius: 4, background: SWIM_STROKE_COLORS[stroke], flexShrink: 0 }} />
                        <span style={{ fontSize: 12.5, color: "#D1D1D6" }}>{SWIM_STROKE_LABELS[stroke]}</span>
                        <span className="mono" style={{ fontSize: 10.5, color: "#636366" }} title="Share of total distance across all strokes, last 6 weeks">{pct != null ? `${pct.toFixed(0)}%` : "—"}</span>
                      </div>
                      <div style={{ display: "flex", gap: 16, flexShrink: 0 }}>
                        <div style={{ textAlign: "right" }}>
                          <div className="mono" style={{ fontSize: 13, fontWeight: 700, color: "#FFFFFF" }}>{latest ? `${latest.distance}m` : "—"}</div>
                          <div style={{ fontSize: 9, color: "#48484A" }}>latest</div>
                        </div>
                        <div style={{ textAlign: "right" }}>
                          <div className="mono" style={{ fontSize: 13, fontWeight: 700, color: "#8E8E93" }}>{sixWeekTotal}m</div>
                          <div style={{ fontSize: 9, color: "#48484A" }}>6-wk total</div>
                        </div>
                      </div>
                    </div>
                    <div style={{ height: 5, borderRadius: 3, background: "#20232a", overflow: "hidden" }}>
                      <div style={{ height: "100%", width: `${pct != null ? Math.max(pct, pct > 0 ? 2 : 0) : 0}%`, background: SWIM_STROKE_COLORS[stroke], borderRadius: 3 }} />
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}
            </>
          )}

          {swimSection === "trends" && (
            <>
          {renderFilterBar()}

          {/* Trends — compact sparkline cards, tap to expand */}
          <div style={cardStyle}>
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 8, marginBottom: 12 }}>
              <div style={labelStyle}>Trends</div>
              <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
                <div style={{ display: "flex", gap: 4 }}>
                  {[["day", "Day"], ["week", "Week"]].map(([v, l]) => (
                    <button key={v} onClick={() => setSwimTimeView(v)} className="pill" style={{
                      cursor: "pointer", background: swimTimeView === v ? "#27272A" : "transparent",
                      border: "1px solid " + (swimTimeView === v ? "#3A3A3C" : "#27272A"), color: swimTimeView === v ? "#FFFFFF" : "#8E8E93",
                      borderRadius: 12, padding: "5px 10px", fontSize: 11.5, fontWeight: 600,
                    }}>{l}</button>
                  ))}
                </div>
                <button
                  onClick={() => setMetricValueMode((m) => (m === "avg6" ? "latest" : "avg6"))}
                  title="Toggle each card's big number between the latest value and the average of the previous 6 calendar weeks"
                  className="pill"
                  style={{
                    cursor: "pointer",
                    background: metricValueMode === "avg6" ? "#64D2FF" : "transparent",
                    border: "1px solid " + (metricValueMode === "avg6" ? "#64D2FF" : "#27272A"),
                    color: metricValueMode === "avg6" ? "#000000" : "#8E8E93",
                    borderRadius: 12, padding: "5px 10px", fontSize: 11.5, fontWeight: 700,
                  }}
                >6-wk avg</button>
                {metricCards.length > 0 && (
                  <button onClick={toggleExpandAllMetrics} className="pill" style={{
                    display: "flex", alignItems: "center", gap: 5, cursor: "pointer",
                    background: allMetricsExpanded ? "#27272A" : "transparent",
                    border: "1px solid " + (allMetricsExpanded ? "#3A3A3C" : "#27272A"),
                    color: allMetricsExpanded ? "#FFFFFF" : "#8E8E93",
                    borderRadius: 12, padding: "5px 10px", fontSize: 11.5, fontWeight: 600,
                  }}>
                    <ChevronDown size={12} style={{ transform: allMetricsExpanded ? "rotate(180deg)" : "none", transition: "transform 0.15s" }} />
                    {allMetricsExpanded ? "Collapse all" : "Expand all"}
                  </button>
                )}
              </div>
            </div>
            <div style={{ display: "grid", gridTemplateColumns: isMobile ? "1fr" : "repeat(2, 1fr)", gap: 10 }}>
              {metricCards.map((card) => {
                const isOpen = expandedMetrics.has(card.key);
                const pts = sparkPoints(card.series);
                return (
                  <div key={card.key} className="trend-compact-card" data-expanded={isOpen ? "true" : "false"} style={{ background: "#000000", border: `1.5px solid ${card.color}${isOpen ? "cc" : "70"}`, borderRadius: 18, padding: 12, cursor: "pointer", transition: "border-color 0.15s" }} onClick={() => toggleMetric(card.key)}>

                        <PolarRadiusAxis domain={[70, 130]} ticks={[70, 100, 130]} tick={{ fill: "#8E8E93", fontSize: 10 }} axisLine={false} tickLine={false} />
                        <Radar name="6-week baseline" dataKey={() => 100} stroke={radarBaselineColor} strokeWidth={2.6} fill={radarBaselineColor} fillOpacity={0.08} strokeDasharray="6 4" />
                        <Radar name="Latest session" dataKey="displayValue" stroke={radarLatestColor} strokeWidth={3} fill={radarLatestColor} fillOpacity={0.22} />
                        <Tooltip
                          contentStyle={{ background: "#000000", border: "1px solid #2C2C2E", borderRadius: 12, fontSize: 11.5 }}
                          formatter={(v, name, props) => name === "Latest session" ? [`${props.payload.score.toFixed(1)} (raw score)`, name] : ["100", name]}
                          labelFormatter={(label, payload) => {
                            const p = payload && payload[0] ? payload[0].payload : null;
                            return p ? `${label} · ${p.score.toFixed(1)}` : label;
                          }}
                        />
                      </RadarChart>
                    </ResponsiveContainer>
                    </div>

                    <div style={{ fontSize: 10.5, color: "#636366", margin: "2px 2px 12px", lineHeight: 1.45, textAlign: isMobile ? "left" : "center" }}>
                      Personal performance profile · <strong style={{ color: "#8E8E93", fontWeight: 700 }}>100 = your baseline</strong> · &gt;100 above baseline · &lt;100 below baseline
                    </div>

                    <div style={{ display: "grid", gridTemplateColumns: isMobile ? "1fr" : "1fr 1fr", gap: 8, marginTop: 2 }}>
                      {radarVisibleProfile.map((axis) => (
                        <div key={axis.key} style={{ border: "1px solid #2C2C2E", borderRadius: 12, padding: "9px 10px", background: "#18181B" }}>
                          <div style={{ display: "flex", justifyContent: "space-between", gap: 8 }}><div style={{ fontSize: 11, color: axis.color, fontWeight: 700 }}>{axis.label}</div><div className="mono" style={{ fontSize: 12, color: "#FFFFFF", fontWeight: 700 }}>{axis.score.toFixed(1)}</div></div>
                          <div style={{ fontSize: 9.5, color: "#48484A", marginTop: 4 }}>100 = personal baseline</div>
                        </div>
                      ))}
                    </div>

                    <details style={{ marginTop: 10, border: "1px solid #2C2C2E", borderRadius: 12, background: "#18181B", overflow: "hidden" }}>
                      <summary style={{ cursor: "pointer", listStyle: "none", padding: "10px 12px", display: "flex", alignItems: "center", gap: 7, fontSize: 11, color: "#8E8E93", fontWeight: 700 }}>
                        <Info size={13} /> What do these axes mean?
                      </summary>
                      <div style={{ padding: "0 12px 11px", display: "grid", gap: 8 }}>
                        {radarVisibleProfile.map((axis) => {
                          const descriptions = {
                            pace: "Speed — latest comparable pace vs your previous 6-week baseline. Above 100 = faster than usual.",
                            efficiency: "Stroke Efficiency — combines same-pool SWOLF and distance per stroke against each stroke's own baseline. Above 100 = a more favorable combined stroke-economy signal.",
                            consistency: "Consistency — how evenly you held pace within each selected stroke vs same-pool sessions from your previous 6 weeks. Above 100 = steadier than usual; below 100 = more variable.",
                            endurance: "Endurance — distance completed in the current stroke/effort/category context vs your previous 6-week average for the same context. Above 100 = more distance than usual; below 100 = less. More is not automatically better.",
                            aerobic: "Aerobic Efficiency — swimming speed relative to heart-rate cost vs your previous 6-week baseline. Above 100 = more speed for the cardiovascular cost. Shown only with sufficient real HR coverage.",
                          };
                          return (
                            <div key={axis.key} style={{ display: "grid", gridTemplateColumns: "auto 1fr", gap: 8, alignItems: "start" }}>
                              <span style={{ width: 7, height: 7, borderRadius: "50%", background: axis.color, marginTop: 5 }} />
                              <div style={{ fontSize: 10.5, color: "#8E8E93", lineHeight: 1.45 }}>{descriptions[axis.key]}</div>
                            </div>
                          );
                        })}
                      </div>
                    </details>

                    <div style={{ fontSize: 10, color: "#48484A", marginTop: 10, lineHeight: 1.45 }}>
                      Display is limited to 70–130 only for the visual scale; raw calculated scores are unchanged and shown in the tooltip and values above.
                      {!radarProfile.some((a) => a.key === "aerobic") && " Aerobic Efficiency is omitted when real HR coverage is insufficient."}
                    </div>
                  </>
                )}
              </div>
            </>
            ) : null;
          })()}
          </React.Fragment>

        </>
      )}
    </div>
  );
}

function TrainingLog() {

  useEffect(() => {

  const visibleTabs = TABS.filter((t) => athleteMode === "swim" ? t.id !== "workout" : athleteMode === "workout" ? t.id !== "swim" : true);

  const [workoutSection, setWorkoutSection] = useState(() => {

  const enterMainTab = (id) => {

      setWorkoutSection("dashboard");
      try { localStorage.setItem("workout-section-v1", "dashboard"); } catch {}
    }
    if (id === "swim") {
      // SwimmingTab remounts when entering Swim, so resetting its stored subsection here

      try { localStorage.setItem("swim-section-v1", "dashboard"); } catch {}

    setTab(id);

  const [filter, setFilter] = useState("All");
  const [metric, setMetric] = useState("reps");
  const [range, setRange] = useState("all");
  const [timeView, setTimeView] = useState("day"); // "day" (per session) or "week" (aggregated)
  const [showForm, setShowForm] = useState(false);
  const [editingId, setEditingId] = useState(null);

  const [confirmDelete, setConfirmDelete] = useState(null);
  const [confirmDeleteAllScope, setConfirmDeleteAllScope] = useState(null); // null | "workout" | "swim" | "all"
  const [trackedExercises, setTrackedExercises] = useState([]);
  const [customExercises, setCustomExercises] = useState([]);
  const [ownerName, setOwnerName] = useState("");
  const [editingName, setEditingName] = useState(false);
  const [nameDraft, setNameDraft] = useState("");
  const [showAddExercise, setShowAddExercise] = useState(false);
  const [addExDraft, setAddExDraft] = useState({ name: "", group: "Pull", ratio: "1.0", target: "" });
  const [draft, setDraft] = useState(() => emptyDraft([]));
  const [pasteText, setPasteText] = useState("");
  const [parseNote, setParseNote] = useState("");
  const [unmatchedNames, setUnmatchedNames] = useState([]);
  const [selectedCompare, setSelectedCompare] = useState([]);
  const [showCompare, setShowCompare] = useState(false);
  const [importMsg, setImportMsg] = useState("");
  const [isMobile, setIsMobile] = useState(typeof window !== "undefined" ? window.innerWidth < 560 : false);
  const [targetSettings, setTargetSettings] = useState(null); // { startDate, weeks } — null until loaded, then falls back to defaults
  const [editingTarget, setEditingTarget] = useState(false);
  const [targetDraft, setTargetDraft] = useState({ startDate: "", weeks: "12" });
  const [selectedHeatDate, setSelectedHeatDate] = useState(null);
  const [chartFocus, setChartFocus] = useState(null);
  const [hiddenStatsExercises, setHiddenStatsExercises] = useState(() => new Set());
  const [showLibrary, setShowLibrary] = useState(false);
  // Which exercises show up in the PR card. null = show all (default); array = only these.
  const [prSelection, setPrSelection] = useState(null);
  const [showPrPicker, setShowPrPicker] = useState(false);
  // Fluid heatmap: the square size is computed from the container's actual measured width
  // (see the effect near HEATMAP_WEEKS below) rather than a fixed pixel value, so 24 weeks
  // always fit exactly without needing horizontal scroll/swipe on narrow phone screens.
  const [heatmapCellSize, setHeatmapCellSize] = useState(14);
  const heatmapGridRef = useRef(null);
  const TARGET_KEY = "target-settings-v1";
  const TRACKED_KEY = "tracked-exercises-v1";
  const CUSTOM_LIB_KEY = "custom-exercises-v1";
  const OWNER_KEY = "owner-name-v1";
  const PR_SELECTION_KEY = "pr-selection-v1";
  const WEIGHT_LOG_KEY = "weight-log-v1";
  const [weightLog, setWeightLog] = useState([]);
  const [weightLogDate, setWeightLogDate] = useState(() => toISODate(new Date()));
  const [weightLogKg, setWeightLogKg] = useState("");
  const [showWeightLogEntry, setShowWeightLogEntry] = useState(false);
  const fileInputRef = useRef(null);

  // ---- History & Log: Workout / Swim toggle -------------------------------------------
  // Controls which "log new session" flow shows (paste/manual form vs. .FIT upload) and
  // what the Import button expects (JSON vs. .FIT). Logging itself lives here now; the
  // Swimming tab is dashboard-only and simply re-reads SWIM_KEY whenever it mounts.
  const [viewMode, setViewMode] = useState(() => {
    try { return localStorage.getItem("athlete-mode-v1") === "swim" ? "swim" : "workout"; }
    catch { return "workout"; }
  }); // "workout" | "swim" | "all"
  useEffect(() => {
    if (!athleteMode) return;
    if (athleteMode === "swim") {
      if (tab === "workout") setTab("dashboard");
      if (viewMode !== "swim") setViewMode("swim");
    } else if (athleteMode === "workout") {
      if (tab === "swim") setTab("dashboard");
      if (viewMode !== "workout") setViewMode("workout");
    }
  }, [athleteMode]);

  const [swimSessions, setSwimSessions] = useState(null);
  const [swimUploading, setSwimUploading] = useState(false);
  const [swimUploadMsg, setSwimUploadMsg] = useState("");
  const [pendingPoolUpload, setPendingPoolUpload] = useState(null);
  const [swimEditingPoolFor, setSwimEditingPoolFor] = useState(null);
  const [swimPoolDraft, setSwimPoolDraft] = useState("");
  const [swimMarkCss, setSwimMarkCss] = useState(false); // "Mark as CSS test" toggle at upload time
  const [pendingCssUpload, setPendingCssUpload] = useState(null); // { drafts: [...] } awaiting confirmation
  const [expandedSwimDetailId, setExpandedSwimDetailId] = useState(null);
  const [swimEditingDistanceFor, setSwimEditingDistanceFor] = useState(null);
  const [swimDistanceDraft, setSwimDistanceDraft] = useState("");
  const [swimActivityStrokeFilter, setSwimActivityStrokeFilter] = useState({});
  const [swimOpenRepsFor, setSwimOpenRepsFor] = useState({});
  const [swimOpenLengthsFor, setSwimOpenLengthsFor] = useState({});
  const [swimEffortEditFor, setSwimEffortEditFor] = useState(null);
  const [swimEffortSelected, setSwimEffortSelected] = useState({});
  const [swimIdleToActiveFor, setSwimIdleToActiveFor] = useState(null);
  const [swimCssRepPick, setSwimCssRepPick] = useState({});
  const swimFileInputRef = useRef(null);
  const swimImportInputRef = useRef(null);
  const SWIM_KEY = "swim-sessions-v1";

  useEffect(() => {
    (async () => {
      try {
        const res = await window.storage.get(SWIM_KEY, false);
        const raw = res && res.value ? JSON.parse(res.value) : [];
        const { sessions: fixed, changed } = backfillSwimSessions(raw);
        setSwimSessions(fixed);
        if (changed) { try { await window.storage.set(SWIM_KEY, JSON.stringify(fixed), false); } catch (_) {} }
      } catch (e) {
        setSwimSessions([]);
      }
    })();
  }, []);

  const persistSwim = async (next) => {
    setSwimSessions(next);
    try { await window.storage.set(SWIM_KEY, JSON.stringify(next), false); } catch (_) {}
  };

  const sortedSwimSessions = [...(swimSessions || [])].sort((a, b) => (a.date < b.date ? 1 : -1));
  const swimEffortAssignments = useMemo(() => buildSwimEffortAssignments(swimSessions || []), [swimSessions]);
  const swimCategoryLabelOf = (s) => (s.isCssTest ? "CSS Test" : "Workout");

  const correctSwimPoolLength = async (id) => {
    const meters = parseFloat(swimPoolDraft);
    if (!Number.isFinite(meters) || meters <= 0) return;
    await persistSwim((swimSessions || []).map((s) => s.id === id ? withSwimPoolLength(s, meters, "manual") : s));
    setSwimEditingPoolFor(null);
    setSwimPoolDraft("");
  };

  const correctSwimDistance = async (id) => {
    const newDistance = parseFloat(swimDistanceDraft);
    if (!Number.isFinite(newDistance) || newDistance <= 0) { setSwimEditingDistanceFor(null); return; }
    const next = (swimSessions || []).map((s) => {
      if (s.id !== id) return s;
      const originalDistance = s.distanceCorrection ? s.distanceCorrection.originalDistance : s.distance;
      const newPace100 = s.swimTimeSec > 0 && newDistance > 0 ? (s.swimTimeSec / newDistance) * 100 : null;
      return { ...s, distance: Math.round(newDistance * 100) / 100, pace100Overall: newPace100, distanceCorrection: { originalDistance, correctedAt: new Date().toISOString() } };
    });
    await persistSwim(next);
    setSwimEditingDistanceFor(null); setSwimDistanceDraft("");
  };

  const resetSwimDistanceCorrection = async (id) => {
    const next = (swimSessions || []).map((s) => {
      if (s.id !== id || !s.distanceCorrection) return s;
      const restoredDistance = s.distanceCorrection.originalDistance;
      const restoredPace = s.swimTimeSec > 0 && restoredDistance ? (s.swimTimeSec / restoredDistance) * 100 : null;
      return { ...s, distance: restoredDistance, pace100Overall: restoredPace, distanceCorrection: null };
    });
    await persistSwim(next);
  };

  const applySwimLengthEdit = async (sessionId, lengthIndex, updater) => {
    const next = (swimSessions || []).map((s) => {
      if (s.id !== sessionId) return s;
      const lengths = (s.lengths || []).map((l) => (l.index === lengthIndex ? updater(l) : l));
      const metrics = computeSwimSessionMetrics(lengths, s.poolLength);
      return { ...s, lengths, distance: metrics.distance, swimTimeSec: metrics.swimTimeSec, restTimeSec: metrics.restTimeSec, pace100Overall: metrics.pace100Overall, strokeStats: metrics.strokeStats, reps: metrics.reps, totalActiveLengths: metrics.totalActiveLengths, validActiveLengths: metrics.validActiveLengths, excludedCount: metrics.excludedCount, qualityNote: metrics.qualityNote, distanceCorrection: null };
    });
    await persistSwim(next);
  };
  const updateSwimLengthStroke = (sessionId, lengthIndex, newStroke) => applySwimLengthEdit(sessionId, lengthIndex, (l) => ({ ...l, userStroke: newStroke === l.stroke ? null : newStroke }));
  const markSwimLengthActive = (sessionId, lengthIndex, stroke) => applySwimLengthEdit(sessionId, lengthIndex, (l) => ({ ...l, userLengthType: "active", userStroke: stroke }));
  const markSwimLengthIdle = (sessionId, lengthIndex) => applySwimLengthEdit(sessionId, lengthIndex, (l) => ({ ...l, userLengthType: l.lengthType === "idle" ? null : "idle", userStroke: null }));
  const toggleExcludeSwimLength = (sessionId, lengthIndex) => applySwimLengthEdit(sessionId, lengthIndex, (l) => ({ ...l, userExcluded: !l.userExcluded }));
  const resetSwimLengthOverrides = (sessionId, lengthIndex) => applySwimLengthEdit(sessionId, lengthIndex, (l) => ({ ...l, userExcluded: false, userLengthType: null, userStroke: null }));

  const toggleSwimEffortSelection = (sessionId, lengthIndex) => {
    setSwimEffortSelected((prev) => {
      const cur = new Set(prev[sessionId] || []);
      if (cur.has(lengthIndex)) cur.delete(lengthIndex); else cur.add(lengthIndex);
      return { ...prev, [sessionId]: cur };
    });
  };
  const setAllSwimEffortSelection = (session, selectAll) => {
    const next = new Set();
    if (selectAll) (session.lengths || []).forEach((l) => {
      const eff = effectiveLength(l);
      if (eff.lengthType === "active" && !l.userExcluded) next.add(l.index);
    });
    setSwimEffortSelected((prev) => ({ ...prev, [session.id]: next }));
  };
  const applyBulkSwimEffort = async (sessionId, effort) => {
    const selected = new Set(swimEffortSelected[sessionId] || []);
    if (!selected.size) return;
    const next = (swimSessions || []).map((s) => s.id !== sessionId ? s : {
      ...s,
      lengths: (s.lengths || []).map((l) => selected.has(l.index) ? { ...l, userEffort: validSwimEffort(effort) ? effort : null } : l)
    });
    await persistSwim(next);
    setSwimEffortSelected((prev) => ({ ...prev, [sessionId]: new Set() }));
  };
  const closeSwimEffortEditor = (sessionId) => {
    setSwimEffortEditFor(null);
    setSwimEffortSelected((prev) => ({ ...prev, [sessionId]: new Set() }));
  };

  const pickSwimCssRep = (sessionId, slot, repIdx) => setSwimCssRepPick((prev) => { const cur = prev[sessionId] || {}; return { ...prev, [sessionId]: { ...cur, [slot]: cur[slot] === repIdx ? null : repIdx } }; });
  const applySwimCssRepPick = async (sessionId) => {
    const pick = swimCssRepPick[sessionId];
    const session = (swimSessions || []).find((s) => s.id === sessionId);
    if (!pick || !session || pick.short == null || pick.long == null || pick.short === pick.long) return;
    const repA = session.reps[pick.short], repB = session.reps[pick.long];
    if (!repA || !repB) return;
    const [shortRep, longRep] = repA.distance <= repB.distance ? [repA, repB] : [repB, repA];
    if (longRep.distance === shortRep.distance || longRep.timeSec <= shortRep.timeSec) return;
    const cssSpeed = (longRep.distance - shortRep.distance) / (longRep.timeSec - shortRep.timeSec);
    const pace100 = cssSpeed > 0 ? 100 / cssSpeed : null;
    await persistSwim((swimSessions || []).map((s) => s.id === sessionId ? { ...s, isCssTest: true, cssTest: { t200: shortRep.timeSec, t400: longRep.timeSec, cssSpeed, pace100 } } : s));
    setSwimCssRepPick((prev) => { const cp = { ...prev }; delete cp[sessionId]; return cp; });
  };
  const clearSwimCssPick = (sessionId) => setSwimCssRepPick((prev) => ({ ...prev, [sessionId]: {} }));
  const deleteSwimSession = async (id) => { await persistSwim((swimSessions || []).filter((s) => s.id !== id)); if (expandedSwimDetailId === id) setExpandedSwimDetailId(null); };

  const unmarkSwimCssTest = async (sessionId) => {
    const next = (swimSessions || []).map((s) => s.id === sessionId ? { ...s, isCssTest: false, cssTest: null } : s);
    await persistSwim(next);
  };

  // Attempts to auto-fill the 200m/400m split times for a CSS test from the session's own
  // reconstructed reps (consecutive-active-length grouping, computed in processSwimFit).
  // Looks for a rep whose distance is within one pool length of 200m / 400m. Returns
  // { t200, t400, auto200, auto400 } — any value not found is left blank for manual entry.
  const autoDetectCssSplits = (swimSession) => {
    const tol = swimSession.poolLength || 25;
    const reps = swimSession.reps || [];
    const findRep = (target) => reps.find((r) => Math.abs(r.distance - target) <= tol);
    const rep200 = findRep(200);
    const rep400 = findRep(400);
    return {
      t200: rep200 ? paceSecToStr((rep200.timeSec / rep200.distance) * 100) : "",
      t400: rep400 ? paceSecToStr((rep400.timeSec / rep400.distance) * 100) : "",
      auto200: !!rep200,
      auto400: !!rep400,
    };
  };

  const finalizeSwimUpload = async (parsedSessions, markCss) => {
    if (!markCss) {
      const next = [...(swimSessions || []), ...parsedSessions].sort((a, b) => (a.date < b.date ? 1 : -1));
      await persistSwim(next);
      return true;
    }
    const drafts = parsedSessions.map((s) => ({ session: s, ...autoDetectCssSplits(s) }));
    setPendingCssUpload({ drafts });
    return false; // awaiting confirmation — not persisted yet
  };

  const handleSwimFitUpload = async (e) => {
    const files = Array.from(e.target.files || []);
    if (!files.length) return;
    setSwimUploading(true);
    setSwimUploadMsg("");
    const added = [];
    const errors = [];
    for (const file of files) {
      try {
        const buf = await file.arrayBuffer();
        const parsed = parseFitBinary(buf);
        const swimSession = processSwimFit(parsed, file.name);
        added.push(swimSession);
      } catch (err) {
        errors.push(`${file.name}: ${err.message || "failed to parse"}`);
      }
    }
    setSwimUploading(false);
    const missingPool = added.some((s) => s.poolLength == null || !Number.isFinite(s.poolLength) || s.poolLength <= 0);
    if (added.length && missingPool) {
      setPendingPoolUpload({ sessions: added, markCss: swimMarkCss, values: added.map((s) => s.poolLength != null ? String(Math.round(s.poolLength * 100) / 100) : "") });
    } else if (added.length) {
      await finalizeSwimUpload(added, swimMarkCss);
    }
    const parts = [];
    if (added.length && missingPool) parts.push(`Parsed ${added.length} swim session${added.length > 1 ? "s" : ""}. Pool length is required before saving.`);
    if (added.length && !missingPool && !swimMarkCss) parts.push(`Imported ${added.length} swim session${added.length > 1 ? "s" : ""}.`);
    if (added.length && !missingPool && swimMarkCss) parts.push(`Parsed ${added.length} swim session${added.length > 1 ? "s" : ""} — confirm CSS test times below before saving.`);
    if (errors.length) parts.push(`Failed: ${errors.join(" · ")}`);
    setSwimUploadMsg(parts.join(" "));
    if (swimFileInputRef.current) swimFileInputRef.current.value = "";
    if (swimImportInputRef.current) swimImportInputRef.current.value = "";
  };

  const updatePendingPoolValue = (idx, value) => setPendingPoolUpload((cur) => {
    if (!cur) return cur;
    const values = [...cur.values]; values[idx] = value;
    return { ...cur, values };
  });
  const confirmPendingPoolUpload = async () => {
    if (!pendingPoolUpload) return;
    const meters = pendingPoolUpload.values.map((v) => parseFloat(v));
    if (meters.some((v) => !Number.isFinite(v) || v <= 0)) {
      setSwimUploadMsg("Pool length is mandatory for every swim session.");
      return;
    }
    const finished = pendingPoolUpload.sessions.map((s, i) => withSwimPoolLength(s, meters[i], s.poolLength != null ? (s.poolLengthSource || "fit") : "manual"));
    const markCss = pendingPoolUpload.markCss;
    setPendingPoolUpload(null);
    const saved = await finalizeSwimUpload(finished, markCss);
    setSwimUploadMsg(saved ? `Imported ${finished.length} swim session${finished.length > 1 ? "s" : ""}.` : "Pool length saved. Confirm CSS test times below before saving.");
  };
  const cancelPendingPoolUpload = () => { setPendingPoolUpload(null); setSwimUploadMsg("Discarded — nothing was saved."); };

  const updatePendingCssDraft = (idx, field, value) => {
    setPendingCssUpload((cur) => {
      if (!cur) return cur;

      // elapsed time for the actual 200m/400m swims, so convert back here.

    const matchedNames = Object.keys(results);

      // "12,12,10,10"). A single value ("15") still works and applies to every set — if fewer

      const weightsRaw = (draft.load[name] || "").split(",").map((v) => v.trim()).filter((v) => v !== "").map((v) => parseFloat(v)).filter((n) => Number.isFinite(n) && n >= 0);

  const handleImport = (e) => {
